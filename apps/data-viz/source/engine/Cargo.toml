[package]
name = "dv-engine"
version = "0.1.0"
edition = "2021"
description = "Build-time engine for the Data Visualization Playground"

[[bin]]
name = "dv-engine"
path = "src/main.rs"

[dependencies]
indexmap = "2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
