<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数据图表英语 · Data Visualization Playground</title>
<style>/* Data Visualization Playground — Solid Glass surfaces, chart palette, layout. */

.dv-app {
  --dv-1: #2a78d6;
  --dv-2: #eb6834;
  --dv-3: #1baf7a;
  --dv-4: #eda100;
  --dv-5: #e87ba4;
  --dv-6: #008300;
  --dv-7: #6250d6;
  --dv-8: #e34948;
  --dv-seq-1: #cde2fb;
  --dv-seq-2: #9ec5f4;
  --dv-seq-3: #6da7ec;
  --dv-seq-4: #3987e5;
  --dv-seq-5: #1c5cab;
  --dv-pos: #2a78d6;
  --dv-neg: #e34948;
  --dv-total: #8b93a1;
  color-scheme: light;
}

html[data-theme="dark"] .dv-app,
html[data-theme="glass"] .dv-app {
  --dv-1: #3987e5;
  --dv-2: #d95926;
  --dv-3: #199e70;
  --dv-4: #c98500;
  --dv-5: #d55181;
  --dv-6: #008300;
  --dv-7: #9085e9;
  --dv-8: #e66767;
  --dv-seq-1: #0d366b;
  --dv-seq-2: #184f95;
  --dv-seq-3: #2a78d6;
  --dv-seq-4: #6da7ec;
  --dv-seq-5: #b7d3f6;
  --dv-pos: #3987e5;
  --dv-neg: #e66767;
  --dv-total: #7c8794;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

html[data-theme] .dv-app {
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.5;
}

.dv-shell {
  max-width: 1240px;
  margin: 0 auto;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) 96px;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.page > .npesl-back {
  position: static;
  display: inline-flex;
  margin: 8px 0 4px max(16px, env(safe-area-inset-left, 0px));
}

[hidden] { display: none !important; }

/* ---------------------------------------------------------------- gallery */
.dv-gallery-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 2px 18px;
  flex-wrap: wrap;
}

.dv-h1 {
  margin: 0;
  font-size: clamp(28px, 4.4vw, 42px);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.03;
}

.dv-h1-zh {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.dv-tagline {
  margin: 10px 0 0;
  font-size: 15px;
  color: var(--muted);
}

.dv-demo-badge { flex: none; }

.dv-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 14px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.dv-chips::-webkit-scrollbar { display: none; }
.dv-chips button {
  flex: none;
  padding: 8px 13px;
  border-radius: var(--radius-pill);
  color: var(--fg);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  min-height: 36px;
}

.dv-wall {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.dv-tile {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px;
  color: inherit;
  text-decoration: none;
  border-radius: var(--radius-card);
  transition: background-color 0.12s ease;
}
.dv-tile-feature { grid-column: span 2; }

.dv-tile-chart {
  display: block;
  border-radius: 14px;
  overflow: hidden;
  background: var(--pane-solid);
  padding: 8px;
}
.dv-tile-feature .dv-tile-chart { padding: 12px; }
.dv-mini { display: block; width: 100%; height: auto; }

.dv-tile-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dv-tile-en { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.dv-tile-zh { font-size: 13px; color: var(--muted); }
.dv-tile-blurb { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------------------------------------------------------------- workspace */
.dv-topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  margin-bottom: 14px;
}

.dv-wall-link,
.dv-step,
.dv-topic-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  color: var(--fg);
  font: inherit;
  font-size: 14px;
  text-decoration: none;
}
.dv-step { width: 38px; justify-content: center; font-size: 20px; line-height: 1; border: 0; background: transparent; }
.dv-topic-btn {
  flex: 1;
  justify-content: center;
  min-width: 0;
  max-width: 520px;
  margin: 0 auto;
  cursor: pointer;
  border: 0;
  background-color: var(--ctrl-fill);
  box-shadow: inset 0 1px 0 var(--ctrl-rim), 0 0 0 1px var(--pane-edge), 0 1px 2px var(--pane-contact);
}
.dv-topic-zh { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-topic-en { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-chev { color: var(--muted); font-size: 11px; }

.dv-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(340px, 420px);
  gap: 22px;
  align-items: start;
}

.dv-chart-card {
  position: sticky;
  top: 62px;
  padding: 20px 20px 14px;
  border-width: 0;
  background-color: var(--pane-solid);
  color: var(--fg);
  border-radius: var(--radius-card);
  box-shadow:
    inset 0 1px 0 var(--pane-rim),
    inset 0 0 0 1px var(--pane-inner),
    0 0 0 1px var(--pane-edge),
    0 1px 2px var(--pane-contact),
    0 12px 32px -14px var(--pane-shade);
}

.dv-chart-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
}
.dv-chart-titles { min-width: 0; }
.dv-chart-head h2 {
  margin: 0;
  font-size: clamp(22px, 2.6vw, 27px);
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.15;
}
.dv-chart-zh { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.dv-chart-sub { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

.dv-views { margin: 0 0 12px; }
.dv-views a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 4px 12px;
  border-radius: var(--radius-control);
  color: var(--fg);
  font-size: 13px;
  text-decoration: none;
}
html[data-theme] .dv-views a[aria-current="page"] {
  background-color: var(--blue);
  color: var(--on-blue);
  box-shadow:
    inset 0 1px 0 var(--ink-rim),
    inset 0 -1px 0 var(--ink-under),
    0 1px 2px var(--pane-contact);
}

.dv-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}
.dv-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.dv-key { flex: none; width: 14px; height: 3px; border-radius: 2px; background: var(--c, var(--dv-1)); }
.dv-key-rect { width: 10px; height: 10px; border-radius: 3px; }
.dv-key-dot { width: 9px; height: 9px; border-radius: 50%; }
.dv-key.dv-s1 { --c: var(--dv-1); }
.dv-key.dv-s2 { --c: var(--dv-2); }
.dv-key.dv-s3 { --c: var(--dv-3); }
.dv-key.dv-s4 { --c: var(--dv-4); }
.dv-key.dv-s5 { --c: var(--dv-5); }
.dv-key.dv-s6 { --c: var(--dv-6); }
.dv-key.dv-s7 { --c: var(--dv-7); }
.dv-key.dv-s8 { --c: var(--dv-8); }

.dv-figure { margin: 0; }
.dv-chart-host { position: relative; }
.dv-chart { display: block; width: 100%; height: auto; overflow: visible; }
.dv-chart-host.dv-scroll { overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.dv-chart-host.dv-scroll .dv-chart-wide { width: max(100%, 560px); }

.dv-chart-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
.dv-table-toggle, .dv-peek-btn { cursor: pointer; font: inherit; }

.dv-peek {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 12px;
  background: var(--ctrl-fill);
  box-shadow: inset 0 1px 0 var(--ctrl-rim), 0 0 0 1px var(--pane-edge);
}
.dv-peek-label { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------------------------------------------------------- panel */
.dv-panel {
  padding: 16px;
  border-width: 0;
  border-radius: var(--radius-card);
  color: var(--fg);
}

.dv-panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  min-height: 44px;
}
.dv-focus-label { margin: 0; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.dv-focus { margin: 3px 0 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
.dv-clear { flex: none; cursor: pointer; font: inherit; font-size: 12px; }

.dv-register {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  margin: 12px 0 10px;
  padding: 3px;
  border-radius: var(--radius-control);
  background: var(--well-fill);
  box-shadow: inset 0 1px 2px var(--well-shade), inset 0 -1px 0 var(--well-rim);
}
.dv-register button {
  min-height: 32px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
html[data-theme] .dv-register button[aria-checked="true"] {
  background-color: var(--blue);
  color: var(--on-blue);
  box-shadow: inset 0 1px 0 var(--ink-rim), inset 0 -1px 0 var(--ink-under),
    0 1px 2px var(--pane-contact);
}

.dv-tabs {
  display: flex;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 12px;
}
.dv-tabs button {
  flex: 1;
  min-height: 40px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.dv-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--blue); }

.dv-panel-body { min-height: 180px; }

.dv-word {
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.dv-word:last-child { border-bottom: 0; }
.dv-word-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.dv-word-en { font-size: 16px; font-weight: 600; }
.dv-word-zh { font-size: 13px; color: var(--muted); }
.dv-reg-badge {
  margin-left: auto;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--blue-tint);
  color: var(--muted);
  font-size: 10px;
}
.dv-word-note { margin: 5px 0 0; font-size: 13px; color: var(--fg); }
.dv-word-meta { margin: 4px 0 0; font-size: 11px; color: var(--muted); }

.dv-pattern {
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.dv-pattern:last-child { border-bottom: 0; }
.dv-level-badge {
  display: inline-block;
  margin-bottom: 4px;
  padding: 1px 6px;
  border-radius: 6px;
  background: var(--state-fill);
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.dv-pattern-en { margin: 0; font-size: 15px; line-height: 1.5; }
.dv-pattern-zh { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.dv-pattern-note { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

.dv-compare, .dv-trap {
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 14px;
  background: var(--surface);
}
.dv-compare-title { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.dv-compare-line { margin: 3px 0; font-size: 12px; color: var(--fg); }
.dv-compare-ex { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.dv-trap { background: transparent; box-shadow: inset 0 0 0 1px var(--pane-edge); }
.dv-trap-wrong { margin: 0; font-size: 13px; color: var(--danger); }
.dv-trap-right { margin: 4px 0 0; font-size: 13px; }
.dv-trap-why { margin: 5px 0 0; font-size: 12px; color: var(--muted); }

.dv-prompt { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.dv-prompt-hint { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.dv-keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.dv-keyword {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--ctrl-fill);
  box-shadow: inset 0 1px 0 var(--ctrl-rim), 0 0 0 1px var(--pane-edge);
  font-size: 12px;
}
.dv-keyword-zh { color: var(--muted); font-size: 11px; }
.dv-frame {
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface);
  font-size: 14px;
  line-height: 1.5;
}
.dv-scratch { margin: 10px 0; font-size: 12px; color: var(--muted); }
.dv-scratch summary { cursor: pointer; }
.dv-scratch-input {
  width: 100%;
  margin-top: 8px;
  padding: 8px 10px;
  border: 0;
  border-radius: 10px;
  background: var(--field-fill);
  box-shadow: inset 0 1px 0 var(--ctrl-rim), 0 0 0 1px var(--pane-edge);
  color: var(--fg);
  font: inherit;
  font-size: 13px;
  resize: vertical;
}
.dv-reveal { margin: 6px 0 2px; cursor: pointer; font: inherit; }
.dv-models { margin-top: 10px; }
.dv-levels { display: flex; gap: 4px; margin-bottom: 10px; }
.dv-levels button {
  flex: 1;
  min-height: 30px;
  border: 0;
  border-radius: 8px;
  background: var(--well-fill);
  color: var(--muted);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
html[data-theme] .dv-levels button[aria-checked="true"] {
  background: var(--blue);
  color: var(--on-blue);
}
.dv-model-en { margin: 0; font-size: 15px; line-height: 1.6; }
.dv-model-zh { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.dv-model-note { margin: 8px 0 0; font-size: 11px; color: var(--muted); }

.dv-read-lead { margin: 0 0 10px; font-size: 14px; line-height: 1.6; }
.dv-read-caution { margin: 0 0 10px; padding: 9px 11px; border-radius: 12px; background: var(--surface); font-size: 12px; color: var(--muted); }
.dv-overview { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
.dv-causal { margin: 10px 0 0; padding: 9px 11px; border-radius: 12px; background: var(--blue-tint); font-size: 12px; }

.dv-empty { margin: 12px 0; font-size: 13px; color: var(--muted); }
.dv-loading { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.dv-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------------- chart */
.dv-mark { cursor: pointer; }
.dv-mark:focus-visible { outline: none; filter: drop-shadow(0 0 4px var(--focus-line)); }
.dv-chart.has-selection .dv-mark:not(.is-selected) { opacity: 0.45; }
.dv-chart .dv-mark.is-selected { filter: drop-shadow(0 0 3px var(--focus-line)); }

.dv-s1 { --c: var(--dv-1); }
.dv-s2 { --c: var(--dv-2); }
.dv-s3 { --c: var(--dv-3); }
.dv-s4 { --c: var(--dv-4); }
.dv-s5 { --c: var(--dv-5); }
.dv-s6 { --c: var(--dv-6); }
.dv-s7 { --c: var(--dv-7); }
.dv-s8 { --c: var(--dv-8); }

.dv-line { stroke: var(--c, var(--dv-1)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
.dv-line.is-selected { stroke-width: 3.5; }
.dv-bar { fill: var(--c, var(--dv-1)); }
.dv-bar.is-selected { stroke: var(--fg); stroke-width: 2; }
.dv-bar.dv-pos { fill: var(--dv-pos); }
.dv-bar.dv-neg { fill: var(--dv-neg); }
.dv-bar.dv-total { fill: var(--dv-total); }
.dv-slice { fill: var(--c, var(--dv-1)); stroke: var(--pane-solid); stroke-width: 2; }
.dv-slice.is-selected { stroke: var(--fg); stroke-width: 2; }
.dv-dot { fill: var(--c, var(--dv-1)); stroke: var(--pane-solid); stroke-width: 2; }
.dv-dot.is-selected { stroke: var(--fg); stroke-width: 2.5; }
.dv-seg-hit:hover { opacity: 1; }
.dv-seg-hit.is-selected { stroke: var(--fg); stroke-width: 8; opacity: 0.18; }
.dv-node { fill: var(--c, var(--dv-1)); }
.dv-node.is-selected { stroke: var(--fg); stroke-width: 2; }
.dv-link { fill: var(--c, var(--dv-1)); opacity: 0.42; }
.dv-link.is-selected { opacity: 0.9; stroke: var(--fg); stroke-width: 1.5; }
.dv-cell { stroke: var(--pane-solid); stroke-width: 1; }
.dv-cell.is-selected { stroke: var(--fg); stroke-width: 2; }
.dv-connector { stroke: var(--muted); stroke-width: 1; opacity: 0.5; }

.dv-heat-1 { fill: var(--dv-seq-1); }
.dv-heat-2 { fill: var(--dv-seq-2); }
.dv-heat-3 { fill: var(--dv-seq-3); }
.dv-heat-4 { fill: var(--dv-seq-4); }
.dv-heat-5 { fill: var(--dv-seq-5); }

.dv-gridline { stroke: var(--rule); stroke-width: 1; }
.dv-baseline { stroke: var(--muted); stroke-width: 1; opacity: 0.55; }
.dv-tick { fill: var(--muted); font-size: 11px; font-family: inherit; }
.dv-unit { fill: var(--muted); font-size: 11px; font-family: inherit; }
.dv-label { fill: var(--fg); font-size: 11px; font-weight: 600; font-family: inherit; paint-order: stroke; stroke: var(--pane-solid); stroke-width: 3px; stroke-linejoin: round; }
.dv-slice-label { fill: var(--fg); font-size: 11px; font-weight: 600; font-family: inherit; paint-order: stroke; stroke: var(--pane-solid); stroke-width: 3px; }

.dv-mini-line { stroke: var(--c, var(--dv-1)); stroke-width: 2; fill: none; }
.dv-mini-area { fill: var(--c, var(--dv-1)); opacity: 0.12; }
.dv-mini-bar { fill: var(--c, var(--dv-1)); }
.dv-mini-slice { fill: var(--c, var(--dv-1)); stroke: var(--pane-solid); stroke-width: 1.5; }
.dv-mini-dot { fill: var(--c, var(--dv-1)); }
.dv-mini-link { fill: none; stroke: var(--c, var(--dv-1)); stroke-width: 5; opacity: 0.35; stroke-linecap: round; }
.dv-mini-linkband { fill: var(--c, var(--dv-1)); opacity: 0.38; }
.dv-mini-node { fill: var(--c, var(--dv-1)); }
.dv-mini-cell { stroke: var(--pane-solid); stroke-width: 1; }
.dv-mini-empty { fill: var(--surface); }

/* ---------------------------------------------------------------- table */
.dv-table { margin-top: 12px; overflow-x: auto; }
.dv-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.dv-table caption { caption-side: top; text-align: left; padding: 4px 0 8px; color: var(--muted); font-size: 11px; }
.dv-table th, .dv-table td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: right; font-variant-numeric: tabular-nums; }
.dv-table th:first-child, .dv-table td:first-child { text-align: left; font-variant-numeric: normal; }
.dv-table thead th { color: var(--muted); font-weight: 600; }

/* ---------------------------------------------------------------- dialog */
.dv-topic-dialog {
  width: min(560px, calc(100vw - 32px));
  max-height: 70vh;
  padding: 16px;
  border: 0;
  border-radius: 20px;
  background: var(--popover);
  color: var(--fg);
  box-shadow: 0 24px 60px -18px var(--pane-shade), 0 6px 16px -6px var(--pane-contact);
}
.dv-topic-dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
.dv-dialog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.dv-dialog-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.dv-dialog-close { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
.dv-topic-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; overflow-y: auto; max-height: 56vh; }
.dv-topic-item {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 8px 10px;
  border-radius: 10px;
  color: var(--fg);
  text-decoration: none;
}
.dv-topic-item:hover { background: var(--state-fill); }

    var columns = d.columns;

    var nodeW = 14;

(function (DV) {

    { id: 'words', label: '词汇' },

    { id: 'describe', label: '描述' },
    { id: 'read', label: '解读' }
  ];

    { id: 'general', label: '通用' },
    { id: 'ielts', label: '雅思' },
    { id: 'business', label: '商务' }

  function entryFor(state) {
    if (!state.feature || !state.library) return null;

  }

    if (!state.feature) return state.view.subject || '整张图';
    var slots = state.feature.slots || {};

    if (slots.period) bits.push(slots.period);
    if (slots.from && slots.to) bits.push(slots.from + ' → ' + slots.to);
    else if (slots.value) bits.push(slots.value);
    else if (slots.share) bits.push(slots.category + ' · ' + slots.share);
    else if (slots.category && slots.value) bits.push(slots.category + ' · ' + slots.value);
    else if (slots.entity) bits.push(slots.entity);

    DV.el('span', { class: 'dv-word-zh' }, head).textContent = word.zh || '';

      data.nodes.forEach(function (n) { tot[n.id] = Math.max(inT[n.id] || 0, outT[n.id] || 0); });
      var colTot = cols.map(function (col) {
        return col.reduce(function (sum, id) { return sum + tot[id]; }, 0);
      });
      var maxCol = Math.max.apply(null, colTot.concat([1]));
      var scale = h / maxCol;
      var pos = {};
      cols.forEach(function (col, ci) {
        var used = col.reduce(function (sum, id) { return sum + tot[id] * scale; }, 0);
        var gap = col.length > 1 ? Math.max(2, Math.min(10, (h - used) / (col.length - 1))) : 0;
        var y = pad;
        col.forEach(function (id) {
          var hh = Math.max(2, tot[id] * scale);
          pos[id] = { x: pad + ci * (w - 6) / Math.max(1, cols.length - 1), y: y, h: hh };
          y += hh + gap;
        });
      });
      var outUsed = {}, inUsed = {};
      data.links.forEach(function (link) {
        var sPos = pos[link.source], tPos = pos[link.target];
        if (!sPos || !tPos) return;
        var y0 = sPos.y + (outUsed[link.source] || 0) * scale;
        var y1 = tPos.y + (inUsed[link.target] || 0) * scale;
        outUsed[link.source] = (outUsed[link.source] || 0) + link.value;
        inUsed[link.target] = (inUsed[link.target] || 0) + link.value;
        var hh = Math.max(1, link.value * scale);
        var mid = (sPos.x + tPos.x) / 2;
        DV.svg('path', {
          d: 'M' + sPos.x + ' ' + y0 + 'C' + mid + ' ' + y0 + ' ' + mid + ' ' + y1 + ' ' + tPos.x + ' ' + y1 +
            'L' + tPos.x + ' ' + (y1 + hh) + 'C' + mid + ' ' + (y1 + hh) + ' ' + mid + ' ' + (y0 + hh) + ' ' + sPos.x + ' ' + (y0 + hh) + 'Z',
          class: 'dv-mini-linkband ' + DV.slotClass((nodesById[link.source] || {}).slot || 1)
        }, svg);
      });
      data.nodes.forEach(function (n) {
        var p2 = pos[n.id];
        if (!p2) return;
        DV.svg('rect', {
          x: p2.x - 2, y: p2.y, width: 5, height: p2.h, rx: 1.5,
          class: 'dv-mini-node ' + DV.slotClass(n.slot || 1)
        }, svg);
      });
    } else if (type === 'slope' && data.entities) {
      data.entities.slice(0, 5).forEach(function (e, i) {
        var y0 = pad + h * (i / 5) + 8;
        var y1 = pad + h * (((i + 2) % 5) / 5) + 8;
        DV.svg('line', { x1: pad, y1: y0, x2: W - pad, y2: y1,
          class: 'dv-mini-line ' + DV.slotClass(e.slot || (i + 1)) }, svg);
      });
    } else if (type === 'waterfall' && data.steps) {
      var running = Number(data.start_value || 0);
      var pts2 = [running];
      data.steps.forEach(function (s4) { running += s4.value; pts2.push(running); });
      var lo3 = Math.min.apply(null, pts2), hi3 = Math.max.apply(null, pts2);
      var span3 = (hi3 - lo3) || 1;
      var all = data.steps.length + 2;
      var bw2 = Math.min(16, w / all * 0.6);
      function wy(v) { return pad + h - (v - lo3) / span3 * h; }
      DV.svg('rect', { x: pad, y: wy(pts2[0]), width: bw2, height: pad + h - wy(pts2[0]), class: 'dv-mini-bar dv-total' }, svg);
      data.steps.forEach(function (s5, i) {
        var base = pts2[i], value = pts2[i + 1];
        var x = pad + (i + 1) * w / all + (w / all - bw2) / 2;
        DV.svg('rect', {
          x: x, y: Math.min(wy(base), wy(value)), width: bw2,
          height: Math.max(2, Math.abs(wy(base) - wy(value))),
          class: 'dv-mini-bar ' + (s5.value > 0 ? 'dv-pos' : 'dv-neg')
        }, svg);
      });
      var lastX = pad + (all - 1) * w / all;
      DV.svg('rect', { x: lastX, y: wy(pts2[pts2.length - 1]), width: bw2,
        height: pad + h - wy(pts2[pts2.length - 1]), class: 'dv-mini-bar dv-total' }, svg);
    }
    if (!svg.firstChild) {
      DV.svg('rect', { x: pad, y: pad, width: w, height: h, rx: 8, class: 'dv-mini-empty' }, svg);
    }
    return svg;
  }

  function sliceArc(cx, cy, r0, r1, a0, a1) {
    var large = a1 - a0 > Math.PI ? 1 : 0;
    var x0 = cx + r1 * Math.cos(a0), y0 = cy + r1 * Math.sin(a0);
    var x1 = cx + r1 * Math.cos(a1), y1 = cy + r1 * Math.sin(a1);
    var x2 = cx + r0 * Math.cos(a1), y2 = cy + r0 * Math.sin(a1);
    var x3 = cx + r0 * Math.cos(a0), y3 = cy + r0 * Math.sin(a0);
    return 'M' + x0 + ' ' + y0 + 'A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + x1 + ' ' + y1 +
      'L' + x2 + ' ' + y2 + 'A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + x3 + ' ' + y3 + 'Z';
  }

  function renderGallery() {
    S.mode = 'gallery';
    S.mark = null;
    DV.clear(app);
    var head = DV.el('header', { class: 'dv-gallery-head' }, app);
    var titles = DV.el('div', {}, head);
    DV.el('h1', { class: 'dv-h1' }, titles).textContent = 'Data Visualization Playground';
    DV.el('p', { class: 'dv-h1-zh' }, titles).textContent = '数据图表英语';
    DV.el('p', { class: 'dv-tagline', lang: 'en' }, titles).textContent =
      'Explore data. Discover patterns. Learn to express.';
    DV.el('span', { class: 'badge dv-demo-badge' }, head).textContent = 'Demo data · 模拟数据';

    var chips = DV.el('nav', { class: 'dv-chips', role: 'group', 'aria-label': '图表类型' }, app);
    function chip(id, label) {
      var btn = DV.el('button', { type: 'button', 'aria-pressed': S.filter === id ? 'true' : 'false' }, chips);
      btn.textContent = label;
      btn.addEventListener('click', function () {
        S.filter = id;
        var params = id === 'all' ? '' : '?type=' + id;
        try { history.replaceState(null, '', '#/' + params); } catch (e) {}
        renderGallery();
      });
    }
    chip('all', '全部');
    G.types.forEach(function (type) { chip(type.id, type.label_zh); });

    var wall = DV.el('div', { class: 'dv-wall' }, app);
    var cards = byOrder(G.topics).filter(function (card) {
      return S.filter === 'all' || card.types.indexOf(S.filter) >= 0;
    });
    cards.forEach(function (card, index) {
      var tile = DV.el('a', {
        class: 'card dv-tile' + (index === 0 ? ' dv-tile-feature' : ''),
        href: '#/' + card.id + '/' + card.default_view,
        'aria-label': card.title_en + '，' + card.title_zh
      }, wall);
      var thumb = DV.el('span', { class: 'dv-tile-chart' }, tile);
      var primary = card.primary;
      thumb.appendChild(miniChart(primary.type, primary.data, primary.unit, card.title_en));
      var copy = DV.el('span', { class: 'dv-tile-copy' }, tile);
      DV.el('span', { class: 'dv-tile-en', lang: 'en' }, copy).textContent = card.title_en;
      DV.el('span', { class: 'dv-tile-zh' }, copy).textContent = card.title_zh;
      DV.el('span', { class: 'dv-tile-blurb' }, copy).textContent = card.blurb_zh || '';
      tile.addEventListener('click', function (event) {
        event.preventDefault();
        pushRoute([card.id, card.default_view]);
      });
    });
    if (!cards.length) DV.el('p', { class: 'dv-empty' }, app).textContent = '这个类型还没有图。';
  }

  // ------------------------------------------------------------ tooltip
  function ensureTooltip() {
    if (!tooltip) {
      tooltip = DV.el('div', { class: 'dv-tooltip', 'aria-hidden': 'true' }, document.body);
    }
    return tooltip;
  }

  function showTip(feature, event) {
    var node = ensureTooltip();
    if (!feature) { node.classList.remove('is-open'); return; }
    DV.clear(node);
    var slots = feature.slots || {};
    var value = slots.value || slots.share || (slots.from && slots.to ? slots.from + ' → ' + slots.to : '');
    DV.el('p', { class: 'dv-tip-value', lang: 'en' }, node).textContent = value || '';
    DV.el('p', { class: 'dv-tip-label' }, node).textContent =
      [slots.category, slots.period].filter(Boolean).join(' · ');
    var entry = (S.library && S.library.features || {})[feature.kind];
    if (entry && entry.words && entry.words[0]) {
      DV.el('p', { class: 'dv-tip-say', lang: 'en' }, node).textContent = '“' + entry.words[0].en + '”';
    }
    var x = 0, y = 0;
    if (event && event.clientX) { x = event.clientX + 16; y = event.clientY + 16; }
    else {
      var rect = event && event.target && event.target.getBoundingClientRect
        ? event.target.getBoundingClientRect() : null;
      x = rect ? rect.right + 8 : 20;
      y = rect ? rect.top : 20;
    }
    node.style.left = Math.max(8, Math.min(x, window.innerWidth - 250)) + 'px';
    node.style.top = Math.max(8, Math.min(y, window.innerHeight - 130)) + 'px';
    node.classList.add('is-open');
  }

  // ------------------------------------------------------------ workspace
  function renderLoading() {
    S.mode = 'workspace';
    DV.clear(app);
    var shell = DV.el('div', { class: 'dv-workspace dv-loading-shell' }, app);
    DV.el('div', { class: 'card dv-chart-card' }, shell).textContent = '载入中…';
    DV.el('div', { class: 'card dv-panel' }, shell).textContent = '载入中…';
  }

  function renderError(message) {
    DV.clear(app);
    var box = DV.el('div', { class: 'card dv-error', role: 'alert' }, app);
    DV.el('h2', {}, box).textContent = '没加载出来。';
    DV.el('p', {}, box).textContent = message || '';
    var retry = DV.el('button', { class: 'pill', type: 'button' }, box);
    retry.textContent = '重试';
    retry.addEventListener('click', function () { route(); });
    var back = DV.el('a', { class: 'pill', href: '#/' }, box);
    back.textContent = '回图表墙';
  }

  function renderWorkspace() {
    var topic = currentTopic();
    var view = currentView();
    if (!topic || !view) { renderGallery(); return; }
    S.mode = 'workspace';
    DV.clear(app);
    var order = byOrder(G.topics);
    var idx = order.map(function (t) { return t.id; }).indexOf(topic.id);
    var prev = order[(idx - 1 + order.length) % order.length];
    var next = order[(idx + 1) % order.length];

    var top = DV.el('div', { class: 'toolbar dv-topbar' }, app);
    var wallLink = DV.el('a', { class: 'dv-wall-link', href: '#/' }, top);
    wallLink.textContent = '图表墙';
    function step(target, label, dir) {
      var link = DV.el('a', { class: 'dv-step', href: '#/' + target.id + '/' + target.default_view,
        'aria-label': label }, top);
      link.textContent = dir;
    }
    step(prev, '上一个主题：' + prev.title_zh, '‹');
    var topicBtn = DV.el('button', { class: 'dv-topic-btn', type: 'button', 'aria-haspopup': 'dialog' }, top);
    DV.el('span', { class: 'dv-topic-zh' }, topicBtn).textContent = topic.title_zh;
    DV.el('span', { class: 'dv-topic-en', lang: 'en' }, topicBtn).textContent = topic.title_en;
    DV.el('span', { class: 'dv-chev', 'aria-hidden': 'true' }, topicBtn).textContent = '▾';
    step(next, '下一个主题：' + next.title_zh, '›');

    var dialog = DV.el('dialog', { class: 'dv-topic-dialog', 'aria-label': '换主题' }, app);
    var dhead = DV.el('header', { class: 'dv-dialog-head' }, dialog);
    DV.el('h2', {}, dhead).textContent = '换主题';
    var close = DV.el('button', { class: 'dv-dialog-close', type: 'button', 'aria-label': '关闭' }, dhead);
    close.textContent = '关闭';
    var list = DV.el('div', { class: 'dv-topic-list' }, dialog);
    order.forEach(function (item) {
      var link = DV.el('a', {
        class: 'dv-topic-item', href: '#/' + item.id + '/' + item.default_view,
        'aria-current': item.id === topic.id ? 'page' : null
      }, list);
      DV.el('span', { class: 'dv-topic-item-en', lang: 'en' }, link).textContent = item.title_en;
      DV.el('span', { class: 'dv-topic-item-zh' }, link).textContent = item.title_zh;
      link.addEventListener('click', function () { dialog.close(); });
    });
    topicBtn.addEventListener('click', function () { dialog.showModal(); });
    close.addEventListener('click', function () { dialog.close(); });
    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) dialog.close();
    });

    var grid = DV.el('div', { class: 'dv-workspace' }, app);
    var chartCard = DV.el('section', { class: 'card dv-chart-card', 'aria-labelledby': 'chart-title' }, grid);
    var chead = DV.el('header', { class: 'dv-chart-head' }, chartCard);
    var titles = DV.el('div', { class: 'dv-chart-titles' }, chead);
    DV.el('h2', { id: 'chart-title', lang: 'en' }, titles).textContent = topic.title_en;
    DV.el('p', { class: 'dv-chart-zh' }, titles).textContent = topic.title_zh;
    if (view.subtitle_en) DV.el('p', { class: 'dv-chart-sub', lang: 'en' }, titles).textContent = view.subtitle_en;
    DV.el('span', { class: 'badge' }, chead).textContent = 'Demo data · 模拟数据';

    if (topic.views.length > 1) {
      var views = DV.el('nav', { class: 'seg dv-views', 'aria-label': '切换视图' }, chartCard);
      topic.views.forEach(function (v) {
        var link = DV.el('a', { href: '#/' + topic.id + '/' + v.id,
          'aria-current': v.id === view.id ? 'page' : null }, views);
        link.textContent = v.label_zh || v.id;
      });
    }

    var hiddenSeries = S.hidden[topic.id + '/' + view.id] || {};
    var renderData = { data: view.data, unit: view.unit, subject: view.subject, type: view.type };
    if ((view.type === 'line' || view.type === 'bar' || view.type === 'stacked') && renderData.data.series) {
      renderData.data = Object.assign({}, renderData.data);
      renderData.data.series = renderData.data.series.filter(function (s) { return !hiddenSeries[s.id]; });
    }

    var legendItems = [];
    if (view.data.series && view.data.series.length > 1) {
      view.data.series.forEach(function (s) { legendItems.push({ id: s.id, name: s.name_en, slot: s.slot, kind: 'series', shape: view.type === 'line' ? 'line' : 'rect' }); });
    } else if (view.type === 'pie' && view.data.parts) {
      view.data.parts.forEach(function (p) { legendItems.push({ id: p.id, name: p.name_en, slot: p.slot, kind: 'slice', shape: 'rect' }); });
    } else if (view.type === 'scatter' && view.data.groups && view.data.groups.length > 1) {
      view.data.groups.forEach(function (g) { legendItems.push({ id: g.id, name: g.name_en, slot: g.slot, kind: 'group', shape: 'dot' }); });
    }
    if (legendItems.length) {
      var legend = DV.el('div', { class: 'dv-legend', role: 'group', 'aria-label': '数据系列' }, chartCard);
      legendItems.forEach(function (item) {
        var btn = DV.el('button', { class: 'dv-legend-item', type: 'button',
          'aria-pressed': item.kind === 'series' ? (hiddenSeries[item.id] ? 'false' : 'true') : 'false' }, legend);
        DV.el('span', { class: 'dv-key dv-key-' + (item.shape || 'line') + ' ' + DV.slotClass(item.slot || 1) }, btn);
        DV.el('span', { lang: 'en' }, btn).textContent = item.name;
        btn.addEventListener('click', function () {
          if (item.kind === 'series') {
            var visible = view.data.series.filter(function (s) { return !hiddenSeries[s.id] || s.id === item.id; });
            if (hiddenSeries[item.id] !== true && visible.length <= 1) return;
            hiddenSeries[item.id] = !hiddenSeries[item.id];
            S.hidden[topic.id + '/' + view.id] = hiddenSeries;
            if (S.mark && S.mark.indexOf(':' + item.id + ':') >= 0) S.mark = null;
            S.featureIndex = buildFeatureIndex(view);
            renderWorkspace();
          } else if (item.kind === 'slice') {
            select('slice:' + item.id);
          } else {
            select('grp:' + item.id);
          }
        });
      });
    }

    var figure = DV.el('figure', { class: 'dv-figure' }, chartCard);
    var chartHost = DV.el('div', { class: 'dv-chart-host' }, figure);
    var tableWrap = DV.el('div', { class: 'dv-table', hidden: 'hidden' }, chartCard);
    var foot = DV.el('footer', { class: 'dv-chart-foot' }, chartCard);
    var tableBtn = DV.el('button', { class: 'pill dv-table-toggle', type: 'button',
      'aria-expanded': S.table ? 'true' : 'false' }, foot);
    tableBtn.textContent = S.table ? '看图' : '看表格';

    var peek = DV.el('div', { class: 'dv-peek', hidden: 'hidden' }, chartCard);
    var peekText = DV.el('span', { class: 'dv-peek-label', lang: 'en' }, peek);
    var peekBtn = DV.el('button', { class: 'pill dv-peek-btn', type: 'button' }, peek);
    peekBtn.textContent = '看说法';

    var panelHost = DV.el('aside', { class: 'card dv-panel' }, grid);
    var live = DV.el('div', { class: 'dv-live', 'aria-live': 'polite', 'aria-atomic': 'true' }, app);

    S.featureIndex = buildFeatureIndex(view);
    if (S.mark && !S.featureIndex[S.mark]) S.mark = null;
    var renderer = DV.renderers[view.type](chartHost, renderData, {
      select: select,
      hover: function (mark, event) { showTip(S.featureIndex[mark], event); }
    });
    S.renderer = renderer;

    function panelState() {
      return {
        view: view,
        feature: featureFor(S.mark),
        library: S.library,
        register: S.register,
        tab: S.tab,
        level: S.level,
        revealed: S.revealed,
        onRegister: function (reg) { S.register = reg; DV.store.set('npesl-dataviz-reg', reg); replaceRoute([topic.id, view.id]); paintPanel(); },
        onTab: function (tab) { S.tab = tab; DV.store.set('npesl-dataviz-tab', tab); replaceRoute([topic.id, view.id]); paintPanel(); },
        onLevel: function (level) { S.level = level; paintPanel(); },
        onReveal: function (open) { S.revealed = open; paintPanel(); },
        onClear: function () { select(null); }
      };
    }

    function paintPanel() {
      DV.panel.render(panelHost, panelState());
      if (S.mark) {
        var f = featureFor(S.mark);
        peekText.textContent = f ? (f.slots.value || f.slots.share || (f.slots.from && f.slots.to ? f.slots.from + ' → ' + f.slots.to : '')) : '';
        peek.hidden = false;
      } else {
        peek.hidden = true;
      }
    }

    function select(mark) {
      S.mark = mark && S.featureIndex[mark] ? mark : null;
      S.revealed = false;
      renderer.setSelected(S.mark);
      replaceRoute([topic.id, view.id]);
      paintPanel();
      if (S.mark) {
        var f = featureFor(S.mark);
        live.textContent = '已选：' + (f && (f.slots.value || f.slots.share || f.slots.period) || '');
      } else {
        live.textContent = '已回到整张图';
      }
    }

    function paintTable() {
      var data = renderer.table ? renderer.table() : null;
      DV.clear(tableWrap);
      if (!data) return;
      var table = DV.el('table', {}, tableWrap);
      DV.el('caption', {}, table).textContent = topic.title_en + ' · 模拟数据';
      var thead = DV.el('thead', {}, table);
      var tr = DV.el('tr', {}, thead);
      data.head.forEach(function (h) { DV.el('th', { scope: 'col' }, tr).textContent = h; });
      var tbody = DV.el('tbody', {}, table);
      data.rows.forEach(function (row) {
        var r = DV.el('tr', {}, tbody);
        row.forEach(function (cell, i) {
          var td = i === 0 ? DV.el('th', { scope: 'row' }, r) : DV.el('td', {}, r);
          td.textContent = cell;
        });
      });
    }

    function applyTable() {
      figure.hidden = S.table;
      tableWrap.hidden = !S.table;
      tableBtn.setAttribute('aria-expanded', S.table ? 'true' : 'false');
      tableBtn.textContent = S.table ? '看图' : '看表格';
      if (S.table) paintTable();
    }
    tableBtn.addEventListener('click', function () { S.table = !S.table; applyTable(); });
    peekBtn.addEventListener('click', function () {
      panelHost.scrollIntoView({ behavior: DV.prefersReduced() ? 'auto' : 'smooth', block: 'start' });
      var tab = panelHost.querySelector('[role="tab"][aria-selected="true"]');
      if (tab) tab.focus({ preventScroll: true });
    });

    renderer.setSelected(S.mark);
    applyTable();
    paintPanel();
    if (!S.mark) live.textContent = '已打开：' + topic.title_zh;
  }

  function buildFeatureIndex(view) {
    var index = {};
    (view.features || []).forEach(function (f) {
      (f.marks || []).forEach(function (mark) { index[mark] = f; });
    });
    return index;
  }

  // ------------------------------------------------------------ routing
  function route() {
    var r = parseRoute();
    if (!r.parts.length) {
      if (r.q.type) S.filter = r.q.type;
      renderGallery();
      return;
    }
    var slug = r.parts[0];
    var card = topicCard(slug);
    if (!card) {
      S.filter = 'all';
      renderGallery();
      DV.el('p', { class: 'dv-notice' }, app).textContent = '没找到这个主题。';
      return;
    }
    S.topic = slug;
    S.view = r.parts[1] || null;
    S.mark = null;
    applyQuery(r.q);
    renderLoading();
    ensureTopic(slug).then(function () {
      var topic = TOPICS[slug];
      if (!S.view) S.view = topic.views[0].id;
      var view = topic.views.filter(function (v) { return v.id === S.view; })[0];
      if (!view) S.view = topic.views[0].id;
      view = topic.views.filter(function (v) { return v.id === S.view; })[0];
      return ensureLang(view.type).then(function () {
        S.library = LANGS[view.type];
      });
    }).then(function () {
      renderWorkspace();
    }).catch(function (error) {
      if (window.console && console.error) console.error(error && error.stack || error);
      renderError(String(error && (error.stack || error.message) || error));
    });
  }

  // ------------------------------------------------------------ boot
  function boot() {
    app = document.getElementById('app');
    if (!app) return;
    if (!G.topics || !G.topics.length) {
      app.textContent = '没有内容。';
      return;
    }
    document.addEventListener('click', function (event) {
      if (!tooltip || !tooltip.classList.contains('is-open')) return;
      if (!event.target.closest || !event.target.closest('[data-mark]')) {
        tooltip.classList.remove('is-open');
      }
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && S.mode === 'workspace' && S.mark) {
        var btn = app.querySelector('.dv-clear');
        if (btn) btn.click();
        else {
          S.mark = null;
          S.revealed = false;
          if (S.renderer) S.renderer.setSelected(null);
          var panel = app.querySelector('.dv-panel');
          if (panel) DV.panel.render(panel, {
            view: currentView(), feature: null, library: S.library,
            register: S.register, tab: S.tab, level: S.level, revealed: false,
            onRegister: function () {}, onTab: function () {}, onLevel: function () {},
            onReveal: function () {}, onClear: function () {}
          });
        }
      }
    });
    window.addEventListener('hashchange', route);
    window.__dv = {
      bootId: BOOT_ID,
      snapshot: function () {
        return {
          mode: S.mode, topic: S.topic, view: S.view, mark: S.mark,
          kind: featureFor(S.mark) ? featureFor(S.mark).kind : null,
          tab: S.tab, register: S.register, level: S.level,
          revealed: S.revealed, table: S.table,
          topics: G.topics.length
        };
      },
      select: function (mark) {
        var node = app.querySelector('[data-mark="' + String(mark).replace(/"/g, '\\"') + '"]');
        if (node) node.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      },
      clear: function () {
        var btn = app.querySelector('.dv-clear');
        if (btn) btn.click();
      },
      setRegister: function (reg) {
        var btns = app.querySelectorAll('.dv-register button');
        for (var i = 0; i < btns.length; i++) {
          if (btns[i].textContent === ({ general: '通用', ielts: '雅思', business: '商务' }[reg])) btns[i].click();
        }
      },
      reveal: function () {
        var btn = app.querySelector('.dv-reveal');
        if (btn) btn.click();
      },
      table: function () {
        var btn = app.querySelector('.dv-table-toggle');
        if (btn) btn.click();
      }
    };
    route();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.DV);
</script>
</body>
</html>
