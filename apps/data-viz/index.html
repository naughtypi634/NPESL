<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数据图表英语 · Data Visualization Playground</title>
<style>/* Data Visualization Playground — Solid Glass surfaces, chart palette, layout. */

.dv-app {
  --dv-1: #1f5fbf;
  --dv-2: #b25424;
  --dv-3: #0b6b5e;
  --dv-4: #8a6500;
  --dv-5: #9c3f86;
  --dv-6: #2f6b2f;
  --dv-7: #5b45c9;
  --dv-8: #b23a48;
  --dv-seq-1: #d8e6f7;
  --dv-seq-2: #b3cdee;
  --dv-seq-3: #7fa9e0;
  --dv-seq-4: #4a7fc9;
  --dv-seq-5: #1f5a9e;
  --dv-pos: #2f6b2f;
  --dv-neg: #b23a48;
  --dv-total: #6b7280;
  color-scheme: light;
}

html[data-theme="dark"] .dv-app,
html[data-theme="glass"] .dv-app {
  --dv-1: #7aa7f5;
  --dv-2: #f29a6b;
  --dv-3: #4fd0bb;
  --dv-4: #e3b74e;
  --dv-5: #e58ac0;
  --dv-6: #9cc36b;
  --dv-7: #b3a4ff;
  --dv-8: #ec7b82;
  --dv-seq-1: #0f2f57;
  --dv-seq-2: #1a4a7e;
  --dv-seq-3: #2a6aa6;
  --dv-seq-4: #5f97cf;
  --dv-seq-5: #a8c8ee;
  --dv-pos: #9cc36b;
  --dv-neg: #ec7b82;
  --dv-total: #9aa3ad;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

html[data-theme] .dv-app {
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.5;
}

.dv-shell {
  max-width: 1240px;
  margin: 0 auto;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) 96px;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.page > .npesl-back {
  position: static;
  display: inline-flex;
  margin: 8px 0 4px max(16px, env(safe-area-inset-left, 0px));
}

[hidden] { display: none !important; }

/* ---------------------------------------------------------------- gallery */
.dv-gallery-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 2px 18px;
  flex-wrap: wrap;
}

.dv-h1 {
  margin: 0;
  font-size: clamp(28px, 4.4vw, 42px);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.03;
}

.dv-h1-zh {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.dv-tagline {
  margin: 10px 0 0;
  font-size: 15px;
  color: var(--muted);
}

.dv-demo-badge { flex: none; border-radius: 999px; }

.dv-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 14px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.dv-chips::-webkit-scrollbar { display: none; }
.dv-chips button {
  flex: none;
  padding: 8px 13px;
  border-radius: var(--radius-pill);
  color: var(--fg);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  min-height: 36px;
}

.dv-wall {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  align-items: start;
}

.dv-tile {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px;
  color: inherit;
  text-decoration: none;
  border-radius: var(--radius-card);
  transition: background-color 0.12s ease;
}
.dv-tile-feature { grid-column: span 2; grid-row: span 2; }

.dv-tile-chart {
  display: block;
  border-radius: 14px;
  overflow: hidden;
  background: var(--pane-solid);
  padding: 8px;
}
.dv-tile-feature .dv-tile-chart { padding: 12px; }
.dv-mini { display: block; width: 100%; height: auto; }

.dv-tile-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dv-tile-en { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.dv-tile-zh { font-size: 13px; color: var(--muted); }
.dv-tile-blurb { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------------------------------------------------------------- workspace */
.dv-topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  margin-bottom: 14px;
}

.dv-wall-link,
.dv-step,
.dv-topic-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  color: var(--fg);
  font: inherit;
  font-size: 14px;
  text-decoration: none;
}
.dv-step { width: 34px; justify-content: center; font-size: 20px; line-height: 1; border: 0; background: transparent; }
.dv-topic-nav { display: flex; flex: 1; justify-content: center; align-items: center; gap: 4px; min-width: 0; }
.dv-topic-nav .dv-topic-btn { flex: 0 1 520px; margin: 0; }
.dv-topic-btn {
  flex: 1;
  justify-content: center;
  min-width: 0;
  max-width: 520px;
  margin: 0 auto;
  cursor: pointer;
  border: 0;
  background-color: var(--ctrl-fill);
  box-shadow: inset 0 1px 0 var(--ctrl-rim), 0 0 0 1px var(--pane-edge), 0 1px 2px var(--pane-contact);
}
.dv-topic-zh { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-topic-en { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-chev { color: var(--muted); font-size: 11px; }

.dv-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(340px, 420px);
  gap: 22px;
  align-items: start;
}

.dv-workspace > * { min-width: 0; }

.dv-chart-card {
  position: sticky;
  top: 62px;
  padding: 20px 20px 14px;
  border-width: 0;
  background-color: var(--pane-solid);
  color: var(--fg);
  border-radius: var(--radius-card);
  box-shadow:
    inset 0 1px 0 var(--pane-rim),
    inset 0 0 0 1px var(--pane-inner),
    0 0 0 1px var(--pane-edge),
    0 1px 2px var(--pane-contact),
    0 12px 32px -14px var(--pane-shade);
}

.dv-chart-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
}
.dv-chart-titles { min-width: 0; }
.dv-chart-head .badge { flex: none; white-space: nowrap; }
.dv-chart-head h2 {
  margin: 0;
  font-size: clamp(22px, 2.6vw, 27px);
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.15;
}
.dv-chart-zh { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.dv-chart-sub { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

.dv-views { margin: 0 0 12px; }
.dv-views a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 4px 12px;
  border-radius: var(--radius-control);
  color: var(--fg);
  font-size: 13px;
  text-decoration: none;
}
html[data-theme] .dv-views a[aria-current="page"] {
  background-color: var(--blue);
  color: var(--on-blue);
  box-shadow:
    inset 0 1px 0 var(--ink-rim),
    inset 0 -1px 0 var(--ink-under),
    0 1px 2px var(--pane-contact);
}

.dv-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}
.dv-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.dv-key { flex: none; width: 14px; height: 3px; border-radius: 2px; background: var(--c, var(--dv-1)); }
.dv-key-rect { width: 10px; height: 10px; border-radius: 3px; }
.dv-key-dot { width: 9px; height: 9px; border-radius: 50%; }
.dv-key.dv-s1 { --c: var(--dv-1); }
.dv-key.dv-s2 { --c: var(--dv-2); }
.dv-key.dv-s3 { --c: var(--dv-3); }
.dv-key.dv-s4 { --c: var(--dv-4); }
.dv-key.dv-s5 { --c: var(--dv-5); }
.dv-key.dv-s6 { --c: var(--dv-6); }
.dv-key.dv-s7 { --c: var(--dv-7); }
.dv-key.dv-s8 { --c: var(--dv-8); }

.dv-figure { margin: 0; }
.dv-chart-host { position: relative; }
.dv-chart { display: block; width: 100%; height: auto; overflow: visible; }
.dv-chart-host.dv-scroll { overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.dv-chart-host.dv-scroll .dv-chart-wide { width: max(100%, 560px); }

.dv-chart-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
.dv-table-toggle, .dv-peek-btn { cursor: pointer; font: inherit; }

.dv-peek {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 12px;
  background: var(--ctrl-fill);
  box-shadow: inset 0 1px 0 var(--ctrl-rim), 0 0 0 1px var(--pane-edge);
}
.dv-peek-label { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------------------------------------------------------- panel */
.dv-panel {
  padding: 16px;
  border-width: 0;
  border-radius: var(--radius-card);
  color: var(--fg);
}

.dv-panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  min-height: 44px;
}
.dv-focus-label { margin: 0; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.dv-focus { margin: 3px 0 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
.dv-clear { flex: none; cursor: pointer; font: inherit; font-size: 12px; }

.dv-register {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  margin: 12px 0 10px;
  padding: 3px;
  border-radius: var(--radius-control);
  background: var(--well-fill);
  box-shadow: inset 0 1px 2px var(--well-shade), inset 0 -1px 0 var(--well-rim);
}
.dv-register button {
  min-height: 32px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
html[data-theme] .dv-register button[aria-checked="true"] {
  background-color: var(--blue);
  color: var(--on-blue);
  box-shadow: inset 0 1px 0 var(--ink-rim), inset 0 -1px 0 var(--ink-under),
    0 1px 2px var(--pane-contact);
}

.dv-tabs {
  display: flex;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 12px;
}
.dv-tabs button {
  flex: 1;
  min-height: 40px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.dv-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--blue); }

.dv-panel-body { min-height: 180px; }

.dv-word {
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.dv-word:last-child { border-bottom: 0; }
.dv-word-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.dv-word-en { font-size: 16px; font-weight: 600; }
.dv-word-zh { font-size: 13px; color: var(--muted); }
.dv-reg-badge {
  margin-left: auto;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--blue-tint);
  color: var(--muted);
  font-size: 10px;
}
.dv-word-note { margin: 5px 0 0; font-size: 13px; color: var(--fg); }
.dv-word-meta { margin: 4px 0 0; font-size: 11px; color: var(--muted); }

.dv-pattern {
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.dv-pattern:last-child { border-bottom: 0; }
.dv-level-badge {
  display: inline-block;
  margin-bottom: 4px;
  padding: 1px 6px;
  border-radius: 6px;
  background: var(--state-fill);
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.dv-pattern-en { margin: 0; font-size: 15px; line-height: 1.5; }
.dv-pattern-zh { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.dv-pattern-note { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

.dv-compare, .dv-trap {
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 14px;
  background: var(--surface);
}
.dv-compare-title { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.dv-compare-line { margin: 3px 0; font-size: 12px; color: var(--fg); }
.dv-compare-ex { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.dv-trap { background: transparent; box-shadow: inset 0 0 0 1px var(--pane-edge); }
.dv-trap-wrong { margin: 0; font-size: 13px; color: var(--danger); }
.dv-trap-right { margin: 4px 0 0; font-size: 13px; }
.dv-trap-why { margin: 5px 0 0; font-size: 12px; color: var(--muted); }

.dv-prompt { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.dv-prompt-hint { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.dv-keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.dv-keyword {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--ctrl-fill);
  box-shadow: inset 0 1px 0 var(--ctrl-rim), 0 0 0 1px var(--pane-edge);
  font-size: 12px;
}
.dv-keyword-zh { color: var(--muted); font-size: 11px; }
.dv-frame {
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface);
  font-size: 14px;
  line-height: 1.5;
}
.dv-scratch { margin: 10px 0; font-size: 12px; color: var(--muted); }
.dv-scratch summary { cursor: pointer; }
.dv-scratch-input {
  width: 100%;
  margin-top: 8px;
  padding: 8px 10px;
  border: 0;
  border-radius: 10px;
  background: var(--field-fill);
  box-shadow: inset 0 1px 0 var(--ctrl-rim), 0 0 0 1px var(--pane-edge);
  color: var(--fg);
  font: inherit;
  font-size: 13px;
  resize: vertical;
}
.dv-reveal { margin: 6px 0 2px; cursor: pointer; font: inherit; }
.dv-models { margin-top: 10px; }
.dv-levels { display: flex; gap: 4px; margin-bottom: 10px; }
.dv-levels button {
  flex: 1;
  min-height: 30px;
  border: 0;
  border-radius: 8px;
  background: var(--well-fill);
  color: var(--muted);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
html[data-theme] .dv-levels button[aria-checked="true"] {
  background: var(--blue);
  color: var(--on-blue);
}
.dv-model-en { margin: 0; font-size: 15px; line-height: 1.6; }
.dv-model-zh { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.dv-model-note { margin: 8px 0 0; font-size: 11px; color: var(--muted); }

.dv-read-lead { margin: 0 0 10px; font-size: 14px; line-height: 1.6; }
.dv-read-caution { margin: 0 0 10px; padding: 9px 11px; border-radius: 12px; background: var(--surface); font-size: 12px; color: var(--muted); }
.dv-overview { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
.dv-causal { margin: 10px 0 0; padding: 9px 11px; border-radius: 12px; background: var(--blue-tint); font-size: 12px; }

.dv-empty { margin: 12px 0; font-size: 13px; color: var(--muted); }
.dv-loading { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.dv-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------------- chart */
.dv-mark { cursor: pointer; transition: opacity 0.1s ease; }
.dv-mark:focus-visible { outline: none; stroke: var(--focus-line); stroke-width: 3; }
.dv-mark:focus-visible.dv-dot { stroke-width: 3; }
.dv-chart.has-selection .dv-mark:not(.is-selected) { opacity: 0.3; }
.dv-chart .dv-mark.is-selected { filter: drop-shadow(0 0 3px var(--focus-line)); }

.dv-s1 { --c: var(--dv-1); }
.dv-s2 { --c: var(--dv-2); }
.dv-s3 { --c: var(--dv-3); }
.dv-s4 { --c: var(--dv-4); }
.dv-s5 { --c: var(--dv-5); }
.dv-s6 { --c: var(--dv-6); }
.dv-s7 { --c: var(--dv-7); }
.dv-s8 { --c: var(--dv-8); }

.dv-line { stroke: var(--c, var(--dv-1)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; fill: none; }
.dv-line.dv-s2 { stroke-dasharray: 7 4; }
.dv-line.dv-s3 { stroke-dasharray: 2 3.5; }
.dv-line.dv-s4 { stroke-dasharray: 11 4 2 4; }
.dv-line.is-selected { stroke-width: 3.5; }
.dv-bar { fill: var(--c, var(--dv-1)); }
.dv-bar.is-selected { stroke: var(--fg); stroke-width: 2; }
.dv-bar.dv-pos { fill: var(--dv-pos); }
.dv-bar.dv-neg { fill: var(--dv-neg); }
.dv-bar.dv-total { fill: var(--dv-total); }
.dv-slice { fill: var(--c, var(--dv-1)); stroke: var(--pane-solid); stroke-width: 2; }
.dv-slice.is-selected { stroke: var(--fg); stroke-width: 2; }
.dv-dot { fill: var(--c, var(--dv-1)); stroke: var(--pane-solid); stroke-width: 2; }
.dv-dot.is-selected { stroke: var(--fg); stroke-width: 2.5; }
.dv-seg-hit:hover { opacity: 1; }
.dv-seg-hit.is-selected { stroke: var(--fg); stroke-width: 8; opacity: 0.18; }
.dv-node { fill: var(--c, var(--dv-1)); }
.dv-node.is-selected { stroke: var(--fg); stroke-width: 2; }
.dv-link { fill: var(--dv-total); opacity: 0.22; transition: opacity 0.1s ease, fill 0.1s ease; }
.dv-link:hover { opacity: 0.42; }
.dv-link.is-selected { fill: var(--c, var(--dv-1)); opacity: 0.65; }
.dv-link.is-selected { opacity: 0.9; stroke: var(--fg); stroke-width: 1.5; }
.dv-cell { stroke: var(--pane-solid); stroke-width: 1; }
.dv-cell.is-selected { stroke: var(--fg); stroke-width: 2; }
.dv-connector { stroke: var(--muted); stroke-width: 1; opacity: 0.5; }
.dv-value-label { fill: var(--muted); font-size: 12px; font-weight: 500; font-family: inherit; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--pane-solid); stroke-width: 3px; stroke-linejoin: round; }
.dv-seg-label { fill: var(--fg); font-size: 11px; font-weight: 600; font-family: inherit; paint-order: stroke; stroke: var(--pane-solid); stroke-width: 3px; }
.dv-slope-line { opacity: 0.5; }
.dv-slope-line.is-moved { opacity: 1; stroke-width: 2.6; }

.dv-heat-1 { fill: var(--dv-seq-1); }
.dv-heat-2 { fill: var(--dv-seq-2); }
.dv-heat-3 { fill: var(--dv-seq-3); }
.dv-heat-4 { fill: var(--dv-seq-4); }
.dv-heat-5 { fill: var(--dv-seq-5); }

.dv-gridline { stroke: var(--rule); stroke-width: 1; opacity: 0.55; }
.dv-baseline { stroke: var(--muted); stroke-width: 1; opacity: 0.8; }
.dv-tick { fill: var(--muted); font-size: 12px; font-family: inherit; }
.dv-unit { fill: var(--muted); font-size: 12px; font-family: inherit; }
.dv-label { fill: var(--fg); font-size: 12px; font-weight: 600; font-family: inherit; paint-order: stroke; stroke: var(--pane-solid); stroke-width: 3px; stroke-linejoin: round; }
.dv-slice-label { fill: var(--fg); font-size: 12px; font-weight: 600; font-family: inherit; paint-order: stroke; stroke: var(--pane-solid); stroke-width: 3px; }

.dv-mini-line { stroke: var(--c, var(--dv-1)); stroke-width: 2; fill: none; }
.dv-mini-area { fill: var(--c, var(--dv-1)); opacity: 0.12; }
.dv-mini-bar { fill: var(--c, var(--dv-1)); }
.dv-mini-slice { fill: var(--c, var(--dv-1)); stroke: var(--pane-solid); stroke-width: 1.5; }
.dv-mini-dot { fill: var(--c, var(--dv-1)); }
.dv-mini-link { fill: none; stroke: var(--c, var(--dv-1)); stroke-width: 5; opacity: 0.35; stroke-linecap: round; }
.dv-mini-linkband { fill: var(--c, var(--dv-1)); opacity: 0.38; }
.dv-mini-node { fill: var(--c, var(--dv-1)); }
.dv-mini-cell { stroke: var(--pane-solid); stroke-width: 1; }
.dv-mini-empty { fill: var(--surface); }

/* ---------------------------------------------------------------- table */
.dv-table { margin-top: 12px; overflow-x: auto; }
.dv-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.dv-table caption { caption-side: top; text-align: left; padding: 4px 0 8px; color: var(--muted); font-size: 11px; }

    if (series) slots.series_name = series.name_en || '';
    return slots;
  }

  function changeSlots(view, series, i, unit) {
    var a = series.values[i];
    var b = series.values[i + 1];
    var slots = baseSlots(view, series);
    slots.from = fmtValue(a, unit);
    slots.to = fmtValue(b, unit);
    slots.from_period = label(view, i);
    slots.to_period = label(view, i + 1);
    slots.period = label(view, i) + ' to ' + label(view, i + 1);
    slots.pct = pctText(a, b);
    slots.pp = ppText(b - a, unit);
    slots.delta = fmtDelta(b - a, unit);
    return slots;
  }

  function make(kind, mark, slots) {
    return { kind: kind, marks: [mark], slots: slots, auto: true };
  }

  function maxIndex(values) {
    var best = 0;
    for (var i = 1; i < values.length; i++) if (values[i] > values[best]) best = i;
    return best;
  }

  function minIndex(values) {
    var best = 0;
    for (var i = 1; i < values.length; i++) if (values[i] < values[best]) best = i;
    return best;
  }

  // ---------------------------------------------------------------- line
  function computeLine(view) {
    var unit = view.unit || {};
    var out = {};
    var n = view.x.values.length;
    view.series.forEach(function (series) {
      var values = series.values;
      var kinds = [];
      var i;
      for (i = 0; i < n - 1; i++) kinds.push(classifyChange(values[i], values[i + 1], unit));

      i = 0;
      while (i < kinds.length) {
        if (kinds[i] !== 'flat') { i += 1; continue; }
        var j = i;
        while (j < kinds.length && kinds[j] === 'flat') j += 1;
        for (var k = i; k < j; k++) kinds[k] = j - i >= 2 ? 'plateau' : 'flat';
        i = j;
      }

      function dirOf(kind) {
        if (kind.indexOf('rise') >= 0) return 1;
        if (kind.indexOf('fall') >= 0) return -1;
        return 0;
      }

      i = 0;
      while (i < kinds.length - 1) {
        if (dirOf(kinds[i]) && dirOf(kinds[i]) !== dirOf(kinds[i + 1])) {
          var end = i + 1;
          while (end + 1 < kinds.length && dirOf(kinds[end + 1])
                 && dirOf(kinds[end + 1]) !== dirOf(kinds[end])) {
            end += 1;
          }
          if (end - i + 1 >= 3) {
            for (var m = i; m <= end; m++) kinds[m] = 'fluctuate';
          }
          i = end + 1;
        } else {
          i += 1;
        }
      }

      for (i = 0; i < n - 1; i++) {
        var seg = 'seg:' + series.id + ':' + i;
        out[seg] = make(kinds[i], seg, changeSlots(view, series, i, unit));
      }
      var peakIdx = maxIndex(values);
      for (i = 0; i < n; i++) {
        var mark = 'pt:' + series.id + ':' + i;
        var value = values[i];
        var neighbors = [];
        if (i > 0) neighbors.push(values[i - 1]);
        if (i < n - 1) neighbors.push(values[i + 1]);
        var kind = 'point';
        var above = neighbors.every(function (v) { return value > v; });
        var below = neighbors.every(function (v) { return value < v; });
        if (neighbors.length && above) kind = 'peak';
        else if (neighbors.length && below) kind = 'trough';
        var slots = baseSlots(view, series);
        slots.value = fmtValue(value, unit);
        slots.period = label(view, i);
        slots.peak = fmtValue(values[peakIdx], unit);
        slots.peak_period = label(view, peakIdx);
        out[mark] = make(kind, mark, slots);
      }
    });
    return out;
  }

  // ---------------------------------------------------------------- bar
  function computeBar(view) {
    var unit = view.unit || {};
    var out = {};
    var count = view.x.values.length;
    view.series.forEach(function (series) {
      var values = series.values;
      var order = values.map(function (_, i) { return i; }).sort(function (a, b) {
        return values[b] - values[a];
      });
      var rank = {};
      order.forEach(function (idx, r) { rank[idx] = r + 1; });
      var top = values[order[0]];
      var second = count > 1 ? values[order[1]] : values[order[0]];
      var spread = (Math.max.apply(null, values) - Math.min.apply(null, values))
        / Math.abs(Math.max.apply(null, values) || 1);
      for (var i = 0; i < count; i++) {
        var mark = 'bar:' + series.id + ':' + i;
        var kind = 'ranking';
        if (rank[i] === 1) {
          kind = 'highest';
        } else if (rank[i] === 2 && second
                   && Math.abs(top - second) / Math.abs(top || 1) <= 0.10) {
          kind = 'small_gap';
        } else if (rank[i] === count) {
          kind = 'lowest';
        } else if (spread <= 0.10) {
          kind = 'similar_values';
        }
        var slots = baseSlots(view, series);
        slots.category = label(view, i);
        slots.value = fmtValue(values[i], unit);
        slots.unit = unit.short || '';
        slots.rank = String(rank[i]);
        slots.gap = fmtDelta(Math.abs(top - values[i]), unit);
        slots.top_category = label(view, order[0]);
        slots.top_value = fmtValue(top, unit);
        out[mark] = make(kind, mark, slots);
      }
    });
    return out;
  }

  // ---------------------------------------------------------------- pie
  function computePie(view) {
    var unit = view.unit || {};
    var parts = view.parts;
    var total = parts.reduce(function (sum, p) { return sum + p.value; }, 0) || 1;
    var order = parts.map(function (_, i) { return i; }).sort(function (a, b) {
      return parts[b].value - parts[a].value;
    });
    var rank = {};
    order.forEach(function (idx, r) { rank[idx] = r + 1; });
    var out = {};
    parts.forEach(function (part, i) {
      var share = part.value / total * 100;
      var mark = 'slice:' + part.id;
      var kind = 'item';
      if (rank[i] === 1) {
        kind = share > 55 ? 'majority' : share >= 45 && share <= 55 ? 'about_half' : 'largest_share';
      } else if (rank[i] === parts.length) {
        kind = share < 10 ? 'minority' : 'smallest_share';
      }
      out[mark] = make(kind, mark, {
        subject: view.subject || '',
        category: part.name_en || '',
        share: fmtValue(share, unit),
        share_number: num(share, unit.decimals == null ? 0 : Number(unit.decimals)),
        value: fmtValue(part.value, unit),
        rank: String(rank[i])
      });
    });
    return out;
  }

  // ---------------------------------------------------------------- scatter
  function pearson(points) {
    var n = points.length;
    if (n < 3) return 0;
    var mx = points.reduce(function (s, p) { return s + p.x; }, 0) / n;
    var my = points.reduce(function (s, p) { return s + p.y; }, 0) / n;
    var sx = Math.sqrt(points.reduce(function (s, p) { return s + (p.x - mx) * (p.x - mx); }, 0));
    var sy = Math.sqrt(points.reduce(function (s, p) { return s + (p.y - my) * (p.y - my); }, 0));
    if (sx === 0 || sy === 0) return 0;
    return points.reduce(function (s, p) { return s + (p.x - mx) * (p.y - my); }, 0) / (sx * sy);
  }

  function scatterKind(r) {
    if (Math.abs(r) >= 0.7) return r > 0 ? 'positive_strong' : 'negative_strong';
    if (Math.abs(r) >= 0.4) return r > 0 ? 'positive_moderate' : 'negative_moderate';
    return 'weak_or_none';
  }

  function computeScatter(view) {
    var unit = view.unit || {};
    var points = view.points;
    var out = {};
    var xs = points.map(function (p) { return p.x; });
    var ys = points.map(function (p) { return p.y; });
    var n = points.length;
    var mx = xs.reduce(function (a, b) { return a + b; }, 0) / n;
    var my = ys.reduce(function (a, b) { return a + b; }, 0) / n;
    var denom = xs.reduce(function (s, x) { return s + (x - mx) * (x - mx); }, 0) || 1;
    var slope = points.reduce(function (s, p) { return s + (p.x - mx) * (p.y - my); }, 0) / denom;
    var intercept = my - slope * mx;
    var residuals = points.map(function (p) { return p.y - (slope * p.x + intercept); });
    var sd = Math.sqrt(residuals.reduce(function (s, r) { return s + r * r; }, 0) / n) || 1e-9;
    var groups = {};
    (view.groups || []).forEach(function (g) { groups[g.id] = g; });
    var byGroup = {};
    points.forEach(function (p) {
      var key = p.group == null ? '' : p.group;
      if (!byGroup[key]) byGroup[key] = [];
      byGroup[key].push(p);
    });

    function slotsFor(group, r) {
      return {
        subject: view.subject || '',
        x: (view.x || {}).label_en || 'x',
        y: (view.y || {}).label_en || 'y',
        r: DV.roundFixed(Math.abs(r), 2),
        direction: r > 0 ? 'positive' : 'negative',
        group: (groups[group] || {}).name_en || '',
        unit: unit.short || ''
      };
    }

    var overall = pearson(points);
    out.all = make(scatterKind(overall), 'all', slotsFor('', overall));
    Object.keys(byGroup).forEach(function (group) {
      var r = pearson(byGroup[group]);
      var mark = 'grp:' + group;
      out[mark] = make(scatterKind(r), mark, slotsFor(group, r));
    });
    points.forEach(function (p) {
      var mark = 'pt:' + p.id;
      var res = p.y - (slope * p.x + intercept);
      var isOutlier = Math.abs(res) > 2 * sd;
      var group = p.group == null ? '' : p.group;
      var r = pearson(byGroup[group] || points);
      var kind = isOutlier ? 'outlier' : scatterKind(r);
      var slots = slotsFor(group, r);
      slots.x_value = num(p.x, 1).replace(/\.0$/, '');
      slots.y_value = num(p.y, 1).replace(/\.0$/, '');
      slots.category = p.name_en || p.id;
      out[mark] = make(kind, mark, slots);
    });
    return out;
  }

  // ---------------------------------------------------------------- stacked
  function computeStacked(view) {
    var unit = view.unit || {};
    var out = {};
    var n = view.x.values.length;
    var series = view.series;
    var totals = [];
    for (var i = 0; i < n; i++) {
      totals.push(series.reduce(function (sum, s) { return sum + s.values[i]; }, 0));
    }
    for (i = 0; i < n; i++) {
      var total = totals[i] || 1;
      var largest = series[0];
      series.forEach(function (s) { if (s.values[i] > largest.values[i]) largest = s; });
      var stackMark = 'stack:' + i;
      var stackSlots = baseSlots(view, null);
      stackSlots.category = label(view, i);
      stackSlots.period = label(view, i);
      stackSlots.value = fmtValue(totals[i], unit);
      stackSlots.share = view.mode === 'percent' ? '100 percent' : '';
      out[stackMark] = make('composition', stackMark, stackSlots);
      series.forEach(function (s) {
        var mark = 'seg:' + i + ':' + s.id;
        var value = s.values[i];
        var share = value / total * 100;
        var slots = baseSlots(view, s);
        slots.category = label(view, i);
        slots.period = label(view, i);
        slots.value = fmtValue(value, unit);
        slots.share = fmtValue(share, unit);
        slots.share_number = num(share, unit.decimals == null ? 0 : Number(unit.decimals));
        slots.total = fmtValue(totals[i], unit);
        out[mark] = make(s === largest ? 'largest_component' : 'item', mark, slots);
      });
    }
    return out;
  }

  // ---------------------------------------------------------------- heatmap
  function computeHeatmap(view) {
    var unit = view.unit || {};
    var rows = view.rows;
    var cols = view.cols;
    var cells = view.cells;
    var best = { r: 0, c: 0, v: cells[0][0] };
    var low = { r: 0, c: 0, v: cells[0][0] };
    rows.forEach(function (_, r) {
      cols.forEach(function (__, c) {
        if (cells[r][c] > best.v) best = { r: r, c: c, v: cells[r][c] };
        if (cells[r][c] < low.v) low = { r: r, c: c, v: cells[r][c] };
      });
    });
    var out = {};
    rows.forEach(function (row, r) {
      cols.forEach(function (col, c) {
        var value = cells[r][c];
        var mark = 'cell:' + row.id + ':' + col.id;
        var kind = 'cell';
        if (r === best.r && c === best.c) kind = 'peak_cell';
        else if (r === low.r && c === low.c) kind = 'low_cell';
        out[mark] = make(kind, mark, {
          subject: view.subject || '',
          row: row.name_en || '',
          col: col.name_en || '',
          category: (row.name_en || '') + ' · ' + (col.name_en || ''),
          period: col.name_en || '',
          value: fmtValue(value, unit),
          unit: unit.short || ''
        });
      });
      var rowAvg = cells[r].reduce(function (s, v) { return s + v; }, 0) / cols.length;
      var rowBusiest = 0;
      cols.forEach(function (__, c) { if (cells[r][c] > cells[r][rowBusiest]) rowBusiest = c; });
      var rowMark = 'row:' + row.id;
      out[rowMark] = make('pattern', rowMark, {
        subject: view.subject || '',
        row: row.name_en || '',
        col: (cols[rowBusiest] || {}).name_en || '',
        category: row.name_en || '',
        period: 'the week',
        value: fmtValue(rowAvg, unit),
        unit: unit.short || ''
      });
    });
    cols.forEach(function (col, c) {
      var avg = rows.reduce(function (s, __, r) { return s + cells[r][c]; }, 0) / rows.length;
      var colBusiest = 0;
      rows.forEach(function (__, r) { if (cells[r][c] > cells[colBusiest][c]) colBusiest = r; });
      var colMark = 'col:' + col.id;
      out[colMark] = make('compare_periods', colMark, {
        subject: view.subject || '',
        row: (rows[colBusiest] || {}).name_en || '',
        col: col.name_en || '',
        category: col.name_en || '',
        period: col.name_en || '',
        value: fmtValue(avg, unit),
        unit: unit.short || ''
      });
    });
    return out;
  }

  // ---------------------------------------------------------------- sankey
  function computeSankey(view) {
    var unit = view.unit || {};
    var nodes = {};
    view.nodes.forEach(function (n) { nodes[n.id] = n; });
    var links = view.links;
    var out = {};
    var outTotal = {};
    var inTotal = {};
    links.forEach(function (link) {
      outTotal[link.source] = (outTotal[link.source] || 0) + link.value;
      inTotal[link.target] = (inTotal[link.target] || 0) + link.value;
    });
    var firstColumn = {};
    ((view.columns || [[]])[0] || []).forEach(function (id) { firstColumn[id] = true; });
    var rootTotal = links.reduce(function (sum, link) {
      return sum + (firstColumn[link.source] ? link.value : 0);
    }, 0) || 1;
    links.forEach(function (link) {
      var src = link.source;
      var dst = link.target;
      var mark = 'link:' + src + '->' + dst;
      var top = 1;
      var hasTop = false;
      links.forEach(function (l) {
        if (l.source === src && (!hasTop || l.value > top)) { top = l.value; hasTop = true; }
      });
      if (!hasTop) top = 1;
      var kind = link.value === top ? 'main_path'
        : link.value < top * 0.5 ? 'drop_off' : 'secondary_path';
      var share = link.value / (outTotal[src] || 1) * 100;
      out[mark] = make(kind, mark, {
        subject: view.subject || '',
        source: (nodes[src] || {}).name_en || src,
        target: (nodes[dst] || {}).name_en || dst,
        value: fmtValue(link.value, unit),
        share: fmtValue(share, { kind: 'percent', decimals: 0 }),
        pct: DV.roundFixed(share, 0),
        period: view.period_label || '',
        unit: unit.short || ''
      });
    });
    Object.keys(nodes).forEach(function (id) {
      var node = nodes[id];
      var mark = 'node:' + id;
      var ins = inTotal[id] || 0;
      var outs = outTotal[id] || 0;
      var nodeKind = ins > outs && ins ? 'merge' : 'split';
      var incoming = links.filter(function (l) { return l.target === id; });
      var outgoing = links.filter(function (l) { return l.source === id; });
      var source = node.name_en || '';
      var target = node.name_en || '';
      var share = 0;
      if (nodeKind === 'merge' && incoming.length) {
        var mainIn = incoming.reduce(function (a, b) { return b.value > a.value ? b : a; });
        source = (nodes[mainIn.source] || {}).name_en || mainIn.source;
        target = node.name_en || '';
        share = Math.max(ins, outs) / rootTotal * 100;
      } else if (outgoing.length) {
        var mainOut = outgoing.reduce(function (a, b) { return b.value > a.value ? b : a; });
        source = node.name_en || '';
        target = (nodes[mainOut.target] || {}).name_en || mainOut.target;
        share = mainOut.value / (outs || 1) * 100;
      }
      out[mark] = make(nodeKind, mark, {
        subject: view.subject || '',
        source: source,
        target: target,
        category: node.name_en || '',
        value: fmtValue(Math.max(ins, outs), unit),
        share: fmtValue(share, { kind: 'percent', decimals: 0 }),
        pct: DV.roundFixed(share, 0),
        period: view.period_label || '',
        unit: unit.short || ''
      });
    });
    return out;
  }

  // ---------------------------------------------------------------- slope
  function computeSlope(view) {
    var unit = view.unit || {};
    var entities = view.entities;
    var periods = view.periods;
    var out = {};
    var ranks = periods.map(function (_, pi) {
      var order = entities.map(function (_, ei) { return ei; }).sort(function (a, b) {
        return entities[b].values[pi] - entities[a].values[pi];
      });
      var rank = {};
      order.forEach(function (ei, r) { rank[ei] = r + 1; });
      return rank;
    });
    entities.forEach(function (entity, ei) {
      var a = entity.values[0];
      var b = entity.values[entity.values.length - 1];
      var mark = 'line:' + entity.id;
      var kind = ranks[0][ei] === ranks[ranks.length - 1][ei] ? 'stable_rank'
        : ranks[ranks.length - 1][ei] < ranks[0][ei] ? 'rank_up' : 'rank_down';
      if (kind === 'rank_up' && ranks[0][ei] - ranks[ranks.length - 1][ei] >= 2) kind = 'overtake';
      var slots = {
        subject: view.subject || '',
        entity: entity.name_en || '',
        category: entity.name_en || '',
        from: fmtValue(a, unit),
        to: fmtValue(b, unit),
        from_period: (periods[0] || {}).label_en || '',
        to_period: (periods[periods.length - 1] || {}).label_en || '',
        period: ((periods[0] || {}).label_en || '') + ' to '
          + ((periods[periods.length - 1] || {}).label_en || ''),
        pct: pctText(a, b),
        pp: ppText(b - a, unit),
        delta: fmtDelta(b - a, unit),
        rank: String(ranks[ranks.length - 1][ei]),
        rank_before: String(ranks[0][ei]),
        gap: String(Math.abs(ranks[0][ei] - ranks[ranks.length - 1][ei]))
      };
      out[mark] = make(kind, mark, slots);
      periods.forEach(function (period, pi) {
        var pm = 'pt:' + entity.id + ':' + pi;
        var ps = Object.assign({}, slots);
        ps.value = fmtValue(entity.values[pi], unit);
        ps.period = period.label_en || '';
        ps.rank = String(ranks[pi][ei]);
        out[pm] = make('point', pm, ps);
      });
    });
    return out;
  }

  // ---------------------------------------------------------------- waterfall
  function computeWaterfall(view) {
    var unit = view.unit || {};
    var steps = view.steps;
    var start = Number(view.start_value || 0);
    var end = start + steps.reduce(function (s, step) { return s + step.value; }, 0);
    var largest = 0;
    steps.forEach(function (step, i) {
      if (Math.abs(step.value) > Math.abs(steps[largest].value)) largest = i;
    });
    var pos = steps.reduce(function (s, step) { return s + (step.value > 0 ? step.value : 0); }, 0);
    var neg = steps.reduce(function (s, step) { return s + (step.value < 0 ? -step.value : 0); }, 0);
    var out = {};
    steps.forEach(function (step, i) {
      var mark = 'step:' + step.id;
      var kind = i === largest ? 'largest_step'
        : step.value > 0 ? 'increase_contributor' : 'decrease_contributor';
      if (i === largest && neg && pos && neg / pos >= 0.5 && step.value > 0) kind = 'offset';
      out[mark] = make(kind, mark, {
        subject: view.subject || '',
        category: step.name_en || '',
        value: fmtValue(Math.abs(step.value), unit),
        signed: (step.value > 0 ? '+' : '-') + fmtValue(Math.abs(step.value), unit),
        start: fmtValue(start, unit),
        end: fmtValue(end, unit),
        pct: pctText(start, end),
        pp: ppText(end - start, unit),
        period: view.period_label || '',
        unit: unit.short || ''
      });
    });
    [
      ['total:start', start, (view.start || {}).name_en || 'Start'],
      ['total:end', end, (view.end || {}).name_en || 'End']
    ].forEach(function (item) {
      out[item[0]] = make('net_change', item[0], {
        subject: view.subject || '',
        category: item[2],
        value: fmtValue(item[1], unit),
        start: fmtValue(start, unit),
        end: fmtValue(end, unit),
        pct: pctText(start, end),
        pp: ppText(end - start, unit),
        period: view.period_label || '',
        unit: unit.short || ''
      });
    });
    return out;
  }

  var COMPUTERS = {
    line: computeLine,
    bar: computeBar,
    pie: computePie,
    scatter: computeScatter,
    stacked: computeStacked,
    heatmap: computeHeatmap,
    sankey: computeSankey,
    slope: computeSlope,
    waterfall: computeWaterfall

  DV.compute = {
    view: function (view) {
      var fn = COMPUTERS[view && view.type];
      return fn ? fn(view) : {};
    },
    fmtValue: fmtValue,
    fmtAxis: fmtAxis,
    fmtDelta: fmtDelta,
    pctText: pctText,
    ppText: ppText,
    classifyChange: classifyChange,
    changeSlots: changeSlots,
    label: label

  // Flatten a shipped view + its (possibly edited) data into the shape the
  // feature engine and renderers read.
  DV.liveView = function (shipped, data) {
    var view = {};
    Object.keys(shipped).forEach(function (key) { view[key] = shipped[key]; });
    view.data = data;
    Object.keys(data || {}).forEach(function (key) { view[key] = data[key]; });
    return view;

    return JSON.parse(JSON.stringify(value));

      ? features

  function featuresOf(features) {

        }, label);
        if (rotate) node.setAttribute('transform', 'rotate(-28 ' + lx + ' ' + ly + ')');
      });
    }
    if (unit && unit.short) {
      DV.text(box.svg, {
        x: p.x - 10, y: p.y - 8, 'text-anchor': 'end', class: 'dv-unit'
      }, unit.short);
    }
    return y;
  }

  function roundedTop(x, y, w, h, r) {
    r = Math.min(r, w / 2, Math.abs(h));
    if (h <= 0) return '';
    return 'M' + x + ',' + (y + h) + 'L' + x + ',' + (y + r) +
      'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
      'L' + (x + w - r) + ',' + y + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) +
      'L' + (x + w) + ',' + (y + h) + 'Z';
  }

  function roundedBottom(x, y, w, h, r) {
    r = Math.min(r, w / 2, Math.abs(h));
    if (h >= 0) return '';
    h = -h;
    return 'M' + x + ',' + y + 'L' + x + ',' + (y + h - r) +
      'Q' + x + ',' + (y + h) + ' ' + (x + r) + ',' + (y + h) +
      'L' + (x + w - r) + ',' + (y + h) + 'Q' + (x + w) + ',' + (y + h) + ' ' + (x + w) + ',' + (y + h - r) +
      'L' + (x + w) + ',' + y + 'Z';
  }

  function arcPath(cx, cy, r0, r1, a0, a1) {
    var large = a1 - a0 > Math.PI ? 1 : 0;
    var x0 = cx + r1 * Math.cos(a0), y0 = cy + r1 * Math.sin(a0);
    var x1 = cx + r1 * Math.cos(a1), y1 = cy + r1 * Math.sin(a1);
    var x2 = cx + r0 * Math.cos(a1), y2 = cy + r0 * Math.sin(a1);
    var x3 = cx + r0 * Math.cos(a0), y3 = cy + r0 * Math.sin(a0);
    return 'M' + x0 + ' ' + y0 + 'A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + x1 + ' ' + y1 +
      'L' + x2 + ' ' + y2 + 'A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + x3 + ' ' + y3 + 'Z';
  }

  function finish(box, nodes) {
    var seen = {};
    var focusable = nodes.filter(function (node) {
      var id = node.getAttribute('data-mark');
      if (seen[id]) return false;
      seen[id] = true;
      return true;
    });
    roving(focusable);
    return {
      setSelected: function (mark, marks) {
        var set = marks && marks.length ? marks : (mark ? [mark] : []);
        box.svg.classList.toggle('has-selection', set.length > 0);
        nodes.forEach(function (node) {
          node.classList.toggle('is-selected', set.indexOf(node.getAttribute('data-mark')) >= 0);
        });
      }
    };
  }

  function seriesClass(slot) { return DV.slotClass(slot); }

  // ---------------------------------------------------------------- line
  DV.renderers.line = function (host, view, api) {
    var box = frame(host, H, view.subject);
    var p = plot(box);
    var d = view.data;
    var n = d.x.values.length;
    var all = [];
    d.series.forEach(function (s) { all = all.concat(s.values); });
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    var span = hi - lo || 1;
    var min = Math.max(0, lo - span * 0.15);
    var max = hi + span * 0.15;
    var y = axes(box, d.series[0].values, view.unit, d.x.values, { min: min, max: max });
    var nodes = [];
    var xOf = function (i) { return p.x + (i + 0.5) * p.w / n; };
    var tip = dragText(box, view);

    d.series.forEach(function (s) {
      var slot = s.slot || 1;
      for (var i = 0; i < n - 1; i++) {
        var hit = DV.svg('line', {
          x1: xOf(i), y1: y(s.values[i]), x2: xOf(i + 1), y2: y(s.values[i + 1]),
          stroke: 'transparent', 'stroke-width': 26, 'stroke-linecap': 'round',
          class: 'dv-seg-hit ' + seriesClass(slot)
        }, box.svg);
        makeMark(hit, 'seg:' + s.id + ':' + i,
          s.name_en + ', ' + d.x.values[i] + ' to ' + d.x.values[i + 1], api);
        nodes.push(hit);
      }
      var previewValues = s.values.slice();
      function linePath(values) {
        return values.map(function (value, index) {
          return (index ? 'L' : 'M') + xOf(index).toFixed(2) + ' ' + y(value).toFixed(2);
        }).join(' ');
      }
      var path = DV.svg('path', {
        d: linePath(s.values),
        fill: 'none',
        class: 'dv-line ' + seriesClass(slot)
      }, box.svg);
      s.values.forEach(function (v, i) {
        var dot = DV.svg('circle', {
          cx: xOf(i), cy: y(v), r: 4.5,
          class: 'dv-dot ' + seriesClass(slot)
        }, box.svg);
        var drag = null;
        if (api.editMode) {
          drag = {
            value: function () { return v; },
            read: function (local) {
              return roundValue(clamp(y.invert(local.y), min, max), view.unit);
            },
            preview: function (next) {
              previewValues[i] = next;
              path.setAttribute('d', linePath(previewValues));
              dot.setAttribute('cy', y(next));
              tip.show(DV.fmtValue(next, view.unit), xOf(i), y(next) - 12);
            },
            end: function () { tip.hide(); }
          };
        }
        makeMark(dot, 'pt:' + s.id + ':' + i,
          s.name_en + ', ' + d.x.values[i] + ': ' + DV.fmtValue(v, view.unit), api, null, drag);
        nodes.push(dot);
      });
      var last = s.values.length - 1;
      DV.text(box.svg, {
        x: xOf(last) + 10, y: y(s.values[last]) - 8, class: 'dv-label'
      }, DV.fmtAxis(s.values[last], view.unit) + (view.unit.short === '%' ? '%' : ''));
    });
    var out = finish(box, nodes);
    out.table = function () {
      return {
        head: [d.x.label_en || 'Period'].concat(d.series.map(function (s) { return s.name_en; })),
        rows: d.x.values.map(function (label, i) {
          return [label].concat(d.series.map(function (s) { return DV.fmtValue(s.values[i], view.unit); }));
        })
      };
    };
    return out;
  };

  // ---------------------------------------------------------------- bar
  DV.renderers.bar = function (host, view, api) {
    var box = frame(host, H, view.subject,
      { minWidth: view.data.x.values.length > 6 ? 520 : 0 });
    var p = plot(box);
    var d = view.data;
    var n = d.x.values.length;
    var all = [];
    d.series.forEach(function (s) { all = all.concat(s.values); });
    var lo = Math.min(0, Math.min.apply(null, all));
    var hi = Math.max(0, Math.max.apply(null, all));
    var pad = (hi - lo) * 0.12 || 1;
    var y = axes(box, d.series[0].values, view.unit, d.x.values,
      { min: lo - pad, max: hi + pad, categorical: true });
    DV.svg('line', { x1: p.x, x2: p.x + p.w, y1: y(0), y2: y(0), class: 'dv-baseline' }, box.svg);
    var nodes = [];
    var band = p.w / n;
    var count = d.series.length;
    var bw = Math.min(64, (band * 0.72) / count);
    var tip = dragText(box, view);
    d.series.forEach(function (s, si) {
      s.values.forEach(function (v, i) {
        var x = p.x + i * band + band / 2 - (count * bw) / 2 + si * bw;
        var zero = y(0);
        var top = y(v);
        var h = zero - top;
        var path = DV.svg('path', {
          d: h >= 0 ? roundedTop(x, top, bw - 2, h, 3) : roundedBottom(x, zero, bw - 2, h, 3),
          class: 'dv-bar ' + seriesClass(s.slot || 1)
        }, box.svg);
        var drag = null;
        if (api.editMode) {
          drag = {
            value: function () { return v; },
            read: function (local) {
              return roundValue(clamp(y.invert(local.y), lo - pad, hi + pad), view.unit);
            },
            preview: function (next) {
              var nextTop = y(next);
              var nextH = zero - nextTop;
              path.setAttribute('d', nextH >= 0
                ? roundedTop(x, nextTop, bw - 2, nextH, 4)
                : roundedBottom(x, zero, bw - 2, nextH, 4));
              tip.show(DV.fmtValue(next, view.unit), x + bw / 2, Math.min(nextTop, zero) - 8);
            },
            end: function () { tip.hide(); }
          };
        }
        makeMark(path, 'bar:' + s.id + ':' + i,
          s.name_en + ', ' + d.x.values[i] + ': ' + DV.fmtValue(v, view.unit), api, null, drag);
        nodes.push(path);
        var hit = DV.svg('rect', {
          x: x - 2, y: Math.min(top, zero) - 12, width: bw + 2,
          height: Math.max(24, Math.abs(h) + 24), fill: 'transparent',
          class: 'dv-mark'
        }, box.svg);
        makeMark(hit, 'bar:' + s.id + ':' + i,
          s.name_en + ', ' + d.x.values[i] + ': ' + DV.fmtValue(v, view.unit), api, null, drag);
        nodes.push(hit);
        if (n <= 8 && count <= 2) {
          var labelY = v >= 0 ? top - 7 : zero + 15;
          DV.text(box.svg, {
            x: x + bw / 2, y: labelY, 'text-anchor': 'middle', class: 'dv-value-label'
          }, DV.fmtAxis(v, view.unit) + (view.unit.short === '%' ? '%' : ''));
        }
      });
    });
    var out = finish(box, nodes);
    out.table = function () {
      return {
        head: [d.x.label_en || 'Category'].concat(d.series.map(function (s) { return s.name_en; })),
        rows: d.x.values.map(function (label, i) {
          return [label].concat(d.series.map(function (s) { return DV.fmtValue(s.values[i], view.unit); }));
        })
      };
    };
    return out;
  };

  // ---------------------------------------------------------------- pie
  DV.renderers.pie = function (host, view, api) {
    var box = frame(host, 380, view.subject);
    var cx = box.W / 2, cy = 190;
    var r1 = Math.min(150, box.W * 0.30), r0 = r1 * 0.72;
    var parts = view.data.parts;
    var total = parts.reduce(function (sum, part) { return sum + part.value; }, 0) || 1;
    var nodes = [];
    var angle = -Math.PI / 2;
    parts.forEach(function (part) {
      var a0 = angle;
      var a1 = angle + part.value / total * Math.PI * 2;
      angle = a1;
      var path = DV.svg('path', {
        d: arcPath(cx, cy, r0, r1, a0 + 0.012, a1 - 0.012),
        class: 'dv-slice ' + seriesClass(part.slot || 1)
      }, box.svg);
      makeMark(path, 'slice:' + part.id,
        part.name_en + ': ' + DV.fmtValue(part.value, view.unit), api);
      nodes.push(path);
      var mid = (a0 + a1) / 2;
      if (part.value / total >= 0.08) {
        DV.text(box.svg, {
          x: cx + (r0 + r1) / 2 * Math.cos(mid),
          y: cy + (r0 + r1) / 2 * Math.sin(mid) + 4,
          'text-anchor': 'middle',
          class: 'dv-slice-label'
        }, Math.round(part.value / total * 100) + '%');
      }
    });
    var out = finish(box, nodes);
    out.table = function () {
      return {
        head: ['Category', 'Share'],
        rows: parts.map(function (part) {
          return [part.name_en, DV.fmtValue(part.value / total * 100, view.unit)];
        })
      };
    };
    return out;
  };

  // ---------------------------------------------------------------- scatter
  DV.renderers.scatter = function (host, view, api) {
    var box = frame(host, H, view.subject);
    var p = plot(box);
    var d = view.data;
    var xs = d.points.map(function (pt) { return pt.x; });
    var ys = d.points.map(function (pt) { return pt.y; });
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
    var ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
    var xpad = (xmax - xmin) * 0.06 || 1, ypad = (ymax - ymin) * 0.08 || 1;
    var sx = DV.linear([xmin - xpad, xmax + xpad], [p.x, p.x + p.w]);
    var sy = DV.linear([ymin - ypad, ymax + ypad], [p.y + p.h, p.y]);
    var g = DV.svg('g', { class: 'dv-grid' }, box.svg);
    DV.ticks(xmin, xmax, 5).forEach(function (t) {
      DV.text(box.svg, { x: sx(t), y: p.y + p.h + 22, 'text-anchor': 'middle', class: 'dv-tick' },
        DV.fmtAxis(t, { decimals: 0 }));
    });
    DV.ticks(ymin, ymax, 4).forEach(function (t) {
      DV.svg('line', { x1: p.x, x2: p.x + p.w, y1: sy(t), y2: sy(t), class: 'dv-gridline' }, g);
      DV.text(box.svg, { x: p.x - 10, y: sy(t) + 4, 'text-anchor': 'end', class: 'dv-tick' },
        DV.fmtAxis(t, { decimals: 0 }));
    });
    DV.text(box.svg, { x: p.x + p.w, y: p.y + p.h + 40, 'text-anchor': 'end', class: 'dv-unit' },
      d.x.label_en || '');
    DV.text(box.svg, { x: p.x, y: p.y - 8, class: 'dv-unit' }, d.y.label_en || '');
    var groups = {};
    (d.groups || []).forEach(function (grp) { groups[grp.id] = grp; });
    var nodes = [];
    var tip = dragText(box, view);
    d.points.forEach(function (pt) {
      var grp = groups[pt.group] || {};
      var dot = DV.svg('circle', {
        cx: sx(pt.x), cy: sy(pt.y), r: 5,
        class: 'dv-dot ' + seriesClass(grp.slot || 1)
      }, box.svg);
      makeMark(dot, 'pt:' + pt.id,
        (grp.name_en ? grp.name_en + ', ' : '') + pt.x + ', ' + pt.y, api);
      nodes.push(dot);
      var hit = DV.svg('circle', {
        cx: sx(pt.x), cy: sy(pt.y), r: 13, fill: 'transparent', class: 'dv-mark'
      }, box.svg);
      var drag = null;
      if (api.editMode) {
        drag = {
          value: function () { return { x: pt.x, y: pt.y }; },
          read: function (local) {
            return {
              x: roundValue(clamp(sx.invert(local.x), xmin - xpad, xmax + xpad), { decimals: 1 }),
              y: roundValue(clamp(sy.invert(local.y), ymin - ypad, ymax + ypad), { decimals: 1 })
            };
          },
          preview: function (next) {
            dot.setAttribute('cx', sx(next.x));
            dot.setAttribute('cy', sy(next.y));
            tip.show(DV.num(next.x, 1) + ', ' + DV.num(next.y, 1), sx(next.x), sy(next.y) - 12);
          },
          end: function () { tip.hide(); }
        };
      }
      makeMark(hit, 'pt:' + pt.id,
        (grp.name_en ? grp.name_en + ', ' : '') + pt.x + ', ' + pt.y, api, null, drag);
      nodes.push(hit);
    });
    var out = finish(box, nodes);
    out.table = function () {
      return {
        head: ['Group', d.x.label_en || 'X', d.y.label_en || 'Y'],
        rows: d.points.map(function (pt) {
          return [(groups[pt.group] || {}).name_en || pt.group || '—',
            String(pt.x), String(pt.y)];
        })
      };
    };
    return out;
  };

  // ---------------------------------------------------------------- stacked
  DV.renderers.stacked = function (host, view, api) {
    var box = frame(host, H, view.subject,
      { minWidth: view.data.x.values.length > 6 ? 520 : 0 });
    var p = plot(box);
    var d = view.data;
    var n = d.x.values.length;
    var totals = d.x.values.map(function (_, i) {
      return d.series.reduce(function (sum, s) { return sum + s.values[i]; }, 0);
    });
    var max = d.mode === 'percent' ? 100 : Math.max.apply(null, totals) * 1.1;
    var y = axes(box, totals, view.unit,
      d.x.values, { min: 0, max: max || 1, categorical: true });
    var nodes = [];
    DV.svg('line', { x1: p.x, x2: p.x + p.w, y1: y(0), y2: y(0), class: 'dv-baseline' }, box.svg);
    var band = p.w / n;
    var bw = Math.min(56, band * 0.62);
    d.x.values.forEach(function (label, i) {
      var x = p.x + i * band + (band - bw) / 2;
      var base = 0;
      var stack = DV.svg('rect', {
        x: x, y: p.y, width: bw, height: p.h, fill: 'transparent', class: 'dv-mark'
      }, box.svg);
      makeMark(stack, 'stack:' + i, label + ', total', api);
      nodes.push(stack);
      d.series.forEach(function (s) {
        var value = s.values[i];
        var h = (value / (max || 1)) * p.h;
        var yy = p.y + p.h - (base + value) / (max || 1) * p.h;
        var seg = DV.svg('rect', {
          x: x, y: yy + 1, width: bw, height: Math.max(0, h - 2), rx: 3,
          class: 'dv-bar ' + seriesClass(s.slot || 1)
        }, box.svg);
        makeMark(seg, 'seg:' + i + ':' + s.id,
          s.name_en + ', ' + label + ': ' + DV.fmtValue(value, view.unit), api);
        nodes.push(seg);
        var segShare = value / (totals[i] || 1) * 100;
        if (bw >= 26 && segShare >= 12) {
          DV.text(box.svg, {
            x: x + bw / 2, y: yy + Math.max(0, h) / 2 + 4,
            'text-anchor': 'middle', class: 'dv-seg-label'
          }, Math.round(segShare) + '%');
        }
        base += value;
      });
    });
    var out = finish(box, nodes);
    out.table = function () {
      return {
        head: [d.x.label_en || 'Category'].concat(d.series.map(function (s) { return s.name_en; })),
        rows: d.x.values.map(function (label, i) {
          return [label].concat(d.series.map(function (s) { return DV.fmtValue(s.values[i], view.unit); }));
        })
      };
    };
    return out;
  };

  // ---------------------------------------------------------------- heatmap
  DV.renderers.heatmap = function (host, view, api) {
    var d = view.data;
    var rows = d.rows.length, cols = d.cols.length;
    var hostW = host && host.clientWidth ? host.clientWidth : 720;
    var target = Math.max(560, Math.min(760, hostW || 720));
    var left = target < 620 ? 84 : 108, top = 30;
    var cell = Math.max(target < 620 ? 24 : 34,
      Math.min(54, (target - left - 24) / cols));
    var width = left + cols * cell + 24;
    var height = top + rows * cell + 54;
    var svg = DV.svg('svg', {
      class: 'dv-chart dv-chart-wide', viewBox: '0 0 ' + width + ' ' + height,
      role: 'group', 'aria-roledescription': '图表', 'aria-label': view.subject || ''
    }, host);
    host.classList.add('dv-scroll');
    if (width > hostW) svg.style.width = width + 'px';
    var flat = [];
    d.cells.forEach(function (row) { flat = flat.concat(row); });
    var lo = Math.min.apply(null, flat), hi = Math.max.apply(null, flat);
    var ramp = ['dv-heat-1', 'dv-heat-2', 'dv-heat-3', 'dv-heat-4', 'dv-heat-5'];
    var nodes = [];
    d.rows.forEach(function (row, r) {
      DV.text(svg, { x: left - 10, y: top + r * cell + cell / 2 + 4, 'text-anchor': 'end', class: 'dv-tick' },
        row.name_en);
      var rowHit = DV.svg('rect', { x: 4, y: top + r * cell, width: left - 8, height: cell, fill: 'transparent', class: 'dv-mark' }, svg);
      makeMark(rowHit, 'row:' + row.id, row.name_en + ', row average', api);
      nodes.push(rowHit);
    });
    d.cols.forEach(function (col, c) {
      DV.text(svg, { x: left + c * cell + cell / 2, y: top - 10, 'text-anchor': 'middle', class: 'dv-tick' },
        col.name_en);
      var colHit = DV.svg('rect', { x: left + c * cell, y: 4, width: cell, height: top - 8, fill: 'transparent', class: 'dv-mark' }, svg);
      makeMark(colHit, 'col:' + col.id, col.name_en + ', column average', api);
      nodes.push(colHit);
    });
    d.rows.forEach(function (row, r) {
      d.cols.forEach(function (col, c) {
        var value = d.cells[r][c];
        var t = (value - lo) / ((hi - lo) || 1);
        var bin = Math.min(4, Math.floor(t * 5));
        var rect = DV.svg('rect', {
          x: left + c * cell + 0.5, y: top + r * cell + 0.5,
          width: cell - 1, height: cell - 1, rx: 2,
          class: 'dv-cell ' + ramp[bin]
        }, svg);
        makeMark(rect, 'cell:' + row.id + ':' + col.id,
          row.name_en + ', ' + col.name_en + ': ' + DV.fmtValue(value, view.unit), api);
        nodes.push(rect);
      });
    });
    var legendY = top + rows * cell + 22;
    DV.text(svg, { x: left, y: legendY + 4, class: 'dv-unit' }, '低');
    ramp.forEach(function (cls, i) {
      DV.svg('rect', { x: left + 26 + i * 22, y: legendY - 8, width: 20, height: 12, rx: 2, class: 'dv-cell ' + cls }, svg);
    });
    DV.text(svg, { x: left + 26 + 5 * 22 + 4, y: legendY + 4, class: 'dv-unit' }, '高');
    var out = finish({ svg: svg }, nodes);
    out.table = function () {
      var rows2 = [];
      d.rows.forEach(function (row, r) {
        d.cols.forEach(function (col, c) {
          rows2.push([row.name_en, col.name_en, DV.fmtValue(d.cells[r][c], view.unit)]);
        });
      });
      return { head: ['Row', 'Column', 'Value'], rows: rows2 };
    };
    return out;
  };

  // ---------------------------------------------------------------- sankey
  DV.renderers.sankey = function (host, view, api) {
    var d = view.data;
    var hostW = host && host.clientWidth ? host.clientWidth : 760;
    var W2 = Math.max(560, Math.min(760, hostW || 760));
    var H2 = 380;
    var svg = DV.svg('svg', {
      class: 'dv-chart', viewBox: '0 0 ' + W2 + ' ' + H2,
      role: 'group', 'aria-roledescription': '图表', 'aria-label': view.subject || ''
    }, host);
    if (W2 > hostW) {
      host.classList.add('dv-scroll');
      svg.style.width = W2 + 'px';
    }
    var margin = { top: 28, bottom: 28, left: 16, right: 16 };
    var columns = d.columns;
    var ncols = columns.length;
    var colW = (W2 - margin.left - margin.right) / ncols;
    var nodeW = 8;
    var nodesById = {};
    d.nodes.forEach(function (n) { nodesById[n.id] = n; });
    var inTotals = {}, outTotals = {};
    d.links.forEach(function (l) {
      outTotals[l.source] = (outTotals[l.source] || 0) + l.value;
      inTotals[l.target] = (inTotals[l.target] || 0) + l.value;
    });
    var totals = {};
    d.nodes.forEach(function (n) {

  // ---------------------------------------------------------------- slope

/* Expression panel: header, register lens, five tabs, Describe It reveal. */
(function (DV) {
  'use strict';

  var TABS = [
    { id: 'words', label: '词汇' },
    { id: 'patterns', label: '句型' },
    { id: 'compare', label: '辨析' },
    { id: 'describe', label: '描述' },
    { id: 'read', label: '解读' }
  ];
  var REGISTERS = [
    { id: 'general', label: '通用' },
    { id: 'ielts', label: '雅思' },
    { id: 'business', label: '商务' }
  ];
  var REG_ZH = { spoken: '口语', neutral: '通用', written: '书面' };
  var REG_ORDER = { spoken: 0, neutral: 1, written: 2 };

  function entryFor(state) {
    if (!state.feature || !state.library) return null;
    return (state.library.features || {})[state.feature.kind] || null;
  }

  function focusText(state) {
    if (!state.feature) return state.view.subject || '整张图';
    var slots = state.feature.slots || {};
    var bits = [];
    if (slots.source && slots.target && slots.source !== slots.target) {
      bits.push(slots.source + ' → ' + slots.target);
    } else if (slots.category) {
      bits.push(slots.category);
    } else if (slots.entity) {
      bits.push(slots.entity);
    }
    if (slots.x_value && slots.y_value) bits.push(slots.x_value + ', ' + slots.y_value);
    if (slots.period && bits.indexOf(slots.period) < 0) bits.push(slots.period);
    if (slots.from && slots.to) bits.push(slots.from + ' → ' + slots.to);
    else if (slots.value) bits.push(slots.value);
    else if (slots.share) bits.push(slots.share);
    if (!bits.length) bits.push(slots.subject || '');
    return bits.filter(Boolean).join(' · ');
  }

  function registerBadge(reg) {
    return DV.el('span', { class: 'dv-reg-badge' }, REG_ZH[reg] || reg);
  }

  function cap(text) {
    text = String(text == null ? '' : text);
    return /^[a-z]/.test(text) ? text.charAt(0).toUpperCase() + text.slice(1) : text;
  }

  function wordCard(word) {

    DV.el('span', { class: 'dv-word-zh' }, head).textContent = word.zh || '';
    DV.el('span', { class: 'dv-reg-badge' }, head).textContent = REG_ZH[word.register] || '';
    DV.el('p', { class: 'dv-word-note' }, card).textContent = word.note_zh || '';
    var meta = [word.grammar, (word.collocations || []).slice(0, 2).join(' · ')].filter(Boolean).join(' · ');
    if (meta) DV.el('p', { class: 'dv-word-meta' }, card).textContent = meta;
    return card;
  }

  function patternCard(pattern, slots) {
    slots = DV.gen.slots(slots);
    var card = DV.el('div', { class: 'dv-pattern' });
    DV.el('span', { class: 'dv-level-badge' }, card).textContent = (pattern.level || '').toUpperCase();
    DV.el('p', { class: 'dv-pattern-en', lang: 'en' }, card).textContent = cap(DV.fill(pattern.frame, slots));
    if (pattern.zh_frame) DV.el('p', { class: 'dv-pattern-zh' }, card).textContent = DV.fill(pattern.zh_frame, slots);
    if (pattern.note_zh) DV.el('p', { class: 'dv-pattern-note' }, card).textContent = pattern.note_zh;

    DV.el('p', { class: 'dv-compare-line' }, card).textContent = comp.meaning_zh || '';
    DV.el('p', { class: 'dv-compare-line' }, card).textContent = '语法：' + (comp.grammar_zh || '');
    DV.el('p', { class: 'dv-compare-line' }, card).textContent = '搭配：' + (comp.collocations_zh || '');
    DV.el('p', { class: 'dv-compare-line' }, card).textContent = '用法：' + (comp.usage_zh || '');
    (comp.examples || []).slice(0, 1).forEach(function (ex) {
      DV.el('p', { class: 'dv-compare-ex', lang: 'en' }, card).textContent = ex.en;
    });

  function trapCard(trap, slots) {
    var card = DV.el('div', { class: 'dv-trap' });

      data.cells.forEach(function (row, r) {
        row.forEach(function (v, c) {
          var bin = Math.min(4, Math.floor((v - lo2) / ((hi2 - lo2) || 1) * 5));
          DV.svg('rect', { x: pad + c * cw, y: pad + r * ch, width: cw - 1, height: ch - 1, rx: 2,
            class: 'dv-mini-cell dv-heat-' + (bin + 1) }, svg);
        });
      });
    } else if (type === 'sankey' && data.links) {
      var cols = data.columns || [];
      var nodesById = {};
      data.nodes.forEach(function (n) { nodesById[n.id] = n; });
      var inT = {}, outT = {};
      data.links.forEach(function (l) {
        outT[l.source] = (outT[l.source] || 0) + l.value;
        inT[l.target] = (inT[l.target] || 0) + l.value;
      });
      var tot = {};
      data.nodes.forEach(function (n) { tot[n.id] = Math.max(inT[n.id] || 0, outT[n.id] || 0); });
      var colTot = cols.map(function (col) {
        return col.reduce(function (sum, id) { return sum + tot[id]; }, 0);
      });
      var maxCol = Math.max.apply(null, colTot.concat([1]));
      var scale = h / maxCol;
      var pos = {};
      cols.forEach(function (col, ci) {
        var used = col.reduce(function (sum, id) { return sum + tot[id] * scale; }, 0);
        var gap = col.length > 1 ? Math.max(2, Math.min(10, (h - used) / (col.length - 1))) : 0;
        var y = pad;
        col.forEach(function (id) {
          var hh = Math.max(2, tot[id] * scale);
          pos[id] = { x: pad + ci * (w - 6) / Math.max(1, cols.length - 1), y: y, h: hh };
          y += hh + gap;
        });
      });
      var outUsed = {}, inUsed = {};
      data.links.forEach(function (link) {
        var sPos = pos[link.source], tPos = pos[link.target];
        if (!sPos || !tPos) return;
        var y0 = sPos.y + (outUsed[link.source] || 0) * scale;
        var y1 = tPos.y + (inUsed[link.target] || 0) * scale;
        outUsed[link.source] = (outUsed[link.source] || 0) + link.value;
        inUsed[link.target] = (inUsed[link.target] || 0) + link.value;
        var hh = Math.max(1, link.value * scale);
        var mid = (sPos.x + tPos.x) / 2;
        DV.svg('path', {
          d: 'M' + sPos.x + ' ' + y0 + 'C' + mid + ' ' + y0 + ' ' + mid + ' ' + y1 + ' ' + tPos.x + ' ' + y1 +
            'L' + tPos.x + ' ' + (y1 + hh) + 'C' + mid + ' ' + (y1 + hh) + ' ' + mid + ' ' + (y0 + hh) + ' ' + sPos.x + ' ' + (y0 + hh) + 'Z',
          class: 'dv-mini-linkband ' + DV.slotClass((nodesById[link.source] || {}).slot || 1)
        }, svg);
      });
      data.nodes.forEach(function (n) {
        var p2 = pos[n.id];
        if (!p2) return;
        DV.svg('rect', {
          x: p2.x - 2, y: p2.y, width: 5, height: p2.h, rx: 2,
          class: 'dv-mini-node ' + DV.slotClass(n.slot || 1)
        }, svg);
      });
    } else if (type === 'slope' && data.entities) {
      data.entities.slice(0, 5).forEach(function (e, i) {
        var y0 = pad + h * (i / 5) + 8;
        var y1 = pad + h * (((i + 2) % 5) / 5) + 8;
        DV.svg('line', { x1: pad, y1: y0, x2: W - pad, y2: y1,
          class: 'dv-mini-line ' + DV.slotClass(e.slot || (i + 1)) }, svg);
      });
    } else if (type === 'waterfall' && data.steps) {
      var running = Number(data.start_value || 0);
      var pts2 = [running];
      data.steps.forEach(function (s4) { running += s4.value; pts2.push(running); });
      var lo3 = Math.min.apply(null, pts2), hi3 = Math.max.apply(null, pts2);
      var span3 = (hi3 - lo3) || 1;
      var all = data.steps.length + 2;
      var bw2 = Math.min(16, w / all * 0.6);
      function wy(v) { return pad + h - (v - lo3) / span3 * h; }
      DV.svg('rect', { x: pad, y: wy(pts2[0]), width: bw2, height: pad + h - wy(pts2[0]), rx: 2, class: 'dv-mini-bar dv-total' }, svg);
      data.steps.forEach(function (s5, i) {
        var base = pts2[i], value = pts2[i + 1];
        var x = pad + (i + 1) * w / all + (w / all - bw2) / 2;
        DV.svg('rect', {
          x: x, y: Math.min(wy(base), wy(value)), width: bw2,
          height: Math.max(2, Math.abs(wy(base) - wy(value))), rx: 2,
          class: 'dv-mini-bar ' + (s5.value > 0 ? 'dv-pos' : 'dv-neg')
        }, svg);
      });
      var lastX = pad + (all - 1) * w / all;
      DV.svg('rect', { x: lastX, y: wy(pts2[pts2.length - 1]), width: bw2,
        height: pad + h - wy(pts2[pts2.length - 1]), rx: 2, class: 'dv-mini-bar dv-total' }, svg);
    }
    if (!svg.firstChild) {
      DV.svg('rect', { x: pad, y: pad, width: w, height: h, rx: 8, class: 'dv-mini-empty' }, svg);
    }
    return svg;
  }

  function sliceArc(cx, cy, r0, r1, a0, a1) {
    var large = a1 - a0 > Math.PI ? 1 : 0;
    var x0 = cx + r1 * Math.cos(a0), y0 = cy + r1 * Math.sin(a0);
    var x1 = cx + r1 * Math.cos(a1), y1 = cy + r1 * Math.sin(a1);
    var x2 = cx + r0 * Math.cos(a1), y2 = cy + r0 * Math.sin(a1);
    var x3 = cx + r0 * Math.cos(a0), y3 = cy + r0 * Math.sin(a0);
    return 'M' + x0 + ' ' + y0 + 'A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + x1 + ' ' + y1 +
      'L' + x2 + ' ' + y2 + 'A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + x3 + ' ' + y3 + 'Z';
  }

  function renderGallery() {
    S.mode = 'gallery';
    S.mark = null;
    if (S.resizeHandler) {
      window.removeEventListener('resize', S.resizeHandler);
      S.resizeHandler = null;
    }
    if (S.observer) {
      S.observer.disconnect();
      S.observer = null;
    }
    DV.clear(app);
    var head = DV.el('header', { class: 'dv-gallery-head' }, app);

    DV.el('p', { class: 'dv-tagline', lang: 'en' }, titles).textContent =

    var chips = DV.el('nav', { class: 'dv-chips', role: 'group', 'aria-label': '图表类型' }, app);
    function chip(id, label) {
      var btn = DV.el('button', { type: 'button', 'aria-pressed': S.filter === id ? 'true' : 'false' }, chips);

      }, wall);
