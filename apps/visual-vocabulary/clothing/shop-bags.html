<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bags 包与配饰</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding: 0 20px 64px;
}
header {
  flex-wrap: wrap;
  max-width: 1180px; margin: 0 auto; padding: 34px 0 22px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
}
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.5px; }
h1 span { font-size: .52em; color: var(--muted); font-weight: 500; margin-left: 10px; letter-spacing: 0; }
main { max-width: 1180px; margin: 0 auto; }
@media (max-width: 680px) {
  body { padding: 0 14px 48px; }
  header { padding-top: 22px; align-items: flex-start; }
}
</style>
<link rel="stylesheet" href="../vv.css">
</head>
<body>
<header>
  <h1>Bags <span>包与配饰</span></h1>
  <div class="vv-tools">
    <div class="seg" role="group" aria-label="视图"><button type="button" data-vv-view="scene" aria-pressed="true">场景</button><button type="button" data-vv-view="cards" aria-pressed="false">卡片</button></div>
    <div class="seg" role="group" aria-label="音色"><span class="voice-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg></span><button type="button" data-voice="h2" aria-pressed="true">女声</button><button type="button" data-voice="c" aria-pressed="false">男声</button></div>
  </div>
</header>
<main class="page">
<div class="vv-scene-card">
  <div class="vv-scene" data-vv-scene>
    <div class="vv-stage">
      <img class="vv-scene-img" loading="lazy" decoding="async" alt="" width="1536" height="960" src="assets/scenes/shop-bags.jpg">
      <span class="vv-dot" data-vv-dot="handbag" style="left:33.0%;top:32.0%"></span>
      <span class="vv-dot" data-vv-dot="backpack" style="left:55.0%;top:35.0%"></span>
      <span class="vv-dot" data-vv-dot="sunglasses" style="left:40.0%;top:59.0%"></span>
      <span class="vv-dot" data-vv-dot="watch" style="left:49.0%;top:63.0%"></span>
      <span class="vv-dot" data-vv-dot="belt" style="left:60.0%;top:73.0%"></span>
      <span class="vv-dot" data-vv-dot="scarf" style="left:66.0%;top:63.0%"></span>
    </div>
  </div>

  <div class="vv-readout">
    <span class="vv-en" data-vv-en hidden></span>
    <span class="vv-zh" data-vv-zh hidden></span>
    <span class="vv-hint" data-vv-hint>指到或点一下物品</span>
    <button class="vv-btn vv-replay" type="button" data-vv-replay hidden>再听一次</button>
  </div>
</div>

<div class="vv-words">
  <button type="button" data-vv-word="handbag" data-en="handbag" data-zh="手提包" data-x="33.0" data-y="32.0" data-audio-h2="handbag" data-audio-c="handbag" aria-pressed="false">handbag</button>
  <button type="button" data-vv-word="backpack" data-en="backpack" data-zh="双肩包" data-x="55.0" data-y="35.0" data-audio-h2="backpack" data-audio-c="backpack" aria-pressed="false">backpack</button>
  <button type="button" data-vv-word="sunglasses" data-en="sunglasses" data-zh="墨镜" data-x="40.0" data-y="59.0" data-audio-h2="sunglasses" data-audio-c="sunglasses" aria-pressed="false">sunglasses</button>
  <button type="button" data-vv-word="watch" data-en="watch" data-zh="手表" data-x="49.0" data-y="63.0" data-audio-h2="watch" data-audio-c="watch" aria-pressed="false">watch</button>
  <button type="button" data-vv-word="belt" data-en="belt" data-zh="腰带" data-x="60.0" data-y="73.0" data-audio-h2="belt" data-audio-c="belt" aria-pressed="false">belt</button>
  <button type="button" data-vv-word="scarf" data-en="scarf" data-zh="围巾" data-x="66.0" data-y="63.0" data-audio-h2="scarf" data-audio-c="scarf" aria-pressed="false">scarf</button>
</div>

<div class="vv-cards">
  <button type="button" class="vv-card" data-vv-word="handbag" data-audio-h2="handbag" data-audio-c="handbag"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/handbag.webp"><span class="en">handbag</span><span class="zh">手提包</span></button>
  <button type="button" class="vv-card" data-vv-word="backpack" data-audio-h2="backpack" data-audio-c="backpack"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/backpack.webp"><span class="en">backpack</span><span class="zh">双肩包</span></button>
  <button type="button" class="vv-card" data-vv-word="sunglasses" data-audio-h2="sunglasses" data-audio-c="sunglasses"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/sunglasses.webp"><span class="en">sunglasses</span><span class="zh">墨镜</span></button>
  <button type="button" class="vv-card" data-vv-word="watch" data-audio-h2="watch" data-audio-c="watch"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/watch.webp"><span class="en">watch</span><span class="zh">手表</span></button>
  <button type="button" class="vv-card" data-vv-word="belt" data-audio-h2="belt" data-audio-c="belt"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/belt.webp"><span class="en">belt</span><span class="zh">腰带</span></button>
  <button type="button" class="vv-card" data-vv-word="scarf" data-audio-h2="scarf" data-audio-c="scarf"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/scarf.webp"><span class="en">scarf</span><span class="zh">围巾</span></button>
</div>
</main>
<nav class="vv-pager" aria-label="区域导航">
  <a class="vv-pager-prev" href="shop-shoes.html">‹ Shoes 鞋</a>
  <a class="vv-pager-home" href="./">服装</a>
  <a class="vv-pager-next" href="shop-tops.html">Tops 上衣 ›</a>
</nav>

</body>
</html>
