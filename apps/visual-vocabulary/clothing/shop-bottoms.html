<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottoms 下装</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding: 0 20px 64px;
}
header {
  flex-wrap: wrap;
  max-width: 1180px; margin: 0 auto; padding: 34px 0 22px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
}
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.5px; }
h1 span { font-size: .52em; color: var(--muted); font-weight: 500; margin-left: 10px; letter-spacing: 0; }
main { max-width: 1180px; margin: 0 auto; }
@media (max-width: 680px) {
  body { padding: 0 14px 48px; }
  header { padding-top: 22px; align-items: flex-start; }
}
</style>
<link rel="stylesheet" href="../vv.css">
</head>
<body>
<header>
  <h1>Bottoms <span>下装</span></h1>
  <div class="vv-tools">
    <div class="seg" role="group" aria-label="视图"><button type="button" data-vv-view="scene" aria-pressed="true">场景</button><button type="button" data-vv-view="cards" aria-pressed="false">卡片</button></div>
    <div class="seg" role="group" aria-label="音色"><span class="voice-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg></span><button type="button" data-voice="h2" aria-pressed="true">女声</button><button type="button" data-voice="c" aria-pressed="false">男声</button></div>
  </div>
</header>
<main class="page">
<div class="vv-scene-card">
  <div class="vv-scene" data-vv-scene>
    <div class="vv-stage">
      <img class="vv-scene-img" loading="lazy" decoding="async" alt="" width="1536" height="960" src="assets/scenes/shop-bottoms.jpg">
      <span class="vv-dot" data-vv-dot="jeans" style="left:15.0%;top:45.0%"></span>
      <span class="vv-dot" data-vv-dot="trousers" style="left:40.0%;top:55.0%"></span>
      <span class="vv-dot" data-vv-dot="chinos" style="left:63.0%;top:48.0%"></span>
      <span class="vv-dot" data-vv-dot="sweatpants" style="left:85.0%;top:40.0%"></span>
    </div>
  </div>

  <div class="vv-readout">
    <span class="vv-en" data-vv-en hidden></span>
    <span class="vv-zh" data-vv-zh hidden></span>
    <span class="vv-hint" data-vv-hint>指到或点一下物品</span>
    <button class="vv-btn vv-replay" type="button" data-vv-replay hidden>再听一次</button>
  </div>
</div>

<div class="vv-words">
  <button type="button" data-vv-word="jeans" data-en="jeans" data-zh="牛仔裤" data-x="15.0" data-y="45.0" data-audio-h2="jeans" data-audio-c="jeans" aria-pressed="false">jeans</button>
  <button type="button" data-vv-word="trousers" data-en="trousers" data-zh="西裤" data-x="40.0" data-y="55.0" data-audio-h2="trousers" data-audio-c="trousers" aria-pressed="false">trousers</button>
  <button type="button" data-vv-word="chinos" data-en="chinos" data-zh="休闲裤" data-x="63.0" data-y="48.0" data-audio-h2="chinos" data-audio-c="chinos" aria-pressed="false">chinos</button>
  <button type="button" data-vv-word="sweatpants" data-en="sweatpants" data-zh="运动裤" data-x="85.0" data-y="40.0" data-audio-h2="sweatpants" data-audio-c="sweatpants" aria-pressed="false">sweatpants</button>
</div>

<div class="vv-cards">
  <button type="button" class="vv-card" data-vv-word="jeans" data-audio-h2="jeans" data-audio-c="jeans"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/jeans.webp"><span class="en">jeans</span><span class="zh">牛仔裤</span></button>
  <button type="button" class="vv-card" data-vv-word="trousers" data-audio-h2="trousers" data-audio-c="trousers"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/trousers.webp"><span class="en">trousers</span><span class="zh">西裤</span></button>
  <button type="button" class="vv-card" data-vv-word="chinos" data-audio-h2="chinos" data-audio-c="chinos"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/chinos.webp"><span class="en">chinos</span><span class="zh">休闲裤</span></button>
  <button type="button" class="vv-card" data-vv-word="sweatpants" data-audio-h2="sweatpants" data-audio-c="sweatpants"><img loading="lazy" decoding="async" alt="" src="assets/clothing/color/sweatpants.webp"><span class="en">sweatpants</span><span class="zh">运动裤</span></button>
</div>
</main>

</html>
