<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPESL · 成人英语练习</title>
<link rel="icon" type="image/png" sizes="512x512" href="/npesl-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:site_name" content="NPESL">
<meta property="og:title" content="NPESL · 成人英语练习">
<meta property="og:image" content="https://npesl.pages.dev/npesl-icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://npesl.pages.dev/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#e4e6eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(48px, 9vh, 96px) max(20px, env(safe-area-inset-left, 0px)) 96px;
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    flex: none;
  }
  h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 40px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .group { margin-top: clamp(36px, 6vh, 52px); }
  .group:first-of-type { margin-top: clamp(44px, 8vh, 72px); }
  h2 {
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h2 span { font-size: 13px; letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .cards { margin-top: clamp(44px, 8vh, 72px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 20px;
    border-radius: var(--radius-card);
    color: inherit;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-1px); }
  .card:active { transform: scale(0.995); }
  .card:focus-visible {
    outline: 2px solid var(--focus-line);
    outline-offset: 3px;
  }
  .glyph {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: var(--radius-control);
    background: var(--blue-tint);
    color: var(--blue);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .body { flex: 1; min-width: 0; }
  .title {
    display: block;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .tag {
    flex: none;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: var(--radius-pill);
    padding: 3px 9px;
  }
  .arrow {
    flex: none;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
  }
  @media (max-width: 420px) {
    .card { gap: 14px; padding: 16px; }
    .glyph { width: 44px; height: 44px; font-size: 18px; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="brand">
    <img class="logo" src="/npesl-icon.png" alt="NPESL" width="64" height="64">
    <h1>Visual Vocabulary <span style="font-size:.6em;color:var(--muted);font-weight:500">图解词汇</span></h1>
  </header>

  <nav class="cards">
    <a class="card" href="home/kitchen.html">
      <span class="glyph">K</span>
      <span class="body"><span class="title">厨房 Kitchen</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="home/rooms.html">
      <span class="glyph">H</span>
      <span class="body"><span class="title">家居 Home</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="clothing/">
      <span class="glyph">C</span>
      <span class="body"><span class="title">衣物 Clothing</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="supermarket/">
      <span class="glyph">F</span>
      <span class="body"><span class="title">食物 Food</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="cosmetics-qwen21/">
      <span class="glyph">B</span>
      <span class="body"><span class="title">身体与美妆 Body &amp; Beauty</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="packing/">
      <span class="glyph">T</span>
      <span class="body"><span class="title">出行 Travel</span></span>
      <span class="arrow">›</span>
    </a>
  </nav>
</main>
</body>
</html>
