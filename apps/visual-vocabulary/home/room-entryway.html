<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entryway 玄关</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding: 0 20px 64px;
}
header {
  flex-wrap: wrap;
  max-width: 1180px; margin: 0 auto; padding: 34px 0 22px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
}
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.5px; }
h1 span { font-size: .52em; color: var(--muted); font-weight: 500; margin-left: 10px; letter-spacing: 0; }
main { max-width: 1180px; margin: 0 auto; }
@media (max-width: 680px) {
  body { padding: 0 14px 48px; }
  header { padding-top: 22px; align-items: flex-start; }
}
</style>
<link rel="stylesheet" href="../vv.css">
</head>
<body>
<header>
  <h1>Entryway <span>玄关</span></h1>
  <div class="vv-tools">
    <div class="seg" role="group" aria-label="视图"><button type="button" data-vv-view="scene" aria-pressed="true">场景</button><button type="button" data-vv-view="cards" aria-pressed="false">卡片</button></div>
    <div class="seg" role="group" aria-label="音色"><span class="voice-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg></span><button type="button" data-voice="h2" aria-pressed="true">女声</button><button type="button" data-voice="c" aria-pressed="false">男声</button></div>
  </div>
</header>
<main class="page">
<div class="vv-scene-card">
  <div class="vv-scene" data-vv-scene>
    <div class="vv-stage">
      <img class="vv-scene-img" loading="lazy" decoding="async" alt="" width="1536" height="960" src="assets/scenes/room-entryway.jpg">
      <span class="vv-dot" data-vv-dot="shoe-cabinet" style="left:40.0%;top:45.0%"></span>
      <span class="vv-dot" data-vv-dot="shoe-rack" style="left:9.0%;top:62.0%"></span>
      <span class="vv-dot" data-vv-dot="door-mat" style="left:53.0%;top:78.0%"></span>
      <span class="vv-dot" data-vv-dot="umbrella" style="left:76.0%;top:60.0%"></span>
      <span class="vv-dot" data-vv-dot="umbrella-stand" style="left:75.0%;top:76.0%"></span>
      <span class="vv-dot" data-vv-dot="coat-rack" style="left:88.0%;top:35.0%"></span>
      <span class="vv-dot" data-vv-dot="key-hook" style="left:90.0%;top:10.0%"></span>
    </div>
  </div>

  <div class="vv-readout">
    <span class="vv-en" data-vv-en hidden></span>
    <span class="vv-zh" data-vv-zh hidden></span>
    <span class="vv-hint" data-vv-hint>指到或点一下物品</span>
    <button class="vv-btn vv-replay" type="button" data-vv-replay hidden>再听一次</button>
  </div>
</div>

<div class="vv-words">
  <button type="button" data-vv-word="shoe-cabinet" data-en="shoe cabinet" data-zh="鞋柜" data-x="40.0" data-y="45.0" data-audio-h2="shoe-cabinet" data-audio-c="shoe-cabinet" aria-pressed="false">shoe cabinet</button>
  <button type="button" data-vv-word="shoe-rack" data-en="shoe rack" data-zh="鞋架" data-x="9.0" data-y="62.0" data-audio-h2="shoe-rack" data-audio-c="shoe-rack" aria-pressed="false">shoe rack</button>
  <button type="button" data-vv-word="door-mat" data-en="door mat" data-zh="门垫" data-x="53.0" data-y="78.0" data-audio-h2="door-mat" data-audio-c="door-mat" aria-pressed="false">door mat</button>
  <button type="button" data-vv-word="umbrella" data-en="umbrella" data-zh="雨伞" data-x="76.0" data-y="60.0" data-audio-h2="umbrella" data-audio-c="umbrella" aria-pressed="false">umbrella</button>

</div>

<div class="vv-cards">
  <button type="button" class="vv-card" data-vv-word="shoe-cabinet" data-audio-h2="shoe-cabinet" data-audio-c="shoe-cabinet"><img loading="lazy" decoding="async" alt="" src="assets/home/color/shoe-cabinet.webp"><span class="en">shoe cabinet</span><span class="zh">鞋柜</span></button>
  <button type="button" class="vv-card" data-vv-word="shoe-rack" data-audio-h2="shoe-rack" data-audio-c="shoe-rack"><img loading="lazy" decoding="async" alt="" src="assets/home/color/shoe-rack.webp"><span class="en">shoe rack</span><span class="zh">鞋架</span></button>
  <button type="button" class="vv-card" data-vv-word="door-mat" data-audio-h2="door-mat" data-audio-c="door-mat"><img loading="lazy" decoding="async" alt="" src="assets/home/color/door-mat.webp"><span class="en">door mat</span><span class="zh">门垫</span></button>
  <button type="button" class="vv-card" data-vv-word="umbrella" data-audio-h2="umbrella" data-audio-c="umbrella"><img loading="lazy" decoding="async" alt="" src="assets/home/color/umbrella.webp"><span class="en">umbrella</span><span class="zh">雨伞</span></button>
  <button type="button" class="vv-card" data-vv-word="umbrella-stand" data-audio-h2="umbrella-stand" data-audio-c="umbrella-stand"><img loading="lazy" decoding="async" alt="" src="assets/home/color/umbrella-stand.webp"><span class="en">umbrella stand</span><span class="zh">伞架</span></button>
  <button type="button" class="vv-card" data-vv-word="coat-rack" data-audio-h2="coat-rack" data-audio-c="coat-rack"><img loading="lazy" decoding="async" alt="" src="assets/home/color/coat-rack.webp"><span class="en">coat rack</span><span class="zh">衣帽架</span></button>
  <button type="button" class="vv-card" data-vv-word="key-hook" data-audio-h2="key-hook" data-audio-c="key-hook"><img loading="lazy" decoding="async" alt="" src="assets/home/color/key-hook.webp"><span class="en">key hook</span><span class="zh">钥匙挂钩</span></button>
</div>
</main>
