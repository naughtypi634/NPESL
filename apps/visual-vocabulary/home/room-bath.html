<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bathroom 卫浴</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding: 0 20px 64px;
}
header {
  flex-wrap: wrap;
  max-width: 1180px; margin: 0 auto; padding: 34px 0 22px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
}
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.5px; }
h1 span { font-size: .52em; color: var(--muted); font-weight: 500; margin-left: 10px; letter-spacing: 0; }
main { max-width: 1180px; margin: 0 auto; }
@media (max-width: 680px) {
  body { padding: 0 14px 48px; }
  header { padding-top: 22px; align-items: flex-start; }
}
</style>
<link rel="stylesheet" href="../vv.css">
</head>
<body>
<header>
  <h1>Bathroom <span>卫浴</span></h1>
  <div class="vv-tools">
    <div class="seg" role="group" aria-label="视图"><button type="button" data-vv-view="scene" aria-pressed="true">场景</button><button type="button" data-vv-view="cards" aria-pressed="false">卡片</button></div>
    <div class="seg" role="group" aria-label="音色"><span class="voice-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg></span><button type="button" data-voice="h2" aria-pressed="true">女声</button><button type="button" data-voice="c" aria-pressed="false">男声</button></div>
  </div>
</header>
<main class="page">
<div class="vv-scene-card">
  <div class="vv-scene" data-vv-scene>
    <div class="vv-stage">
      <img class="vv-scene-img" loading="lazy" decoding="async" alt="" width="1536" height="960" src="assets/scenes/room-bath.jpg">
      <span class="vv-dot" data-vv-dot="bathtub" style="left:6.0%;top:22.0%"></span>
      <span class="vv-dot" data-vv-dot="shower-stall" style="left:18.0%;top:14.0%"></span>
      <span class="vv-dot" data-vv-dot="toilet" style="left:30.0%;top:55.0%"></span>
      <span class="vv-dot" data-vv-dot="toilet-paper" style="left:39.0%;top:76.0%"></span>
      <span class="vv-dot" data-vv-dot="towel-rack" style="left:52.0%;top:26.0%"></span>
      <span class="vv-dot" data-vv-dot="bathroom-vanity" style="left:63.0%;top:72.0%"></span>
      <span class="vv-dot" data-vv-dot="faucet" style="left:77.0%;top:48.0%"></span>
      <span class="vv-dot" data-vv-dot="toothbrush" style="left:88.0%;top:54.0%"></span>
      <span class="vv-dot" data-vv-dot="soap-dispenser" style="left:95.0%;top:64.0%"></span>
    </div>
  </div>

  <div class="vv-readout">
    <span class="vv-en" data-vv-en hidden></span>
    <span class="vv-zh" data-vv-zh hidden></span>
    <span class="vv-hint" data-vv-hint>指到或点一下物品</span>
    <button class="vv-btn vv-replay" type="button" data-vv-replay hidden>再听一次</button>
  </div>
</div>

<div class="vv-words">
  <button type="button" data-vv-word="bathtub" data-en="bathtub" data-zh="浴缸" data-x="6.0" data-y="22.0" data-audio-h2="bathtub" data-audio-c="bathtub" aria-pressed="false">bathtub</button>
  <button type="button" data-vv-word="shower-stall" data-en="shower stall" data-zh="淋浴房" data-x="18.0" data-y="14.0" data-audio-h2="shower-stall" data-audio-c="shower-stall" aria-pressed="false">shower stall</button>
  <button type="button" data-vv-word="toilet" data-en="toilet" data-zh="马桶" data-x="30.0" data-y="55.0" data-audio-h2="toilet" data-audio-c="toilet" aria-pressed="false">toilet</button>
  <button type="button" data-vv-word="toilet-paper" data-en="toilet paper" data-zh="卫生纸" data-x="39.0" data-y="76.0" data-audio-h2="toilet-paper" data-audio-c="toilet-paper" aria-pressed="false">toilet paper</button>
  <button type="button" data-vv-word="towel-rack" data-en="towel rack" data-zh="毛巾架" data-x="52.0" data-y="26.0" data-audio-h2="towel-rack" data-audio-c="towel-rack" aria-pressed="false">towel rack</button>
  <button type="button" data-vv-word="bathroom-vanity" data-en="bathroom vanity" data-zh="浴室柜" data-x="63.0" data-y="72.0" data-audio-h2="bathroom-vanity" data-audio-c="bathroom-vanity" aria-pressed="false">bathroom vanity</button>
  <button type="button" data-vv-word="faucet" data-en="faucet" data-zh="水龙头" data-x="77.0" data-y="48.0" data-audio-h2="faucet" data-audio-c="faucet" aria-pressed="false">faucet</button>
  <button type="button" data-vv-word="toothbrush" data-en="toothbrush" data-zh="牙刷" data-x="88.0" data-y="54.0" data-audio-h2="toothbrush" data-audio-c="toothbrush" aria-pressed="false">toothbrush</button>
  <button type="button" data-vv-word="soap-dispenser" data-en="soap dispenser" data-zh="洗手液瓶" data-x="95.0" data-y="64.0" data-audio-h2="soap-dispenser" data-audio-c="soap-dispenser" aria-pressed="false">soap dispenser</button>
</div>

<div class="vv-cards">
  <button type="button" class="vv-card" data-vv-word="bathtub" data-audio-h2="bathtub" data-audio-c="bathtub"><img loading="lazy" decoding="async" alt="" src="assets/home/color/bathtub.webp"><span class="en">bathtub</span><span class="zh">浴缸</span></button>
  <button type="button" class="vv-card" data-vv-word="shower-stall" data-audio-h2="shower-stall" data-audio-c="shower-stall"><img loading="lazy" decoding="async" alt="" src="assets/home/color/shower-stall.webp"><span class="en">shower stall</span><span class="zh">淋浴房</span></button>
  <button type="button" class="vv-card" data-vv-word="toilet" data-audio-h2="toilet" data-audio-c="toilet"><img loading="lazy" decoding="async" alt="" src="assets/home/color/toilet.webp"><span class="en">toilet</span><span class="zh">马桶</span></button>
  <button type="button" class="vv-card" data-vv-word="toilet-paper" data-audio-h2="toilet-paper" data-audio-c="toilet-paper"><img loading="lazy" decoding="async" alt="" src="assets/home/color/toilet-paper.webp"><span class="en">toilet paper</span><span class="zh">卫生纸</span></button>
  <button type="button" class="vv-card" data-vv-word="towel-rack" data-audio-h2="towel-rack" data-audio-c="towel-rack"><img loading="lazy" decoding="async" alt="" src="assets/home/color/towel-rack.webp"><span class="en">towel rack</span><span class="zh">毛巾架</span></button>
  <button type="button" class="vv-card" data-vv-word="bathroom-vanity" data-audio-h2="bathroom-vanity" data-audio-c="bathroom-vanity"><img loading="lazy" decoding="async" alt="" src="assets/home/color/bathroom-vanity.webp"><span class="en">bathroom vanity</span><span class="zh">浴室柜</span></button>
  <button type="button" class="vv-card" data-vv-word="faucet" data-audio-h2="faucet" data-audio-c="faucet"><img loading="lazy" decoding="async" alt="" src="assets/home/color/faucet.webp"><span class="en">faucet</span><span class="zh">水龙头</span></button>
  <button type="button" class="vv-card" data-vv-word="toothbrush" data-audio-h2="toothbrush" data-audio-c="toothbrush"><img loading="lazy" decoding="async" alt="" src="assets/home/color/toothbrush.webp"><span class="en">toothbrush</span><span class="zh">牙刷</span></button>
  <button type="button" class="vv-card" data-vv-word="soap-dispenser" data-audio-h2="soap-dispenser" data-audio-c="soap-dispenser"><img loading="lazy" decoding="async" alt="" src="assets/home/color/soap-dispenser.webp"><span class="en">soap dispenser</span><span class="zh">洗手液瓶</span></button>
</div>
</main>
<nav class="vv-pager" aria-label="区域导航">
  <a class="vv-pager-prev" href="room-bedroom.html">‹ Bedroom 卧室</a>
  <a class="vv-pager-home" href="rooms.html">房间</a>
  <a class="vv-pager-next" href="room-dining.html">Dining 餐厅 ›</a>
</nav>
<script src="../vv.js" defer></script>
</body>
</html>
