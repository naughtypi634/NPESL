<title>Rooms 房间</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding: 0 20px 64px;
}
header { max-width: 1180px; margin: 0 auto; padding: 34px 0 26px; }
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.5px; }
h1 span { font-size: .52em; color: var(--muted); font-weight: 500; margin-left: 10px; letter-spacing: 0; }
main { max-width: 1180px; margin: 0 auto; }
.zones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.zone {
  display: flex; flex-direction: column;
  border-radius: var(--radius-card); overflow: hidden;
  color: inherit; text-decoration: none;
  background: var(--pane); box-shadow: var(--shadow-card);
  transition: transform .15s ease;
}
.zone:hover { transform: translateY(-2px); }
.zone:focus-visible { outline: 2px solid var(--focus-line); outline-offset: 3px; }
.zone img { width: 100%; aspect-ratio: 8 / 5; object-fit: cover; display: block; }
.zone .label { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 14px; font-weight: 600; }
.zone .label .zh { color: var(--muted); font-weight: 400; font-size: 13px; }
@media (max-width: 900px) { .zones { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) {
  body { padding: 0 14px 48px; }
  header { padding-top: 22px; }
  .zones { gap: 10px; }
}
</style>
<link rel="stylesheet" href="../vv.css">
</head>
