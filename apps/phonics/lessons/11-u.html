      var n = Number(value);
      if (!isFinite(n)) n = SPEED_DEFAULT;
      n = Math.max(SPEED_MIN, Math.min(SPEED_MAX, Math.round(n * 100) / 100));
      speed = n;
      VOICE_KEYS.forEach(function (key) {
        audios[key].playbackRate = n;
      });
      var label = document.querySelector("[data-speed-label]");
      if (label) label.textContent = speedLabel(n);
      var input = document.querySelector("[data-speed-input]");
      if (input && Math.abs(parseFloat(input.value) - n) > 0.001) input.value = n;
      if (save) {
        try { localStorage.setItem(SPEED_KEY, String(n)); } catch (e) {}
      }
    }

    function clearMarks() {
      document.querySelectorAll(".is-playing, .is-active").forEach(function (el) {
        el.classList.remove("is-playing", "is-active");
      });
    }

    function setPlayAll(on) {
      playAllBtn.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) {
        icoPlay.setAttribute("hidden", "");
        icoStop.removeAttribute("hidden");
      } else {
        icoPlay.removeAttribute("hidden");
        icoStop.setAttribute("hidden", "");
      }
      playAllLabel.textContent = on ? "停止" : "全文连读";
    }

    function stop() {
      generation++;
      if (state) {
        cancelAnimationFrame(state.raf);
        state = null;
      }
      audio.pause();
      audio.onended = null;
      clearMarks();
      setPlayAll(false);
    }

    function whenReady(callback) {
      if (audio.readyState >= 1) {
        callback();
        return;
      }
      var handler = function () {
        audio.removeEventListener("loadedmetadata", handler);
        callback();
      };
      audio.addEventListener("loadedmetadata", handler);
      audio.load();
    }

    function stamp(el, kind) {
      return parseFloat(el.dataset[kind + (voice === "f" ? "F" : "M")]);
    }

    function current(list, time) {
      var found = null;
      list.forEach(function (el) {
        if (time + 0.001 >= stamp(el, "start")) found = el;
      });
      return found;
    }

    function highlight(time) {
      var chunk = current(chunks, time);
      if (chunk !== state.hlChunk) {
        if (state.hlChunk) state.hlChunk.classList.remove("is-playing");
        state.hlChunk = chunk;
        if (chunk) chunk.classList.add("is-playing");
      }
      var section = current(sections, time);
      if (section !== state.hlSection) {
        if (state.hlSection) {
          var oldSpeaker = state.hlSection.querySelector(".speaker");
          if (oldSpeaker) oldSpeaker.classList.remove("is-active");
        }
        state.hlSection = section;
        if (section) {
          var speaker = section.querySelector(".speaker");
          if (speaker) speaker.classList.add("is-active");
        }
      }
    }

    function fail() {
      stop();
      showStatus("这段音频没能播放，请刷新页面再试。");
    }

    function start(startTime, endTime, mode, el) {
      stop();
      var gen = generation;
      state = { raf: 0, stopAt: endTime, mode: mode, hlChunk: null, hlSection: null };
      if (mode === "chunk") {
        el.classList.add("is-playing");
        state.hlChunk = el;
      }
      if (mode === "sentence") {
        el.querySelector(".speaker").classList.add("is-active");
        state.hlSection = el;
      }
      if (mode === "all") setPlayAll(true);
      whenReady(function () {
        if (!state || gen !== generation) return;
        // iOS Safari 的 seek 是异步的：设完 currentTime 立刻 play，
        // 跳转可能还没落地就开始播，导致句子开头被吃掉。
        // 留一点前置余量，并等 seeked 再播。
        var LEAD = 0.12;
        var from = Math.max(0, startTime - LEAD);
        var started = false;
        var play = function () {
          if (started || !state || gen !== generation) return;
          started = true;
          // 音频换成外链后，load() 可能把 playbackRate 重置回 1。
          audio.playbackRate = speed;
          audio.onended = function () {
            if (state) stop();
          };
          audio.play().then(function () {
            var tick = function () {
              if (!state || gen !== generation) return;
              var time = audio.currentTime;
              if (state.stopAt !== null && time >= state.stopAt - 0.006) {
                stop();
                return;
              }
              if (state.mode !== "chunk") highlight(time);
              state.raf = requestAnimationFrame(tick);
            };
            tick();
          }).catch(function (error) {
            if (error && error.name === "AbortError") return;
            fail();
          });
        };
        if (Math.abs(audio.currentTime - from) < 0.02) {
          play();
          return;
        }
        var onSeeked = function () {
          audio.removeEventListener("seeked", onSeeked);
          clearTimeout(guard);
          if (gen !== generation) return;
          play();
        };
        // 网络音频的 seek 比内存 Blob 慢，guard 放宽到 600ms；
        // 真没落到实处就再设一次，避免从上一句的位置开始播。
        var guard = setTimeout(function () {
          audio.removeEventListener("seeked", onSeeked);
          if (gen !== generation) return;
          if (Math.abs(audio.currentTime - from) > 0.05) audio.currentTime = from;
          play();
        }, 600);
        audio.addEventListener("seeked", onSeeked);
        audio.currentTime = from;
      });
    }

    document.getElementById("passage").addEventListener("click", function (event) {
      var chunk = event.target.closest(".chunk");
      if (chunk) {
        start(stamp(chunk, "start"), stamp(chunk, "end"), "chunk", chunk);
        return;
      }
      var speaker = event.target.closest(".speaker");
      if (speaker) {
        var section = speaker.closest(".sentence");
        start(stamp(section, "start"), stamp(section, "end"), "sentence", section);
      }
    });

    playAllBtn.addEventListener("click", function () {
      if (state && state.mode === "all") {
        stop();
        return;
      }
      start(0, null, "all", null);
    });

    voiceSeg.addEventListener("click", function (event) {
      var btn = event.target.closest("button[data-voice]");
      if (!btn || btn.dataset.voice === voice) return;
      stop();
      voice = btn.dataset.voice;
      audio = audios[voice];
      Array.prototype.forEach.call(voiceSeg.querySelectorAll("button"), function (item) {
        item.setAttribute("aria-pressed", item === btn ? "true" : "false");
      });
    });

    var speedInput = document.querySelector("[data-speed-input]");
    if (speedInput) {
      speedInput.value = speed;
      speedInput.addEventListener("input", function () {
        setSpeed(parseFloat(speedInput.value), true);
      });
    }
    var speedReset = document.querySelector("[data-speed-reset]");
    if (speedReset) {
      speedReset.addEventListener("click", function () {
        setSpeed(SPEED_DEFAULT, true);
      });
    }
    setSpeed(speed, false);
  })();
</script>
</body>
</html>
