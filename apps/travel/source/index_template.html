<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行英语 Travel English</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --rule:#e5e5ea;
    --surface:#f5f5f7; --surface-strong:#e8e8ed;
    --blue:#0071e3; --blue-tint:#e8f2ff; --on-blue:#ffffff;
    --radius-card:24px; --radius-control:12px; --radius-pill:999px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable",
      "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f7; --muted:#98989d; --rule:#38383a;
      --surface:#1c1c1e; --surface-strong:#2c2c2e;
      --blue:#2997ff; --blue-tint:#102a43; --on-blue:#06131f;
      color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
    -webkit-font-smoothing:antialiased; }
  .page { max-width:760px; margin:0 auto;
    padding:clamp(40px,7vh,72px) 24px 96px; }
  h1 { margin:0; font-size:clamp(2rem,6vw,2.8rem); font-weight:700;
    letter-spacing:-.03em; line-height:1.08; }
  .zh-title { margin:7px 0 0; color:var(--muted); font-size:17px; }
  .stage-group { margin:36px 0 0; }
  .stage-group:first-of-type { margin-top:30px; }
  .stage-head { margin:0 0 12px; font-size:15px; font-weight:650;
    letter-spacing:.01em; }
  .stage-head .stage-en { margin-left:7px; color:var(--muted); font-size:11px;
    font-weight:500; letter-spacing:.08em; text-transform:uppercase; }
  .scene-list { display:flex; flex-direction:column; gap:10px; }
  .scene-card { display:flex; align-items:center; gap:14px; padding:16px 18px;
    border:1px solid var(--rule); border-radius:var(--radius-card,24px);
    background:var(--bg); color:inherit; text-decoration:none;
    transition:background-color .15s ease, transform .15s ease; }
  .scene-card:hover { background:var(--surface); transform:translateY(-1px); }
  .scene-card:active { transform:scale(.995); }
  .scene-card:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .scene-icon { display:flex; align-items:center; justify-content:center;
    flex:none; width:42px; height:42px; border-radius:14px;
    background:var(--blue-tint); color:var(--blue); }
  .scene-icon svg { width:22px; height:22px; }
  .scene-title { flex:1; min-width:0; }
  .scene-title .en { display:block; font-size:17px; font-weight:600;
    letter-spacing:-.01em; }
  .scene-title .zh { display:block; margin-top:2px; color:var(--muted);
    font-size:13px; }
  .arrow { flex:none; color:var(--muted); font-size:20px; line-height:1; }
  @media (max-width:480px) {
    .page { padding-left:16px; padding-right:16px; }
    .scene-card { gap:12px; padding:14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>Travel English</h1>
    <p class="zh-title">旅行英语</p>
  </header>

  <!--SCENES-->
</main>
</body>
</html>
