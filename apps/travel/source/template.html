<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE_EN}} {{TITLE_ZH}}</title>
<script>try{var t=localStorage.getItem('npesl-theme');if(t==='glass')t='dark';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
<link rel="stylesheet" href="../site/theme.css">
<link rel="stylesheet" href="travel.css?v=2">
</head>
<body>
<div class="page">
  <header class="tv-head">
    <a class="tv-back" href="index.html">Travel English</a>
    <h1>{{TITLE_EN}} <span>{{TITLE_ZH}}</span></h1>
  </header>

  <div class="tv-main">
    <div class="tv-scene-card">
      <div class="tv-stage" id="stage">
        <img class="tv-scene-img" src="{{SCENE}}" width="1600" height="1000" alt="" decoding="async" fetchpriority="high">
        {{DOTS}}
        <div class="tv-box" id="tv-box" hidden></div>
      </div>
      <div class="tv-readout" id="readout" aria-live="polite">
        <span class="tv-hint">点图上的白点，看单词和对话</span>
      </div>
    </div>

    <section class="tv-detail" id="detail" hidden aria-live="polite">
      <div class="tv-detail-head">
        <h2 id="d-en"></h2>
        <span id="d-zh"></span>
      </div>
      <p class="tv-example" id="d-example"></p>
      <div class="tv-dialog" id="d-dialog"></div>
    </section>
  </div>

  <nav class="tv-steps" id="steps" aria-label="场景流程"></nav>
  <div class="tv-terms" id="terms"></div>

  <nav class="tv-pager" aria-label="场景导航">
    <a class="tv-pager-prev" href="{{PREV_HREF}}">{{PREV_LABEL}}</a>
    <a class="tv-pager-home" href="index.html">Travel English</a>
    <a class="tv-pager-next" href="{{NEXT_HREF}}">{{NEXT_LABEL}}</a>
  </nav>
</div>

<script type="application/json" id="tv-data">{{DATA}}</script>
<script src="travel.js?v=2" defer></script>
</body>
</html>
