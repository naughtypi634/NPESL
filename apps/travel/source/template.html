<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title><!--TITLE--></title>
<style>
  :root {
    --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --rule:#e5e5ea;
    --surface:#f5f5f7; --surface-strong:#e8e8ed;
    --blue:#0071e3; --blue-hover:#0077ed; --blue-tint:#e8f2ff; --on-blue:#ffffff;
    --radius-card:24px; --radius-control:12px; --radius-pill:999px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable",
      "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f7; --muted:#98989d; --rule:#38383a;
      --surface:#1c1c1e; --surface-strong:#2c2c2e;
      --blue:#2997ff; --blue-hover:#40a9ff; --blue-tint:#102a43; --on-blue:#06131f;
      color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
    -webkit-font-smoothing:antialiased; }
  .page { max-width:760px; margin:0 auto;
    padding:clamp(40px,7vh,72px) 24px 96px; }
  .back, .npesl-back { display:inline-flex; align-items:center; gap:6px;
    margin:0 0 18px; padding:7px 13px; border:1px solid var(--rule);
    border-radius:999px; background:var(--surface); color:var(--fg);
    text-decoration:none; font-size:13px; font-weight:600;
    transition:background-color .15s ease; }
  /* 站点会统一注入 .npesl-back；这里把它放回文档流，避免和吸顶难度栏打架。 */
  .npesl-back { position:static; top:auto; z-index:auto; }
  .back:hover, .npesl-back:hover { background:var(--surface-strong);
    color:var(--fg); }
  .back svg, .npesl-back svg { width:14px; height:14px; flex:none; }
  .stage { margin:0 0 8px; color:var(--muted); font-size:12px;
    letter-spacing:.1em; text-transform:uppercase; }
  h1 { margin:0; font-size:clamp(2rem,6vw,2.8rem); font-weight:700;
    letter-spacing:-.03em; line-height:1.08; }
  .zh-title { margin:7px 0 0; color:var(--muted); font-size:17px; }
  .toolbar { position:sticky; top:0; z-index:30; display:flex; flex-wrap:wrap;
    align-items:center; justify-content:space-between; gap:10px;
    margin:20px -24px 0; padding:10px 24px;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:1px solid transparent;
    transition:border-color .15s ease; }
  .toolbar.is-stuck { border-bottom-color:var(--rule); }
  .level-switch { display:flex; flex-wrap:wrap; gap:6px; }
  .level-switch button, .pill {
    appearance:none; font:inherit; font-size:14px; padding:8px 14px;
    border:1px solid var(--rule); border-radius:var(--radius-pill,999px);
    background:transparent; color:var(--fg); cursor:pointer; }
  .level-switch button:hover, .pill:hover { background:var(--surface); }
  .level-switch button[aria-pressed="true"], .pill[aria-pressed="true"] {
    background:var(--blue); border-color:var(--blue); color:var(--on-blue); }
  .tools { display:flex; align-items:center; gap:8px; }
  .seg { display:inline-flex; align-items:center; padding:3px;
    border-radius:var(--radius-pill,999px); background:var(--surface); }
  .seg button { border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:13px; font-weight:600; padding:6px 13px;
    border-radius:var(--radius-pill,999px); cursor:pointer;
    transition:background-color .15s ease, color .15s ease; }
  .seg button[aria-pressed="true"] { background:var(--bg); color:var(--fg); }
  .zh-toggle { display:inline-flex; align-items:center; justify-content:center;
    gap:6px; min-width:96px; height:35px; padding:0 12px;
    border:1px solid var(--rule); border-radius:999px;
    background:var(--surface); color:var(--fg);
    font:inherit; font-size:13px; font-weight:650; cursor:pointer;
    transition:background-color .15s ease, color .15s ease; }
  .zh-toggle:hover { background:var(--surface-strong); }
  .zh-toggle .zh-state { color:var(--muted); font-weight:600; }
  .zh-toggle.is-off { color:var(--muted); }
  .map-card { margin:18px 0 0; }
  .map-wrap { position:relative; width:100%; aspect-ratio:640 / 400;
    min-height:220px; }
  .map-stage { position:absolute; inset:0; }
  .map-svg { display:block; width:100%; height:100%;
    --map-floor:light-dark(#f2f4f7,#1d262b);
    --map-base:light-dark(#eef0f4,#151c20);
    --map-floor-2:light-dark(#e9ecf1,#232e34);
    --map-floor-3:light-dark(#fbfbfd,#182024);
    --map-top:light-dark(#e6e9ef,#3f4f59);
    --map-top-2:light-dark(#d7dbe3,#50626d);
    --map-side:light-dark(#c9ced8,#2b3a42);
    --map-side-2:light-dark(#b7bdc9,#1f2a30);
    --map-wall-top:light-dark(#e1e5eb,#4d5f6a);
    --map-edge:light-dark(rgba(20,24,30,.14),rgba(238,243,244,.16));
    --map-shadow:light-dark(rgba(20,24,30,.18),rgba(0,0,0,.42)); }
  .map-plate { fill:var(--map-base); stroke:var(--map-edge); stroke-width:1; }
  .map-dot-field { opacity:.45; }
  .map-dot { fill:var(--map-edge); }
  .map-zone-shape { stroke:var(--map-edge); stroke-width:1;
    stroke-opacity:.55; }
  .map-zone-shape.tone-1 { fill:var(--map-floor); }
  .map-zone-shape.tone-2 { fill:var(--map-floor-2); }
  .map-zone-shape.tone-3 { fill:var(--map-floor-3); }
  .map-zone-label { fill:var(--muted); font:600 10.5px var(--font);
    letter-spacing:.1em; paint-order:stroke; stroke:var(--map-base);
    stroke-width:3px; }
  .map-zone-dot { fill:var(--blue); opacity:.7; }
  .map-furniture { filter:drop-shadow(0 .8px 1px var(--map-shadow)); }
  .map-fixture { fill:none; stroke:var(--muted); stroke-width:1.4; }
  .map-fixture-line { fill:none; stroke:var(--muted); stroke-width:1; }
  .map-fixture-soft { fill:var(--map-floor-2); stroke:var(--map-edge);
    stroke-width:1; }
  .map-counter, .map-shelf, .map-sofa, .map-bed, .map-train, .map-car,
  .map-pump, .map-atm, .map-terminal, .map-booth, .map-machine {
    fill:var(--map-top); stroke:var(--map-edge); stroke-width:1.2; }
  .map-counter-top, .map-sofa-seat, .map-pillow, .map-car-window,
  .map-train-window { fill:var(--map-top-2); stroke:var(--map-edge);
    stroke-width:1; }
  .map-seat { fill:var(--map-top); stroke:var(--map-edge); stroke-width:1; }
  .map-table { fill:var(--map-top-2); stroke:var(--map-edge); stroke-width:1; }
  .map-person { fill:var(--muted); }
  .map-pin, .map-flag { fill:var(--blue); }
  .map-route { fill:none; stroke:var(--blue); stroke-width:1.5;
    stroke-dasharray:5 7; stroke-linecap:round; stroke-linejoin:round;
    opacity:.5; }
  .map-arrow { fill:var(--blue); }
  .map-street-dash, .map-queue-line, .map-tactile { fill:none;
    stroke:var(--muted); stroke-width:1; stroke-dasharray:5 7; opacity:.55; }
  .map-tactile { stroke:var(--blue); stroke-width:2; stroke-dasharray:2 3; }
  .map-window { fill:none; stroke:var(--muted); stroke-width:1; opacity:.5; }
  .map-wc { fill:var(--muted); font:600 9px var(--font);
    letter-spacing:.06em; }
  .map-plant { fill:var(--surface-strong); stroke:var(--rule); }
  .map-leaf { fill:var(--blue); opacity:.22; }
  .map-bowl { fill:var(--surface-strong); stroke:var(--rule); }
  .map-blanket, .map-burner, .map-sofa-seam, .map-seat-back,
  .map-stock, .map-belt-slat, .map-curtain, .map-train-door,
  .map-door-leaf { fill:none; stroke:var(--muted); stroke-width:1;
    opacity:.55; }
  .map-curtain { stroke-width:1.5; }
  .map-train-door { stroke:var(--rule); stroke-width:1.5; opacity:1; }
  .map-wheel, .map-headlight { fill:var(--muted); opacity:.65; }
  .map-screen { fill:var(--blue-tint); stroke:var(--blue); }
  .map-stool { fill:var(--surface); stroke:var(--rule); }
  .map-3d-slab { fill:var(--map-floor-3); stroke:var(--map-edge);
    stroke-width:1; }
  .map-3d-slab-side { fill:var(--map-side); }
  .map-3d-floor { stroke:var(--map-edge); stroke-width:.8; }
  .map-3d-floor.tone-0 { fill:var(--map-floor); }
  .map-3d-floor.tone-1 { fill:var(--map-floor-2); }
  .map-3d-floor.tone-2 { fill:var(--map-floor-3); }
  .map-3d-top.tone-1 { fill:var(--map-top); }
  .map-3d-top.tone-2 { fill:var(--map-top-2); }
  .map-3d-top.tone-3 { fill:var(--map-side); }
  .map-3d-side { fill:var(--map-side); }
  .map-3d-side-2 { fill:var(--map-side-2); }
  .map-3d-wall-top { fill:var(--map-wall-top); }
  .map-3d-wall-side { fill:var(--map-side); }
  .map-3d-wall-side-2 { fill:var(--map-side-2); }
  .map-zone.is-active .map-zone-shape { fill:var(--blue);
    fill-opacity:.13; stroke:var(--blue); stroke-width:1.4; }
  .map-zone.is-active .map-zone-label { fill:var(--blue); }
  .map-zone.is-active .map-3d-floor { fill:var(--blue);
    fill-opacity:.26; stroke:var(--blue); stroke-width:1.4; }
  .hotspot { position:absolute; left:var(--x2d); top:var(--y2d);
    transform:translate(-50%,-50%); display:flex; align-items:center;
    gap:7px; min-height:32px; padding:4px 10px 4px 4px;
    border:1px solid var(--rule); border-radius:var(--radius-pill,999px);
    background:var(--bg); color:var(--fg); font:inherit; font-size:12px;
    line-height:1.15; text-align:left; white-space:nowrap; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.10); z-index:2; }
  body.view-3d .hotspot { left:var(--x3d); top:var(--y3d); }
  .hs-num { flex:none; display:inline-flex; align-items:center;
    justify-content:center; width:24px; height:24px; border-radius:50%;
    background:var(--blue); color:var(--on-blue); font-size:11px;
    font-weight:700; }
  .hs-text { display:flex; flex-direction:column; gap:0; }
  .hotspot .hs-en { font-weight:600; }
  .hotspot .hs-zh { font-size:10px; color:var(--muted); }
  .hotspot:hover { background:var(--surface); }
  .hotspot[aria-pressed="true"] { border-color:var(--blue);
    background:var(--blue-tint);
    box-shadow:0 4px 14px rgba(0,0,0,.14); }
  .hotspot[aria-pressed="true"] .hs-zh { color:var(--muted); }
  .hotspot:focus-visible, .level-switch button:focus-visible,
  .zh-toggle:focus-visible,
  .seg button:focus-visible, .pill:focus-visible, .phrase:focus-visible,
  .play-all:focus-visible, .line .say:focus-visible {
    outline:2px solid var(--blue); outline-offset:2px; }
  .encounter { margin:30px 0 0; }
  .encounter-head h2 { margin:0 0 14px; font-size:1.3rem; font-weight:650;
    letter-spacing:-.01em; }
  .encounter-head .zh { color:var(--muted); font-size:14px; font-weight:400;
    margin-left:8px; }
  .phrases { display:flex; flex-direction:column; gap:8px; }
  .phrase { position:relative; width:100%; display:block; text-align:left;
    font:inherit; padding:12px 42px 12px 14px; border:1px solid var(--rule);
    border-radius:var(--radius-control,12px); background:var(--bg);
    color:inherit; cursor:pointer; }
  .phrase:hover { background:var(--surface); }
  .phrase .en { display:block; font-size:16px; line-height:1.45; }
  .phrase .zh { display:block; margin-top:2px; color:var(--muted);
    font-size:13px; }
  .phrase .note { display:block; margin-top:4px; color:var(--muted);
    font-size:12px; line-height:1.5; }
  .play { position:absolute; right:12px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; border:1px solid var(--rule); border-radius:50%;
    background:var(--bg); color:var(--muted); }
  .play svg { display:block; width:8px; height:8px; margin-left:1px; }
  .play .bars { display:none; align-items:flex-end; gap:2px; height:9px; }
  .play .bars i { display:block; width:2px; height:4px; border-radius:1px;
    background:currentColor; animation:eq .9s ease-in-out infinite; }
  .play .bars i:nth-child(2) { animation-delay:.15s; }
  .play .bars i:nth-child(3) { animation-delay:.3s; }
  .phrase.on .play, .ask.on .play, .reply.on .play {
    background:var(--blue); border-color:var(--blue); color:var(--on-blue); }
  .phrase.on .play svg, .ask.on .play svg, .reply.on .play svg {
    display:none; }
  .phrase.on .play .bars, .ask.on .play .bars, .reply.on .play .bars {
    display:inline-flex; }
  @keyframes eq {
    0%,100% { height:3px; }
    50% { height:9px; }
  }
  .phrase.on { border-color:var(--blue); }
  .dialogue { margin:24px 0 0; }
  .dialogue-tools { display:flex; flex-wrap:wrap; align-items:center;
    gap:8px; margin-bottom:12px; }
  .dialogue-tools .pill { padding:7px 13px; font-size:13px; }
  .play-all { display:inline-flex; align-items:center; gap:7px;
    border:1px solid transparent; background:var(--blue); color:var(--on-blue);
    font:inherit; font-size:13.5px; font-weight:650; padding:7px 14px;
    border-radius:999px; cursor:pointer;
    transition:background-color .15s ease, color .15s ease; }
  .play-all:hover { background:var(--blue-hover); }
  .play-all svg { width:15px; height:15px; fill:currentColor; flex:none; }
  .play-all .stop-icon { display:none; }
  .play-all[aria-pressed="true"] { background:var(--surface-strong);
    color:var(--fg); }
  .play-all[aria-pressed="true"] .play-icon { display:none; }
  .play-all[aria-pressed="true"] .stop-icon { display:inline; }  .turns { display:flex; flex-direction:column; gap:9px; }
  .line { display:grid; grid-template-columns:52px minmax(0,1fr); gap:8px;
    align-items:start; }
  .who { padding-top:11px; color:var(--muted); font-size:12px; text-align:right;
    overflow:hidden; text-overflow:ellipsis; }
  .line .say { width:100%; display:block; text-align:left; font:inherit;
    padding:10px 12px; border:1px solid var(--rule);
    border-radius:var(--radius-control,12px); background:var(--surface);
    color:inherit; cursor:pointer; }
  .line[data-role="you"] .say { background:var(--blue-tint); }
  .line .say .en { display:block; font-size:15px; line-height:1.45; }
  .line .say .zh { display:block; margin-top:2px; color:var(--muted);
    font-size:12px; }
  .line.playing .say { border-color:var(--blue);
    background:var(--blue-tint); }
  .listening { margin:28px 0 0; }
  .listening h2 { margin:0 0 14px; font-size:1.3rem; font-weight:650;
    letter-spacing:-.01em; }
  .intents { display:flex; flex-direction:column; gap:12px; }
  .intent { padding:15px 16px 16px; border:1px solid var(--rule);
    border-radius:var(--radius-control,12px); background:var(--surface); }
  .intent h3 { margin:0 0 10px; font-size:13px; font-weight:650;
    letter-spacing:.02em; }
  .asks { display:flex; flex-direction:column; gap:6px; }
  .ask { position:relative; width:100%; display:block; text-align:left;
    font:inherit; padding:10px 38px 10px 12px; border:1px solid var(--rule);
    border-radius:var(--radius-control,12px); background:var(--bg);
    color:inherit; cursor:pointer; }
  .ask:hover { background:var(--surface-strong); }
  .ask .en { display:block; font-size:15px; line-height:1.45; }
  .ask .zh { display:block; margin-top:2px; color:var(--muted);
    font-size:12px; }
  .ask.on, .reply.on { border-color:var(--blue); }
  .key { background:none; color:var(--blue); font-weight:650; }
  .reply { position:relative; width:100%; display:flex; align-items:flex-start;
    gap:10px; margin-top:9px; padding:10px 38px 10px 11px;
    border:1px solid var(--blue); border-radius:var(--radius-control,12px);
    background:var(--blue-tint); color:inherit; font:inherit;
    text-align:left; cursor:pointer; }
  .reply-tag { flex:none; display:inline-flex; align-items:center;
    justify-content:center; width:22px; height:22px; border-radius:50%;
    background:var(--blue); color:var(--on-blue); font-size:12px;
    font-weight:650; }
  .reply-body { flex:1; min-width:0; }
  .reply .en { display:block; font-size:15px; line-height:1.45; }
  .reply .zh { display:block; margin-top:2px; color:var(--muted);
    font-size:12px; }
  .pattern { margin:11px 0 0; color:var(--muted); font-size:13px;
    line-height:1.55; }
  .plabel { display:inline-block; margin-right:7px; padding:1px 6px;
    border-radius:4px; background:var(--surface-strong); color:var(--fg);
    font-size:11px; font-weight:600; }
  .listen-note { margin:7px 0 0; color:var(--muted); font-size:12px;
    line-height:1.55; }
  body.zh-off .zh, body.zh-off .note, body.zh-off .zh-title { display:none; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media (max-width:480px) {
    .page { padding-left:16px; padding-right:16px; }
    .toolbar { align-items:flex-start; margin-left:-16px; margin-right:-16px;
      padding-left:16px; padding-right:16px; }
    .tools { gap:6px; }
    .level-switch button { padding:7px 11px; font-size:13px; }
    .seg button { padding:6px 11px; font-size:12.5px; }
    .zh-toggle { min-width:88px; height:33px; padding:0 10px; font-size:12.5px; }
    .hotspot { font-size:11px; padding:3px 8px 3px 3px; gap:5px; }
    .hs-num { width:20px; height:20px; font-size:10px; }
    .hotspot .hs-zh { display:none; }
    .intent { padding:13px; }
    .line { grid-template-columns:44px minmax(0,1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body data-default-level="<!--DEFAULT_LEVEL-->">
<main class="page">
  <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>旅行英语</a>
  <header>
    <p class="stage"><!--STAGE--></p>
    <h1><!--TITLE_EN--></h1>
    <p class="zh-title"><!--TITLE_ZH--></p>
  </header>

  <div class="toolbar">
    <div class="level-switch" role="group" aria-label="难度">
      <button type="button" data-level="survival" aria-pressed="true">Survival</button>
      <button type="button" data-level="conversational" aria-pressed="false">Conversational</button>
      <button type="button" data-level="advanced" aria-pressed="false">Advanced</button>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="地图视图">
        <button type="button" data-view="2d" aria-pressed="true">2D</button>
        <button type="button" data-view="3d" aria-pressed="false">3D</button>
      </div>
      <div class="seg" role="group" aria-label="短语音色">
        <button type="button" data-voice="f" aria-pressed="true">女声</button>
        <button type="button" data-voice="m" aria-pressed="false">男声</button>
      </div>
      <button class="zh-toggle" type="button" data-zh-toggle aria-pressed="true"
        aria-label="中文开"><span data-zh-label>中文</span><span class="zh-state" data-zh-state>开</span></button>
    </div>
  </div>

  <figure class="card map-card" role="group" aria-label="场景平面图">
    <div class="map-wrap">
      <div class="map-stage" data-map-view="2d"><!--MAP_SVG_2D--></div>
      <div class="map-stage" data-map-view="3d" hidden><!--MAP_SVG_3D--></div>
      <!--HOTSPOTS-->
    </div>
  </figure>
  <p class="sr-only" aria-live="polite" data-status></p>

  <!--ENCOUNTERS-->

  <script id="spriteMap" type="application/json"><!--SPRITES--></script>
</main>

<script>
(function () {
  var LEVELS = ['survival', 'conversational', 'advanced'];
  var SPRITES = {};
  try {
    SPRITES = JSON.parse(document.getElementById('spriteMap').textContent || '{}');
  } catch (e) { SPRITES = {}; }
  var body = document.body;
  var levelBtns = [].slice.call(document.querySelectorAll('[data-level]'));
  var voiceBtns = [].slice.call(document.querySelectorAll('[data-voice]'));
  var viewBtns = [].slice.call(document.querySelectorAll('[data-view]'));
  var hotspots = [].slice.call(document.querySelectorAll('[data-hotspot]'));
  var encounters = [].slice.call(document.querySelectorAll('.encounter'));
  var zhToggle = document.querySelector('[data-zh-toggle]');
  var zhState = document.querySelector('[data-zh-state]');
  var speedBtns = [].slice.call(document.querySelectorAll('[data-speed]'));
  var playBtns = [];
  var activePlayBtn = null;
  var toolbar = document.querySelector('.toolbar');
  var statusEl = document.querySelector('[data-status]');
  var audio = new Audio();
  audio.preload = 'none';
  audio.preservesPitch = true;

  var voice = 'f';
  var view = '2d';
  var level = body.getAttribute('data-default-level') || 'survival';
  var speed = 0.9;
  var zhOff = false;
  var selected = null;
  var playToken = 0;
  var seqRunning = false;
  var srcCache = {};
  var currentEl = null;

  try {
    var savedVoice = localStorage.getItem('npesl-voice');
    if (savedVoice === 'f' || savedVoice === 'm') voice = savedVoice;
  } catch (e) {}
  try {
    var savedView = localStorage.getItem('travel-view');
    if (savedView === '2d' || savedView === '3d') view = savedView;
  } catch (e) {}
  try {
    zhOff = localStorage.getItem('npesl-zh') === '0';
  } catch (e) {}
  try {
    var savedSpeed = parseFloat(localStorage.getItem('npesl-speed'));
    if ([0.8, 0.9, 1, 1.15].indexOf(savedSpeed) >= 0) speed = savedSpeed;
  } catch (e) {}

  var queryLevel = null;
  try {
    queryLevel = new URLSearchParams(location.search).get('level');
  } catch (e) {}
  if (LEVELS.indexOf(queryLevel) >= 0) {
    level = queryLevel;
  } else {
    try {
      var savedLevel = localStorage.getItem('travel-level');
      if (LEVELS.indexOf(savedLevel) >= 0) level = savedLevel;
    } catch (e) {}
  }

  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function updateHash() {
    var next = '?level=' + level + (selected
      ? '#' + selected.getAttribute('data-hotspot') : '');
    try { history.replaceState(null, '', next); } catch (e) {}
  }

  function applyLevelPanels() {
    [].forEach.call(document.querySelectorAll('.level-panel'), function (panel) {
      panel.hidden = panel.getAttribute('data-level') !== level;
    });
    levelBtns.forEach(function (btn) {
      btn.setAttribute('aria-pressed',
        btn.getAttribute('data-level') === level ? 'true' : 'false');
    });
  }

  function setLevel(next, persist) {
    if (LEVELS.indexOf(next) < 0) return;
    level = next;
    applyLevelPanels();
    stopAudio();
    if (persist !== false) save('travel-level', level);
    updateHash();
  }

  function selectHotspot(btn, scroll) {
    if (!btn) return;
    selected = btn;
    hotspots.forEach(function (spot) {
      spot.setAttribute('aria-pressed', spot === btn ? 'true' : 'false');
    });
    var zone = btn.getAttribute('data-zone');
    [].forEach.call(document.querySelectorAll('.map-zone'), function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-zone') === zone);
    });
    var target = btn.getAttribute('data-encounter');
    encounters.forEach(function (panel) {
      panel.hidden = panel.getAttribute('data-encounter') !== target;
    });
    applyLevelPanels();
    stopAudio();
    var zh = btn.querySelector('.hs-zh');
    if (statusEl) statusEl.textContent = '已选择：' + (zh ? zh.textContent : '');
    updateHash();
    if (scroll && window.matchMedia('(max-width: 700px)').matches) {
      var panel = document.getElementById('panel-' + target);
      if (panel) {
        setTimeout(function () {
          panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 40);
      }
    }
  }

  function applyVoice(next, persist) {
    voice = next === 'm' ? 'm' : 'f';
    voiceBtns.forEach(function (btn) {
      btn.setAttribute('aria-pressed',
        btn.getAttribute('data-voice') === voice ? 'true' : 'false');
    });
    if (persist !== false) save('npesl-voice', voice);
    stopAudio();
  }

  function applyView(next, persist) {
    view = next === '3d' ? '3d' : '2d';
    body.classList.toggle('view-3d', view === '3d');
    [].forEach.call(document.querySelectorAll('[data-map-view]'),
      function (stage) {
        stage.hidden = stage.getAttribute('data-map-view') !== view;
      });
    viewBtns.forEach(function (btn) {
      btn.setAttribute('aria-pressed',
        btn.getAttribute('data-view') === view ? 'true' : 'false');
    });
    if (persist !== false) save('travel-view', view);
  }

  function applyZh(next, persist) {
    zhOff = !!next;
    body.classList.toggle('zh-off', zhOff);
    if (zhToggle) {
      zhToggle.setAttribute('aria-pressed', zhOff ? 'false' : 'true');
      zhToggle.setAttribute('aria-label', zhOff ? '中文关' : '中文开');
      zhToggle.classList.toggle('is-off', zhOff);
    }
    if (zhState) zhState.textContent = zhOff ? '关' : '开';
    if (persist !== false) save('npesl-zh', zhOff ? '0' : '1');
  }

  function applySpeed(next, persist) {
    speed = next;
    speedBtns.forEach(function (btn) { btn.textContent = speed + '×'; });
    audio.playbackRate = speed;
    if (persist !== false) save('npesl-speed', String(speed));
  }

  function stopAudio() {
    playToken++;
    seqRunning = false;
    try { audio.pause(); } catch (e) {}
    if (currentEl) {
      currentEl.classList.remove('on', 'playing');
      currentEl = null;
    }
    [].forEach.call(document.querySelectorAll('.phrase.on, .line.playing, .say.playing'),
      function (node) { node.classList.remove('on', 'playing'); });
    playBtns.forEach(function (btn) {
      btn.setAttribute('aria-pressed', 'false');
      var label = btn.querySelector('[data-play-label]');
      if (label) label.textContent = '播放对话';
    });
    activePlayBtn = null;
  }

  function srcFor(url) {
    if (srcCache[url]) return srcCache[url];
    if (location.protocol === 'file:' || !window.fetch || !window.URL
        || !window.URL.createObjectURL) {
      srcCache[url] = Promise.resolve(url);
      return srcCache[url];
    }
    srcCache[url] = fetch(url).then(function (response) {
      if (!response.ok) throw 0;
      return response.blob();
    }).then(function (blob) {
      return URL.createObjectURL(blob);
    }).catch(function () { return url; });
    return srcCache[url];
  }

  function loadSource(src) {
    return new Promise(function (resolve) {
      if (audio.src === src && audio.readyState >= 1) return resolve();
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        audio.removeEventListener('loadedmetadata', finish);
        audio.removeEventListener('error', finish);
        resolve();
      }
      audio.addEventListener('loadedmetadata', finish);
      audio.addEventListener('error', finish);
      audio.src = src;
      audio.load();
    });
  }

  function waitStop(end, token) {
    return new Promise(function (resolve) {
      function tick() {
        if (token !== playToken) return resolve();
        if (audio.paused || audio.currentTime >= end - 0.008) {
          try { audio.pause(); } catch (e) {}
          return resolve();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  function playSprite(key, start, end, el, token) {
    return new Promise(function (resolve) {
      var rel = SPRITES[key];
      if (!rel || !isFinite(start) || !isFinite(end)) return resolve(false);
      srcFor('audio/' + rel).then(function (src) {
        if (token !== playToken) return resolve(false);
        return loadSource(src).then(function () {
          if (token !== playToken) return resolve(false);
          try { audio.currentTime = Math.max(0, start); } catch (e) {}
          audio.playbackRate = speed;
          if (currentEl) currentEl.classList.remove('on', 'playing');
          currentEl = el;
          if (el) {
            if (el.classList.contains('phrase') || el.classList.contains('ask')
                || el.classList.contains('reply')) {
              el.classList.add('on');
            } else {
              var line = el.closest('.line');
              if (line) line.classList.add('playing');
              else el.classList.add('playing');
            }
          }
          var played;
          try { played = audio.play(); } catch (e) { return resolve(false); }
          Promise.resolve(played).then(function () {
            if (token !== playToken) return resolve(false);
            waitStop(end, token).then(function () {
              resolve(token === playToken);
            });
          }, function () { resolve(false); });
        });
      });
    });
  }

  function playPhrase(btn) {
    var sprite = btn.getAttribute('data-sprite');
    if (!sprite) sprite = level + '-p';
    var start = parseFloat(btn.getAttribute('data-start-' + voice));
    var end = parseFloat(btn.getAttribute('data-end-' + voice));
    stopAudio();
    var token = playToken;
    playSprite(sprite + '-' + voice, start, end, btn, token);
  }

  function playLine(line, btn) {
    var start = parseFloat(btn.getAttribute('data-start'));
    var end = parseFloat(btn.getAttribute('data-end'));
    stopAudio();
    var token = playToken;
    return playSprite(level + '-d', start, end, btn, token);
  }

  function currentPanel() {
    return document.querySelector(
      '.encounter:not([hidden]) .dialogue-panel:not([hidden])');
  }

  function playDialogue(btn) {
    if (seqRunning) { stopAudio(); return; }
    var panel = currentPanel();
    if (!panel) return;
    var lines = [].slice.call(panel.querySelectorAll('.line'));
    if (!lines.length) return;
    stopAudio();
    var token = playToken;
    seqRunning = true;
    activePlayBtn = btn || null;
    if (activePlayBtn) {
      activePlayBtn.setAttribute('aria-pressed', 'true');
      var label = activePlayBtn.querySelector('[data-play-label]');
      if (label) label.textContent = '停止';
    }
    var index = 0;
    function next() {
      if (token !== playToken || index >= lines.length) {
        if (token === playToken) {
          seqRunning = false;
          if (activePlayBtn) {
            activePlayBtn.setAttribute('aria-pressed', 'false');
            var done = activePlayBtn.querySelector('[data-play-label]');
            if (done) done.textContent = '播放对话';
          }
          activePlayBtn = null;
        }
        return;
      }
      var line = lines[index++];
      var say = line.querySelector('.say');
      if (!say) return next();
      var start = parseFloat(say.getAttribute('data-start'));
      var end = parseFloat(say.getAttribute('data-end'));
      if (line.scrollIntoView) {
        try { line.scrollIntoView({ block: 'nearest' }); } catch (e) {}
      }
      playSprite(level + '-d', start, end, say, token).then(function () {
        if (token !== playToken) return;
        next();
      });
    }
    next();
  }

  document.addEventListener('click', function (event) {
    var hotspot = event.target.closest('[data-hotspot]');
    if (hotspot) { selectHotspot(hotspot, true); return; }

    var phrase = event.target.closest('.phrase, .ask, .reply');
    if (phrase) { playPhrase(phrase); return; }

    var playLineBtn = event.target.closest('.line .say');
    if (playLineBtn) {
      playLine(playLineBtn.closest('.line'), playLineBtn);
      return;
    }

    var levelBtn = event.target.closest('button[data-level]');
    if (levelBtn) { setLevel(levelBtn.getAttribute('data-level')); return; }

    var voiceBtn = event.target.closest('[data-voice]');
    if (voiceBtn) { applyVoice(voiceBtn.getAttribute('data-voice')); return; }

    var viewBtn = event.target.closest('[data-view]');
    if (viewBtn) { applyView(viewBtn.getAttribute('data-view')); return; }

    if (event.target.closest('[data-zh-toggle]')) {
      applyZh(!zhOff);
      return;
    }
    if (event.target.closest('[data-speed]')) {
      var steps = [0.8, 0.9, 1, 1.15];
      var index = steps.indexOf(speed);
      applySpeed(steps[(index + 1) % steps.length]);
      return;
    }
    if (event.target.closest('[data-play-dialogue]')) {
      playDialogue(event.target.closest('[data-play-dialogue]'));
    }
  });

  playBtns = [].slice.call(document.querySelectorAll('[data-play-dialogue]'));
  function syncToolbar() {
    if (toolbar) toolbar.classList.toggle('is-stuck',
      toolbar.getBoundingClientRect().top <= 0);
  }
  window.addEventListener('scroll', syncToolbar, { passive: true });
  window.addEventListener('resize', syncToolbar);
  syncToolbar();

  applyVoice(voice, false);
  applyView(view, false);
  applyZh(zhOff, false);
  applySpeed(speed, false);
  var hash = '';
  try { hash = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) {}
  var initial = hotspots.filter(function (spot) {
    return spot.getAttribute('data-hotspot') === hash;
  })[0] || hotspots[0];
  selectHotspot(initial, false);
  setLevel(level, false);
})();
</script>
</body>
</html>
