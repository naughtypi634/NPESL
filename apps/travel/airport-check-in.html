  .hot { position:absolute; width:34px; height:34px; padding:0;

    background:transparent; cursor:pointer; }
  .hot::before { content:""; position:absolute; inset:11px; border-radius:50%;

  .hot::after { content:""; position:absolute; inset:4px; border-radius:50%;

  .hot:hover::before, .hot:focus-visible::before { transform:scale(1.35);

  .hot:hover::after, .hot:focus-visible::after { opacity:1; }

  .hot .tag small { display:block; font-size:11px; opacity:.7; }

  .card { border:1px solid var(--rule); border-radius:16px; padding:22px 24px; }
  .card .word { font-size:clamp(1.5rem,3.6vw,2rem); font-weight:700;

  .card .pos { font-size:13px; color:var(--muted); font-style:italic; }

  .card .ex { margin:16px 0 0; font-size:17px; line-height:1.55; }

  .card .note { margin:14px 0 0; font-size:13.5px; color:var(--muted);

    background:var(--tint); color:var(--accent); cursor:pointer; flex:none;

  .play svg { width:14px; height:14px; fill:currentColor; }
  .play[data-playing="true"] { background:var(--accent); color:var(--on-accent); }

  .enc h2 { margin:0 0 4px; font-size:clamp(1.2rem,2.8vw,1.55rem);
    font-weight:700; letter-spacing:-0.02em; }
  .enc .zh { color:var(--muted); font-size:14px; margin:0; }
  .row { display:flex; align-items:center; justify-content:space-between;

  .levels { display:flex; gap:6px; }
  .levels button, .toggle { appearance:none; font:inherit; font-size:13px;
    padding:6px 13px; border:1px solid var(--rule); border-radius:999px;

  .levels button:hover, .toggle:hover { background:var(--surface); }
  .levels button[aria-pressed="true"] { background:var(--accent);

  .lines { list-style:none; margin:14px 0 0; padding:0; }
  .lines li { display:grid; grid-template-columns:auto 1fr auto; gap:10px;
    align-items:baseline; padding:9px 0; border-top:1px solid var(--rule); }
  .lines li:first-child { border-top:0; }
  .who { font-size:12px; color:var(--muted); min-width:52px; }
  .say { font-size:16px; line-height:1.5; }
  .say .zh { display:block; font-size:13.5px; color:var(--muted); margin-top:2px; }
  body.hide-zh .zh { display:none; }

  .block { margin-top:26px; }
  .block h3 { margin:0 0 8px; font-size:14px; font-weight:600; color:var(--muted);

  .listen { border:1px solid var(--rule); border-radius:14px; padding:16px 18px;

  .listen .asks { list-style:none; margin:8px 0 0; padding:0; }

  .listen .pattern { margin:8px 0 0; font-size:13px; color:var(--muted); }
  .listen .note { margin:6px 0 0; font-size:13px; color:var(--muted); }
  .hidden { display:none !important; }
</style>

const LEVEL_LABEL = {survival:"Survival", conversational:"Conversational", advanced:"Advanced"};
const LOCATIONS = [
  ["airport-check-in","Check-in"],
  ["airport-security","Security"],
  ["airport-boarding","Boarding"]
];
let voice = localStorage.getItem("travel-voice") === "m" ? "m" : "f";
let level = localStorage.getItem("travel-level") || "survival";
let current = null;

const player = document.getElementById("player");
const panel = document.getElementById("panel");
let token = 0;

function icon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';}
function esc(s){return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function play(spriteName, holdKey, button){
  const sp = DATA.sprites[spriteName];
  if (!sp) return;
  const span = sp.holds[holdKey];
  if (!span) return;
  const my = ++token;
  if (document.querySelector('.play[data-playing="true"]')) {
    document.querySelectorAll('.play').forEach(b => b.dataset.playing = "false");
  }
  const start = () => {
    player.currentTime = span[0];
    player.play().catch(() => {});
    if (button) button.dataset.playing = "true";
  };
  if (player.dataset.sprite !== spriteName) {
    player.dataset.sprite = spriteName;
    player.src = DATA.audio + sp.file;
    player.onloadedmetadata = start;
    player.load();
  } else { start(); }
  player.ontimeupdate = () => {
    if (my !== token) return;
    if (player.currentTime >= span[1] - 0.01) {
      player.pause();
      document.querySelectorAll('.play').forEach(b => b.dataset.playing = "false");
      player.ontimeupdate = null;
    }
  };
}

function playButton(spriteName, holdKey){
  return '<button class="play" data-sprite="'+spriteName+'" data-hold="'+holdKey+'" aria-label="Play">'+icon()+'</button>';
}

function bindPlays(root){
  root.querySelectorAll(".play").forEach(b => {
    b.addEventListener("click", () => play(b.dataset.sprite, b.dataset.hold, b));
  });
}

function tabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = LOCATIONS.map(([id,label]) =>
    '<a href="/travel/'+id+'.html" '+(id===DATA.id?'aria-current="page"':'')+'>'+label+'</a>').join("");
}

function hotspots(){
  const stage = document.getElementById("stage");
  stage.innerHTML = '<img src="'+DATA.background+'" alt="'+esc(DATA.title_en)+'" width="'+DATA.canvas.w+'" height="'+DATA.canvas.h+'">';
  const add = (kind, o) => {
    const b = document.createElement("button");
    b.className = "hot " + kind;
    b.style.left = o.x + "%";
    b.style.top = o.y + "%";
    if (o.hit && o.hit.w && DATA.canvas.w) {
      b.style.width = Math.max(34, o.hit.w / 100 * 0 + 34) + "px";
    }
    b.setAttribute("aria-label", o.label_en + (o.label_zh ? " · " + o.label_zh : ""));
    b.innerHTML = '<span class="tag">'+esc(o.label_en)+'<small>'+esc(o.label_zh)+'</small></span>';
    b.addEventListener("click", () => kind === "item" ? showItem(o.id) : showEncounter(o.encounter));
    stage.appendChild(b);
  };
  DATA.items.forEach(i => add("item", i));
  DATA.characters.forEach(c => add("character", c));
}

function showItem(id){
  const item = DATA.items.find(i => i.id === id);
  if (!item) return;
  const w = item.word;
  current = {kind:"item", id};
  const ex = (w.examples && w.examples[0]) || item.phrases[0];
  let html = '<div class="card">';
  html += '<div class="word">'+esc(w.en)+' <span class="ipa">/'+esc(w.ipa)+'/</span> <span class="pos">'+esc(w.pos)+'</span></div>';
  html += '<p class="zh">'+esc(w.zh)+'</p>';
  if (ex) {
    html += '<p class="ex">'+playButton("items-"+voice, "e:"+id+":0")+' '+esc(ex.en)+'<span class="zh">'+esc(ex.zh)+'</span></p>';
  }
  if (item.phrases.length) {
    html += '<div class="block"><h3>In the hall</h3><ul class="lines">';
    item.phrases.forEach((p, i) => {
      html += '<li><span class="who"></span><span class="say">'+esc(p.en)+'<span class="zh">'+esc(p.zh)+'</span></span>'
            + playButton("items-"+voice, "p:"+id+":"+i) + '</li>';
    });
    html += '</ul></div>';
  }
  if (w.l1_note) html += '<p class="note">'+esc(w.l1_note)+'</p>';
  html += '</div>';
  panel.innerHTML = html;
  bindPlays(panel);
  play("items-"+voice, "w:"+id, panel.querySelector(".play"));
}

function showEncounter(encId){
  const enc = DATA.encounters.find(e => e.id === encId);
  if (!enc) return;
  current = {kind:"enc", id:encId};
  const lv = enc.levels[level] || {phrases:[], dialogue:[]};
  let html = '<div class="enc"><h2>'+esc(enc.title_en)+'</h2><p class="zh">'+esc(enc.title_zh)+'</p>';
  html += '<div class="row"><div class="levels">';
  DATA.levels.forEach(l => {
    html += '<button data-level="'+l+'" aria-pressed="'+(l===level)+'">'+LEVEL_LABEL[l]+'</button>';
  });
  html += '</div><button class="toggle" id="zh-toggle">中</button></div>';

  if (lv.phrases.length) {
    html += '<div class="block"><h3>Phrases</h3><ul class="lines">';
    lv.phrases.forEach((p, i) => {
      html += '<li><span class="who"></span><span class="say">'+esc(p.en)+'<span class="zh">'+esc(p.zh)+'</span></span>'
            + playButton("phrases-"+level+"-"+voice, "ph:"+level+":"+i) + '</li>';
    });
    html += '</ul></div>';
  }
  if (lv.dialogue.length) {
    html += '<div class="block"><h3>Dialogue</h3><ul class="lines">';
    lv.dialogue.forEach((l, i) => {
      const spk = DATA.speakers[l.spk] || {en:l.spk, zh:""};
      html += '<li><span class="who">'+esc(spk.en)+'</span><span class="say">'+esc(l.en)+'<span class="zh">'+esc(l.zh)+'</span></span>'
            + playButton("dialogue-"+level, "dl:"+level+":"+i) + '</li>';
    });
    html += '</ul></div>';
  }
  if (enc.listening && enc.listening.length) {
    html += '<div class="block"><h3>What they may ask</h3>';
    enc.listening.forEach(li => {
      html += '<div class="listen"><div class="intent">'+esc(li.intent_zh)+'</div><ul class="asks">';
      li.asks.forEach((a, i) => {
        html += '<li><span>'+esc(a.en)+'</span>'
              + playButton("listen-"+voice, "l:"+enc.id+":"+li.id+":"+i) + '</li>';
      });
      html += '</ul>';
      html += '<p class="reply">'+esc(li.reply.en)+' <span class="zh">'+esc(li.reply.zh)+'</span></p>';
      if (li.pattern) html += '<p class="pattern">'+esc(li.pattern)+'</p>';
      if (li.note) html += '<p class="note">'+esc(li.note)+'</p>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  panel.innerHTML = html;
  bindPlays(panel);
  panel.querySelectorAll(".levels button").forEach(b => {
    b.addEventListener("click", () => {
      level = b.dataset.level;
      localStorage.setItem("travel-level", level);
      showEncounter(encId);
    });
  });
  const zh = panel.querySelector("#zh-toggle");
  zh.addEventListener("click", () => document.body.classList.toggle("hide-zh"));
  panel.scrollIntoView({behavior:"smooth", block:"start"});
}

tabs();
hotspots();
document.body.classList.toggle("hide-zh", localStorage.getItem("travel-zh") === "0");
document.addEventListener("keydown", e => {
  const i = DATA.items.findIndex(x => x.id === (current && current.id));
  if (e.key === "Escape") panel.innerHTML = "";
});
</script>
<script src="/theme.js"></script>
