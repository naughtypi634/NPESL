<header class="studio-head" id="site-head">
  <div class="head-inner">
    <a class="npesl-back" href="../" aria-label="返回 NPESL">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>

    <div class="brand">

<main class="studio">

<nav class="deck type-switch" aria-label="图表类型">

  <div class="sheet-backdrop" data-sheet-close></div>

    <header class="sheet-head">
      <div class="sheet-tabs" role="tablist" aria-label="参考内容">
        <button class="sheet-tab" type="button" role="tab" data-sheet-tab="patterns" aria-selected="true">句型</button>
        <button class="sheet-tab" type="button" role="tab" data-sheet-tab="vocab" aria-selected="false">词汇</button>
        <button class="sheet-tab" type="button" role="tab" data-sheet-tab="errors" aria-selected="false">错误</button>
      </div>
      <button class="sheet-close" type="button" data-sheet-close aria-label="关闭参考">×</button>
    </header>
    <div class="sheet-body" data-sheet-body></div>
  </section>
</div>
