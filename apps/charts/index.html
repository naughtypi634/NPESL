    handles.forEach(function (item) {
      item.handle.group.addEventListener('focus', function () {
        var center = state.band.center(item.categoryIndex);
        var start = center - state.groupWidth / 2;
        var x = start + item.seriesIndex * (state.barWidth + state.barGap) + state.barWidth / 2;
        showTip(item.seriesIndex, item.categoryIndex, x, state.y(dataset.series[item.seriesIndex].values[item.categoryIndex]));
      });
      item.handle.group.addEventListener('blur', function () { common.hideTip(lab.plot); });
    });
  }

  function updateVertical(lab) {
    var state = lab.barState;
    if (!state || state.direction !== 'vertical') return;
    var dataset = lab.dataset;
    var y = state.y;
    var band = state.band;
    if (state.layout === 'stacked') {
      dataset.categories.forEach(function (category, categoryIndex) {
        var cumulative = 0;
        dataset.series.forEach(function (series, seriesIndex) {
          var value = series.values[categoryIndex];
          var segment = state.segments.filter(function (item) {
            return item.seriesIndex === seriesIndex && item.categoryIndex === categoryIndex;
          })[0];
          if (segment) {
            segment.rect.setAttribute('y', y(cumulative + value));
            segment.rect.setAttribute('height', Math.max(0, y(cumulative) - y(cumulative + value)));
          }
          var handle = state.handles.filter(function (item) {
            return item.seriesIndex === seriesIndex && item.categoryIndex === categoryIndex;
          })[0];
          cumulative += value;
          if (handle) {
            svg.move(handle.handle, band.center(categoryIndex), y(cumulative));
            svg.setSlider(handle.handle, value, tipText(dataset, seriesIndex, categoryIndex));
          }
        });
        var label = state.labels[categoryIndex];
        if (label && label.node) {
          label.node.setAttribute('y', Math.max(state.plot.top + 12, y(cumulative) - 10));
          label.node.textContent = NC.fmt.number(cumulative, 0);
        }
      });
      return;
    }
    var barWidth = state.barWidth;
    var barGap = state.barGap;
    var groupWidth = state.groupWidth;
    dataset.series.forEach(function (series, seriesIndex) {
      series.values.forEach(function (value, categoryIndex) {
        var center = band.center(categoryIndex);
        var start = center - groupWidth / 2;
        var x = start + seriesIndex * (barWidth + barGap);
        var bar = state.bars[categoryIndex * dataset.series.length + seriesIndex];
        if (bar) {
          bar.setAttribute('y', y(value));
          bar.setAttribute('height', Math.max(0, state.plot.bottom - y(value)));
        }
        var item = state.handles.filter(function (handle) {
          return handle.seriesIndex === seriesIndex && handle.categoryIndex === categoryIndex;
        })[0];
        if (item) {
          svg.move(item.handle, x + barWidth / 2, y(value));
          svg.setSlider(item.handle, value, tipText(dataset, seriesIndex, categoryIndex));
        }
      });
    });
    state.labels.forEach(function (item) {
      if (!item.node || item.seriesIndex == null) return;
      var value = dataset.series[item.seriesIndex].values[item.categoryIndex];
      var center = band.center(item.categoryIndex);
      var start = center - groupWidth / 2;
      var x = start + item.seriesIndex * (barWidth + barGap);
      item.node.setAttribute('x', x + barWidth / 2);
      item.node.setAttribute('y', Math.max(state.plot.top + 12, y(value) - 8));
      item.node.textContent = NC.fmt.number(value, 0);
    });
  }

          var lab = NC.state.labs[id];
          if (lab.isMounted()) NC.motion.play(lab);
        });
      }
    }
    apply(query && query.matches);
    if (!query) return;
    if (query.addEventListener) query.addEventListener('change', function (event) { apply(event.matches); });
    else if (query.addListener) query.addListener(function (event) { apply(event.matches); });
  }

  ui.build = function () {
    setupReducedMotion();
    buildPanels();
    buildTypeSwitch();
    renderAllLearning();
    renderErrors();
    setupHeader();
    setupTypeOverflow();
    setupResize();
    setupLevel();
    setupHash();
    activate(initialTypeId());
  };

  ui.mountAll = function () {
    Object.keys(NC.state.labs).forEach(function (id) {
      if (NC.state.labs[id]) NC.state.labs[id].mount();
    });
  };
})(window.NPESLCharts);

;
(function (NC) {
  'use strict';

  function boot() {
    var node = document.getElementById('npesl-charts-data');
    if (!node) {
      console.error('Chart data is missing.');
      return;
    }
    var data = JSON.parse(node.textContent);
    NC.state.data = data;
    NC.state.datasets = NC.deepClone(data.labs.datasets);
    NC.state.initial = NC.deepClone(data.labs.datasets);
    NC.ui.build();
    document.documentElement.setAttribute('data-charts-ready', 'true');
    NC.test = {
      mountAll: NC.ui.mountAll,
      labs: NC.state.labs,
      state: NC.state,
      // One serializable view of every machine, for tests and agents.
      snapshot: function () {
        var labs = {};
        Object.keys(NC.state.labs).forEach(function (id) {
          var lab = NC.state.labs[id];
          var tip = lab.plot ? lab.plot.querySelector('.chart-tip') : null;
          labs[id] = {
            mountState: lab.mountState,
            compact: !!lab.compact,
            mode: lab.mode,
            editor: lab.plot ? lab.plot.getAttribute('data-editor') || 'closed' : null,
            activeStep: lab.processState ? lab.processState.activeStep : null,
            tableScroll: lab.tableState ? lab.tableState.shell.getAttribute('data-scroll') : null,
            tooltip: tip ? tip.getAttribute('data-visible') === 'true' : false
          };
        });
        return {
          version: NC.version,
          activeType: NC.state.activeType,
          level: NC.state.level,
          reducedMotion: NC.state.reducedMotion,
          labs: labs
        };
      }
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.NPESLCharts);

;
(function () {
  var KEY = 'npesl-theme';
  var THEMES = [
    { id: 'auto', label: 'Auto' },
    { id: 'editorial', label: 'Editorial' },
    { id: 'brutal', label: 'Brutalist' },
    { id: 'glass', label: 'Glass' },
    { id: 'mono', label: 'Mono' },
    { id: 'bright', label: 'Bright' },
    { id: 'sepia', label: 'Sepia' },
    { id: 'dark', label: 'Dark' }
  ];
  var VALID = THEMES.map(function (theme) { return theme.id; });

  function read() {
    try {
      var value = localStorage.getItem(KEY);
      if (value && VALID.indexOf(value) !== -1) return value;
    } catch (err) {
      // localStorage 不可用时跟随系统。
    }
    return 'auto';
  }

  function current() {
    var value = document.documentElement.getAttribute('data-theme');
    return value && VALID.indexOf(value) !== -1 ? value : read();
  }

  function apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try {
      localStorage.setItem(KEY, theme);
    } catch (err) {
      // 存不下也不影响当前页面。
    }
  }

  // 页面自己的内联脚本已经在首屏前设过一次，这里兜底。
  apply(current());

  function build() {
    if (document.getElementById('npesl-theme')) return;

    var root = document.createElement('div');
    root.className = 'npesl-theme';
    root.id = 'npesl-theme';

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'npesl-theme-fab';
    button.setAttribute('aria-label', 'Theme');
    button.setAttribute('aria-haspopup', 'menu');
    button.setAttribute('aria-expanded', 'false');
    button.title = 'Theme';
    button.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>' +
      '<path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor"/>' +
      '</svg>';

    var menu = document.createElement('div');
    menu.className = 'npesl-theme-menu';
    menu.setAttribute('role', 'menu');
    menu.setAttribute('aria-label', 'Theme');
    menu.dataset.open = 'false';

    THEMES.forEach(function (theme) {
      var option = document.createElement('button');
      option.type = 'button';
      option.className = 'npesl-theme-option';
      option.setAttribute('role', 'menuitemradio');
      option.setAttribute('aria-checked', 'false');
      option.dataset.theme = theme.id;

      var swatch = document.createElement('span');
      swatch.className = 'npesl-theme-swatch';
      swatch.dataset.swatch = theme.id;

      var label = document.createElement('span');
      label.textContent = theme.label;

      var check = document.createElement('span');
      check.className = 'npesl-theme-check';
      check.textContent = '✓';
      check.setAttribute('aria-hidden', 'true');

      option.appendChild(swatch);
      option.appendChild(label);
      option.appendChild(check);
      option.addEventListener('click', function () {
        apply(theme.id);
        sync();
        close();
      });
      menu.appendChild(option);
    });

    function sync() {
      var active = current();
      Array.prototype.forEach.call(
        menu.querySelectorAll('.npesl-theme-option'),
        function (option) {
          option.setAttribute('aria-checked', String(option.dataset.theme === active));
        }
      );
    }

    function open() {
      sync();
      menu.dataset.open = 'true';
      button.setAttribute('aria-expanded', 'true');
      var active = menu.querySelector('.npesl-theme-option[aria-checked="true"]');
      if (active) active.focus();
    }

    function close() {
      menu.dataset.open = 'false';
      button.setAttribute('aria-expanded', 'false');
    }

    button.addEventListener('click', function (event) {
      event.stopPropagation();
      if (menu.dataset.open === 'true') close();
      else open();
    });

    menu.addEventListener('click', function (event) {
      event.stopPropagation();
    });

    document.addEventListener('click', function () {
      if (menu.dataset.open === 'true') close();
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && menu.dataset.open === 'true') {
        close();
        button.focus();
      }
    });

    window.addEventListener('storage', function (event) {
      if (event.key === KEY) {
        document.documentElement.setAttribute('data-theme', read());
        if (menu.dataset.open === 'true') sync();
      }
    });

    root.appendChild(button);
    root.appendChild(menu);
    document.body.appendChild(root);
    sync();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();

</script>
