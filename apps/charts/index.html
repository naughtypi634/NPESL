<style>
/*
 * NPESL theme tokens and the floating theme switch.
 * Loaded after each page's own styles; the html[data-theme] selectors win
 * over the pages' :root rules, including their prefers-color-scheme media.
 */

html[data-theme="bright"],
html[data-theme="auto"],
html:not([data-theme]) {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #1d1d1f;
  --muted: #66666c;
  --rule: #e0e0e0;
  --rail: #e5e5ea;
  --surface: #f5f5f7;
  --surface-strong: #e8e8ed;
  --blue: #0066cc;
  --blue-hover: #005bb8;
  --blue-tint: #e8f2ff;
  --on-blue: #ffffff;
  --icon: #515154;
  --danger: #b8302a;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --fg: #f5f5f7;
  --muted: #98989d;
  --rule: #38383a;
  --rail: #2c2c2e;
  --surface: #1c1c1e;
  --surface-strong: #2c2c2e;
  --blue: #2997ff;
  --blue-hover: #40a9ff;
  --blue-tint: #102a43;
  --on-blue: #06131f;
  --icon: #98989d;
  --danger: #ff6b5f;
}

@media (prefers-color-scheme: dark) {
  html[data-theme="auto"],
  html:not([data-theme]) {
    color-scheme: dark;
    --bg: #000000;
    --fg: #f5f5f7;
    --muted: #98989d;
    --rule: #38383a;
    --rail: #2c2c2e;
    --surface: #1c1c1e;
    --surface-strong: #2c2c2e;
    --blue: #2997ff;
    --blue-hover: #40a9ff;
    --blue-tint: #102a43;
    --on-blue: #06131f;
    --icon: #98989d;
    --danger: #ff6b5f;
  }
}

/*
 * 额外配色。放在 auto 的媒体查询之后，亮色主题才不会被系统深色覆盖。
 * 新主题要同时加进 tools/themes.py 的 THEME_IDS 和 theme.js 的菜单。
 */

/* ================================================================
 * 视觉方向：配色、字体、圆角、边框、阴影一起换。
 * 每个主题只给一个 --font（中西文配对写在同一条栈里），标题、正文、
 * 按钮全部继承它，所以同一主题内不会出现两种字体气质。
 * ================================================================ */

/* 卡片玻璃（墨绿）：深墨绿底 + 蜜桃/薄荷/淡紫极光 + 半透明深卡；
   几何无衬线配黑体中文。色值与「短语动词精进对照」demo 的深色态对齐：
   底 #0e1418，薄荷青绿 #5cc8b6，卡片 rgba(24,34,39,.76)，线 rgba(238,243,244,.12)，
   圆角 20/14。 */
html[data-theme="glass"] {
  color-scheme: dark;
  --bg: #0e1418;
  --fg: #eef3f4;
  --muted: #a3b0b6;
  --rule: rgba(238, 243, 244, 0.12);
  --rail: rgba(24, 34, 39, 0.52);
  --surface: rgba(24, 34, 39, 0.76);
  --surface-strong: #172126;
  --blue: #5cc8b6;
  --blue-hover: #8bdccd;
  --blue-tint: rgba(92, 200, 182, 0.14);
  --on-blue: #08211c;
  --icon: #a3b0b6;
  --danger: #f08a7f;
  --peach-soft: rgba(240, 169, 132, 0.14);
  --mint-soft: rgba(127, 214, 194, 0.12);
  --lav-soft: rgba(183, 169, 227, 0.14);
  --font: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC",
    "Microsoft YaHei", system-ui, sans-serif;
  --radius-card: 20px;
  --radius-control: 14px;
  --radius-pill: 999px;
  --radius: 20px;
  --shadow-card: 0 20px 50px -30px rgba(0, 0, 0, 0.65);
  /* 页面极光层：body 和吸顶横幅共用，横幅才能和背景无缝相接。 */
  --bg-art:
    radial-gradient(920px 560px at 92% -8%, var(--peach-soft), transparent 62%),
    radial-gradient(760px 520px at -12% 16%, var(--mint-soft), transparent 58%),
    radial-gradient(760px 540px at 58% 108%, var(--lav-soft), transparent 62%);
}


.npesl-back {
  position: sticky;
  top: max(12px, env(safe-area-inset-top, 0px));
  z-index: 50;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 20px;
  padding: 8px 14px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface);
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.2;
  text-decoration: none;
  transition: background-color 0.15s ease;
}

.npesl-back svg {
  width: 14px;
  height: 14px;
  flex: none;
}

.npesl-back:hover { background: var(--surface-strong); }
.npesl-back:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

.npesl-theme {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  z-index: 9999;
  /* 跟随当前主题的字体，切到西文主题时切换器不会自己变回系统字。 */
  font-family: var(--font, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Microsoft YaHei", sans-serif);
}

.npesl-theme-fab {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: 50%;
  background: var(--surface);
  color: var(--fg);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.15s ease;
}

.npesl-theme-fab:hover { background: var(--surface-strong); }
.npesl-theme-fab:active { transform: scale(0.96); }
.npesl-theme-fab:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.npesl-theme-fab svg { width: 21px; height: 21px; display: block; }

.npesl-theme-menu {
  position: absolute;
  right: 0;
  bottom: 54px;
  display: none;
  min-width: 158px;
  padding: 6px;
  border: 1px solid var(--rule);
  border-radius: 16px;
  background: var(--bg);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}

.npesl-theme-menu[data-open="true"] { display: block; }

.npesl-theme-option {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
}

.npesl-theme-option:hover { background: var(--surface); }
.npesl-theme-option:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

.npesl-theme-swatch {
  flex: none;
  width: 16px;
  height: 16px;
  border: 1px solid var(--rule);
  border-radius: 50%;
}

.npesl-theme-swatch[data-swatch="auto"] {
  background: linear-gradient(90deg, #ffffff 50%, #000000 50%);
}
.npesl-theme-swatch[data-swatch="bright"] { background: #ffffff; }
.npesl-theme-swatch[data-swatch="dark"] { background: #000000; }
.npesl-theme-swatch[data-swatch="glass"] {
  background: linear-gradient(135deg, #f0a984 0 14%, #0e1418 14% 52%,
    #5cc8b6 52% 70%, #172126 70%);
}


.npesl-theme-check {
  margin-left: auto;
  color: var(--blue);
  font-size: 14px;
  opacity: 0;
}

.npesl-theme-option[aria-checked="true"] .npesl-theme-check { opacity: 1; }

@media print {
  .npesl-theme { display: none !important; }
}

/* 统一的圆角与卡片阴影尺度：卡片 24 / 控件 12 / 胶囊 999 */
:root {
  --radius-card: 24px;
  --radius-control: 12px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.06);
}

/*
 * 统一按钮动作：独立按钮 hover 浮起 1px + 柔和阴影。
 * 行内文字按钮（句子里的可点单词）不参与，避免整段文字跳动。
 */
.pill,
.chip,
.opt,
.primary,
.ghost,
.browseBtn,
.browserClose,
.speed-reset,
.play-all,
.marks-toggle,
.chips button,
.level,
.npesl-back,
.npesl-theme-fab,
.npesl-theme-option,
.speaker {
  transition: transform 0.16s ease, box-shadow 0.16s ease,
    background-color 0.16s ease, color 0.16s ease,
    border-color 0.16s ease !important;
}

.pill:hover,
.chip:hover,
.opt:hover,
.primary:hover,
.ghost:hover,
.browseBtn:hover,
.browserClose:hover,
.speed-reset:hover,
.play-all:hover,
.marks-toggle:hover,
.chips button:hover,
.level:hover,
.npesl-back:hover,
.npesl-theme-fab:hover,
.npesl-theme-option:hover,
.speaker:hover {
  transform: translateY(-1px);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 20px rgba(0, 0, 0, 0.08);
}

.pill:active,
.chip:active,
.opt:active,
.primary:active,
.ghost:active,
.browseBtn:active,
.browserClose:active,
.speed-reset:active,
.play-all:active,
.marks-toggle:active,
.chips button:active,
.level:active,
.npesl-back:active,
.npesl-theme-fab:active,
.npesl-theme-option:active,
.speaker:active {
  transform: translateY(0) scale(0.98);
  box-shadow: none;
}

/* ================================================================
 * 方向的形状层：同一套组件类在各应用里通用，这里按主题改形状。
 * 只动外壳（卡片、行、按钮、播放条），不改任何应用的排版逻辑。
 * ================================================================ */

/* ---- 卡片玻璃：近白底上的蜜桃/薄荷/淡紫极光，卡片半透 + 毛玻璃 + 柔和投影 ---- */
html[data-theme="glass"] body {
  background: var(--bg-art), var(--bg);
  background-attachment: fixed;
}

/* 吸顶横幅 / 工具栏用同一层极光，滚动时不会出现一条平色带。 */
html[data-theme="glass"] :is(.sp-context, .toolbar) {
  background: var(--bg-art), var(--bg);
  background-attachment: fixed;
}

html[data-theme="glass"] :is(
  .content-card, .card, .target, .row, .browserSheet, .kplayer,
  .seg, .zh-toggle, .pill, .chip, .level, .npesl-back, .play-all,
  .marks-toggle, .voice, .voice-seg, .sp-inline
) {
  backdrop-filter: blur(16px) saturate(1.08);
  -webkit-backdrop-filter: blur(16px) saturate(1.08);
}

html[data-theme="glass"] :is(.content-card, .card, .target, .row, .browserSheet, .kplayer) {
  border-color: var(--rule);
  box-shadow: var(--shadow-card);
}

html[data-theme="glass"] .row { background: var(--surface); }

/* 阅读训练的正文行贴着页面排，不做卡片；毛玻璃层也一并去掉。 */
html[data-theme="glass"] .passage .row {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* ================================================================
 * 音色切换：男女两个选项做成胶囊按钮。
 * 不用 :has()，旧版微信 WebView 也能生效；按各应用现有的容器特征识别：
 *   #voiceSeg            自然拼读
 *   .voice               音标表
 *   .voice-seg           短语搭配列表页
 *   .seg[aria-label=...] 发音现象 / 短语搭配章节 / Conversation
 * ================================================================ */

/* 独立按钮之间留出缝隙，不再靠分段控件的左边线分格 */
:is(#voiceSeg, .voice, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"]) {
  gap: 3px;
}

:is(#voiceSeg, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"]) {
  padding: 3px;
}

:is(#voiceSeg, .voice, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"]) > button[data-voice] {
  border-radius: 999px;
}

:is(#voiceSeg, .voice, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"])
  > button[data-voice] + button[data-voice] {
  border-left: 0 !important;
}

html[data-theme="glass"] :is(.npesl-theme-fab, .npesl-theme-menu) {
  backdrop-filter: blur(18px) saturate(1.1);
  -webkit-backdrop-filter: blur(18px) saturate(1.1);
}
html[data-theme="glass"] .npesl-theme-menu { background: var(--surface); }
html[data-theme="glass"] .npesl-theme-option:hover { background: var(--surface-strong); }

</style>
<style>
/* Business Charts. Colors and surfaces come from the site theme tokens
 * (apps/site/theme.css); this file only adds layout, the chart palette, and
 * the chart states (hover, drag, dimmed, active).
 */

:root {
  --s1: var(--blue);
  --s2: #e8956b;
  --s3: #9d8fe0;
  --s4: #6fb7d9;
  --s5: #9aa6ad;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body.charts {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font, "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC",
    "Microsoft YaHei", system-ui, sans-serif);
  line-height: 1.5;
}

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---- series palette --------------------------------------------------- */

.series-1 { --c: var(--s1); }
.series-2 { --c: var(--s2); }
.series-3 { --c: var(--s3); }
.series-4 { --c: var(--s4); }
.series-5 { --c: var(--s5); }

/* ---- header ------------------------------------------------------------ */

.top {
  max-width: 1080px;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top, 0px)) 16px 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.back,
.ref-open {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
}

.back svg { width: 18px; height: 18px; }

.back:hover,
.ref-open:hover { background: var(--surface-strong); }

.back:focus-visible,
.ref-open:focus-visible,
.type-tab:focus-visible,
.sentence:focus-visible,
.seg-btn:focus-visible,
.icon-btn:focus-visible,
.ref-tab:focus-visible,
.ref-close:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.brand {
  flex: 1;
  margin: 0;
  font-size: 18px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-en { font-weight: 700; }

.brand-zh {
  margin-left: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
}

/* ---- chart type tabs ------------------------------------------------------ */

.types {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
}

.types-scroll {
  max-width: 1080px;
  margin: 0 auto;
  padding: 8px 16px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}

.types-scroll::-webkit-scrollbar { display: none; }

.type-tab {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}

.type-tab:hover { color: var(--fg); }

.type-tab.is-on {
  background: var(--surface-strong);
  border-color: var(--rule);
  color: var(--fg);
}

.glyph { display: inline-flex; }

.glyph svg {
  width: 20px;
  height: 20px;
}

.type-tab.is-on .glyph { color: var(--blue); }

/* ---- layout -------------------------------------------------------------- */

.studio {
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px 16px 56px;
}

.panel {
  display: grid;
  gap: 16px;
  align-items: start;
}

.panel > * { min-width: 0; }

.card {
  padding: 20px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

@media (min-width: 900px) {
  .panel { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 20px; }
}

.figure-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.figure-title h2 {
  margin: 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 700;
}

.scene-zh {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.icon-btn {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--rule);
  border-radius: 50%;
  background: var(--surface-strong);
  color: var(--icon);
  cursor: pointer;
}

.icon-btn svg { width: 18px; height: 18px; }

.icon-btn:hover { color: var(--fg); }

.plot { margin-top: 16px; }

/* ---- charts ------------------------------------------------------------- */

.chart {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.chart-pie {
  max-width: 300px;
  margin: 0 auto;
}

.grid line {
  stroke: var(--rule);
  stroke-width: 1;
}

.tick {
  fill: var(--muted);
  font-size: 12px;
  font-family: inherit;
}

.val {
  fill: var(--fg);
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  pointer-events: none;
}

.series-line {
  stroke: var(--c);
  stroke-width: 2.5;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.point .dot,
.handle .dot {
  fill: var(--c, var(--s1));
  stroke: var(--surface-strong);
  stroke-width: 2;
}

.handle .dot { fill: var(--fg); }

.hit { touch-action: none; }

.point .hit,
.col .hit,
.handle .hit { cursor: ns-resize; }

.handle .hit { cursor: grab; }

.point,
.col,
.handle {
  outline: none;
}

.point:focus-visible .dot,
.handle:focus-visible .dot {
  stroke: var(--fg);
  stroke-width: 3;
}

.bar { fill: var(--c); }

.col .val {
  opacity: 0;
  transition: opacity 0.15s;
}

.col:hover .val,
.col:focus-visible .val {
  opacity: 1;
}

.slice {
  fill: var(--c);
  stroke: var(--surface);
  stroke-width: 2;
}

[data-mark] {
  transition: opacity 0.2s;
}

.is-dim { opacity: 0.22; }

/* ---- legend ---------------------------------------------------------------- */

.legend {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  font-size: 14px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-zh { color: var(--muted); }

.legend-value {
  color: var(--fg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.swatch {
  display: inline-block;
  flex: 0 0 auto;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  background: var(--c);
}

.swatch-line {
  width: 18px;
  height: 3px;
  border-radius: 2px;
}

/* ---- table ---------------------------------------------------------------- */

.table-wrap { overflow-x: auto; }

.data-table {
  width: 100%;
  min-width: 460px;
  border-collapse: collapse;
  font-size: 15px;
}

.data-table th,
.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule);
  text-align: right;
  vertical-align: middle;
}

.data-table th[scope="row"] { text-align: left; }

.data-table thead th {
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
}

.data-table .zh {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
}

.data-table th[scope="row"] .zh {
  font-size: 13px;
}

.data-table td input {
  width: 88px;
  padding: 6px 8px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: transparent;
  color: var(--fg);
  font: inherit;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.data-table td input:focus {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}

.total-col { font-weight: 600; font-variant-numeric: tabular-nums; }

.total-row th,
.total-row td {
  border-bottom: none;
  border-top: 1px solid var(--rule);
}

/* ---- process ---------------------------------------------------------------- */

.flow {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.step {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 16px;
  row-gap: 10px;
  padding: 14px 16px;
  border: 1px solid var(--rule);
  border-radius: 16px;
  background: var(--surface-strong);
  transition: opacity 0.2s;
}

.step-text { min-width: 0; }

.step-en {
  margin: 0;
  font-weight: 600;
  text-transform: capitalize;
}

.step-zh {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.step-time {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
}

.step-time input {
  width: 72px;
  padding: 6px 8px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: transparent;
  color: var(--fg);
  font: inherit;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.step-time input:focus {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}

.step-track {
  grid-column: 1 / -1;
  grid-row: 2;
  display: block;
  height: 6px;
  border-radius: 3px;
  background: var(--rule);
  overflow: hidden;
}

.step-fill {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: var(--s1);
}

/* ---- description ----------------------------------------------------------- */

.notes-head {
  display: flex;
  justify-content: flex-end;
}

.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border-radius: var(--radius-pill);
  background: var(--surface-strong);
}

.seg-btn {
  min-height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}

.seg-btn:hover { color: var(--fg); }

.seg-btn[aria-pressed="true"] {
  background: var(--blue);
  color: var(--on-blue);
}

.sentences {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}

.sentence {
  display: grid;
  gap: 4px;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--fg);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.sentence:hover { background: var(--surface-strong); }

.sentence.is-active {
  background: var(--blue-tint);
  border-color: var(--blue);
}

.sentence .en {
  font-size: 16px;
  line-height: 1.5;
}

.sentence .zh {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

.note {
  margin: 14px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

/* ---- reference dialog ----------------------------------------------------- */

.ref {
  width: min(680px, calc(100vw - 24px));
  max-height: 82vh;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  background: var(--surface-strong);
  color: var(--fg);
  box-shadow: var(--shadow-card);
}

.ref::backdrop { background: rgba(0, 0, 0, 0.45); }

.ref-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface-strong);
}

.ref-tabs {
  display: flex;
  gap: 4px;
}

.ref-tab {
  min-height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
}

.ref-tab[aria-selected="true"] {
  background: var(--blue-tint);
  color: var(--fg);
}

.ref-close {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--icon);
  font: inherit;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

.ref-body {
  max-height: calc(82vh - 64px);
  padding: 18px 20px 24px;
  overflow: auto;
}

.ref-body h3 {
  margin: 22px 0 10px;
  font-size: 15px;
  color: var(--muted);
}

.ref-body h3 span {
  font-weight: 400;
}

.ref-body .en {
  margin: 0;
  font-size: 16px;
}

.ref-body .zh {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.ref-body .example {
  margin: 6px 0 0;
  font-size: 15px;
}

.patterns {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 12px;
}

.patterns li,
.vocab,
.error {
  padding: 12px 14px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
}

.tag {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 8px;
  border-radius: var(--radius-pill);
  background: var(--blue-tint);
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  vertical-align: 2px;
}

.vocab-group + .vocab-group { margin-top: 4px; }

.vocab + .vocab { margin-top: 8px; }

.error + .error { margin-top: 8px; }

.error .wrong,
.error .right {
  margin: 0;
  font-size: 15px;
}

.error .wrong { color: var(--danger); }

.error .right { color: var(--fg); }

.error .mark {
  display: inline-block;
  width: 1.4em;
  font-weight: 700;
}

.error .right .mark { color: var(--blue); }

.error .zh {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
}

@media (max-width: 520px) {
  .brand-zh { display: none; }
  .card { padding: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
  }
}

},"advanced":{"en":"The process runs from {first} to {last}, in {count} steps.","zh":"整个流程从{first}起，到{last}止，共 {count} 个环节。"}},"longest":{"basic":{"en":"The longest step is {label}, at about {minutes} minutes.","zh":"耗时最长的是{label}，约 {minutes} 分钟。"},"advanced":{"en":"{label} is the slowest stage, taking about {minutes} minutes.","zh":"最耗时的环节是{label}，约 {minutes} 分钟。"}},"total":{"basic":{"en":"The whole process takes about {total} minutes.","zh":"整个流程大约需要 {total} 分钟。"},"advanced":{"en":"From order to delivery, the process takes about {total} minutes.","zh":"从下单到收货，全程约 {total} 分钟。"}},"bars":{"basic":{"en":"Revenue {verb} from {first} to {last} {unit}.","zh":"营收{verb}，从 {first} 增至 {last} {unit}。"},"advanced":{"en":"Over six months, revenue {verb} from {first} to {last} {unit}.","zh":"半年内营收{verb}，从 {first} 增至 {last} {unit}。"}},"margin":{"basic":{"en":"The margin {verb} from {first}% to {last}%.","zh":"毛利率{verb}，从 {first}% 到 {last}%。"},"advanced":{"en":"Over six months, the margin {verb} from {first}% to {last}%.","zh":"半年内毛利率{verb}，从 {first}% 变为 {last}%。"}},"peakMargin":{"basic":{"en":"The margin was highest in {period}, at {value}%.","zh":"毛利率在{period}最高，为 {value}%。"},"advanced":{"en":"The margin peaked in {period} at {value}%, the best rate of the half-year.","zh":"毛利率在{period}达到半年内最高，为 {value}%。"}},"mismatch":{"basic":{"en":"Revenue was highest in {periodRevenue}, but the margin was highest in {periodMargin}.","zh":"营收在{periodRevenue}最高，但毛利率在{periodMargin}最高。"},"advanced":{"en":"Revenue peaked in {periodRevenue}, while the margin peaked in {periodMargin}.","zh":"营收峰值出现在{periodRevenue}，毛利率峰值则在{periodMargin}。"}}}},"vocabulary":{"version":3,"groups":[{"id":"change","title_zh":"趋势与变化"},{"id":"peak","title_zh":"高点与低点"},{"id":"approx","title_zh":"约数与程度"},{"id":"compare","title_zh":"比较"},{"id":"share","title_zh":"占比"},{"id":"flow","title_zh":"先后顺序"}],"entries":[{"id":"go-up","group":"change","level":"basic","en":"go up","zh":"上升","example_en":"Orders went up in both the first <script>
/* Core helpers: namespace, DOM and SVG builders, number formatting, scales. */
(function (global) {
  'use strict';

  var NC = global.NPESLCharts = {};
  NC.renderers = {};
  var SVG_NS = 'http://www.w3.org/2000/svg';

  NC.clamp = function (value, min, max) {
    return Math.min(max, Math.max(min, value));
  };

  NC.decimalsOf = function (step) {
    return (String(step).split('.')[1] || '').length;
  };

  // Snap to the dataset's step grid, then clamp into its range.
  NC.snap = function (value, step, min, max) {
    var stepped = Math.round(value / step) * step;
    return Number(NC.clamp(stepped, min, max).toFixed(NC.decimalsOf(step)));
  };

  // 1234.5 -> "1,234.5" (American grouping; the same in both languages).
  NC.fmt = function (value, decimals) {
    var fixed = Number(value).toFixed(decimals || 0);
    var parts = fixed.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  };

  NC.escape = function (text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };

  NC.clone = function (value) {
    return JSON.parse(JSON.stringify(value));
  };

  // Nice axis ticks: about `count` steps of 1, 2 or 5 times a power of ten.
  NC.ticks = function (min, max, count) {
    var span = max - min;
    if (!(span > 0)) return [min];
    var raw = span / (count || 4);
    var power = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var step = power;
    var rel = raw / power;
    if (rel >= 5) step = power * 5;
    else if (rel >= 2) step = power * 2;
    var out = [];
    for (var v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) {
      out.push(Number(v.toFixed(10)));
    }
    return out;
  };

  NC.linear = function (domain, range) {
    var d0 = domain[0];
    var d1 = domain[1];
    var r0 = range[0];
    var r1 = range[1];
    var span = d1 - d0 || 1;
    var scale = function (v) { return r0 + (v - d0) / span * (r1 - r0); };
    scale.invert = function (p) { return d0 + (p - r0) / (r1 - r0 || 1) * span; };
    return scale;
  };

  // ---- DOM ---------------------------------------------------------------

  NC.el = function (tag, attrs, html) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (attrs[key] == null || attrs[key] === false) return;
      node.setAttribute(key, attrs[key] === true ? '' : String(attrs[key]));
    });
    if (html != null) node.innerHTML = html;
    return node;
  };

  NC.svg = function (tag, attrs, parent) {
    var node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (attrs[key] == null) return;
      node.setAttribute(key, String(attrs[key]));
    });
    if (parent) parent.appendChild(node);
    return node;
  };

  NC.svgText = function (parent, attrs, text) {
    var node = NC.svg('text', attrs, parent);
    node.textContent = text == null ? '' : String(text);
    return node;
  };

  // Pointer position in the SVG's own coordinate system, so drags stay
  // correct however the chart is scaled on screen.
  NC.svgPoint = function (svg, event) {
    var point = svg.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;
    return point.matrixTransform(svg.getScreenCTM().inverse());
  };

  // Pointer drag with capture. `move` gets the SVG-space point; the drag ends
  // on pointerup or cancel. Returns nothing; attach to the grabbed node.
  NC.drag = function (node, svg, move, onEnd) {
    node.addEventListener('pointerdown', function (event) {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      try { node.setPointerCapture(event.pointerId); } catch (err) {}
      move(NC.svgPoint(svg, event), true);
      var stop = function () {
        node.removeEventListener('pointermove', onMove);
        node.removeEventListener('pointerup', stop);
        node.removeEventListener('pointercancel', stop);
        if (onEnd) onEnd();
      };
      var onMove = function (ev) { move(NC.svgPoint(svg, ev), false); };
      node.addEventListener('pointermove', onMove);
      node.addEventListener('pointerup', stop);
      node.addEventListener('pointercancel', stop);
    });
  };

  // Keyboard nudge shared by every draggable mark: arrows move one step,
  // Shift moves ten. `nudge(delta)` does the actual change.
  NC.nudgeKeys = function (node, nudge) {
    node.addEventListener('keydown', function (event) {
      var up = event.key === 'ArrowUp' || event.key === 'ArrowRight';
      var down = event.key === 'ArrowDown' || event.key === 'ArrowLeft';
      if (!up && !down) return;
      event.preventDefault();
      nudge((up ? 1 : -1) * (event.shiftKey ? 10 : 1));
    });
  };

  // Persist a small preference; storage can be blocked, so never throw.
  NC.store = {
    get: function (key, fallback) {
      try {
        var value = global.localStorage.getItem(key);
        return value == null ? fallback : value;
      } catch (err) {
        return fallback;
      }
    },
    set: function (key, value) {
      try { global.localStorage.setItem(key, value); } catch (err) {}
    }
  };
})(window);

/* Sentence engine: turns the current data into English and Chinese
 * descriptions. Phrasing lives in content/charts/describe.json; this file only
 * works out the numbers, the winners, and which marks each sentence points at.
 *
 * Every sentence returns { en, zh, marks }. `marks` are the keys the renderers
 * stamp on their elements (data-mark): p:i (line point), b:c:s (bar or table
 * cell), s:i (pie slice), st:i (process step), bar:i / ln:i (combo).
 */
(function (NC) {
  'use strict';

  function pair(en, zh) {
    return { en: en, zh: zh };
  }

  function unitOf(source) {
    return pair(source.unit_en, source.unit_zh);
  }

  function nameOf(item) {
    return pair(item.name_en, item.name_zh);
  }

  function labelOf(item) {
    return pair(item.label_en, item.label_zh);
  }

  function argmax(values) {
    var best = 0;
    values.forEach(function (value, index) {
      if (value > values[best]) best = index;
    });
    return best;
  }

  function argmin(values) {
    var best = 0;
    values.forEach(function (value, index) {
      if (value < values[best]) best = index;
    });
    return best;
  }

  function sum(values) {
    return values.reduce(function (total, value) { return total + value; }, 0);
  }

  function mean(values) {
    return values.length ? sum(values) / values.length : 0;
  }

  // Overall movement between the first and last value, as a verb key.
  function trendKey(first, last) {
    var pct = (last - first) / Math.abs(first || 1);
    if (Math.abs(pct) < 0.05) return 'flat';
    if (pct >= 0.5) return 'surge';
    if (pct > 0) return 'up';
    if (pct <= -0.5) return 'drop';
    return 'down';
  }

  function verb(key, level) {
    var entry = NC.content.describe.verbs[key];
    return pair(entry[level], entry.zh);
  }

  function seriesIndexMarks(categories, series, check) {
    var out = [];
    categories.forEach(function (_, c) {
      series.forEach(function (_s, s) {
        if (check(c, s)) out.push('b:' + c + ':' + s);
      });
    });
    return out;
  }

  // ---- one builder per sentence id ---------------------------------------
  // Each returns { slots, marks } or null when the data cannot support it.

  var BUILDERS = {
    trend: function (d, level) {
      var v = d.values;
      var last = v.length - 1;
      return {
        slots: {
          verb: verb(trendKey(v[0], v[last]), level),
          first: NC.fmt(v[0], d.decimals),
          last: NC.fmt(v[last], d.decimals),
          unit: unitOf(d)
        },
        marks: []
      };
    },

    peak: function (d) {
      var i = argmax(d.values);
      return {
        slots: { period: labelOf(d.periods[i]), value: NC.fmt(d.values[i], d.decimals), unit: unitOf(d) },
        marks: ['p:' + i]
      };
    },

    change: function (d, level) {
      var v = d.values;
      if (v.length < 2) return null;
      var best = 1;
      for (var i = 2; i < v.length; i += 1) {
        if (Math.abs(v[i] - v[i - 1]) > Math.abs(v[best] - v[best - 1])) best = i;
      }
      var rose = v[best] >= v[best - 1];
      return {
        slots: {
          period: labelOf(d.periods[best]),
          verb: verb(rose ? 'rise' : 'fall', level),
          from: NC.fmt(v[best - 1], d.decimals),
          to: NC.fmt(v[best], d.decimals),
          unit: unitOf(d)
        },
        marks: ['p:' + (best - 1), 'p:' + best]
      };
    },

    pace: function (d) {
      var v = d.values;
      var half = Math.floor(v.length / 2);
      if (half < 1) return null;
      var marks = [];
      for (var i = half; i < v.length; i += 1) marks.push('p:' + i);
      return {
        slots: {
          avgSecond: NC.fmt(mean(v.slice(half)), 1),
          avgFirst: NC.fmt(mean(v.slice(0, half)), 1),
          unit: unitOf(d)
        },
        marks: marks
      };
    },

    top: function (d) {
      var totals = d.categories.map(function (_, c) {
        return sum(d.series.map(function (s) { return s.values[c]; }));
      });
      var c = argmax(totals);
      return {
        slots: { category: labelOf(d.categories[c]), value: NC.fmt(totals[c]), unit: unitOf(d) },
        marks: seriesIndexMarks(d.categories, d.series, function (cat) { return cat === c; })
      };
    },

    low: function (d) {
      var totals = d.categories.map(function (_, c) {
        return sum(d.series.map(function (s) { return s.values[c]; }));
      });
      var c = argmin(totals);

    var studio = document.getElementById('studio');
    state.types.forEach(function (type) { buildPanel(type, studio); });
    syncLevels();
    bindReference();

    studio.addEventListener('click', function (event) {
      var button = event.target.closest ? event.target.closest('[data-level]') : null;
      if (button) setLevel(button.getAttribute('data-level'));

    var hash = String(window.location.hash || '').replace(/^#/, '');
    var first = typeById(hash) ? hash : state.types[0].id;
    activate(first, false);
    document.documentElement.setAttribute('data-charts-ready', 'true');

  NC.app = { state: state, activate: activate, setLevel: setLevel, reset: reset };

;
(function () {
  var KEY = 'npesl-theme';
  var THEMES = [
    { id: 'auto', label: 'Auto' },
    { id: 'bright', label: 'Bright' },
    { id: 'glass', label: 'Glass' },
    { id: 'dark', label: 'Dark' }
  ];
  var VALID = THEMES.map(function (theme) { return theme.id; });

  function read() {
    try {
      var value = localStorage.getItem(KEY);
      if (value && VALID.indexOf(value) !== -1) return value;
    } catch (err) {
      // localStorage 不可用时跟随系统。
    }
    return 'auto';
  }

  function current() {
    var value = document.documentElement.getAttribute('data-theme');
    return value && VALID.indexOf(value) !== -1 ? value : read();
  }

  function apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try {
      localStorage.setItem(KEY, theme);
    } catch (err) {
      // 存不下也不影响当前页面。
    }
  }

  // 页面自己的内联脚本已经在首屏前设过一次，这里兜底。
  apply(current());

  function build() {
    if (document.getElementById('npesl-theme')) return;

    var root = document.createElement('div');
    root.className = 'npesl-theme';
    root.id = 'npesl-theme';

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'npesl-theme-fab';
    button.setAttribute('aria-label', 'Theme');
    button.setAttribute('aria-haspopup', 'menu');
    button.setAttribute('aria-expanded', 'false');
    button.title = 'Theme';
    button.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>' +
      '<path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor"/>' +
      '</svg>';

    var menu = document.createElement('div');
    menu.className = 'npesl-theme-menu';
    menu.setAttribute('role', 'menu');
    menu.setAttribute('aria-label', 'Theme');
    menu.dataset.open = 'false';

    THEMES.forEach(function (theme) {
      var option = document.createElement('button');
      option.type = 'button';
      option.className = 'npesl-theme-option';
      option.setAttribute('role', 'menuitemradio');
      option.setAttribute('aria-checked', 'false');
      option.dataset.theme = theme.id;

      var swatch = document.createElement('span');
      swatch.className = 'npesl-theme-swatch';
      swatch.dataset.swatch = theme.id;

      var label = document.createElement('span');
      label.textContent = theme.label;

      var check = document.createElement('span');
      check.className = 'npesl-theme-check';
      check.textContent = '✓';
      check.setAttribute('aria-hidden', 'true');

      option.appendChild(swatch);
      option.appendChild(label);
      option.appendChild(check);
      option.addEventListener('click', function () {
        apply(theme.id);
        sync();
        close();
      });
      menu.appendChild(option);
    });

    function sync() {
      var active = current();
      Array.prototype.forEach.call(
        menu.querySelectorAll('.npesl-theme-option'),
        function (option) {
          option.setAttribute('aria-checked', String(option.dataset.theme === active));
        }
      );
    }

    function open() {
      sync();
      menu.dataset.open = 'true';
      button.setAttribute('aria-expanded', 'true');
      var active = menu.querySelector('.npesl-theme-option[aria-checked="true"]');
      if (active) active.focus();
    }

    function close() {
      menu.dataset.open = 'false';
      button.setAttribute('aria-expanded', 'false');
    }

    button.addEventListener('click', function (event) {
      event.stopPropagation();
      if (menu.dataset.open === 'true') close();
      else open();
    });

    menu.addEventListener('click', function (event) {
      event.stopPropagation();
    });

    document.addEventListener('click', function () {
      if (menu.dataset.open === 'true') close();
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && menu.dataset.open === 'true') {
        close();
        button.focus();
      }
    });

    window.addEventListener('storage', function (event) {
      if (event.key === KEY) {
        document.documentElement.setAttribute('data-theme', read());
        if (menu.dataset.open === 'true') sync();
      }
    });

    root.appendChild(button);
    root.appendChild(menu);
    document.body.appendChild(root);
    sync();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();

</script>
