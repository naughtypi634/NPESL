@media (prefers-color-scheme: dark) {

  html:not([data-theme]) {

/*
 * 额外配色。放在 auto 的媒体查询之后，亮色主题才不会被系统深色覆盖。
 * 新主题要同时加进 tools/themes.py 的 THEME_IDS 和 theme.js 的菜单。
 */

/* 极简：纯灰阶、细线小圆角、不要卡片阴影，强调色就是墨色。 */
html[data-theme="mono"] {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #0e0e10;
  --muted: #67676c;
  --rule: #dbdbdf;
  --rail: #f0f0f2;
  --surface: #f7f7f8;
  --surface-strong: #ececee;
  --blue: #111114;
  --blue-hover: #2b2b30;
  --blue-tint: #efeff1;
  --on-blue: #ffffff;
  --icon: #4b4b52;
  --danger: #b02a1a;
  --radius-card: 12px;
  --radius-control: 8px;
  --radius: 12px;
  --shadow-card: none;
}

/* ================================================================
 * 三个完整视觉方向：配色、字体、圆角、边框、阴影一起换。
 * 每个主题只给一个 --font（中西文配对写在同一条栈里），标题、正文、
 * 按钮全部继承它，所以同一主题内不会出现两种字体气质。
 * ================================================================ */

/* 编辑网格：纸张 + 墨 + 瑞士红；衬线中文西文成对，直角、细线、不要卡片。 */
html[data-theme="editorial"] {
  color-scheme: light;
  --bg: #f6f5f1;
  --fg: #151412;
  --muted: #615e57;
  --rule: #d7d3c9;
  --rail: #e7e3d8;
  --surface: #efede6;
  --surface-strong: #e4e0d5;
  --blue: #b02a1a;
  --blue-hover: #c83422;
  --blue-tint: #f1e3dc;
  --on-blue: #ffffff;
  --icon: #4a4740;
  --danger: #b02a1a;
  --font: "Source Serif 4", "Noto Serif SC", Georgia, "Songti SC", serif;
  --radius-card: 0px;
  --radius-control: 0px;
  --radius-pill: 0px;
  --radius: 0px;
  --shadow-card: none;
}

/* 新粗野：奶油底 + 墨边 + 硬阴影；特粗无衬线配黑体中文。 */
html[data-theme="brutal"] {
  color-scheme: light;
  --bg: #f2ecdf;
  --fg: #141008;
  --muted: #6b6458;
  --rule: #141008;
  --rail: #e6dfcd;
  --surface: #fffdf6;
  --surface-strong: #f7f1e2;
  --blue: #b8381a;
  --blue-hover: #c9441f;
  --blue-tint: #fff0b8;
  --on-blue: #ffffff;
  --icon: #3b352b;
  --danger: #9c2416;
  --font: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC",
    "Microsoft YaHei", system-ui, sans-serif;
  --radius-card: 14px;
  --radius-control: 12px;
  --radius: 14px;
  --shadow-card: 5px 5px 0 var(--fg);
}

/* 卡片玻璃（墨绿）：深墨绿底 + 蜜桃/薄荷/淡紫极光 + 半透明深卡；
   几何无衬线配黑体中文。色值与「短语动词精进对照」demo 的深色态对齐：
   底 #0e1418，薄荷青绿 #5cc8b6，卡片 rgba(24,34,39,.76)，线 rgba(238,243,244,.12)，
   圆角 20/14。 */
html[data-theme="glass"] {
  color-scheme: dark;
  --bg: #0e1418;
  --fg: #eef3f4;
  --muted: #a3b0b6;
  --rule: rgba(238, 243, 244, 0.12);
  --rail: rgba(24, 34, 39, 0.52);
  --surface: rgba(24, 34, 39, 0.76);
  --surface-strong: #172126;
  --blue: #5cc8b6;
  --blue-hover: #8bdccd;
  --blue-tint: rgba(92, 200, 182, 0.14);
  --on-blue: #08211c;
  --icon: #a3b0b6;
  --danger: #f08a7f;
  --peach-soft: rgba(240, 169, 132, 0.14);
  --mint-soft: rgba(127, 214, 194, 0.12);
  --lav-soft: rgba(183, 169, 227, 0.14);
  --font: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC",
    "Microsoft YaHei", system-ui, sans-serif;
  --radius-card: 20px;
  --radius-control: 14px;
  --radius-pill: 999px;
  --radius: 20px;
  --shadow-card: 0 20px 50px -30px rgba(0, 0, 0, 0.65);
  /* 页面极光层：body 和吸顶横幅共用，横幅才能和背景无缝相接。 */
  --bg-art:
    radial-gradient(920px 560px at 92% -8%, var(--peach-soft), transparent 62%),
    radial-gradient(760px 520px at -12% 16%, var(--mint-soft), transparent 58%),
    radial-gradient(760px 540px at 58% 108%, var(--lav-soft), transparent 62%);
}


.npesl-back {
  position: sticky;
  top: max(12px, env(safe-area-inset-top, 0px));
  z-index: 50;
  display: inline-flex;
  align-items: center;

}

.npesl-back svg {

  height: 14px;
  flex: none;
}

.npesl-back:hover { background: var(--surface-strong); }
.npesl-back:focus-visible {
  outline: 2px solid var(--blue);

}

.npesl-theme {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, env(safe-area-inset-bottom, 0px));

    "PingFang SC", "Microsoft YaHei", sans-serif);
}

.npesl-theme-fab {

.npesl-theme-fab:hover { background: var(--surface-strong); }

.npesl-theme-fab:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.npesl-theme-fab svg { width: 21px; height: 21px; display: block; }

.npesl-theme-menu {

.npesl-theme-option {
  display: flex;
  align-items: center;

  padding: 10px 12px;
  border: 0;

}

.npesl-theme-option:hover { background: var(--surface); }
.npesl-theme-option:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

.npesl-theme-swatch {
  flex: none;
  width: 16px;
  height: 16px;
  border: 1px solid var(--rule);
  border-radius: 50%;
}

.npesl-theme-swatch[data-swatch="auto"] {
  background: linear-gradient(90deg, #ffffff 50%, #000000 50%);
}
.npesl-theme-swatch[data-swatch="bright"] { background: #ffffff; }
.npesl-theme-swatch[data-swatch="dark"] { background: #000000; }
.npesl-theme-swatch[data-swatch="sepia"] { background: #f6efe0; }
.npesl-theme-swatch[data-swatch="editorial"] { background: #f6f5f1; }
.npesl-theme-swatch[data-swatch="brutal"] {
  background: linear-gradient(135deg, #f2ecdf 0 46%, #ffe45e 46% 68%, #141008 68% 100%);
}
.npesl-theme-swatch[data-swatch="glass"] {
  background: linear-gradient(135deg, #f0a984 0 14%, #0e1418 14% 52%,
    #5cc8b6 52% 70%, #172126 70%);
}
.npesl-theme-swatch[data-swatch="mono"] {
  background: linear-gradient(135deg, #ffffff 49%, #111114 51%);
}


.npesl-theme-check {
  margin-left: auto;
  color: var(--blue);
  font-size: 14px;
  opacity: 0;
}

.npesl-theme-option[aria-checked="true"] .npesl-theme-check { opacity: 1; }

@media print {
  .npesl-theme { display: none !important; }
}

/* 统一的圆角与卡片阴影尺度：卡片 24 / 控件 12 / 胶囊 999 */
:root {
  --radius-card: 24px;
  --radius-control: 12px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.06);
}

/*
 * 统一按钮动作：独立按钮 hover 浮起 1px + 柔和阴影。
 * 行内文字按钮（句子里的可点单词）不参与，避免整段文字跳动。
 */
.pill,
.chip,
.opt,
.primary,
.ghost,
.browseBtn,
.browserClose,
.speed-reset,
.play-all,
.marks-toggle,
.chips button,
.level,
.npesl-back,
.npesl-theme-fab,
.npesl-theme-option,
.speaker {
  transition: transform 0.16s ease, box-shadow 0.16s ease,
    background-color 0.16s ease, color 0.16s ease,
    border-color 0.16s ease !important;
}

.pill:hover,
.chip:hover,
.opt:hover,
.primary:hover,
.ghost:hover,
.browseBtn:hover,
.browserClose:hover,
.speed-reset:hover,
.play-all:hover,
.marks-toggle:hover,
.chips button:hover,
.level:hover,
.npesl-back:hover,
.npesl-theme-fab:hover,
.npesl-theme-option:hover,
.speaker:hover {
  transform: translateY(-1px);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 20px rgba(0, 0, 0, 0.08);
}

.pill:active,
.chip:active,
.opt:active,
.primary:active,
.ghost:active,
.browseBtn:active,
.browserClose:active,
.speed-reset:active,
.play-all:active,
.marks-toggle:active,
.chips button:active,
.level:active,
.npesl-back:active,
.npesl-theme-fab:active,
.npesl-theme-option:active,
.speaker:active {
  transform: translateY(0) scale(0.98);
  box-shadow: none;
}

/* ================================================================
 * 方向的形状层：同一套组件类在各应用里通用，这里按主题改形状。
 * 只动外壳（卡片、行、按钮、播放条），不改任何应用的排版逻辑。
 * ================================================================ */

/* ---- 编辑网格：去掉卡片底色，用横线分块；控件一律直角 ---- */
html[data-theme="editorial"] :is(
  .pill, .chip, .opt, .primary, .ghost, .play-all, .marks-toggle,
  .speed-reset, .zh-toggle, .seg, .seg button, .voice, .voice button,
  .chips button, .level, .npesl-back, .browseBtn, .browserClose, .catBtn,
  .badge, .hint, .npesl-theme-option,
  .sp-inline, .sp-tip
) { border-radius: 0 !important; }

html[data-theme="editorial"] .content-card {
  background: transparent;
  border-radius: 0;
  box-shadow: none;
  padding-left: 0;
  padding-right: 0;
  border-top: 1px solid var(--fg);
  border-bottom: 1px solid var(--rule);
}

html[data-theme="editorial"] :is(.row, .card, .target) {
  background: transparent;
  border-radius: 0;
  box-shadow: none;
}

/* 浮层必须压在页面上，不能跟卡片一样透底：编辑网格用纸色实底 + 细墨线。 */
html[data-theme="editorial"] .browserSheet {
  background: var(--bg);
  border-radius: 0;
  box-shadow: none;
  border: 1px solid var(--fg);
}

html[data-theme="editorial"] .row {
  border-width: 0 0 1px;
  padding-left: 0;
  padding-right: 0;
}

/* ---- 新粗野：2px 墨边 + 硬阴影，卡片不再靠底色分层 ---- */
html[data-theme="brutal"] :is(
  .content-card, .card, .target, .row, .browserSheet, .kplayer
) {
  border: 2px solid var(--fg);
  box-shadow: 5px 5px 0 var(--fg);
}

html[data-theme="brutal"] :is(.row, .content-card, .card, .target, .browserSheet) {
  background: var(--surface);
}

/* 阅读训练的正文行贴着页面排，不做卡片；只留点读的高亮。 */
html[data-theme="brutal"] .passage .row {
  background: transparent;
  border: 0;
  box-shadow: none;
}

html[data-theme="brutal"] :is(
  .pill, .chip, .opt, .primary, .ghost, .play-all, .marks-toggle,
  .speed-reset, .zh-toggle, .seg, .level, .npesl-back, .browseBtn,
  .browserClose, .catBtn, .voice, .voice-seg, .sp-inline
) {
  border: 2px solid var(--fg);
  border-radius: 10px;
  box-shadow: 3px 3px 0 var(--fg);
}

html[data-theme="brutal"] .zh-toggle,
html[data-theme="brutal"] .pill,
html[data-theme="brutal"] .chip,
html[data-theme="brutal"] .sp-inline { border-radius: 999px; }

/* ---- 卡片玻璃：近白底上的蜜桃/薄荷/淡紫极光，卡片半透 + 毛玻璃 + 柔和投影 ---- */
html[data-theme="glass"] body {
  background: var(--bg-art), var(--bg);
  background-attachment: fixed;
}

/* 吸顶横幅 / 工具栏用同一层极光，滚动时不会出现一条平色带。 */
html[data-theme="glass"] :is(.sp-context, .toolbar) {
  background: var(--bg-art), var(--bg);
  background-attachment: fixed;
}

html[data-theme="glass"] :is(
  .content-card, .card, .target, .row, .browserSheet, .kplayer,
  .seg, .zh-toggle, .pill, .chip, .level, .npesl-back, .play-all,
  .marks-toggle, .voice, .voice-seg, .sp-inline
) {
  backdrop-filter: blur(16px) saturate(1.08);
  -webkit-backdrop-filter: blur(16px) saturate(1.08);
}

html[data-theme="glass"] :is(.content-card, .card, .target, .row, .browserSheet, .kplayer) {
  border-color: var(--rule);
  box-shadow: var(--shadow-card);
}

html[data-theme="glass"] .row { background: var(--surface); }

/* 阅读训练的正文行贴着页面排，不做卡片；毛玻璃层也一并去掉。 */
html[data-theme="glass"] .passage .row {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* ================================================================
 * 音色切换：男女两个选项做成按钮，形状跟着主题走。
 * editorial 直角、brutal 圆角矩形、其余主题胶囊。
 * 不用 :has()，旧版微信 WebView 也能生效；按各应用现有的容器特征识别：
 *   #voiceSeg            自然拼读
 *   .voice               音标表
 *   .voice-seg           短语搭配列表页
 *   .seg[aria-label=...] 发音现象 / 短语搭配章节 / Conversation
 * ================================================================ */

/* 独立按钮之间留出缝隙，不再靠分段控件的左边线分格 */
:is(#voiceSeg, .voice, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"]) {
  gap: 3px;
}

:is(#voiceSeg, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"]) {
  padding: 3px;
}

:is(#voiceSeg, .voice, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"]) > button[data-voice] {
  border-radius: 999px;
}

:is(#voiceSeg, .voice, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"])
  > button[data-voice] + button[data-voice] {
  border-left: 0 !important;
}

/* 编辑网格：直角 */
html[data-theme="editorial"] :is(#voiceSeg, .voice, .voice-seg,
  .seg[aria-label="音色"], .seg[aria-label="朗读音色"], .seg[aria-label="读音"]),
html[data-theme="editorial"] :is(#voiceSeg, .voice, .voice-seg,
  .seg[aria-label="音色"], .seg[aria-label="朗读音色"], .seg[aria-label="读音"])
  > button[data-voice] {

}

/* 新粗野：圆角矩形，和它的卡片、控件同一档 10px */
html[data-theme="brutal"] :is(#voiceSeg, .voice, .voice-seg,
  .seg[aria-label="音色"], .seg[aria-label="朗读音色"], .seg[aria-label="读音"]),
html[data-theme="brutal"] :is(#voiceSeg, .voice, .voice-seg,
  .seg[aria-label="音色"], .seg[aria-label="朗读音色"], .seg[aria-label="读音"])
  > button[data-voice] {
  border-radius: 10px !important;
}

/* 主题切换器也跟着方向的形状走，不然一开菜单就露馅 */
html[data-theme="editorial"] :is(.npesl-theme-fab, .npesl-theme-menu) {
  border-radius: 0 !important;
}
html[data-theme="brutal"] :is(.npesl-theme-fab, .npesl-theme-menu) {
  border: 2px solid var(--fg);
  box-shadow: 5px 5px 0 var(--fg);
}
html[data-theme="glass"] :is(.npesl-theme-fab, .npesl-theme-menu) {
  backdrop-filter: blur(18px) saturate(1.1);
  -webkit-backdrop-filter: blur(18px) saturate(1.1);
}
html[data-theme="glass"] .npesl-theme-menu { background: var(--surface); }
html[data-theme="glass"] .npesl-theme-option:hover { background: var(--surface-strong); }

。"},{"id":"rebound","group":"up","en":"rebound","zh":"反弹","level":"B2","register":"neutral","pattern":"rebound + from … to …","example_en":"Bookings rebounded from 5,000 to 7,200 in the next quarter.","example_zh":"预订量在下一季度从 5,000 反弹到 7,200。","note_zh":"先跌后涨时用，强调恢复。"},{"id":"fall","group":"down","en":"fall","zh":"下降","level":"A2","register":"neutral","pattern":"fall + by / to","example_en":"Average delivery time fell by six minutes after the route update.","example_zh":"路线更新后，平均配送时间下降了六分钟。","note_zh":"中性词；by 接变化量，to 接终点。"},{"id":"decrease","group":"down","en":"decrease","zh":"减少","level":"A2","register":"neutral","pattern":"decrease + by / to","example_en":"Customer complaints decreased slightly in the second half.","example_zh":"下半年客户投诉略有减少。","note_zh":"正式、中性；和 increase 相对。"},{"id":"decline","group":"down","en":"decline","zh":"下滑","level":"B1","register":"formal","pattern":"decline + by / to","example_en":"Revenue declined year on year in the northeast market.","example_zh":"东北市场的收入同比下滑。","note_zh":"比 fall 正式，适合报告和新闻。"},{"id":"drop","group":"down","en":"drop","zh":"下跌","level":"B1","register":"neutral","pattern":"drop + by / to","example_en":"Orders dropped in the week after the discount ended.","example_zh":"折扣结束后的那一周，订单下跌。","note_zh":"口语和书面都常用，语气比 decline 直接。"},{"id":"go-down","group":"down","en":"go down","zh":"下降","level":"A2","register":"spoken","pattern":"go down + by / to","example_en":"Sales went down after the holiday promotion ended.","example_zh":"节日促销结束后，销售额下降了。","note_zh":"口语常用；正式写作可换成 fall 或 decline。"},{"id":"dip","group":"down","en":"dip","zh":"小幅下降","level":"B1","register":"neutral","pattern":"dip + to","example_en":"Margins dipped to 11% in the first quarter.","example_zh":"第一季度利润率小幅下降到 11%。","note_zh":"通常指短暂、小幅的下降。"},{"id":"edge-down","group":"down","en":"edge down","zh":"微降","level":"B2","register":"neutral","pattern":"edge down + to","example_en":"The cancellation rate edged down to 2.1% in September.","example_zh":"九月取消率微降到 2.1%。","note_zh":"幅度很小，和 edge up 相对。"},{"id":"slip","group":"down","en":"slip","zh":"下滑","level":"B2","register":"neutral","pattern":"slip + to / below","example_en":"Market share slipped to 18% after the rival's price cut.","example_zh":"竞争对手降价后，市场份额下滑到 18%。","note_zh":"常指小幅失去优势，语气比 plunge 轻。"},{"id":"plunge","group":"down","en":"plunge","zh":"暴跌","level":"B2","register":"neutral","pattern":"plunge + to / by","example_en":"Bookings plunged during the two-week system outage.","example_zh":"系统宕机的两周里，预订量暴跌。","note_zh":"幅度大、速度快，常和 into 或 by 搭配。"},{"id":"tumble","group":"down","en":"tumble","zh":"大幅下跌","level":"B2","register":"neutral","pattern":"tumble + to / by","example_en":"The company's shares tumbled 18% after the profit warning.","example_zh":"盈利预警发布后，公司股价大幅下跌 18%。","note_zh":"常用于股价、估值和市场信心。"},{"id":"plummet","group":"down","en":"plummet","zh":"骤降","level":"C1","register":"neutral","pattern":"plummet + to / by","example_en":"Daily active users plummeted after the app crashed.","example_zh":"应用崩溃后，日活跃用户骤降。","note_zh":"强调直线下跌，语气很强。"},{"id":"contract","group":"down","en":"contract","zh":"收缩","level":"C1","register":"formal","pattern":"contract + by","example_en":"The tablet market contracted by 4% last year.","example_zh":"平板市场去年收缩了 4%。","note_zh":"经济学用语，通常指整体市场规模变小。"},{"id":"stay-the-same","group":"flat","en":"stay the same","zh":"保持不变","level":"A2","register":"spoken","pattern":"stay the same + at","example_en":"The delivery fee stayed the same at RMB 6.","example_zh":"配送费保持在 6 元不变。","note_zh":"最基础的平稳表达。"},{"id":"remain-stable","group":"flat","en":"remain stable","zh":"保持稳定","level":"B1","register":"formal","pattern":"remain stable + at","example_en":"Customer satisfaction remained stable at around 87%.","example_zh":"客户满意度稳定在 87% 左右。","note_zh":"正式报告常用；不要写 remain stably。"},{"id":"hold-steady","group":"flat","en":"hold steady","zh":"保持平稳","level":"B1","register":"neutral","pattern":"hold steady + at","example_en":"Weekly orders held steady at 12,000 through the summer.","example_zh":"整个夏天，每周订单稳定在 12,000 单。","note_zh":"强调在一段时间内没有明显变化。"},{"id":"level-off","group":"flat","en":"level off","zh":"趋平","level":"B1","register":"neutral","pattern":"level off + at","example_en":"Sales leveled off at around RMB 2 million in the fourth quarter.","example_zh":"第四季度销售额在 200 万元左右趋平。","note_zh":"先涨或先跌，然后稳定下来。"},{"id":"plateau","group":"flat","en":"plateau","zh":"进入平台期","level":"B2","register":"neutral","pattern":"plateau + at","example_en":"App usage plateaued at 45 minutes a day.","example_zh":"应用使用时长在每天 45 分钟进入平台期。","note_zh":"名词和动词同形；常暗示增长停止。"},{"id":"flatten-out","group":"flat","en":"flatten out","zh":"走平","level":"B2","register":"neutral","pattern":"flatten out + at","example_en":"The growth curve flattened out after the launch rush.","example_zh":"发布热潮过后，增长曲线走平。","note_zh":"口语和报告都能用，强调曲线变平。"},{"id":"stagnate","group":"flat","en":"stagnate","zh":"停滞","level":"C1","register":"formal","pattern":"stagnate + at","example_en":"Revenue stagnated at RMB 3 million for three quarters.","example_zh":"收入连续三个季度停滞在 300 万元。","note_zh":"带负面评价，表示该涨却没涨。"},{"id":"slightly","group":"magnitude","en":"slightly","zh":"略微","level":"B1","register":"neutral","pattern":"verb + slightly","example_en":"Conversion rose slightly from 3.1% to 3.3%.","example_zh":"转化率从 3.1% 略微上升到 3.3%。","note_zh":"幅度最小的副词之一；形容词是 slight。"},{"id":"steadily","group":"magnitude","en":"steadily","zh":"稳步地","level":"B1","register":"neutral","pattern":"verb + steadily","example_en":"Revenue grew steadily through the first half.","example_zh":"上半年收入稳步增长。","note_zh":"强调持续、均匀，不强调快。"},{"id":"gradually","group":"magnitude","en":"gradually","zh":"逐渐地","level":"B1","register":"neutral","pattern":"verb + gradually","example_en":"Delivery times gradually fell as the new routes took effect.","example_zh":"新路线生效后，配送时间逐渐下降。","note_zh":"强调过程慢，和 suddenly 相对。"},{"id":"sharply","group":"magnitude","en":"sharply","zh":"大幅地","level":"B1","register":"neutral","pattern":"verb + sharply","example_en":"Costs rose sharply after the fuel price increase.","example_zh":"油价上涨后，成本大幅上升。","note_zh":"强调幅度大、速度快；形容词是 sharp。"},{"id":"dramatically","group":"magnitude","en":"dramatically","zh":"剧烈地","level":"B2","register":"neutral","pattern":"verb + dramatically","example_en":"Demand for live commerce grew dramatically in 2026.","example_zh":"2026 年直播电商需求剧烈增长。","note_zh":"比 sharply 更强，常带戏剧性。"},{"id":"significantly","group":"magnitude","en":"significantly","zh":"显著地","level":"B2","register":"formal","pattern":"verb + significantly","example_en":"Customer retention improved significantly after the loyalty program.","example_zh":"会员计划上线后，客户留存显著改善。","note_zh":"正式报告常用；形容词是 significant。"},{"id":"substantially","group":"magnitude","en":"substantially","zh":"大幅度地","level":"B2","register":"formal","pattern":"verb + substantially","example_en":"Warehouse capacity expanded substantially in the second half.","example_zh":"下半年仓库容量大幅扩张。","note_zh":"正式，强调数量或程度大。"},{"id":"marginally","group":"magnitude","en":"marginally","zh":"轻微地","level":"B2","register":"formal","pattern":"verb + marginally","example_en":"The app's rating improved marginally to 4.6.","example_zh":"应用评分轻微提升到 4.6。","note_zh":"非常小、几乎可忽略的变化。"},{"id":"modestly","group":"magnitude","en":"modestly","zh":"温和地","level":"B2","register":"formal","pattern":"verb + modestly","example_en":"Ad spend rose modestly, in line with the sales plan.","example_zh":"广告投入温和上升，与销售计划一致。","note_zh":"幅度不大但可见，比 slightly 稍强。"},{"id":"drastically","group":"magnitude","en":"drastically","zh":"急剧地","level":"C1","register":"neutral","pattern":"verb + drastically","example_en":"The company drastically cut its delivery subsidies.","example_zh":"公司急剧削减了配送补贴。","note_zh":"常修饰 cut、reduce、change，语气很强。"},{"id":"rapidly","group":"speed","en":"rapidly","zh":"迅速地","level":"B2","register":"neutral","pattern":"verb + rapidly","example_en":"Same-day delivery expanded rapidly across tier-2 cities.","example_zh":"当日达在二线城市迅速扩张。","note_zh":"强调速度快；形容词是 rapid。"},{"id":"suddenly","group":"speed","en":"suddenly","zh":"突然","level":"B1","register":"neutral","pattern":"verb + suddenly","example_en":"Traffic suddenly dropped when the app crashed.","example_zh":"应用崩溃时，流量突然下降。","note_zh":"强调没有预兆；形容词是 sudden。"},{"id":"abruptly","group":"speed","en":"abruptly","zh":"骤然","level":"B2","register":"formal","pattern":"verb + abruptly","example_en":"The promotion ended abruptly, and orders fell the next day.","example_zh":"促销骤然结束，第二天订单就下降了。","note_zh":"比 suddenly 更正式，常带负面意味。"},{"id":"accelerate","group":"speed","en":"accelerate","zh":"加速","level":"B2","register":"neutral","pattern":"growth accelerated","example_en":"Growth accelerated in the third quarter after the new pricing plan.","example_zh":"新定价方案推出后，增长在第三季度加速。","note_zh":"强调速度变快，不是数值变大。"},{"id":"decelerate","group":"speed","en":"decelerate","zh":"减速","level":"B2","register":"formal","pattern":"growth decelerated","example_en":"Revenue kept rising, but growth decelerated in the second half.","example_zh":"收入仍在上升，但下半年增速放缓。","note_zh":"常和 growth、momentum 搭配。"},{"id":"volatile","group":"speed","en":"volatile","zh":"波动剧烈","level":"B2","register":"formal","pattern":"be volatile / a volatile market","example_en":"Demand was volatile around the holiday season.","example_zh":"节日前后需求波动剧烈。","note_zh":"形容上下大幅变化，不是单向趋势。"},{"id":"fluctuate","group":"speed","en":"fluctuate","zh":"波动","level":"B2","register":"formal","pattern":"fluctuate between … and …","example_en":"Order volume fluctuated between 8,000 and 12,000 a week.","example_zh":"每周订单量在 8,000 到 12,000 之间波动。","note_zh":"不要写 fluctuated up and down，意思重复。"},{"id":"peak","group":"peak","en":"peak","zh":"达到峰值","level":"B1","register":"neutral","pattern":"peak at / peak in","example_en":"Orders peaked at 15,000 on the first day of the sale.","example_zh":"大促第一天订单达到 15,000 的峰值。","note_zh":"peak at 接数值，peak in 接时间。"},{"id":"reach-a-peak-of","group":"peak","en":"reach a peak of","zh":"达到……的峰值","level":"B1","register":"neutral","pattern":"reach a peak of + number","example_en":"Revenue reached a peak of RMB 92 million in the fourth quarter.","example_zh":"收入在第四季度达到 9,200 万元的峰值。","note_zh":"比 peak at 更完整，适合正式描述。"},{"id":"hit-a-high-of","group":"peak","en":"hit a high of","zh":"创下……的新高","level":"B2","register":"neutral","pattern":"hit a high of + number","example_en":"The app hit a high of 4.9 million daily users in August.","example_zh":"这款应用在八月创下 490 万日活的新高。","note_zh":"强调创纪录，常和 high 搭配。"},{"id":"trough","group":"peak","en":"trough","zh":"低谷","level":"C1","register":"formal","pattern":"reach a trough of","example_en":"Sales reached a trough of RMB 1.8 million in February.","example_zh":"销售额在二月跌到 180 万元的低谷。","note_zh":"技术性较强；口语里常说 low point。"},{"id":"reach-a-low-of","group":"peak","en":"reach a low of","zh":"跌到……的低点","level":"B2","register":"neutral","pattern":"reach a low of + number","example_en":"Cancellations reached a low of 1.8% in November.","example_zh":"取消率在十一月降到 1.8% 的低点。","note_zh":"和 reach a peak of 相对。"},{"id":"bottom-out","group":"peak","en":"bottom out","zh":"触底","level":"B2","register":"neutral","pattern":"bottom out + at","example_en":"Churn bottomed out at 1.6% before improving in spring.","example_zh":"流失率在 1.6% 触底，随后在春天改善。","note_zh":"强调跌到最低后不再跌，常暗示要反弹。"},{"id":"turning-point","group":"peak","en":"turning point","zh":"拐点","level":"B2","register":"neutral","pattern":"mark a turning point","example_en":"The third quarter marked a turning point for the business.","example_zh":"第三季度成为业务的拐点。","note_zh":"方向发生变化的时刻，不一定是最高或最低点。"},{"id":"reverse-course","group":"peak","en":"reverse course","zh":"转向","level":"C1","register":"formal","pattern":"reverse course","example_en":"After two quarters of decline, sales reversed course in June.","example_zh":"连续两个季度下滑后，销售额在六月转向。","note_zh":"强调方向反转，常和 after 搭配。"},{"id":"the-highest","group":"comparison","en":"the highest","zh":"最高的","level":"A2","register":"neutral","pattern":"the highest + noun","example_en":"East China had the highest revenue at RMB 520,000.","example_zh":"华东收入最高，为 52 万元。","note_zh":"最高级前面通常加 the。"},{"id":"the-lowest","group":"comparison","en":"the lowest","zh":"最低的","level":"A2","register":"neutral","pattern":"the lowest + noun","example_en":"Northeast had the lowest revenue at RMB 180,000.","example_zh":"东北收入最低，为 18 万元。","note_zh":"和 the highest 成对使用。"},{"id":"higher-than","group":"comparison","en":"higher than","zh":"高于","level":"A2","register":"neutral","pattern":"A is higher than B","example_en":"Revenue in the east was 90,000 higher than in the south.","example_zh":"华东收入比华南高 9 万元。","note_zh":"比较级后接 than，不接 to。"},{"id":"compared-with","group":"comparison","en":"compared with","zh":"与……相比","level":"B1","register":"neutral","pattern":"X, compared with Y","example_en":"Gross margin fell to 38%, compared with 44% a year earlier.","example_zh":"毛利率降到 38%，而一年前是 44%。","note_zh":"比 compared to 更常用，尤其在有具体数字时。"},{"id":"whereas","group":"comparison","en":"whereas","zh":"而","level":"B1","register":"formal","pattern":"clause + whereas + clause","example_en":"Revenue grew in the east, whereas it stagnated in the northeast.","example_zh":"华东收入增长，而东北停滞。","note_zh":"连接两个完整从句，前后形成对比。"},{"id":"while","group":"comparison","en":"while","zh":"而 / 同时","level":"B1","register":"neutral","pattern":"clause + while + clause","example_en":"Orders rose, while the average order value fell.","example_zh":"订单上升，而平均客单价下降。","note_zh":"比 whereas 口语化，也可表示同时发生。"},{"id":"respectively","group":"comparison","en":"respectively","zh":"分别","level":"B2","register":"formal","pattern":"A and B + respectively","example_en":"East and South China recorded RMB 520,000 and RMB 430,000 respectively.","example_zh":"华东和华南分别录得 52 万元和 43 万元。","note_zh":"数值顺序必须和前面提到的对象一致。"},{"id":"twice-as-high-as","group":"comparison","en":"twice as high as","zh":"是……的两倍","level":"B2","register":"neutral","pattern":"A is twice as high as B","example_en":"East China's revenue was almost twice as high as Northeast's.","example_zh":"华东收入几乎是东北的两倍。","note_zh":"不要写 twice higher than。"},{"id":"a-gap-of","group":"comparison","en":"a gap of","zh":"相差","level":"B2","register":"neutral","pattern":"a gap of + number","example_en":"There was a gap of RMB 90,000 between the top two markets.","example_zh":"前两个市场之间相差 9 万元。","note_zh":"gap 可接具体数值或 percentage points。"},{"id":"overtake","group":"comparison","en":"overtake","zh":"超过","level":"B2","register":"neutral","pattern":"A overtook B","example_en":"Central China overtook Southwest to take fourth place.","example_zh":"华中超过西南，升至第四。","note_zh":"强调名次变化，不只是数值更高。"},{"id":"the-second-largest","group":"comparison","en":"the second-largest","zh":"第二大的","level":"B1","register":"neutral","pattern":"the second-largest + noun","example_en":"South China was the second-largest market, at RMB 430,000.","example_zh":"华南是第二大市场，为 43 万元。","note_zh":"second-largest 中间有连字符。"},{"id":"broadly-in-line-with","group":"comparison","en":"broadly in line with","zh":"与……大致一致","level":"C1","register":"formal","pattern":"be broadly in line with","example_en":"Ad spend was broadly in line with the annual plan.","example_zh":"广告投入与年度计划大致一致。","note_zh":"正式表达，表示差异不大。"},{"id":"account-for","group":"share","en":"account for","zh":"占（比例）","level":"B1","register":"neutral","pattern":"X accounts for N% of Y","example_en":"Mobile accounts for 52% of total revenue.","example_zh":"手机应用占总收入的 52%。","note_zh":"最常用的占比动词；不要和解释义的 account for 混淆。"},{"id":"make-up","group":"share","en":"make up","zh":"构成","level":"B1","register":"neutral","pattern":"X makes up N% of Y","example_en":"Private-label goods make up 18% of sales.","example_zh":"自有品牌商品占销售额的 18%。","note_zh":"和 account for 接近，更强调组成。"},{"id":"represent","group":"share","en":"represent","zh":"占 / 代表","level":"B2","register":"formal","pattern":"X represents N% of Y","example_en":"The east represents a quarter of total revenue.","example_zh":"华东占总收入四分之一。","note_zh":"正式，适合报告。"},{"id":"dominate","group":"share","en":"dominate","zh":"占据主导","level":"B2","register":"neutral","pattern":"X dominates the market","example_en":"The mobile app dominates the market with a 52% share.","example_zh":"手机应用以 52% 的份额主导市场。","note_zh":"通常指份额明显领先，至少接近一半。"},{"id":"the-lions-share","group":"share","en":"the lion's share","zh":"最大的一份","level":"C1","register":"neutral","pattern":"take / account for the lion's share","example_en":"The mobile app takes the lion's share of revenue.","example_zh":"手机应用拿走了收入中最大的一份。","note_zh":"当代商务写作仍常用；不要用于只领先一点点的情形。"},{"id":"neck-and-neck","group":"share","en":"neck and neck","zh":"并驾齐驱","level":"B2","register":"neutral","pattern":"be neck and neck","example_en":"The two apps are neck and neck, at 31% and 30%.","example_zh":"两款应用并驾齐驱，份额分别为 31% 和 30%。","note_zh":"差距通常只有一两个百分点。"},{"id":"a-distant-second","group":"share","en":"a distant second","zh":"远远落后的第二名","level":"B2","register":"neutral","pattern":"be a distant second","example_en":"The website is a distant second, with less than half the leader's share.","example_zh":"网站远远排在第二，份额不到领先者的一半。","note_zh":"差距明显时用，比 the second-largest 更有评价色彩。"},{"id":"gain-ground","group":"share","en":"gain ground","zh":"抢占份额","level":"B2","register":"neutral","pattern":"gain ground on / in","example_en":"Mini programs gained ground in lower-tier cities.","example_zh":"小程序在下沉市场抢占份额。","note_zh":"强调相对份额上升，常和 on 搭配。"},{"id":"lose-ground","group":"share","en":"lose ground","zh":"失去份额","level":"B2","register":"neutral","pattern":"lose ground to","example_en":"Offline stores lost ground to same-day delivery.","example_zh":"线下门店的份额被当日达抢走。","note_zh":"和 gain ground 相对。"},{"id":"percentage-points","group":"share","en":"percentage points","zh":"百分点","level":"B2","register":"formal","pattern":"rise / fall + N percentage points","example_en":"Its share rose 6 percentage points, from 46% to 52%.","example_zh":"它的份额上升 6 个百分点，从 46% 到 52%。","note_zh":"份额从 46% 到 52% 是 6 个百分点，不是 6%。"},{"id":"fragmented-market","group":"share","en":"a fragmented market","zh":"分散的市场","level":"C1","register":"formal","pattern":"a fragmented market","example_en":"The market remains fragmented, with no player above 12%.","example_zh":"市场仍然分散，没有玩家超过 12%。","note_zh":"份额分散、没有明显领先者。"},{"id":"consolidated-market","group":"share","en":"a consolidated market","zh":"集中的市场","level":"C1","register":"formal","pattern":"a consolidated market","example_en":"The top three players control most of the market, leaving a consolidated field.","example_zh":"前三名控制大部分市场，格局高度集中。","note_zh":"少数玩家占据大部分份额。"},{"id":"about","group":"approx","en":"about","zh":"大约","level":"A2","register":"neutral","pattern":"about + number","example_en":"About 60% of orders come from the app.","example_zh":"大约 60% 的订单来自应用。","note_zh":"最常用的近似词。"},{"id":"roughly","group":"approx","en":"roughly","zh":"大致","level":"B1","register":"neutral","pattern":"roughly + number","example_en":"Revenue was roughly RMB 42 million in the first quarter.","example_zh":"第一季度收入大致为 4,200 万元。","note_zh":"比 about 稍正式，强调估算。"},{"id":"approximately","group":"approx","en":"approximately","zh":"大约","level":"B1","register":"formal","pattern":"approximately + number","example_en":"Approximately 1,500 customers joined the loyalty program.","example_zh":"大约 1,500 名客户加入了会员计划。","note_zh":"正式写作常用。"},{"id":"just-under","group":"approx","en":"just under","zh":"略低于","level":"B1","register":"neutral","pattern":"just under + number","example_en":"Just under half of the orders came from the mini program.","example_zh":"略低于一半的订单来自小程序。","note_zh":"比 almost 更精确地表示差一点。"},{"id":"just-over","group":"approx","en":"just over","zh":"略高于","level":"B1","register":"neutral","pattern":"just over + number","example_en":"Just over 30% of users opened the app every day.","example_zh":"略高于 30% 的用户每天打开应用。","note_zh":"和 just under 相对。"},{"id":"nearly","group":"approx","en":"nearly","zh":"接近","level":"A2","register":"neutral","pattern":"nearly + number","example_en":"Nearly 40% of revenue came from the east.","example_zh":"接近 40% 的收入来自华东。","note_zh":"后面接数字，不写 near 40% 表示近似。"},{"id":"around","group":"approx","en":"around","zh":"在……左右","level":"A2","register":"neutral","pattern":"around + number","example_en":"Average delivery time stayed around 28 minutes.","example_zh":"平均配送时间保持在 28 分钟左右。","note_zh":"口语里很常用。"},{"id":"per-capita","group":"approx","en":"per capita","zh":"人均","level":"C1","register":"formal","pattern":"per capita + noun","example_en":"Spending per capita rose to RMB 320 a month.","example_zh":"人均月支出上升到 320 元。","note_zh":"正式统计用语，注意 per capita 位置。"},{"id":"headwinds","group":"idioms","en":"headwinds","zh":"逆风 / 不利因素","level":"C1","register":"business","pattern":"face / weigh on + headwinds","example_en":"Regulatory headwinds weighed on margins in the second half.","example_zh":"监管逆风在下半年拖累了利润率。","note_zh":"当代财报和新闻常用，指阻碍增长的因素。"},{"id":"tailwinds","group":"idioms","en":"tailwinds","zh":"顺风 / 有利因素","level":"C1","register":"business","pattern":"benefit from + tailwinds","example_en":"The EV maker benefited from policy tailwinds in smaller cities.","example_zh":"这家新能源车企受益于小城市的政策顺风。","note_zh":"和 headwinds 相对。"},{"id":"gain-traction","group":"idioms","en":"gain traction","zh":"开始获得认可","level":"B2","register":"business","pattern":"gain traction with / in","example_en":"The subscription tier is gaining traction in tier-2 cities.","example_zh":"订阅档在二线城市开始获得认可。","note_zh":"新产品或新策略开始被市场接受。"},{"id":"move-the-needle","group":"idioms","en":"move the needle","zh":"带来明显改变","level":"C1","register":"business","pattern":"barely / really move the needle","example_en":"The discount lifted orders but barely moved the needle on margin.","example_zh":"折扣提升了订单，但对利润率几乎没有带来明显改变。","note_zh":"常和 barely、hardly 连用。"},{"id":"double-down","group":"idioms","en":"double down","zh":"加倍投入","level":"C1","register":"business","pattern":"double down on","example_en":"The company is doubling down on live commerce.","example_zh":"公司正在加倍投入直播电商。","note_zh":"在已有方向上投入更多资源。"},{"id":"turn-the-corner","group":"idioms","en":"turn the corner","zh":"开始好转","level":"C1","register":"business","pattern":"turn the corner","example_en":"After three loss-making quarters, the unit has turned the corner.","example_zh":"连续三个季度亏损后，这个业务单元开始好转。","note_zh":"强调从困难期走出来。"},{"id":"a-tale-of-two-halves","group":"idioms","en":"a tale of two halves","zh":"前后两重天","level":"C1","register":"journalism","pattern":"be a tale of two halves","example_en":"2026 was a tale of two halves: a record spring and a flat fall.","example_zh":"2026 年如同两重天：春天创纪录，秋天却停滞。","note_zh":"新闻和财报电话会常用。"},{"id":"hockey-stick-growth","group":"idioms","en":"hockey-stick growth","zh":"曲棍球杆式增长","level":"C1","register":"business","pattern":"hockey-stick growth","example_en":"The pitch promised hockey-stick growth, but the data showed a plateau.","example_zh":"路演承诺曲棍球杆式增长，但数据显示的是平台期。","note_zh":"前期平缓、后期突然陡升的曲线。"},{"id":"a-bump-in-the-road","group":"idioms","en":"a bump in the road","zh":"小挫折","level":"B2","register":"business","pattern":"be a bump in the road","example_en":"The recall is a bump in the road, not a structural decline.","example_zh":"这次召回只是小挫折，不是结构性下滑。","note_zh":"临时问题，不影响长期趋势。"},{"id":"the-bottom-line","group":"idioms","en":"the bottom line","zh":"净利润 / 最终结论","level":"B2","register":"business","pattern":"the bottom line","example_en":"The bottom line improved by 300 basis points.","example_zh":"净利润率提升了 300 个基点。","note_zh":"财务语境指净利润；日常语境指最终结论。"}]},"grammar":{"version":1,"converter":{"verbs":[{"id":"rise","base":"rise","past":"rose","noun":"rise","level":"B1","zh":"上升"},{"id":"increase","base":"increase","past":"increased","noun":"increase","level":"A2","zh":"增加"},{"id":"grow","base":"grow","past":"grew","noun":"growth","level":"A2","zh":"增长"},{"id":"climb","base":"climb","past":"climbed","noun":"climb","level":"B1","zh":"攀升"},{"id":"surge","base":"surge","past":"surged","noun":"surge","level":"B2","zh":"激增"},{"id":"jump","base":"jump","past":"jumped","noun":"jump","level":"B1","zh":"跃升"},{"id":"fall","base":"fall","past":"fell","noun":"fall","level":"A2","zh":"下降"},{"id":"decrease","base":"decrease","past":"decreased","noun":"decrease","level":"A2","zh":"减少"},{"id":"decline","base":"decline","past":"declined","noun":"decline","level":"B1","zh":"下滑"},{"id":"drop","base":"drop","past":"dropped","noun":"drop","level":"B1","zh":"下跌"},{"id":"dip","base":"dip","past":"dipped","noun":"dip","level":"B1","zh":"小幅下降"},{"id":"plunge","base":"plunge","past":"plunged","noun":"plunge","level":"B2","zh":"暴跌"},{"id":"tumble","base":"tumble","past":"tumbled","noun":"tumble","level":"B2","zh":"大幅下跌"}],"adverbs":[{"id":"slightly","adverb":"slightly","adjective":"slight","level":"B1","zh":"略微"},{"id":"steadily","adverb":"steadily","adjective":"steady","level":"B1","zh":"稳步"},{"id":"gradually","adverb":"gradually","adjective":"gradual","level":"B1","zh":"逐渐"},{"id":"sharply","adverb":"sharply","adjective":"sharp","level":"B1","zh":"大幅"},{"id":"dramatically","adverb":"dramatically","adjective":"dramatic","level":"B2","zh":"剧烈"},{"id":"significantly","adverb":"significantly","adjective":"significant","level":"B2","zh":"显著"},{"id":"marginally","adverb":"marginally","adjective":"marginal","level":"B2","zh":"轻微"},{"id":"modestly","adverb":"modestly","adjective":"modest","level":"B2","zh":"温和"}]},"patterns":[{"id":"by-vs-to","title_en":"by vs. to","title_zh":"变化量与终点","level":"B1","explain_zh":"by 后面接变化了多少，to 后面接最后停在哪个数。","correct":[{"en":"Revenue rose by 18%.","zh":"收入上升了 18%。"},{"en":"Revenue rose to RMB 92 million.","zh":"收入上升到 9,200 万元。"}],"wrong":[{"en":"Revenue rose of 18%.","why_zh":"变化量用 by，不用 of。"},{"en":"Revenue rose by RMB 92 million.","why_zh":"如果 92 是终点，要用 to；by 会变成增加了 9,200 万。"}]},{"id":"from-to","title_en":"from … to …","title_zh":"从……到……","level":"B1","explain_zh":"同时给出起点和终点时，用 from A to B；如果只给一个范围，用 between A and B。","correct":[{"en":"Orders rose from 1,200 to 2,100.","zh":"订单从 1,200 上升到 2,100。"},{"en":"Orders fluctuated between 8,000 and 12,000.","zh":"订单在 8,000 到 12,000 之间波动。"}],"wrong":[{"en":"Orders rose from 1,200 at 2,100.","why_zh":"终点用 to，不用 at。"}]},{"id":"percentage-points","title_en":"Percent vs. percentage points","title_zh":"百分比与百分点","level":"B2","explain_zh":"份额从 46% 到 52% 是 6 个百分点；说 6% 会被理解成相对增长了 6%。","correct":[{"en":"Its share rose 6 percentage points, from 46% to 52%.","zh":"它的份额上升 6 个百分点，从 46% 到 52%。"}],"wrong":[{"en":"Its share rose 6% to 52%.","why_zh":"两个百分数相减，结果要用 percentage points。"}]},{"id":"twice-as-high-as","title_en":"twice as high as","title_zh":"倍数的说法","level":"B2","explain_zh":"倍数用 as … as，不用 higher than。","correct":[{"en":"East China's revenue was twice as high as Northeast's.","zh":"华东收入是东北的两倍。"},{"en":"Revenue was three times the figure for the northeast.","zh":"收入是东北的三倍。"}],"wrong":[{"en":"Revenue was twice higher than the northeast.","why_zh":"英语里没有 twice higher than 这种说法。"}]},{"id":"double-vs-twice","title_en":"double vs. twice","title_zh":"double 与 twice","level":"B2","explain_zh":"double 作动词表示变成两倍；twice 是副词，常和 as … as 连用。","correct":[{"en":"Revenue doubled between 2025 and 2026.","zh":"收入在 2025 到 2026 年间翻了一倍。"},{"en":"Revenue was twice as high as in 2025.","zh":"收入是 2025 年的两倍。"}],"wrong":[{"en":"Revenue increased by double.","why_zh":"double 不能这样当名词用；说 doubled 或 increased twofold。"}]},{"id":"account-for","title_en":"account for / make up / represent","title_zh":"占比动词","level":"B1","explain_zh":"表示占多少比例，用 account for、make up 或 represent，不用 occupy。","correct":[{"en":"Mobile accounts for 52% of revenue.","zh":"手机应用占收入的 52%。"},{"en":"Private-label goods make up 18% of sales.","zh":"自有品牌商品占销售额的 18%。"}],"wrong":[{"en":"Mobile occupies 52% of revenue.","why_zh":"occupy 指占据空间，不用于份额。"}]},{"id":"the-highest","title_en":"the highest","title_zh":"最高级","level":"A2","explain_zh":"最高级前面通常加 the；不要叠加 most 和 -est。","correct":[{"en":"East China had the highest revenue.","zh":"华东收入最高。"},{"en":"This was the most expensive quarter.","zh":"这是成本最高的一个季度。"}],"wrong":[{"en":"East China had the most highest revenue.","why_zh":"highest 已经是最高级，不能再加 most。"}]},{"id":"compared-with","title_en":"compared with","title_zh":"与……相比","level":"B1","explain_zh":"比较两个数字时用 compared with；句子要有明确主语。","correct":[{"en":"Revenue fell to 38%, compared with 44% a year earlier.","zh":"收入降到 38%，而一年前是 44%。"}],"wrong":[{"en":"Compared with last year, sales increased this year.","why_zh":"主语和比较对象不清楚；改成 Sales increased this year, compared with last year."}]},{"id":"respectively","title_en":"respectively","title_zh":"分别","level":"B2","explain_zh":"respectively 放在句末，前面的数值顺序要和对象顺序一致。","correct":[{"en":"East and South China recorded RMB 520,000 and RMB 430,000 respectively.","zh":"华东和华南分别录得 52 万元和 43 万元。"}],"wrong":[{"en":"East and South China recorded RMB 430,000 and RMB 520,000 respectively.","why_zh":"数值顺序反了，respectively 就对应错了。"}]},{"id":"approximation","title_en":"nearly / just over / around","title_zh":"近似表达","level":"B1","explain_zh":"近似词后面直接接数字；nearly 和 near 不要混用。","correct":[{"en":"Nearly 40% of revenue came from the east.","zh":"接近 40% 的收入来自华东。"},{"en":"Just over 30% of users opened the app daily.","zh":"略高于 30% 的用户每天打开应用。"}],"wrong":[{"en":"Near 40% of revenue came from the east.","why_zh":"表示近似数量用 nearly，不用 near。"}]},{"id":"peak-at","title_en":"peak at / reach a peak of","title_zh":"峰值的说法","level":"B1","explain_zh":"peak at 后面直接接数值；reach a peak of 更完整。","correct":[{"en":"Orders peaked at 15,000 in December.","zh":"订单在十二月达到 15,000 的峰值。"},{"en":"Revenue reached a peak of RMB 92 million.","zh":"收入达到 9,200 万元的峰值。"}],"wrong":[{"en":"Orders reached the peak at 15,000 in December.","why_zh":"更自然的说法是 peaked at 或 reached a peak of。"}]},{"id":"while-whereas","title_en":"while / whereas","title_zh":"对比连接词","level":"B1","explain_zh":"while 和 whereas 后面都要接完整从句，不能直接接名词短语。","correct":[{"en":"Revenue grew in the east, whereas it stagnated in the northeast.","zh":"华东收入增长，而东北停滞。"}],"wrong":[{"en":"Revenue grew in the east, whereas a fall in the northeast.","why_zh":"whereas 后面缺主语和谓语。"}]},{"id":"fewer-less","title_en":"fewer vs. less","title_zh":"可数与不可数","level":"B2","explain_zh":"可数名词用 fewer，不可数名词用 less；人数、订单数用 number，不用 amount。","correct":[{"en":"Fewer customers canceled their orders this month.","zh":"这个月取消订单的客户更少。"},{"en":"There was less demand for delivery on Sunday.","zh":"周日的配送需求更少。"}],"wrong":[{"en":"Less customers canceled their orders.","why_zh":"customers 可数，用 fewer。"}]},{"id":"in-by-time","title_en":"in 2030 vs. by 2030","title_zh":"时间点与截止时间","level":"B2","explain_zh":"in 接某个时间点或时间段；by 表示到某个时间为止完成。","correct":[{"en":"Revenue reached RMB 92 million in 2026.","zh":"收入在 2026 年达到 9,200 万元。"},{"en":"The company aims to reach RMB 150 million by 2028.","zh":"公司目标是在 2028 年前达到 1.5 亿元。"}],"wrong":[{"en":"The company aims to reach RMB 150 million in 2028.","why_zh":"如果意思是“到 2028 年为止”，要用 by。"}]}]},"errors":{"version":1,"errors":[{"id":"rose-of","level":"B1","family":"trend","wrong_en":"Revenue rose of 18% in the fourth quarter.","right_en":"Revenue rose by 18% in the fourth quarter.","why_zh":"变化量用 by；of 只在 a rise of 18% 这种名词结构里用。"},{"id":"increased-to-vs-by","level":"B1","family":"trend","wrong_en":"Orders increased to 20% after the campaign.","right_en":"Orders increased by 20% after the campaign.","why_zh":"to 接终点数值；如果 20% 是涨幅，要用 by。"},{"id":"twice-higher","level":"B2","family":"comparison","wrong_en":"Sales are twice higher than last year.","right_en":"Sales are twice as high as last year.","why_zh":"倍数用 as … as，不用 higher than。"},{"id":"amount-of-users","level":"B1","family":"quantity","wrong_en":"The amount of users rose to 3 million.","right_en":"The number of users rose to 3 million.","why_zh":"users 可数，用 number of；amount of 接不可数名词。"},{"id":"less-users","level":"B1","family":"quantity","wrong_en":"Less customers opened the app this month.","right_en":"Fewer customers opened the app this month.","why_zh":"customers 可数，用 fewer；less 接不可数名词。"},{"id":"most-highest","level":"A2","family":"comparison","wrong_en":"East China had the most highest revenue.","right_en":"East China had the highest revenue.","why_zh":"highest 已经是最高级，不能再加 most。"},{"id":"reach-to","level":"B1","family":"trend","wrong_en":"Revenue reached to RMB 92 million in the fourth quarter.","right_en":"Revenue reached RMB 92 million in the fourth quarter.","why_zh":"reach 后面直接接数值，不加 to。"},{"id":"occupy-share","level":"B2","family":"share","wrong_en":"Mobile occupies 52% of the market.","right_en":"Mobile accounts for 52% of the market.","why_zh":"occupy 指占据空间；份额用 account for、make up 或 represent。"},{"id":"share-percent","level":"B2","family":"share","wrong_en":"Its share rose 6% to 52%.","right_en":"Its share rose 6 percentage points to 52%.","why_zh":"两个百分比相减，结果是百分点，不是百分比。"},{"id":"remain-stably","level":"B2","family":"flat","wrong_en":"Customer satisfaction remained stably at 87%.","right_en":"Customer satisfaction remained stable at 87%.","why_zh":"remain 后面接形容词 stable，不接副词 stably。"},{"id":"fluctuated-up-and-down","level":"B2","family":"speed","wrong_en":"Order volume fluctuated up and down all year.","right_en":"Order volume fluctuated all year.","why_zh":"fluctuate 本身已经包含上下变化，up and down 重复。"},{"id":"dangling-compared","level":"C1","family":"comparison","wrong_en":"Compared with last year, sales increased this year.","right_en":"Sales increased this year, compared with last year.","why_zh":"Compared with 的逻辑主语要和主句主语一致，否则读者不知道谁和谁比。"}]}}</script>
<script>
(function (global) {
  'use strict';

  var NC = global.NPESLCharts = global.NPESLCharts || {};
  NC.version = '1.0.0';
  NC.LEVELS = ['A2', 'B1', 'B2', 'C1'];
  NC.renderers = {};
  NC.desc = NC.desc || {};
  NC.stats = NC.stats || {};
  NC.svg = NC.svg || {};
  NC.scale = NC.scale || {};
  NC.renderCommon = NC.renderCommon || {};

  NC.state = {
    level: 'B1',
    reducedMotion: false,
    data: null,
    datasets: null,
    labs: {},
    lastTemplate: {}
  };

  NC.byId = function (id) {
    return document.getElementById(id);
  };

  NC.clamp = function (value, min, max) {
    return Math.max(min, Math.min(max, value));
  };

  NC.roundTo = function (value, step) {
    if (!step) return value;
    var decimals = (String(step).split('.')[1] || '').length;
    return Number((Math.round(value / step) * step).toFixed(decimals));
  };

  NC.deepClone = function (value) {
    return JSON.parse(JSON.stringify(value));
  };

  NC.hash = function (text) {
    var hash = 2166136261;
    for (var i = 0; i < text.length; i += 1) {
      hash ^= text.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
  };

  NC.debounce = function (fn, wait) {
    var timer = null;
    return function () {
      var args = arguments;
      var self = this;
      clearTimeout(timer);
      timer = setTimeout(function () {
        fn.apply(self, args);
      }, wait);
    };
  };

  NC.createElement = function (tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        if (key === 'text') node.textContent = attrs[key];
        else if (key === 'html') node.innerHTML = attrs[key];
        else if (key === 'class') node.className = attrs[key];
        else if (key.indexOf('data-') === 0 || key === 'role' || key === 'aria-live') {
          node.setAttribute(key, attrs[key]);
        } else {
          node.setAttribute(key, attrs[key]);
        }
      });
    }
    (children || []).forEach(function (child) {
      if (child == null) return;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
    return node;
  };

  NC.escapeHtml = function (text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };

  NC.emit = function (name, payload) {
    var listeners = NC.bus && NC.bus[name];
    if (!listeners) return;
    listeners.slice().forEach(function (fn) {
      fn(payload);
    });
  };

  NC.bus = {};
  NC.on = function (name, fn) {
    (NC.bus[name] = NC.bus[name] || []).push(fn);
  };

  NC.levelIndex = function (level) {
    return NC.LEVELS.indexOf(level);
  };

  NC.showLevel = function (entryLevel, level) {
    return NC.levelIndex(entryLevel) <= NC.levelIndex(level || NC.state.level);
  };
})(window);

(function (NC) {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  var svg = NC.svg = {};

  svg.el = function (tag, attrs, parent) {

      '</div>' +
      '<p class="vocab-ex"><span lang="en">' + NC.escapeHtml(entry.example_en) + '</span></p>' +
      '<p class="vocab-ex-zh">' + NC.escapeHtml(entry.example_zh) + '</p>' +
      (entry.note_zh ? '<p class="vocab-note">' + NC.escapeHtml(entry.note_zh) + '</p>' : '') +
    '</article>';
  }

  function renderVocab(type) {
    var section = NC.byId('chart-' + type.id);
    var host = section && section.querySelector('[data-vocab]');
    if (!host) return;
    var allowed = type.vocab_groups || [];
    var entries = NC.state.data.vocab.entries.filter(function (entry) {
      return allowed.indexOf(entry.group) !== -1 && NC.showLevel(entry.level, NC.state.level);
    });
    var html = NC.state.data.vocab.groups.filter(function (group) {
      return allowed.indexOf(group.id) !== -1;
    }).map(function (group) {
      var items = entries.filter(function (entry) { return entry.group === group.id; });
      if (!items.length) return '';
      return '<div class="vocab-group">' +
        '<h4>' + NC.escapeHtml(group.title_zh) + '</h4>' +
        '<div class="vocab-list">' + items.map(vocabCard).join('') + '</div>' +
      '</div>';
    }).join('');
    host.innerHTML = html || '<p class="empty">当前难度下没有词条，把难度调高试试。</p>';
  }

  function renderPatterns(type) {
    var section = NC.byId('chart-' + type.id);
    var list = section && section.querySelector('[data-patterns]');
    if (!list) return;
    var visible = (type.patterns || []).filter(function (pattern) {
      return NC.showLevel(pattern.level, NC.state.level);
    });
    if (!visible.length && type.patterns && type.patterns.length) visible = [type.patterns[0]];
    list.innerHTML = visible.map(function (pattern) {
      return '<li>' + levelBadge(pattern.level) +
        '<span class="pattern-en" lang="en">' + NC.escapeHtml(pattern.en) + '</span>' +
        '<span class="pattern-zh">' + NC.escapeHtml(pattern.zh) + '</span></li>';
    }).join('');
  }

  function grammarCard(pattern) {
    return '<article class="grammar-card">' +
      '<div class="grammar-head"><h3 lang="en">' + NC.escapeHtml(pattern.title_en) + '</h3>' +
      '<span class="grammar-zh">' + NC.escapeHtml(pattern.title_zh) + '</span>' +
      levelBadge(pattern.level) + '</div>' +
      '<p class="grammar-explain">' + NC.escapeHtml(pattern.explain_zh) + '</p>' +
      '<div class="examples">' +
        (pattern.correct || []).map(function (item) {
          return '<div class="example correct"><span class="mark">✓</span><div><p lang="en">' + NC.escapeHtml(item.en) + '</p><p class="zh">' + NC.escapeHtml(item.zh) + '</p></div></div>';
        }).join('') +
        (pattern.wrong || []).map(function (item) {
          return '<div class="example wrong"><span class="mark">✕</span><div><p lang="en">' + NC.escapeHtml(item.en) + '</p><p class="zh">' + NC.escapeHtml(item.why_zh) + '</p></div></div>';
        }).join('') +
      '</div>' +
    '</article>';
  }

  function renderGrammar(type) {
    var section = NC.byId('chart-' + type.id);
    var host = section && section.querySelector('[data-grammar]');
    if (!host) return;
    var allowed = type.grammar_patterns || [];
    var patterns = NC.state.data.grammar.patterns.filter(function (pattern) {
      return allowed.indexOf(pattern.id) !== -1;
    });
    host.innerHTML = patterns.map(grammarCard).join('');
  }

  function renderConverter(type) {
    var section = NC.byId('chart-' + type.id);
    var host = section && section.querySelector('[data-converter]');
    if (!host) return;
    var verbSelect = host.querySelector('[data-converter-verb]');
    var adverbSelect = host.querySelector('[data-converter-adverb]');
    var output = host.querySelector('[data-converter-output]');
    if (!verbSelect || !adverbSelect || !output) return;

    var grammar = NC.state.data.grammar.converter;
    var verbs = grammar.verbs.filter(function (verb) { return NC.showLevel(verb.level, NC.state.level); });
    var adverbs = grammar.adverbs.filter(function (adverb) { return NC.showLevel(adverb.level, NC.state.level); });
    if (!verbs.length) verbs = grammar.verbs;
    if (!adverbs.length) adverbs = grammar.adverbs;

    var verbValue = verbSelect.value;
    var adverbValue = adverbSelect.value;
    verbSelect.innerHTML = verbs.map(function (verb) {
      return '<option value="' + verb.id + '">' + NC.escapeHtml(verb.base) + ' · ' + NC.escapeHtml(verb.zh) + '</option>';
    }).join('');
    adverbSelect.innerHTML = adverbs.map(function (adverb) {
      return '<option value="' + adverb.id + '">' + NC.escapeHtml(adverb.adverb) + ' · ' + NC.escapeHtml(adverb.zh) + '</option>';
    }).join('');
    if (verbs.some(function (verb) { return verb.id === verbValue; })) verbSelect.value = verbValue;
    if (adverbs.some(function (adverb) { return adverb.id === adverbValue; })) adverbSelect.value = adverbValue;

    function update() {
      var currentVerb = verbs.filter(function (item) { return item.id === verbSelect.value; })[0] || verbs[0];
      var currentAdverb = adverbs.filter(function (item) { return item.id === adverbSelect.value; })[0] || adverbs[0];
      var phrase = NC.fmt.withArticle(currentAdverb.adjective + ' ' + currentVerb.noun);
      output.innerHTML =
        '<p class="converter-line" lang="en">Revenue ' + NC.escapeHtml(currentVerb.past) + ' ' + NC.escapeHtml(currentAdverb.adverb) + '.</p>' +
        '<p class="converter-line" lang="en">There was ' + NC.escapeHtml(phrase) + ' in revenue.</p>' +
        '<p class="converter-line" lang="en">Revenue saw ' + NC.escapeHtml(phrase) + '.</p>' +
        '<p class="converter-zh">收入' + NC.escapeHtml(currentAdverb.zh) + NC.escapeHtml(currentVerb.zh) + '。</p>';
    }
    verbSelect.onchange = update;
    adverbSelect.onchange = update;
    update();
  }

  function renderLearning(type) {
    renderPatterns(type);
    renderVocab(type);
    renderGrammar(type);
    renderConverter(type);
  }

  function renderAllLearning() {
    sortedTypes().forEach(renderLearning);
  }

  function renderErrors() {
    var host = NC.byId('errors-list');
    if (!host) return;
    var errors = NC.state.data.errors.errors;
    host.innerHTML = errors.map(function (item) {
      return '<article class="error-card">' +
        '<div class="error-head">' + levelBadge(item.level) + '</div>' +
        '<div class="example wrong"><span class="mark">✕</span><p lang="en">' + NC.escapeHtml(item.wrong_en) + '</p></div>' +
        '<div class="example correct"><span class="mark">✓</span><p lang="en">' + NC.escapeHtml(item.right_en) + '</p></div>' +
        '<p class="error-why">' + NC.escapeHtml(item.why_zh) + '</p>' +
      '</article>';
    }).join('');
  }

  function buildTypeSwitch() {
    var host = NC.byId('type-buttons');
    if (!host) return;
    host.innerHTML = '';
    sortedTypes().forEach(function (type) {
      var button = document.createElement('button');
      button.type = 'button';
      button.id = 'tab-' + type.id;
      button.className = 'type-tab';
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-controls', 'chart-' + type.id);
      button.setAttribute('aria-selected', 'false');
      button.tabIndex = -1;
      button.textContent = type.label_zh;
      button.addEventListener('click', function () {
        activate(type.id);
      });
      button.addEventListener('keydown', onTabKey);
      host.appendChild(button);
    });
  }

  function onTabKey(event) {
    var keys = ['ArrowRight', 'ArrowLeft', 'Home', 'End'];
    if (keys.indexOf(event.key) === -1) return;
    event.preventDefault();
    var types = sortedTypes();
    var current = types.map(function (type) { return type.id; }).indexOf(state.typeId);
    var next = current;
    if (event.key === 'ArrowRight') next = (current + 1) % types.length;
    if (event.key === 'ArrowLeft') next = (current - 1 + types.length) % types.length;
    if (event.key === 'Home') next = 0;
    if (event.key === 'End') next = types.length - 1;
    activate(types[next].id);
    var tab = NC.byId('tab-' + types[next].id);
    if (tab) tab.focus();
  }

  function typeFromHash() {
    var hash = String((window.location && window.location.hash) || '').replace(/^#/, '');
    if (hash.indexOf('chart-') === 0) hash = hash.slice(6);
    return hash;
  }

  function activate(id) {
    var types = sortedTypes();
    var known = types.some(function (type) { return type.id === id; });
    if (!known) id = types[0].id;
    state.typeId = id;
    types.forEach(function (type) {
      var panel = NC.byId('chart-' + type.id);
      var tab = NC.byId('tab-' + type.id);
      var selected = type.id === id;
      if (panel) panel.hidden = !selected;
      if (tab) {
        tab.setAttribute('aria-selected', selected ? 'true' : 'false');
        tab.tabIndex = selected ? 0 : -1;
      }
    });
    var lab = NC.state.labs[id];
    if (lab) lab.mount();
    try {
      window.history.replaceState(null, '', '#chart-' + id);
    } catch (err) {}
  }

  function initialTypeId() {
    var id = typeFromHash();
    var types = sortedTypes();
    var known = types.some(function (type) { return type.id === id; });
    return known ? id : types[0].id;
  }

  function setupHash() {
    window.addEventListener('hashchange', function () {
      var id = typeFromHash();
      var types = sortedTypes();
      var known = types.some(function (type) { return type.id === id; });
      if (known && id !== state.typeId) activate(id);
    });
  }

  function setupLevel() {
    var buttons = Array.prototype.slice.call(document.querySelectorAll('#level-switch [data-level]'));
    try {
      var saved = localStorage.getItem('npesl-charts-level');
      if (saved && NC.LEVELS.indexOf(saved) !== -1) NC.state.level = saved;
    } catch (err) {}
    function apply(level) {
      NC.state.level = level;
      document.documentElement.setAttribute('data-charts-level', level);
      buttons.forEach(function (button) {
        button.setAttribute('aria-pressed', button.getAttribute('data-level') === level ? 'true' : 'false');
      });
      try { localStorage.setItem('npesl-charts-level', level); } catch (err) {}
      Object.keys(NC.state.labs).forEach(function (id) {
        var lab = NC.state.labs[id];
        if (lab.mounted) lab.refresh(false);
      });
      renderAllLearning();
    }
    buttons.forEach(function (button) {
      button.addEventListener('click', function () {
        apply(button.getAttribute('data-level'));
      });
    });
    apply(NC.state.level);
  }

  function setupReducedMotion() {
    var query = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    NC.state.reducedMotion = !!(query && query.matches);
    document.documentElement.setAttribute('data-reduced-motion', NC.state.reducedMotion ? 'true' : 'false');
  }

  ui.build = function () {
    setupReducedMotion();
    buildPanels();
    buildTypeSwitch();
    renderErrors();
    setupLevel();
    setupHash();
    activate(initialTypeId());
  };

  ui.mountAll = function () {
    Object.keys(NC.state.labs).forEach(function (id) {
      if (NC.state.labs[id]) NC.state.labs[id].mount();
    });
  };
})(window.NPESLCharts);

;
(function (NC) {
  'use strict';

  function boot() {
    var node = document.getElementById('npesl-charts-data');
    if (!node) {
      console.error('Chart data is missing.');
      return;
    }
    var data = JSON.parse(node.textContent);
    NC.state.data = data;
    NC.state.datasets = NC.deepClone(data.labs.datasets);
    NC.state.initial = NC.deepClone(data.labs.datasets);
    NC.ui.build();
    document.documentElement.setAttribute('data-charts-ready', 'true');
    NC.test = {
      mountAll: NC.ui.mountAll,
      labs: NC.state.labs,
      state: NC.state
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.NPESLCharts);

;
(function () {
  var KEY = 'npesl-theme';
  var THEMES = [
    { id: 'auto', label: 'Auto' },
    { id: 'editorial', label: 'Editorial' },
    { id: 'brutal', label: 'Brutalist' },
    { id: 'glass', label: 'Glass' },
    { id: 'mono', label: 'Mono' },
    { id: 'bright', label: 'Bright' },
    { id: 'sepia', label: 'Sepia' },
    { id: 'dark', label: 'Dark' }
  ];
  var VALID = THEMES.map(function (theme) { return theme.id; });

  function read() {
    try {
      var value = localStorage.getItem(KEY);
      if (value && VALID.indexOf(value) !== -1) return value;
    } catch (err) {
      // localStorage 不可用时跟随系统。
    }
    return 'auto';
  }

  function current() {
    var value = document.documentElement.getAttribute('data-theme');
    return value && VALID.indexOf(value) !== -1 ? value : read();
  }

  function apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try {
      localStorage.setItem(KEY, theme);
    } catch (err) {
      // 存不下也不影响当前页面。
    }
  }

  // 页面自己的内联脚本已经在首屏前设过一次，这里兜底。
  apply(current());

  function build() {
    if (document.getElementById('npesl-theme')) return;

    var root = document.createElement('div');
    root.className = 'npesl-theme';
    root.id = 'npesl-theme';

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'npesl-theme-fab';
    button.setAttribute('aria-label', 'Theme');
    button.setAttribute('aria-haspopup', 'menu');
    button.setAttribute('aria-expanded', 'false');
    button.title = 'Theme';
    button.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>' +
      '<path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor"/>' +
      '</svg>';

    var menu = document.createElement('div');
    menu.className = 'npesl-theme-menu';
    menu.setAttribute('role', 'menu');
    menu.setAttribute('aria-label', 'Theme');
    menu.dataset.open = 'false';

    THEMES.forEach(function (theme) {
      var option = document.createElement('button');
      option.type = 'button';
      option.className = 'npesl-theme-option';
      option.setAttribute('role', 'menuitemradio');
      option.setAttribute('aria-checked', 'false');
      option.dataset.theme = theme.id;

      var swatch = document.createElement('span');
      swatch.className = 'npesl-theme-swatch';
      swatch.dataset.swatch = theme.id;

      var label = document.createElement('span');
      label.textContent = theme.label;

      var check = document.createElement('span');
      check.className = 'npesl-theme-check';
      check.textContent = '✓';
      check.setAttribute('aria-hidden', 'true');

      option.appendChild(swatch);
      option.appendChild(label);
      option.appendChild(check);
      option.addEventListener('click', function () {
        apply(theme.id);
        sync();
        close();
      });
      menu.appendChild(option);
    });

    function sync() {
      var active = current();
      Array.prototype.forEach.call(
        menu.querySelectorAll('.npesl-theme-option'),
        function (option) {
          option.setAttribute('aria-checked', String(option.dataset.theme === active));
        }
      );
    }

    function open() {
      sync();
      menu.dataset.open = 'true';
      button.setAttribute('aria-expanded', 'true');
      var active = menu.querySelector('.npesl-theme-option[aria-checked="true"]');
      if (active) active.focus();
    }

    function close() {
      menu.dataset.open = 'false';
      button.setAttribute('aria-expanded', 'false');
    }

    button.addEventListener('click', function (event) {
      event.stopPropagation();
      if (menu.dataset.open === 'true') close();
      else open();
    });

    menu.addEventListener('click', function (event) {
      event.stopPropagation();
    });

    document.addEventListener('click', function () {
      if (menu.dataset.open === 'true') close();
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && menu.dataset.open === 'true') {
        close();
        button.focus();
      }
    });

    window.addEventListener('storage', function (event) {
      if (event.key === KEY) {
        document.documentElement.setAttribute('data-theme', read());
        if (menu.dataset.open === 'true') sync();
      }
    });

    root.appendChild(button);
    root.appendChild(menu);
    document.body.appendChild(root);
    sync();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();

</script>
