/*

/* 极简：纯灰阶、细线小圆角、不要卡片阴影，强调色就是墨色。 */
html[data-theme="mono"] {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #0e0e10;
  --muted: #67676c;
  --rule: #dbdbdf;
  --rail: #f0f0f2;
  --surface: #f7f7f8;
  --surface-strong: #ececee;
  --blue: #111114;

}

/* ================================================================
 * 三个完整视觉方向：配色、字体、圆角、边框、阴影一起换。
 * 每个主题只给一个 --font（中西文配对写在同一条栈里），标题、正文、
 * 按钮全部继承它，所以同一主题内不会出现两种字体气质。
 * ================================================================ */

/* 编辑网格：纸张 + 墨 + 瑞士红；衬线中文西文成对，直角、细线、不要卡片。 */
html[data-theme="editorial"] {
  color-scheme: light;
  --bg: #f6f5f1;
  --fg: #151412;
  --muted: #615e57;
  --rule: #d7d3c9;

  --surface: #efede6;
  --surface-strong: #e4e0d5;
  --blue: #b02a1a;
  --blue-hover: #c83422;
  --blue-tint: #f1e3dc;
  --on-blue: #ffffff;
  --icon: #4a4740;
  --danger: #b02a1a;
  --font: "Source Serif 4", "Noto Serif SC", Georgia, "Songti SC", serif;
  --radius-card: 0px;
  --radius-control: 0px;
  --radius-pill: 0px;
  --radius: 0px;
  --shadow-card: none;
}

/* 新粗野：奶油底 + 墨边 + 硬阴影；特粗无衬线配黑体中文。 */
html[data-theme="brutal"] {
  color-scheme: light;
  --bg: #f2ecdf;
  --fg: #141008;
  --muted: #6b6458;
  --rule: #141008;
  --rail: #e6dfcd;
  --surface: #fffdf6;
  --surface-strong: #f7f1e2;
  --blue: #b8381a;
  --blue-hover: #c9441f;
  --blue-tint: #fff0b8;
  --on-blue: #ffffff;
  --icon: #3b352b;
  --danger: #9c2416;
  --font: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC",
    "Microsoft YaHei", system-ui, sans-serif;
  --radius-card: 14px;
  --radius-control: 12px;
  --radius: 14px;
  --shadow-card: 5px 5px 0 var(--fg);
}

/* 卡片玻璃（墨绿）：深墨绿底 + 蜜桃/薄荷/淡紫极光 + 半透明深卡；

   底 #0e1418，薄荷青绿 #5cc8b6，卡片 rgba(24,34,39,.76)，线 rgba(238,243,244,.12)，
   圆角 20/14。 */
html[data-theme="glass"] {
  color-scheme: dark;
  --bg: #0e1418;
  --fg: #eef3f4;
  --muted: #a3b0b6;
  --rule: rgba(238, 243, 244, 0.12);
  --rail: rgba(24, 34, 39, 0.52);
  --surface: rgba(24, 34, 39, 0.76);
  --surface-strong: #172126;
  --blue: #5cc8b6;
  --blue-hover: #8bdccd;
  --blue-tint: rgba(92, 200, 182, 0.14);
  --on-blue: #08211c;
  --icon: #a3b0b6;
  --danger: #f08a7f;
  --peach-soft: rgba(240, 169, 132, 0.14);
  --mint-soft: rgba(127, 214, 194, 0.12);
  --lav-soft: rgba(183, 169, 227, 0.14);
  --font: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC",
    "Microsoft YaHei", system-ui, sans-serif;
  --radius-card: 20px;
  --radius-control: 14px;
  --radius-pill: 999px;
  --radius: 20px;
  --shadow-card: 0 20px 50px -30px rgba(0, 0, 0, 0.65);
  /* 页面极光层：body 和吸顶横幅共用，横幅才能和背景无缝相接。 */
  --bg-art:
    radial-gradient(920px 560px at 92% -8%, var(--peach-soft), transparent 62%),
    radial-gradient(760px 520px at -12% 16%, var(--mint-soft), transparent 58%),
    radial-gradient(760px 540px at 58% 108%, var(--lav-soft), transparent 62%);
}


.npesl-back {
  position: sticky;
  top: max(12px, env(safe-area-inset-top, 0px));

.npesl-back:hover { background: var(--surface-strong); }

.npesl-theme-option {

.npesl-theme-option:hover { background: var(--surface); }
.npesl-theme-option:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

.npesl-theme-swatch {
  flex: none;
  width: 16px;

  border: 1px solid var(--rule);

}

.npesl-theme-swatch[data-swatch="auto"] {

}
.npesl-theme-swatch[data-swatch="bright"] { background: #ffffff; }
.npesl-theme-swatch[data-swatch="dark"] { background: #000000; }

}
.npesl-theme-swatch[data-swatch="glass"] {

}
.npesl-theme-swatch[data-swatch="mono"] {

}


.npesl-theme-check {
  margin-left: auto;

  font-size: 14px;

@media print {
  .npesl-theme { display: none !important; }
}

/* 统一的圆角与卡片阴影尺度：卡片 24 / 控件 12 / 胶囊 999 */
:root {
  --radius-card: 24px;
  --radius-control: 12px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.06);
}

/*
 * 统一按钮动作：独立按钮 hover 浮起 1px + 柔和阴影。
 * 行内文字按钮（句子里的可点单词）不参与，避免整段文字跳动。
 */
.pill,
.chip,
.opt,
.primary,
.ghost,
.browseBtn,
.browserClose,
.speed-reset,
.play-all,
.marks-toggle,
.chips button,
.level,
.npesl-back,
.npesl-theme-fab,
.npesl-theme-option,
.speaker {
  transition: transform 0.16s ease, box-shadow 0.16s ease,
    background-color 0.16s ease, color 0.16s ease,
    border-color 0.16s ease !important;
}

.pill:hover,
.chip:hover,
.opt:hover,
.primary:hover,
.ghost:hover,
.browseBtn:hover,
.browserClose:hover,
.speed-reset:hover,
.play-all:hover,
.marks-toggle:hover,
.chips button:hover,
.level:hover,
.npesl-back:hover,
.npesl-theme-fab:hover,
.npesl-theme-option:hover,
.speaker:hover {
  transform: translateY(-1px);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 20px rgba(0, 0, 0, 0.08);
}

.pill:active,
.chip:active,
.opt:active,
.primary:active,
.ghost:active,
.browseBtn:active,
.browserClose:active,
.speed-reset:active,
.play-all:active,
.marks-toggle:active,
.chips button:active,
.level:active,
.npesl-back:active,
.npesl-theme-fab:active,
.npesl-theme-option:active,
.speaker:active {
  transform: translateY(0) scale(0.98);
  box-shadow: none;
}

/* ================================================================
 * 方向的形状层：同一套组件类在各应用里通用，这里按主题改形状。
 * 只动外壳（卡片、行、按钮、播放条），不改任何应用的排版逻辑。
 * ================================================================ */

/* ---- 编辑网格：去掉卡片底色，用横线分块；控件一律直角 ---- */
html[data-theme="editorial"] :is(
  .pill, .chip, .opt, .primary, .ghost, .play-all, .marks-toggle,
  .speed-reset, .zh-toggle, .seg, .seg button, .voice, .voice button,
  .chips button, .level, .npesl-back, .browseBtn, .browserClose, .catBtn,
  .badge, .hint, .npesl-theme-option,
  .opp-btn, .opp-return,
  .sp-inline, .sp-tip
) { border-radius: 0 !important; }

html[data-theme="editorial"] .content-card {
  background: transparent;
  border-radius: 0;
  box-shadow: none;
  padding-left: 0;
  padding-right: 0;
  border-top: 1px solid var(--fg);
  border-bottom: 1px solid var(--rule);
}

html[data-theme="editorial"] :is(.row, .card, .target) {
  background: transparent;
  border-radius: 0;
  box-shadow: none;
}

/* 浮层必须压在页面上，不能跟卡片一样透底：编辑网格用纸色实底 + 细墨线。 */
html[data-theme="editorial"] .browserSheet {
  background: var(--bg);
  border-radius: 0;
  box-shadow: none;
  border: 1px solid var(--fg);
}

html[data-theme="editorial"] .row {
  border-width: 0 0 1px;
  padding-left: 0;
  padding-right: 0;
}

/* ---- 新粗野：2px 墨边 + 硬阴影，卡片不再靠底色分层 ---- */
html[data-theme="brutal"] :is(
  .content-card, .card, .target, .row, .browserSheet, .kplayer
) {
  border: 2px solid var(--fg);
  box-shadow: 5px 5px 0 var(--fg);
}

html[data-theme="brutal"] :is(.row, .content-card, .card, .target, .browserSheet) {
  background: var(--surface);
}

/* 阅读训练的正文行贴着页面排，不做卡片；只留点读的高亮。 */
html[data-theme="brutal"] .passage .row {
  background: transparent;
  border: 0;
  box-shadow: none;
}

html[data-theme="brutal"] :is(
  .pill, .chip, .opt, .primary, .ghost, .play-all, .marks-toggle,
  .speed-reset, .zh-toggle, .seg, .level, .npesl-back, .browseBtn,
  .browserClose, .catBtn, .voice, .voice-seg, .sp-inline
) {
  border: 2px solid var(--fg);
  border-radius: 10px;
  box-shadow: 3px 3px 0 var(--fg);
}

html[data-theme="brutal"] .zh-toggle,
html[data-theme="brutal"] .pill,
html[data-theme="brutal"] .chip,
html[data-theme="brutal"] .sp-inline { border-radius: 999px; }

/* ---- 卡片玻璃：近白底上的蜜桃/薄荷/淡紫极光，卡片半透 + 毛玻璃 + 柔和投影 ---- */
html[data-theme="glass"] body {
  background: var(--bg-art), var(--bg);
  background-attachment: fixed;
}

/* 吸顶横幅 / 工具栏用同一层极光，滚动时不会出现一条平色带。 */
html[data-theme="glass"] :is(.sp-context, .toolbar) {
  background: var(--bg-art), var(--bg);
  background-attachment: fixed;
}

html[data-theme="glass"] :is(
  .content-card, .card, .target, .row, .browserSheet, .kplayer,
  .seg, .zh-toggle, .pill, .chip, .level, .npesl-back, .play-all,
  .marks-toggle, .voice, .voice-seg, .sp-inline
) {
  backdrop-filter: blur(16px) saturate(1.08);
  -webkit-backdrop-filter: blur(16px) saturate(1.08);
}

html[data-theme="glass"] :is(.content-card, .card, .target, .row, .browserSheet, .kplayer) {
  border-color: var(--rule);
  box-shadow: var(--shadow-card);
}

html[data-theme="glass"] .row { background: var(--surface); }

/* 阅读训练的正文行贴着页面排，不做卡片；毛玻璃层也一并去掉。 */
html[data-theme="glass"] .passage .row {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* ================================================================
 * 音色切换：男女两个选项做成按钮，形状跟着主题走。
 * editorial 直角、brutal 圆角矩形、其余主题胶囊。
 * 不用 :has()，旧版微信 WebView 也能生效；按各应用现有的容器特征识别：
 *   #voiceSeg            自然拼读
 *   .voice               音标表
 *   .voice-seg           短语搭配列表页
 *   .seg[aria-label=...] 发音现象 / 短语搭配章节 / Conversation
 * ================================================================ */

/* 独立按钮之间留出缝隙，不再靠分段控件的左边线分格 */
:is(#voiceSeg, .voice, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"]) {

}

:is(#voiceSeg, .voice, .voice-seg, .seg[aria-label="音色"],
  .seg[aria-label="朗读音色"], .seg[aria-label="读音"])
  > button[data-voice] + button[data-voice] {
  border-left: 0 !important;
}

/* 编辑网格：直角 */
html[data-theme="editorial"] :is(#voiceSeg, .voice, .voice-seg,
  .seg[aria-label="音色"], .seg[aria-label="朗读音色"], .seg[aria-label="读音"]),
html[data-theme="editorial"] :is(#voiceSeg, .voice, .voice-seg,
  .seg[aria-label="音色"], .seg[aria-label="朗读音色"], .seg[aria-label="读音"])
  > button[data-voice] {

/* 新粗野：圆角矩形，和它的卡片、控件同一档 10px */
html[data-theme="brutal"] :is(#voiceSeg, .voice, .voice-seg,
  .seg[aria-label="音色"], .seg[aria-label="朗读音色"], .seg[aria-label="读音"]),
html[data-theme="brutal"] :is(#voiceSeg, .voice, .voice-seg,

  > button[data-voice] {

/* 主题切换器也跟着方向的形状走，不然一开菜单就露馅 */
html[data-theme="editorial"] :is(.npesl-theme-fab, .npesl-theme-menu) {
  border-radius: 0 !important;

}

}

html[data-theme="glass"] .npesl-theme-option:hover { background: var(--surface-strong); }

  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 72px;

  --t-body: 1rem;
  --t-small: 0.875rem;
  --t-meta: 0.75rem;
  --t-micro: 0.6875rem;

  --c-ink: var(--fg);
  --c-muted: var(--muted);
  --c-rule: var(--rule);
  --c-rule-strong: color-mix(in srgb, var(--fg) 24%, var(--rule));
  --c-surface: var(--surface);
  --c-accent: var(--blue);
  --c-accent-tint: var(--blue-tint);

  --c-radius-card: var(--radius-card, 0px);
  --c-radius-control: var(--radius-control, 0px);

  --motion-fast: 150ms;
  --motion-base: 240ms;
  --ease-out: cubic-bezier(.16, 1, .3, 1);

  --series-1: var(--blue);
  --series-2: #6b6b70;
  --series-3: #96969b;
  --series-4: #b4b4b8;
  --series-5: #d2d2d5;
}

@supports (color: color-mix(in srgb, red 50%, blue)) {
  .charts-page {
    --series-2: color-mix(in srgb, var(--fg) 72%, var(--bg));
    --series-3: color-mix(in srgb, var(--fg) 54%, var(--bg));
    --series-4: color-mix(in srgb, var(--fg) 40%, var(--bg));
    --series-5: color-mix(in srgb, var(--fg) 30%, var(--bg));
  }
}

* { box-sizing: border-box; }

body.charts-page {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--bg-art, none);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font, -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "SF Pro Display", "Segoe UI Variable", "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

html[data-theme="glass"] .site-head {
  background-color: var(--bg);
  background-image: var(--bg-art, none);
}

.charts-page .npesl-back {
  position: static;
  margin: 0;
  flex: none;
  padding: 6px 12px;
  font-size: 13px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.charts-page :where(a, button, summary, input, select, [tabindex]):focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.charts-page .plot [tabindex]:focus-visible { outline: none; }

/* ---------------------------------------------------------------- shell */

.site-head {
  position: sticky;
  top: 0;
  z-index: 40;
  background-color: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
}

@supports (backdrop-filter: blur(12px)) {
  .site-head {
    background-color: color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter: blur(12px);
  }
}

.site-head.is-scrolled { border-bottom: 1px solid var(--rule); }

.head-inner {
  max-width: var(--shell-max);
  margin: 0 auto;
  padding: 8px max(var(--space-5), env(safe-area-inset-right, 0px)) 8px max(var(--space-5), env(safe-area-inset-left, 0px));
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-5);
  transition: padding var(--motion-fast) ease;
}

.site-head.is-scrolled .head-inner { padding-top: 5px; padding-bottom: 5px; }

.brand {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.brand-en {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.015em;
  white-space: nowrap;
}

.brand-zh {
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
}

/* tabs */

.type-switch {
  position: relative;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
}

.type-switch-scroll {
  min-width: 0;
  flex: 0 1 auto;
  width: max-content;
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-pill, 999px);
  background: var(--surface);
  overflow-x: auto;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
  overscroll-behavior-x: contain;
}

.type-switch-scroll::-webkit-scrollbar { display: none; }

.type-switch::before,
.type-switch::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 22px;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--motion-fast) ease;
  z-index: 2;
}

.type-switch[data-overflow="start"]::before,
.type-switch[data-overflow="both"]::before,
.type-switch[data-overflow="end"]::after,
.type-switch[data-overflow="both"]::after { opacity: 1; }

.type-scroll {
  appearance: none;
  flex: none;
  width: 24px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius-pill, 999px);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
}

.type-scroll[hidden] { display: none; }
.type-scroll:hover { color: var(--fg); border-color: var(--c-rule-strong); }
.type-scroll svg { width: 14px; height: 14px; }

.type-tab {
  appearance: none;
  position: relative;
  flex: none;
  padding: 7px 12px;
  border: 0;
  border-radius: var(--radius-pill, 999px);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  line-height: 1.1;
  white-space: nowrap;
  cursor: pointer;
  scroll-snap-align: start;
  transition: color var(--motion-fast) ease, background-color var(--motion-fast) ease;
}

.type-tab:hover { color: var(--fg); background: var(--bg); }
.type-tab[aria-selected="true"] {
  color: var(--on-blue);
  background: var(--blue);
  font-weight: 600;
}

/* level */

.level-switch {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-pill, 999px);
  background: var(--surface);
}

.level-switch button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12.5px;
  line-height: 1;
  padding: 7px 11px;
  border-radius: var(--radius-pill, 999px);
  cursor: pointer;
  transition: color var(--motion-fast) ease, background-color var(--motion-fast) ease, box-shadow var(--motion-fast) ease;
}

.level-switch button:hover { color: var(--fg); }

.level-switch button[aria-pressed="true"] {
  color: var(--fg);
  font-weight: 600;
  background: var(--bg);
  box-shadow: 0 1px 3px color-mix(in srgb, var(--fg) 12%, transparent);
}

/* ---------------------------------------------------------------- page */

.page {
  max-width: var(--shell-max);
  margin: 0 auto;
  padding: 28px max(var(--space-5), env(safe-area-inset-right, 0px)) 96px max(var(--space-5), env(safe-area-inset-left, 0px));
}

.chart-panel { animation: none; }
.chart-panel.is-entering { animation: panel-in 620ms var(--ease-out) both; }

@keyframes panel-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 14px 0 26px;
}

.section-head h2 {
  margin: 0;
  font-size: clamp(1.8rem, 3vw, 2.1rem);
  font-weight: 680;
  letter-spacing: -0.035em;
  line-height: 1.1;
}

.h2-en {
  margin-left: 4px;
  font-size: 0.48em;
  font-weight: 450;
  letter-spacing: 0.01em;
  color: var(--muted);
}

.panel-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.62fr) minmax(270px, 0.88fr);
  gap: clamp(32px, 5vw, 72px);
  align-items: start;
}

.panel-figure { min-width: 0; }

.chart-card {
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: var(--c-radius-card);
}

.figure-head {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 10px;
}

.figure-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 18px;
  flex-wrap: wrap;
}

.chart-scene {
  font-size: 11.5px;
  line-height: 1.4;
  letter-spacing: 0.02em;
  color: var(--muted);
}

.figure-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  margin-left: auto;
}

.figure-modes {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.figure-modes:empty { display: none; }

.mode-group { display: inline-flex; align-items: center; gap: 8px; }

.mode-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.segment {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-pill, 999px);
  background: var(--surface);
}

.segment-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  line-height: 1;
  padding: 6px 10px;
  border-radius: var(--radius-pill, 999px);
  cursor: pointer;
  transition: color var(--motion-fast) ease, background-color var(--motion-fast) ease;
}

.segment-btn:hover { color: var(--fg); background: var(--bg); }

.segment-btn[aria-pressed="true"] {
  color: var(--on-blue);
  background: var(--blue);
  font-weight: 600;
}

.action-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-pill, 999px);
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  transition: color var(--motion-fast) ease, border-color var(--motion-fast) ease, background-color var(--motion-fast) ease;
}

.action-btn:hover {
  color: var(--fg);
  border-color: var(--c-rule-strong);
  background: var(--bg);
}

.action-btn-icon svg { width: 14px; height: 14px; }

.plot {
  position: relative;
  min-height: 120px;
  margin-top: 4px;
}

.chart-svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.chart-empty {
  margin: 0;
  padding: 48px 0;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* legend */

.legend-host {
  display: flex;
  justify-content: center;
  margin-top: 4px;
}

.legend {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px 18px;
  padding: 0;
  font-size: 11.5px;
  color: var(--muted);
}

.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

/* ---------------------------------------------------------------- reading */

.panel-reading {
  position: sticky;
  top: calc(var(--header-h) + 28px);
  min-width: 0;
}

.desc { min-height: 80px; }

.sentence { transition: color var(--motion-fast) ease; }
.sentence + .sentence { margin-top: 16px; }

.sentence-en {
  margin: 0;
  font-size: 0.98rem;
  line-height: 1.5;
  letter-spacing: -0.008em;
}

.sentence.lead .sentence-en {
  font-size: clamp(1.16rem, 1.6vw, 1.34rem);
  line-height: 1.36;
  font-weight: 620;
  letter-spacing: -0.022em;
}

.sentence-zh {
  margin: 5px 0 0;
  font-size: 0.79rem;
  line-height: 1.62;
  color: var(--muted);
}

.sentence.is-linked .sentence-en,
.sentence.is-linked .sentence-zh { color: var(--blue); }

/* ---------------------------------------------------------------- patterns */

.learning-block {
  margin-top: 58px;
  scroll-margin-top: calc(var(--header-h) + 16px);
  padding-top: 22px;
  border-top: 1px solid var(--rule);
}

.learning-block h3 {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.pattern-list {
  list-style: none;
  margin: 20px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px 48px;
}

.pattern-list li {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.pattern-en {
  font-size: 0.94rem;
  line-height: 1.45;
}

.pattern-zh {
  font-size: 0.79rem;
  line-height: 1.55;
  color: var(--muted);
}

.vocab-groups { display: grid; gap: 30px; margin-top: 20px; }

.vocab-group h4 {
  margin: 0 0 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.vocab-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 20px 36px;
}

.vocab-card { min-width: 0; }

.vocab-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.vocab-en {
  font-size: 0.94rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.vocab-zh { font-size: 0.79rem; color: var(--muted); }

.vocab-register {
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--muted);
  white-space: nowrap;
}

.vocab-ex {
  margin: 6px 0 0;
  font-size: 0.82rem;
  line-height: 1.5;
  color: var(--fg);
}

.vocab-ex-zh {
  margin: 2px 0 0;
  font-size: 0.76rem;
  line-height: 1.55;
  color: var(--muted);
}

.vocab-note {
  margin: 5px 0 0;
  font-size: 0.74rem;
  line-height: 1.55;
  color: var(--muted);
}

.example {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  gap: 8px;
  font-size: 0.82rem;
  line-height: 1.5;
}

.example p { margin: 0; }
.example .zh { margin-top: 2px; font-size: 0.76rem; color: var(--muted); }
.example .mark { color: var(--muted); font-size: 11px; line-height: 1.6; }
.example.wrong .mark { color: var(--danger); }
.example.correct .mark { color: var(--blue); }
.example.wrong p[lang="en"] { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

/* ---------------------------------------------------------------- tables */

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.data-table th,
.data-table td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  white-space: nowrap;
}

.data-table thead th {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.data-table .num-cell { text-align: right; }

.data-table input {
  width: 72px;
  padding: 2px 0;
  border: 0;
  border-bottom: 1px solid transparent;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.data-table input:hover,
.data-table input:focus { border-bottom-color: var(--c-rule-strong); outline: none; }

.table-scroll-shell { position: relative; }

.table-scroll { overflow-x: auto; }

.chart-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  font-variant-numeric: tabular-nums;
}

.chart-table th,
.chart-table td {
  padding: 13px 14px;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  white-space: nowrap;
}

.chart-table thead th {
  padding-top: 0;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
}

.chart-table thead .num-cell { text-align: right; }

.chart-table tbody tr { transition: background-color var(--motion-fast) ease; }
.chart-table tbody tr:hover { background: var(--surface); }

.chart-table .row-head { font-weight: 500; }

.row-en { display: block; }
.row-zh { display: block; margin-top: 1px; font-size: 10.5px; color: var(--muted); }

.th-unit {
  display: block;
  margin-top: 2px;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: var(--muted);
}

.chart-table .num-cell { text-align: right; }

.chart-table .edit-cell { padding-top: 9px; padding-bottom: 9px; }

.chart-table .edit-cell input {
  width: 74px;
  padding: 3px 0;
  border: 0;
  border-bottom: 1px solid transparent;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.chart-table .edit-cell input:hover,
.chart-table .edit-cell input:focus { border-bottom-color: var(--c-rule-strong); outline: none; }

.chart-table tfoot th {
  padding-top: 13px;
  padding-bottom: 13px;
  border-top: 1px solid var(--c-rule-strong);
  border-bottom: 0;
  font-weight: 600;
}

.table-scroll-cue {
  display: none;
  margin: 8px 0 0;
  font-size: 11px;
  color: var(--muted);
}

.table-scroll-shell[data-overflow="true"] .table-scroll-cue { display: block; }

/* ---------------------------------------------------------------- process */

.process-flow {
  display: flex;
  align-items: stretch;
  gap: 0;
  padding: 8px 0 4px;
}

.process-step {
  appearance: none;
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 16px 12px 18px;
  border: 0;
  border-radius: var(--c-radius-control);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--motion-fast) ease;
}

.process-step:hover { background: var(--surface); }
.process-step.is-active { background: var(--c-accent-tint); }

.process-icon {
  display: block;
  width: 26px;
  height: 26px;
  margin-bottom: 8px;
  color: var(--blue);
}

.process-icon svg { width: 100%; height: 100%; }

.process-title {
  font-size: 0.84rem;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.process-zh { font-size: 0.7rem; color: var(--muted); }

.process-arrow {
  flex: 0 0 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--c-rule-strong);
}

.process-arrow svg { width: 14px; height: 14px; }

/* ---------------------------------------------------------------- svg marks */

.chart-svg { font-variant-numeric: tabular-nums; }

.axis-line { stroke: var(--c-rule-strong); stroke-width: 1; }
.grid-line { stroke: var(--rule); stroke-width: 1; }
.tick-line { stroke: var(--c-rule-strong); stroke-width: 1; }

.axis-label { fill: var(--muted); font-size: 10.5px; }
.axis-title { fill: var(--muted); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; }
.category-label { fill: var(--fg); font-size: 11px; }

.value-label {
  fill: var(--fg);
  font-size: 10.5px;
  font-weight: 600;
}

.value-label.inside { fill: var(--bg); }
.value-label.ghost { fill: var(--muted); font-weight: 400; }

.line-path {
  fill: none;
  stroke: var(--series-1);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mixed-line {
  fill: none;
  stroke: var(--series-1);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mixed-dot {
  fill: var(--bg);
  stroke: var(--series-1);
  stroke-width: 2;
}

.axis-label-right { fill: var(--series-1); }
.line-value-label { fill: var(--series-1); }

.area-fill { stroke: none; }
.area-edge { fill: none; stroke: var(--series-1); stroke-width: 2.2; }

.hover-dot {
  fill: var(--series-1);
  stroke: var(--bg);
  stroke-width: 2;
}

.crosshair {
  stroke: var(--c-rule-strong);
  stroke-width: 1;
  stroke-dasharray: 3 4;
}

.plot-hit { cursor: crosshair; }

.handle { cursor: ns-resize; touch-action: none; }
.handle .hit { fill: transparent; }
.handle .dot {
  fill: var(--bg);
  stroke: var(--series-1);
  stroke-width: 2;
  opacity: 1;
  transition: opacity var(--motion-fast) ease;
}
.handle .halo {
  fill: var(--blue-tint);
  opacity: 0;
  transition: opacity var(--motion-fast) ease;
}
.handle:hover .dot,
.handle:focus .dot,
.handle.dragging .dot { opacity: 1; }
.handle:hover .halo,
.handle:focus .halo,
.handle.dragging .halo { opacity: 0.55; }

.bar-current { transition: opacity var(--motion-fast) ease; cursor: pointer; }
.bar-segment { transition: opacity var(--motion-fast) ease; cursor: pointer; }
.bar-current:hover, .bar-segment:hover { opacity: 0.82; }

.plot[data-emphasis="current"] .bar-current { opacity: 0.9; }
.plot[data-emphasis="current"] .bar-ghost { opacity: 0.45; }

.bar-ghost {
  fill: transparent;
  stroke: var(--series-2);
  stroke-width: 1.4;
}

.bar-ghost-rule {
  fill: var(--series-2);
  opacity: 0.5;
}

.pie-slice {
  stroke: var(--bg);
  stroke-width: 2;
  cursor: pointer;
  transition: opacity var(--motion-fast) ease;
}

.pie-slice.is-active { opacity: 0.86; }

.pie-leader { fill: none; stroke: var(--rule); stroke-width: 1; }

.pie-label { fill: var(--fg); font-size: 10.5px; }

.pie-handle .dot { opacity: 0.7; }

.pie-empty-ring {
  fill: none;
  stroke: var(--rule);
  stroke-width: 22;
}

.chart-tip {
  position: absolute;
  z-index: 5;
  transform: translate(-50%, -100%);
  max-width: 260px;
  padding: 6px 9px;
  border-radius: 6px;
  background: var(--fg);
  color: var(--bg);
  font-size: 11.5px;
  line-height: 1.35;
  white-space: normal;
  pointer-events: none;
  opacity: 0;
  transition: opacity 120ms ease;
}

.chart-tip[data-visible="true"] { opacity: 1; }

.editable-value { cursor: pointer; }
.editable-value:hover {
  fill: var(--blue);
  text-decoration: underline;
  text-decoration-style: dotted;
  text-decoration-thickness: 1px;
}

.value-editor {
  position: absolute;
  z-index: 8;
  display: grid;
  gap: 7px;
  min-width: 196px;
  padding: 10px;
  border: 1px solid var(--c-rule-strong);
  border-radius: var(--c-radius-control, 8px);
  background: var(--bg);
  box-shadow: 0 12px 32px -16px color-mix(in srgb, var(--fg) 32%, transparent);
}

.value-editor-label {
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.value-editor-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.value-editor-input {
  width: 82px;
  padding: 6px 8px;
  border: 1px solid var(--c-rule-strong);
  border-radius: var(--c-radius-control, 6px);
  background: var(--surface);
  color: var(--fg);
  font: inherit;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.value-editor-input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }

.value-editor-unit { font-size: 12px; color: var(--muted); }

.value-editor-ok {
  appearance: none;
  margin-left: auto;
  padding: 6px 10px;
  border: 0;
  border-radius: var(--c-radius-control, 6px);
  background: var(--blue);
  color: var(--on-blue);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.value-editor-cancel {
  appearance: none;
  padding: 6px 4px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.value-editor-cancel:hover { color: var(--fg); }

/* ---------------------------------------------------------------- errors */

.library {
  margin-top: 88px;
  scroll-margin-top: calc(var(--header-h) + 16px);
  padding-top: 28px;
  border-top: 1px solid var(--rule);
}

.library-head { margin: 0 0 24px; }

.library-head h2 {
  margin: 0;
  font-size: clamp(1.3rem, 2vw, 1.5rem);
  font-weight: 650;
  letter-spacing: -0.025em;
}

.error-group + .error-group { margin-top: 38px; }

.error-group-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
}

.error-group-head h3 {
  margin: 0;
  font-size: 0.98rem;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.error-group-head span {
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.errors-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px 48px;
}

.error-card { font-size: 0.84rem; line-height: 1.5; }

.error-card .example { grid-template-columns: 14px minmax(0, 1fr); }

.error-why {
  margin: 7px 0 0;
  font-size: 0.76rem;
  line-height: 1.55;
  color: var(--muted);
}

/* ---------------------------------------------------------------- responsive */

@media (max-width: 960px) {
  .panel-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 36px;
  }

  .panel-reading {
    position: static;
    max-width: 680px;
  }

  .sentence.lead .sentence-en { font-size: 1.16rem; }
}

@media (max-width: 760px) {
  .head-inner {
    grid-template-columns: auto 1fr auto;
    grid-template-areas:
      "back brand level"
      "tabs tabs tabs";
    gap: 2px 12px;
    padding-top: 8px;
    padding-bottom: 4px;
  }

  .head-inner > .npesl-back { grid-area: back; }
  .head-inner > .brand { grid-area: brand; }
  .head-inner > .level-switch { grid-area: level; }
  .head-inner > .type-switch {
    grid-area: tabs;
    margin: 0 calc(-1 * var(--space-5));
    padding: 0 var(--space-5);
  }

  .type-switch-scroll { gap: 1px; }
  .type-scroll { display: none; }
  .type-tab { padding: 7px 9px; font-size: 12px; }

  .page { padding-top: 18px; padding-bottom: 72px; }

  .section-head { margin: 6px 0 20px; }
  .section-head h2 { font-size: 1.65rem; }

  .figure-head { gap: 8px; }
  .figure-modes { width: 100%; gap: 12px; }
  .figure-actions { margin-left: auto; }

  .learning-block { margin-top: 44px; }
  .pattern-list { grid-template-columns: minmax(0, 1fr); gap: 18px; }

  .vocab-list { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .errors-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; }

  .process-flow { flex-direction: column; }
  .process-step {
    flex: 0 0 auto;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
  }
  .process-icon {
    flex: none;
    width: 22px;
    height: 22px;
    margin-bottom: 0;
  }
  .process-arrow {
    flex: 0 0 16px;
    width: 16px;
    height: 16px;
    margin-left: 11px;
  }
  /* Rotate the glyph, not the box: a transformed flex item leaves its layout
     box, so the arrow drifts out of the vertical stack. */
  .process-arrow svg { transform: rotate(90deg); }

  .chart-table { font-size: 0.84rem; }
  .chart-table th,
  .chart-table td { padding: 11px 10px; }
  .chart-table .edit-cell input { width: 62px; }
}

@media (max-width: 430px) {
  .brand-zh { display: none; }
  .level-switch button { padding: 8px 7px; }
  .section-head h2 { font-size: 1.5rem; }
  .h2-en { display: block; margin: 2px 0 0; font-size: 0.46em; }
  .figure-modes { gap: 10px; }
  .mode-group { gap: 4px; }
  .segment-btn { padding: 5px 6px; }
}

@media (prefers-reduced-motion: reduce) {
  .chart-panel.is-entering { animation: none; }
  .sentence,
  .bar-current,
  .bar-segment,
  .pie-slice,
  .handle .dot,
  .handle .halo { transition: none; }
}

</style>
</head>

ods":[{"id":"q1-2025","label_en":"Q1 2025","label_zh":"2025 年第一季度"},{"id":"q2-2025","label_en":"Q2 2025","label_zh":"2025 年第二季度"},{"id":"q3-2025","label_en":"Q3 2025","label_zh":"2025 年第三季度"},{"id":"q4-2025","label_en":"Q4 2025","label_zh":"2025 年第四季度"},{"id":"q1-2026","label_en":"Q1 2026","label_zh":"2026 年第一季度"},{"id":"q2-2026","label_en":"Q2 2026","label_zh":"2026 年第二季度"},{"id":"q3-2026","label_en":"Q3 2026","label_zh":"2026 年第三季度"},{"id":"q4-2026","label_en":"Q4 2026","label_zh":"2026 年第四季度"}],"bars":{"id":"revenue","name_en":"Revenue","name_zh":"收入","unit":"RMB million","unit_zh":"百万元","values":[42,46,55,52,61,68,71,92],"min":0,"max":100,"step":1,"decimals":0,"color":"series-2","axis":"left"},"line":{"id":"margin","name_en":"Margin","name_zh":"利润率","unit":"%","unit_zh":"%","values":[8.2,8.8,9.6,8.9,10.4,11.1,11.5,12.6],"min":6,"max":14,"step":0.1,"decimals":1,"color":"series-1","axis":"right"}}}},"vocab":{"version":1,"groups":[{"id":"up","title_en":"Going up","title_zh":"上升"},{"id":"down","title_en":"Going down","title_zh":"下降"},{"id":"flat","title_en":"Staying flat","title_zh":"平稳"},{"id":"magnitude","title_en":"How big","title_zh":"幅度"},{"id":"speed","title_en":"How fast","title_zh":"速度与波动"},{"id":"peak","title_en":"Peaks and turns","title_zh":"峰谷与反转"},{"id":"comparison","title_en":"Comparing","title_zh":"比较与排名"},{"id":"share","title_en":"Shares and markets","title_zh":"占比与市场"},{"id":"approx","title_en":"Approximating","title_zh":"近似与单位"},{"id":"idioms","title_en":"Business idioms","title_zh":"商务习语"},{"id":"sequence","title_en":"Sequencing a process","title_zh":"流程顺序"},{"id":"mixed","title_en":"Combining two datasets","title_zh":"两组数据"}],"entries":[{"id":"rise","group":"up","en":"rise","zh":"上升","level":"B1","register":"neutral","pattern":"rise + by / to","example_en":"Revenue rose by 18% after the new delivery fee launched.","example_zh":"新的配送费上线后，收入上升了 18%。","note_zh":"中性词；by 接变化量，to 接终点。"},{"id":"increase","group":"up","en":"increase","zh":"增加","level":"A2","register":"neutral","pattern":"increase + by / to","example_en":"Orders increased from 1,200 to 2,100 during the promotion.","example_zh":"促销期间订单从 1,200 增加到 2,100。","note_zh":"最通用的上升动词，正式和口语都能用。"},{"id":"grow","group":"up","en":"grow","zh":"增长","level":"A2","register":"neutral","pattern":"grow + by / from … to …","example_en":"The coffee chain grew from 80 stores to 120 in two years.","example_zh":"这家咖啡连锁两年内从 80 家门店增长到 120 家。","note_zh":"强调规模变大，常和 revenue、sales、users 搭配。"},{"id":"climb","group":"up","en":"climb","zh":"攀升","level":"B1","register":"neutral","pattern":"climb + to","example_en":"App downloads climbed to 3.4 million in the fourth quarter.","example_zh":"应用下载量在第四季度攀升到 340 万。","note_zh":"常暗示一步一步往上走，比 rise 更有画面。"},{"id":"go-up","group":"up","en":"go up","zh":"上升","level":"A2","register":"spoken","pattern":"go up + by / to","example_en":"Delivery costs went up again in March.","example_zh":"配送成本在三月又上升了。","note_zh":"口语常用；正式报告里可以换成 rise 或 increase。"},{"id":"edge-up","group":"up","en":"edge up","zh":"微升","level":"B2","register":"neutral","pattern":"edge up + to","example_en":"Average order value edged up to RMB 68 in June.","example_zh":"六月平均客单价微升到 68 元。","note_zh":"幅度很小，通常不到几个百分点。"},{"id":"creep-up","group":"up","en":"creep up","zh":"缓慢攀升","level":"C1","register":"neutral","pattern":"creep up + to","example_en":"Warehouse rents crept up through the year, quietly eating into margins.","example_zh":"仓库租金全年缓慢攀升，悄悄侵蚀利润率。","note_zh":"常带负面意味，适合描述成本慢慢变高。"},{"id":"surge","group":"up","en":"surge","zh":"激增","level":"B2","register":"neutral","pattern":"surge + to / by","example_en":"Orders surged to 8,000 on Singles' Day.","example_zh":"双十一当天订单激增到 8,000 单。","note_zh":"幅度大、速度快；不要用于 3% 的小变化。"},{"id":"jump","group":"up","en":"jump","zh":"跃升","level":"B1","register":"neutral","pattern":"jump + from … to …","example_en":"Sign-ups jumped from 400 to 900 after the referral campaign.","example_zh":"推荐活动后，注册数从 400 跃升到 900。","note_zh":"突然且明显的变化，比 rise 更有冲击力。"},{"id":"soar","group":"up","en":"soar","zh":"猛涨","level":"B2","register":"neutral","pattern":"soar + to / by","example_en":"Battery prices soared during the supply shortage.","example_zh":"供应短缺期间电池价格猛涨。","note_zh":"常和价格、成本、需求搭配，语气强。"},{"id":"skyrocket","group":"up","en":"skyrocket","zh":"暴涨","level":"C1","register":"informal","pattern":"skyrocket + to","example_en":"Demand for same-day delivery skyrocketed during the holiday rush.","example_zh":"节日高峰期间，当日达需求暴涨。","note_zh":"口语和新闻里常见；正式报告慎用。"},{"id":"rebound","group":"up","en":"rebound","zh":"反弹","level":"B2","register":"neutral","pattern":"rebound + from … to …","example_en":"Bookings rebounded from 5,000 to 7,200 in the next quarter.","example_zh":"预订量在下一季度从 5,000 反弹到 7,200。","note_zh":"先跌后涨时用，强调恢复。"},{"id":"fall","group":"down","en":"fall","zh":"下降","level":"A2","register":"neutral","pattern":"fall + by / to","example_en":"Average delivery time fell by six minutes after the route update.","example_zh":"路线更新后，平均配送时间下降了六分钟。","note_zh":"中性词；by 接变化量，to 接终点。"},{"id":"decrease","group":"down","en":"decrease","zh":"减少","level":"A2","register":"neutral","pattern":"decrease + by / to","example_en":"Customer complaints decreased slightly in the second half.","example_zh":"下半年客户投诉略有减少。","note_zh":"正式、中性；和 increase 相对。"},{"id":"decline","group":"down","en":"decline","zh":"下滑","level":"B1","register":"formal","pattern":"decline + by / to","example_en":"Revenue declined year on year in the northeast market.","example_zh":"东北市场的收入同比下滑。","note_zh":"比 fall 正式，适合报告和新闻。"},{"id":"drop","group":"down","en":"drop","zh":"下跌","level":"B1","register":"neutral","pattern":"drop + by / to","example_en":"Orders dropped in the week after the discount ended.","example_zh":"折扣结束后的那一周，订单下跌。","note_zh":"口语和书面都常用，语气比 decline 直接。"},{"id":"go-down","group":"down","en":"go down","zh":"下降","level":"A2","register":"spoken","pattern":"go down + by / to","example_en":"Sales went down after the holiday promotion ended.","example_zh":"节日促销结束后，销售额下降了。","note_zh":"口语常用；正式写作可换成 fall 或 decline。"},{"id":"dip","group":"down","en":"dip","zh":"小幅下降","level":"B1","register":"neutral","pattern":"dip + to","example_en":"Margins dipped to 11% in the first quarter.","example_zh":"第一季度利润率小幅下降到 11%。","note_zh":"通常指短暂、小幅的下降。"},{"id":"edge-down","group":"down","en":"edge down","zh":"微降","level":"B2","register":"neutral","pattern":"edge down + to","example_en":"The cancellation rate edged down to 2.1% in September.","example_zh":"九月取消率微降到 2.1%。","note_zh":"幅度很小，和 edge up 相对。"},{"id":"slip","group":"down","en":"slip","zh":"下滑","level":"B2","register":"neutral","pattern":"slip + to / below","example_en":"Market share slipped to 18% after the rival's price cut.","example_zh":"竞争对手降价后，市场份额下滑到 18%。","note_zh":"常指小幅失去优势，语气比 plunge 轻。"},{"id":"plunge","group":"down","en":"plunge","zh":"暴跌","level":"B2","register":"neutral","pattern":"plunge + to / by","example_en":"Bookings plunged during the two-week system outage.","example_zh":"系统宕机的两周里，预订量暴跌。","note_zh":"幅度大、速度快，常和 into 或 by 搭配。"},{"id":"tumble","group":"down","en":"tumble","zh":"大幅下跌","level":"B2","register":"neutral","pattern":"tumble + to / by","example_en":"The company's shares tumbled 18% after the profit warning.","example_zh":"盈利预警发布后，公司股价大幅下跌 18%。","note_zh":"常用于股价、估值和市场信心。"},{"id":"plummet","group":"down","en":"plummet","zh":"骤降","level":"C1","register":"neutral","pattern":"plummet + to / by","example_en":"Daily active users plummeted after the app crashed.","example_zh":"应用崩溃后，日活跃用户骤降。","note_zh":"强调直线下跌，语气很强。"},{"id":"contract","group":"down","en":"contract","zh":"收缩","level":"C1","register":"formal","pattern":"contract + by","example_en":"The tablet market contracted by 4% last year.","example_zh":"平板市场去年收缩了 4%。","note_zh":"经济学用语，通常指整体市场规模变小。"},{"id":"stay-the-same","group":"flat","en":"stay the same","zh":"保持不变","level":"A2","register":"spoken","pattern":"stay the same + at","example_en":"The delivery fee stayed the same at RMB 6.","example_zh":"配送费保持在 6 元不变。","note_zh":"最基础的平稳表达。"},{"id":"remain-stable","group":"flat","en":"remain stable","zh":"保持稳定","level":"B1","register":"formal","pattern":"remain stable + at","example_en":"Customer satisfaction remained stable at around 87%.","example_zh":"客户满意度稳定在 87% 左右。","note_zh":"正式报告常用；不要写 remain stably。"},{"id":"hold-steady","group":"flat","en":"hold steady","zh":"保持平稳","level":"B1","register":"neutral","pattern":"hold steady + at","example_en":"Weekly orders held steady at 12,000 through the summer.","example_zh":"整个夏天，每周订单稳定在 12,000 单。","note_zh":"强调在一段时间内没有明显变化。"},{"id":"level-off","group":"flat","en":"level off","zh":"趋平","level":"B1","register":"neutral","pattern":"level off + at","example_en":"Sales leveled off at around RMB 2 million in the fourth quarter.","example_zh":"第四季度销售额在 200 万元左右趋平。","note_zh":"先涨或先跌，然后稳定下来。"},{"id":"plateau","group":"flat","en":"plateau","zh":"进入平台期","level":"B2","register":"neutral","pattern":"plateau + at","example_en":"App usage plateaued at 45 minutes a day.","example_zh":"应用使用时长在每天 45 分钟进入平台期。","note_zh":"名词和动词同形；常暗示增长停止。"},{"id":"flatten-out","group":"flat","en":"flatten out","zh":"走平","level":"B2","register":"neutral","pattern":"flatten out + at","example_en":"The growth curve flattened out after the launch rush.","example_zh":"发布热潮过后，增长曲线走平。","note_zh":"口语和报告都能用，强调曲线变平。"},{"id":"stagnate","group":"flat","en":"stagnate","zh":"停滞","level":"C1","register":"formal","pattern":"stagnate + at","example_en":"Revenue stagnated at RMB 3 million for three quarters.","example_zh":"收入连续三个季度停滞在 300 万元。","note_zh":"带负面评价，表示该涨却没涨。"},{"id":"slightly","group":"magnitude","en":"slightly","zh":"略微","level":"B1","register":"neutral","pattern":"verb + slightly","example_en":"Conversion rose slightly from 3.1% to 3.3%.","example_zh":"转化率从 3.1% 略微上升到 3.3%。","note_zh":"幅度最小的副词之一；形容词是 slight。"},{"id":"steadily","group":"magnitude","en":"steadily","zh":"稳步地","level":"B1","register":"neutral","pattern":"verb + steadily","example_en":"Revenue grew steadily through the first half.","example_zh":"上半年收入稳步增长。","note_zh":"强调持续、均匀，不强调快。"},{"id":"gradually","group":"magnitude","en":"gradually","zh":"逐渐地","level":"B1","register":"neutral","pattern":"verb + gradually","example_en":"Delivery times gradually fell as the new routes took effect.","example_zh":"新路线生效后，配送时间逐渐下降。","note_zh":"强调过程慢，和 suddenly 相对。"},{"id":"sharply","group":"magnitude","en":"sharply","zh":"大幅地","level":"B1","register":"neutral","pattern":"verb + sharply","example_en":"Costs rose sharply after the fuel price increase.","example_zh":"油价上涨后，成本大幅上升。","note_zh":"强调幅度大、速度快；形容词是 sharp。"},{"id":"dramatically","group":"magnitude","en":"dramatically","zh":"剧烈地","level":"B2","register":"neutral","pattern":"verb + dramatically","example_en":"Demand for live commerce grew dramatically in 2026.","example_zh":"2026 年直播电商需求剧烈增长。","note_zh":"比 sharply 更强，常带戏剧性。"},{"id":"significantly","group":"magnitude","en":"significantly","zh":"显著地","level":"B2","register":"formal","pattern":"verb + significantly","example_en":"Customer retention improved significantly after the loyalty program.","example_zh":"会员计划上线后，客户留存显著改善。","note_zh":"正式报告常用；形容词是 significant。"},{"id":"substantially","group":"magnitude","en":"substantially","zh":"大幅度地","level":"B2","register":"formal","pattern":"verb + substantially","example_en":"Warehouse capacity expanded substantially in the second half.","example_zh":"下半年仓库容量大幅扩张。","note_zh":"正式，强调数量或程度大。"},{"id":"marginally","group":"magnitude","en":"marginally","zh":"轻微地","level":"B2","register":"formal","pattern":"verb + marginally","example_en":"The app's rating improved marginally to 4.6.","example_zh":"应用评分轻微提升到 4.6。","note_zh":"非常小、几乎可忽略的变化。"},{"id":"modestly","group":"magnitude","en":"modestly","zh":"温和地","level":"B2","register":"formal","pattern":"verb + modestly","example_en":"Ad spend rose modestly, in line with the sales plan.","example_zh":"广告投入温和上升，与销售计划一致。","note_zh":"幅度不大但可见，比 slightly 稍强。"},{"id":"drastically","group":"magnitude","en":"drastically","zh":"急剧地","level":"C1","register":"neutral","pattern":"verb + drastically","example_en":"The company drastically cut its delivery subsidies.","example_zh":"公司急剧削减了配送补贴。","note_zh":"常修饰 cut、reduce、change，语气很强。"},{"id":"rapidly","group":"speed","en":"rapidly","zh":"迅速地","level":"B2","register":"neutral","pattern":"verb + rapidly","example_en":"Same-day delivery expanded rapidly across tier-2 cities.","example_zh":"当日达在二线城市迅速扩张。","note_zh":"强调速度快；形容词是 rapid。"},{"id":"suddenly","group":"speed","en":"suddenly","zh":"突然","level":"B1","register":"neutral","pattern":"verb + suddenly","example_en":"Traffic suddenly dropped when the app crashed.","example_zh":"应用崩溃时，流量突然下降。","note_zh":"强调没有预兆；形容词是 sudden。"},{"id":"abruptly","group":"speed","en":"abruptly","zh":"骤然","level":"B2","register":"formal","pattern":"verb + abruptly","example_en":"The promotion ended abruptly, and orders fell the next day.","example_zh":"促销骤然结束，第二天订单就下降了。","note_zh":"比 suddenly 更正式，常带负面意味。"},{"id":"accelerate","group":"speed","en":"accelerate","zh":"加速","level":"B2","register":"neutral","pattern":"growth accelerated","example_en":"Growth accelerated in the third quarter after the new pricing plan.","example_zh":"新定价方案推出后，增长在第三季度加速。","note_zh":"强调速度变快，不是数值变大。"},{"id":"decelerate","group":"speed","en":"decelerate","zh":"减速","level":"B2","register":"formal","pattern":"growth decelerated","example_en":"Revenue kept rising, but growth decelerated in the second half.","example_zh":"收入仍在上升，但下半年增速放缓。","note_zh":"常和 growth、momentum 搭配。"},{"id":"volatile","group":"speed","en":"volatile","zh":"波动剧烈","level":"B2","register":"formal","pattern":"be volatile / a volatile market","example_en":"Demand was volatile around the holiday season.","example_zh":"节日前后需求波动剧烈。","note_zh":"形容上下大幅变化，不是单向趋势。"},{"id":"fluctuate","group":"speed","en":"fluctuate","zh":"波动","level":"B2","register":"formal","pattern":"fluctuate between … and …","example_en":"Order volume fluctuated between 8,000 and 12,000 a week.","example_zh":"每周订单量在 8,000 到 12,000 之间波动。","note_zh":"不要写 fluctuated up and down，意思重复。"},{"id":"peak","group":"peak","en":"peak","zh":"达到峰值","level":"B1","register":"neutral","pattern":"peak at / peak in","example_en":"Orders peaked at 15,000 on the first day of the sale.","example_zh":"大促第一天订单达到 15,000 的峰值。","note_zh":"peak at 接数值，peak in 接时间。"},{"id":"reach-a-peak-of","group":"peak","en":"reach a peak of","zh":"达到……的峰值","level":"B1","register":"neutral","pattern":"reach a peak of + number","example_en":"Revenue reached a peak of RMB 92 million in the fourth quarter.","example_zh":"收入在第四季度达到 9,200 万元的峰值。","note_zh":"比 peak at 更完整，适合正式描述。"},{"id":"hit-a-high-of","group":"peak","en":"hit a high of","zh":"创下……的新高","level":"B2","register":"neutral","pattern":"hit a high of + number","example_en":"The app hit a high of 4.9 million daily users in August.","example_zh":"这款应用在八月创下 490 万日活的新高。","note_zh":"强调创纪录，常和 high 搭配。"},{"id":"trough","group":"peak","en":"trough","zh":"低谷","level":"C1","register":"formal","pattern":"reach a trough of","example_en":"Sales reached a trough of RMB 1.8 million in February.","example_zh":"销售额在二月跌到 180 万元的低谷。","note_zh":"技术性较强；口语里常说 low point。"},{"id":"reach-a-low-of","group":"peak","en":"reach a low of","zh":"跌到……的低点","level":"B2","register":"neutral","pattern":"reach a low of + number","example_en":"Cancellations reached a low of 1.8% in November.","example_zh":"取消率在十一月降到 1.8% 的低点。","note_zh":"和 reach a peak of 相对。"},{"id":"bottom-out","group":"peak","en":"bottom out","zh":"触底","level":"B2","register":"neutral","pattern":"bottom out + at","example_en":"Churn bottomed out at 1.6% before improving in spring.","example_zh":"流失率在 1.6% 触底，随后在春天改善。","note_zh":"强调跌到最低后不再跌，常暗示要反弹。"},{"id":"turning-point","group":"peak","en":"turning point","zh":"拐点","level":"B2","register":"neutral","pattern":"mark a turning point","example_en":"The third quarter marked a turning point for the business.","example_zh":"第三季度成为业务的拐点。","note_zh":"方向发生变化的时刻，不一定是最高或最低点。"},{"id":"reverse-course","group":"peak","en":"reverse course","zh":"转向","level":"C1","register":"formal","pattern":"reverse course","example_en":"After two quarters of decline, sales reversed course in June.","example_zh":"连续两个季度下滑后，销售额在六月转向。","note_zh":"强调方向反转，常和 after 搭配。"},{"id":"the-highest","group":"comparison","en":"the highest","zh":"最高的","level":"A2","register":"neutral","pattern":"the highest + noun","example_en":"East China had the highest revenue at RMB 520,000.","example_zh":"华东收入最高，为 52 万元。","note_zh":"最高级前面通常加 the。"},{"id":"the-lowest","group":"comparison","en":"the lowest","zh":"最低的","level":"A2","register":"neutral","pattern":"the lowest + noun","example_en":"Northeast had the lowest revenue at RMB 180,000.","example_zh":"东北收入最低，为 18 万元。","note_zh":"和 the highest 成对使用。"},{"id":"higher-than","group":"comparison","en":"higher than","zh":"高于","level":"A2","register":"neutral","pattern":"A is higher than B","example_en":"Revenue in the east was 90,000 higher than in the south.","example_zh":"华东收入比华南高 9 万元。","note_zh":"比较级后接 than，不接 to。"},{"id":"compared-with","group":"comparison","en":"compared with","zh":"与……相比","level":"B1","register":"neutral","pattern":"X, compared with Y","example_en":"Gross margin fell to 38%, compared with 44% a year earlier.","example_zh":"毛利率降到 38%，而一年前是 44%。","note_zh":"比 compared to 更常用，尤其在有具体数字时。"},{"id":"whereas","group":"comparison","en":"whereas","zh":"而","level":"B1","register":"formal","pattern":"clause + whereas + clause","example_en":"Revenue grew in the east, whereas it stagnated in the northeast.","example_zh":"华东收入增长，而东北停滞。","note_zh":"连接两个完整从句，前后形成对比。"},{"id":"while","group":"comparison","en":"while","zh":"而 / 同时","level":"B1","register":"neutral","pattern":"clause + while + clause","example_en":"Orders rose, while the average order value fell.","example_zh":"订单上升，而平均客单价下降。","note_zh":"比 whereas 口语化，也可表示同时发生。"},{"id":"respectively","group":"comparison","en":"respectively","zh":"分别","level":"B2","register":"formal","pattern":"A and B + respectively","example_en":"East and South China recorded RMB 520,000 and RMB 430,000 respectively.","example_zh":"华东和华南分别录得 52 万元和 43 万元。","note_zh":"数值顺序必须和前面提到的对象一致。"},{"id":"twice-as-high-as","group":"comparison","en":"twice as high as","zh":"是……的两倍","level":"B2","register":"neutral","pattern":"A is twice as high as B","example_en":"East China's revenue was almost twice as high as Northeast's.","example_zh":"华东收入几乎是东北的两倍。","note_zh":"不要写 twice higher than。"},{"id":"a-gap-of","group":"comparison","en":"a gap of","zh":"相差","level":"B2","register":"neutral","pattern":"a gap of + number","example_en":"There was a gap of RMB 90,000 between the top two markets.","example_zh":"前两个市场之间相差 9 万元。","note_zh":"gap 可接具体数值或 percentage points。"},{"id":"overtake","group":"comparison","en":"overtake","zh":"超过","level":"B2","register":"neutral","pattern":"A overtook B","example_en":"Central China overtook Southwest to take fourth place.","example_zh":"华中超过西南，升至第四。","note_zh":"强调名次变化，不只是数值更高。"},{"id":"the-second-largest","group":"comparison","en":"the second-largest","zh":"第二大的","level":"B1","register":"neutral","pattern":"the second-largest + noun","example_en":"South China was the second-largest market, at RMB 430,000.","example_zh":"华南是第二大市场，为 43 万元。","note_zh":"second-largest 中间有连字符。"},{"id":"broadly-in-line-with","group":"comparison","en":"broadly in line with","zh":"与……大致一致","level":"C1","register":"formal","pattern":"be broadly in line with","example_en":"Ad spend was broadly in line with the annual plan.","example_zh":"广告投入与年度计划大致一致。","note_zh":"正式表达，表示差异不大。"},{"id":"account-for","group":"share","en":"account for","zh":"占（比例）","level":"B1","register":"neutral","pattern":"X accounts for N% of Y","example_en":"Mobile accounts for 52% of total revenue.","example_zh":"手机应用占总收入的 52%。","note_zh":"最常用的占比动词；不要和解释义的 account for 混淆。"},{"id":"make-up","group":"share","en":"make up","zh":"构成","level":"B1","register":"neutral","pattern":"X makes up N% of Y","example_en":"Private-label goods make up 18% of sales.","example_zh":"自有品牌商品占销售额的 18%。","note_zh":"和 account for 接近，更强调组成。"},{"id":"represent","group":"share","en":"represent","zh":"占 / 代表","level":"B2","register":"formal","pattern":"X represents N% of Y","example_en":"The east represents a quarter of total revenue.","example_zh":"华东占总收入四分之一。","note_zh":"正式，适合报告。"},{"id":"dominate","group":"share","en":"dominate","zh":"占据主导","level":"B2","register":"neutral","pattern":"X dominates the market","example_en":"The mobile app dominates the market with a 52% share.","example_zh":"手机应用以 52% 的份额主导市场。","note_zh":"通常指份额明显领先，至少接近一半。"},{"id":"the-lions-share","group":"share","en":"the lion's share","zh":"最大的一份","level":"C1","register":"neutral","pattern":"take / account for the lion's share","example_en":"The mobile app takes the lion's share of revenue.","example_zh":"手机应用拿走了收入中最大的一份。","note_zh":"当代商务写作仍常用；不要用于只领先一点点的情形。"},{"id":"neck-and-neck","group":"share","en":"neck and neck","zh":"并驾齐驱","level":"B2","register":"neutral","pattern":"be neck and neck","example_en":"The two apps are neck and neck, at 31% and 30%.","example_zh":"两款应用并驾齐驱，份额分别为 31% 和 30%。","note_zh":"差距通常只有一两个百分点。"},{"id":"a-distant-second","group":"share","en":"a distant second","zh":"远远落后的第二名","level":"B2","register":"neutral","pattern":"be a distant second","example_en":"The website is a distant second, with less than half the leader's share.","example_zh":"网站远远排在第二，份额不到领先者的一半。","note_zh":"差距明显时用，比 the second-largest 更有评价色彩。"},{"id":"gain-ground","group":"share","en":"gain ground","zh":"抢占份额","level":"B2","register":"neutral","pattern":"gain ground on / in","example_en":"Mini programs gained ground in lower-tier cities.","example_zh":"小程序在下沉市场抢占份额。","note_zh":"强调相对份额上升，常和 on 搭配。"},{"id":"lose-ground","group":"share","en":"lose ground","zh":"失去份额","level":"B2","register":"neutral","pattern":"lose ground to","example_en":"Offline stores lost ground to same-day delivery.","example_zh":"线下门店的份额被当日达抢走。","note_zh":"和 gain ground 相对。"},{"id":"percentage-points","group":"share","en":"percentage points","zh":"百分点","level":"B2","register":"formal","pattern":"rise / fall + N percentage points","example_en":"Its share rose 6 percentage points, from 46% to 52%.","example_zh":"它的份额上升 6 个百分点，从 46% 到 52%。","note_zh":"份额从 46% 到 52% 是 6 个百分点，不是 6%。"},{"id":"fragmented-market","group":"share","en":"a fragmented market","zh":"分散的市场","level":"C1","register":"formal","pattern":"a fragmented market","example_en":"The market remains fragmented, with no player above 12%.","example_zh":"市场仍然分散，没有玩家超过 12%。","note_zh":"份额分散、没有明显领先者。"},{"id":"consolidated-market","group":"share","en":"a consolidated market","zh":"集中的市场","level":"C1","register":"formal","pattern":"a consolidated market","example_en":"The top three players control most of the market, leaving a consolidated field.","example_zh":"前三名控制大部分市场，格局高度集中。","note_zh":"少数玩家占据大部分份额。"},{"id":"about","group":"approx","en":"about","zh":"大约","level":"A2","register":"neutral","pattern":"about + number","example_en":"About 60% of orders come from the app.","example_zh":"大约 60% 的订单来自应用。","note_zh":"最常用的近似词。"},{"id":"roughly","group":"approx","en":"roughly","zh":"大致","level":"B1","register":"neutral","pattern":"roughly + number","example_en":"Revenue was roughly RMB 42 million in the first quarter.","example_zh":"第一季度收入大致为 4,200 万元。","note_zh":"比 about 稍正式，强调估算。"},{"id":"approximately","group":"approx","en":"approximately","zh":"大约","level":"B1","register":"formal","pattern":"approximately + number","example_en":"Approximately 1,500 customers joined the loyalty program.","example_zh":"大约 1,500 名客户加入了会员计划。","note_zh":"正式写作常用。"},{"id":"just-under","group":"approx","en":"just under","zh":"略低于","level":"B1","register":"neutral","pattern":"just under + number","example_en":"Just under half of the orders came from the mini program.","example_zh":"略低于一半的订单来自小程序。","note_zh":"比 almost 更精确地表示差一点。"},{"id":"just-over","group":"approx","en":"just over","zh":"略高于","level":"B1","register":"neutral","pattern":"just over + number","example_en":"Just over 30% of users opened the app every day.","example_zh":"略高于 30% 的用户每天打开应用。","note_zh":"和 just under 相对。"},{"id":"nearly","group":"approx","en":"nearly","zh":"接近","level":"A2","register":"neutral","pattern":"nearly + number","example_en":"Nearly 40% of revenue came from the east.","example_zh":"接近 40% 的收入来自华东。","note_zh":"后面接数字，不写 near 40% 表示近似。"},{"id":"around","group":"approx","en":"around","zh":"在……左右","level":"A2","register":"neutral","pattern":"around + number","example_en":"Average delivery time stayed around 28 minutes.","example_zh":"平均配送时间保持在 28 分钟左右。","note_zh":"口语里很常用。"},{"id":"per-capita","group":"approx","en":"per capita","zh":"人均","level":"C1","register":"formal","pattern":"per capita + noun","example_en":"Spending per capita rose to RMB 320 a month.","example_zh":"人均月支出上升到 320 元。","note_zh":"正式统计用语，注意 per capita 位置。"},{"id":"headwinds","group":"idioms","en":"headwinds","zh":"逆风 / 不利因素","level":"C1","register":"business","pattern":"face / weigh on + headwinds","example_en":"Regulatory headwinds weighed on margins in the second half.","example_zh":"监管逆风在下半年拖累了利润率。","note_zh":"当代财报和新闻常用，指阻碍增长的因素。"},{"id":"tailwinds","group":"idioms","en":"tailwinds","zh":"顺风 / 有利因素","level":"C1","register":"business","pattern":"benefit from + tailwinds","example_en":"The EV maker benefited from policy tailwinds in smaller cities.","example_zh":"这家新能源车企受益于小城市的政策顺风。","note_zh":"和 headwinds 相对。"},{"id":"gain-traction","group":"idioms","en":"gain traction","zh":"开始获得认可","level":"B2","register":"business","pattern":"gain traction with / in","example_en":"The subscription tier is gaining traction in tier-2 cities.","example_zh":"订阅档在二线城市开始获得认可。","note_zh":"新产品或新策略开始被市场接受。"},{"id":"move-the-needle","group":"idioms","en":"move the needle","zh":"带来明显改变","level":"C1","register":"business","pattern":"barely / really move the needle","example_en":"The discount lifted orders but barely moved the needle on margin.","example_zh":"折扣提升了订单，但对利润率几乎没有带来明显改变。","note_zh":"常和 barely、hardly 连用。"},{"id":"double-down","group":"idioms","en":"double down","zh":"加倍投入","level":"C1","register":"business","pattern":"double down on","example_en":"The company is doubling down on live commerce.","example_zh":"公司正在加倍投入直播电商。","note_zh":"在已有方向上投入更多资源。"},{"id":"turn-the-corner","group":"idioms","en":"turn the corner","zh":"开始好转","level":"C1","register":"business","pattern":"turn the corner","example_en":"After three loss-making quarters, the unit has turned the corner.","example_zh":"连续三个季度亏损后，这个业务单元开始好转。","note_zh":"强调从困难期走出来。"},{"id":"a-tale-of-two-halves","group":"idioms","en":"a tale of two halves","zh":"前后两重天","level":"C1","register":"journalism","pattern":"be a tale of two halves","example_en":"2026 was a tale of two halves: a record spring and a flat fall.","example_zh":"2026 年如同两重天：春天创纪录，秋天却停滞。","note_zh":"新闻和财报电话会常用。"},{"id":"hockey-stick-growth","group":"idioms","en":"hockey-stick growth","zh":"曲棍球杆式增长","level":"C1","register":"business","pattern":"hockey-stick growth","example_en":"The pitch promised hockey-stick growth, but the data showed a plateau.","example_zh":"路演承诺曲棍球杆式增长，但数据显示的是平台期。","note_zh":"前期平缓、后期突然陡升的曲线。"},{"id":"a-bump-in-the-road","group":"idioms","en":"a bump in the road","zh":"小挫折","level":"B2","register":"business","pattern":"be a bump in the road","example_en":"The recall is a bump in the road, not a structural decline.","example_zh":"这次召回只是小挫折，不是结构性下滑。","note_zh":"临时问题，不影响长期趋势。"},{"id":"the-bottom-line","group":"idioms","en":"the bottom line","zh":"净利润 / 最终结论","level":"B2","register":"business","pattern":"the bottom line","example_en":"The bottom line improved by 300 basis points.","example_zh":"净利润率提升了 300 个基点。","note_zh":"财务语境指净利润；日常语境指最终结论。"},{"id":"first","group":"sequence","en":"first","zh":"首先","level":"A2","register":"neutral","pattern":"First, + clause","example_en":"First, the customer places the order in the app.","example_zh":"首先，顾客在应用里下单。","note_zh":"顺序词放在句首，后面加逗号。"},{"id":"next","group":"sequence","en":"next","zh":"接着","level":"A2","register":"neutral","pattern":"Next, + clause","example_en":"Next, the restaurant confirms the order and starts cooking.","example_zh":"接着，餐厅确认订单并开始制作。","note_zh":"表示紧接的下一步。"},{"id":"after-that","group":"sequence","en":"after that","zh":"在那之后","level":"A2","register":"neutral","pattern":"After that, + clause","example_en":"After that, a courier picks up the food from the restaurant.","example_zh":"之后，骑手到餐厅取餐。","note_zh":"用来连接两个已经提过的步骤。"},{"id":"once","group":"sequence","en":"once","zh":"一旦……就……","level":"B1","register":"neutral","pattern":"Once + clause, + clause","example_en":"Once the order is confirmed, the restaurant starts cooking.","example_zh":"订单一经确认，餐厅就开始制作。","note_zh":"比 when 更强调前一步完成。"},{"id":"finally","group":"sequence","en":"finally","zh":"最后","level":"A2","register":"neutral","pattern":"Finally, + clause","example_en":"Finally, the courier hands the order to the customer.","example_zh":"最后，骑手把订单交给顾客。","note_zh":"收尾步骤用，不要和 at last 混淆。"},{"id":"be-placed","group":"sequence","en":"be placed","zh":"被提交／下单","level":"B1","register":"formal","pattern":"be placed in / with","example_en":"The order is placed in the app and paid online.","example_zh":"订单在应用里提交并在线支付。","note_zh":"流程图的被动语态常用一般现在时。"},{"id":"be-confirmed","group":"sequence","en":"be confirmed","zh":"被确认","level":"B1","register":"formal","pattern":"be confirmed by","example_en":"The order is confirmed by the restaurant within a minute.","example_zh":"订单一分钟内由餐厅确认。","note_zh":"动作发出者用 by 引出。"},{"id":"be-assigned","group":"sequence","en":"be assigned to","zh":"被分配给","level":"B2","register":"formal","pattern":"be assigned to + person / place","example_en":"The delivery is assigned to the nearest available courier.","example_zh":"这单被分配给最近的可用骑手。","note_zh":"assign 后面接 to，不接 for。"},{"id":"be-handed","group":"sequence","en":"be handed to","zh":"被交给","level":"B2","register":"formal","pattern":"be handed to + person","example_en":"The food is handed to the customer at the building entrance.","example_zh":"餐品在楼栋入口交给顾客。","note_zh":"hand over 也可以，但后面不直接接人。"},{"id":"in-turn","group":"sequence","en":"in turn","zh":"依次","level":"C1","register":"formal","pattern":"clause + in turn","example_en":"Each order is checked, packed, and handed over in turn.","example_zh":"每个订单依次经过检查、打包和交付。","note_zh":"强调按顺序一个接一个。"},{"id":"in-tandem","group":"mixed","en":"in tandem","zh":"同步地","level":"B2","register":"neutral","pattern":"move / grow in tandem","example_en":"Revenue and margin grew in tandem through the second half.","example_zh":"下半年收入和利润率同步增长。","note_zh":"两组数据同向变化时用。"},{"id":"outpace","group":"mixed","en":"outpace","zh":"超过……的速度","level":"B2","register":"neutral","pattern":"A outpaces B","example_en":"Revenue growth outpaced the increase in operating costs.","example_zh":"收入增长超过了运营成本的增长。","note_zh":"强调一方速度更快。"},{"id":"widen","group":"mixed","en":"widen","zh":"扩大","level":"B2","register":"neutral","pattern":"gap / margin widens","example_en":"The margin widened from 8.9% to 12.6% over the year.","example_zh":"利润率在这一年里从 8.9% 扩大到 12.6%。","note_zh":"可形容差距、利润率、缺口。"},{"id":"narrow","group":"mixed","en":"narrow","zh":"缩小","level":"B2","register":"neutral","pattern":"gap / margin narrows","example_en":"The gap between revenue and cost narrowed in the final quarter.","example_zh":"最后一个季度，收入和成本之间的差距缩小了。","note_zh":"和 widen 相对。"},{"id":"decouple","group":"mixed","en":"decouple","zh":"脱钩","level":"C1","register":"formal","pattern":"A decouples from B","example_en":"Revenue kept rising while costs decoupled from sales.","example_zh":"收入继续上升，成本却与销售额脱钩。","note_zh":"高级表达，指原本同步的变量分开。"},{"id":"on-the-back-of","group":"mixed","en":"on the back of","zh":"借助……","level":"C1","register":"neutral","pattern":"on the back of + noun","example_en":"Margin improved on the back of lower delivery costs.","example_zh":"借助配送成本下降，利润率有所改善。","note_zh":"表示某结果由前一因素推动。"}]},"errors":{"version":1,"errors":[{"id":"rose-of","level":"B1","family":"trend","wrong_en":"Revenue rose of 18% in the "flat","wrong_en":"Customer satisfaction remained stably at 87%.","right_en":"Customer satisfaction remained stable at 87%.","why_zh":"remain 后面接形容词 stable，不接副词 stably。","category":"trend"},{"id":"fluctuated-up-and-down","level":"B2","family":"speed","wrong_en":"Order volume fluctuated up and down all year.","right_en":"Order volume fluctuated all year.","why_zh":"fluctuate 本身已经包含上下变化，up and down 重复。","category":"trend"},{"id":"dangling-compared","level":"C1","family":"comparison","wrong_en":"Compared with last year, sales increased this year.","right_en":"Sales increased this year, compared with last year.","why_zh":"Compared with 的逻辑主语要和主句主语一致，否则读者不知道谁和谁比。","category":"comparison"},{"id":"process-participle","level":"B1","wrong_en":"First, the order is place in the app.","right_en":"First, the order is placed in the app.","why_zh":"被动语态用过去分词 placed，不是原形 place。","category":"process"},{"id":"mixed-while-same","level":"B2","wrong_en":"Revenue rose, while margin rose as well.","right_en":"Revenue and margin rose in tandem.","why_zh":"while 用来对比相反或不同的趋势；同向变化用 in tandem 或 and。","category":"linking"}],"categories":[{"id":"trend","title_zh":"趋势动词与介词","title_en":"Trend verbs and prepositions"},{"id":"comparison","title_zh":"比较与最高级","title_en":"Comparison and superlatives"},{"id":"countability","title_zh":"数量与可数性","title_en":"Amount and countability"},{"id":"share","title_zh":"比例与百分点","title_en":"Shares and percentage points"},{"id":"process","title_zh":"流程与被动","title_en":"Process and passive voice"},{"id":"linking","title_zh":"连接与对比","title_en":"Linking and contrast"}]}}</script>

      var allowed = transitions[current];

      get: function () { return current; },

          var value = series.values[categoryIndex];
          var bottom = y(base);
          var top = y(base + value);
          var rect = svg.rect(root, {
            x: center - barWidth / 2,
            y: top,
            width: barWidth,
            height: Math.max(0, bottom - top),
            class: 'bar-segment',
            fill: 'var(--' + series.color + ')',
            'data-series': series.id,
            'data-index': categoryIndex
          });
          rect.addEventListener('pointerenter', function () {
            common.emphasize(lab.plot, series.id);
            showTip(seriesIndex, categoryIndex, center, top);
          });
          rect.addEventListener('pointerleave', function () {
            common.clearEmphasis(lab.plot);
            common.hideTip(lab.plot);
          });
          bars.push(rect);
          NC.bindValueClick(rect, lab, (function (si, ci, node) {
            return function () {
              return {
                root: root,
                x: center,
                y: node.getAttribute('y'),
                value: dataset.series[si].values[ci],
                min: 0,
                max: max,
                step: dataset.step || 5,
                label: category.label_en + ' ' + dataset.series[si].name_en,
                unit: dataset.unit,
                set: function (value) { dataset.series[si].values[ci] = value; },
                onCommit: function () {
                  lab.changed(true);
                  lab.renderer.render(lab);
                  lab.refresh(false);
                }
              };
            };
          })(seriesIndex, categoryIndex, rect));

          var stackHandle = svg.mkHandle(handleLayer, center, top, {
            min: 0,
            max: max,
            now: value,
            radius: common.screenPx(root, 4),
            hitRadius: common.screenPx(root, 14),
            label: category.label_en + ' ' + series.name_en,
            valueText: tipText(dataset, seriesIndex, categoryIndex),
            data: { series: seriesIndex, index: categoryIndex, category: category.id }
          });
          NC.drag.bind(stackHandle.group, {
            axis: 'y',
            min: 0,
            max: max,
            step: dataset.step || 5,
            pixelSpan: plot.height,
            get: function () { return dataset.series[seriesIndex].values[categoryIndex]; },
            set: function (next) {
              var total = dataset.series.reduce(function (sum, item) { return sum + item.values[categoryIndex]; }, 0);
              var room = max - (total - dataset.series[seriesIndex].values[categoryIndex]);
              dataset.series[seriesIndex].values[categoryIndex] = Math.max(0, Math.min(room, next));
            },
            onStart: function () { showTip(seriesIndex, categoryIndex, center, top); },
            onUpdate: function () { lab.changed(false); showTip(seriesIndex, categoryIndex, center, y(dataset.series[seriesIndex].values[categoryIndex])); },
            onCommit: function () { lab.changed(true); },
            onEnd: function () { showTip(seriesIndex, categoryIndex, center, y(dataset.series[seriesIndex].values[categoryIndex])); },
            valueText: function (next) { return category.label_en + ', ' + NC.fmt.value(next, dataset.unit, 0); }
          });
          NC.bindValueClick(stackHandle.group, lab, (function (si, ci, px) {
            return function () {
              return {
                root: root,
                x: px,
                y: y(dataset.series[si].values[ci]),
                value: dataset.series[si].values[ci],
                min: 0,
                max: max,
                step: dataset.step || 5,
                label: category.label_en + ' ' + dataset.series[si].name_en,
                unit: dataset.unit,
                set: function (next) { dataset.series[si].values[ci] = next; },
                onCommit: function () { lab.changed(true); }
              };
            };
          })(seriesIndex, categoryIndex, center));
          handles.push({ handle: stackHandle, seriesIndex: seriesIndex, categoryIndex: categoryIndex });
          segments.push({ rect: rect, seriesIndex: seriesIndex, categoryIndex: categoryIndex });
          base += value;
        });
      } else {
        var start = center - groupWidth / 2;
        dataset.series.forEach(function (series, seriesIndex) {
          var value = series.values[categoryIndex];
          var x = start + seriesIndex * (barWidth + barGap);
          var rect = svg.rect(root, {
            x: x,
            y: y(value),
            width: barWidth,
            height: Math.max(0, plot.bottom - y(value)),
            class: 'bar-current',
            fill: 'var(--' + series.color + ')',
            'data-series': series.id,
            'data-index': categoryIndex
          });
          rect.addEventListener('pointerenter', function () {
            common.emphasize(lab.plot, series.id);
            showTip(seriesIndex, categoryIndex, x + barWidth / 2, y(value));
          });
          rect.addEventListener('pointerleave', function () {
            common.clearEmphasis(lab.plot);
            common.hideTip(lab.plot);
          });
          bars.push(rect);
          NC.bindValueClick(rect, lab, (function (si, ci, px) {
            return function () {
              return {
                root: root,
                x: px,
                y: y(dataset.series[si].values[ci]),
                value: dataset.series[si].values[ci],
                min: 0,
                max: max,
                step: dataset.step || 5,
                label: category.label_en + ' ' + dataset.series[si].name_en,
                unit: dataset.unit,
                set: function (value) { dataset.series[si].values[ci] = value; },
                onCommit: function () { lab.changed(true); }
              };
            };
          })(seriesIndex, categoryIndex, x + barWidth / 2));

          var handle = svg.mkHandle(handleLayer, x + barWidth / 2, y(value), {
            min: 0,
            max: max,
            now: value,
            radius: common.screenPx(root, 4.5),
            hitRadius: common.screenPx(root, 15),
            label: category.label_en + ' ' + series.name_en,
            valueText: tipText(dataset, seriesIndex, categoryIndex),
            data: { series: seriesIndex, index: categoryIndex, category: category.id }
          });
          bindBar(handle.group, lab, seriesIndex, categoryIndex, handle, function () {
            showTip(seriesIndex, categoryIndex, x + barWidth / 2, y(series.values[categoryIndex]));
          });
          NC.bindValueClick(handle.group, lab, (function (si, ci, px) {
            return function () {
              return {
                root: root,
                x: px,
                y: y(dataset.series[si].values[ci]),
                value: dataset.series[si].values[ci],
                min: 0,
                max: max,
                step: dataset.step || 5,
                label: category.label_en + ' ' + dataset.series[si].name_en,
                unit: dataset.unit,
                set: function (value) { dataset.series[si].values[ci] = value; },
                onCommit: function () { lab.changed(true); }
              };
            };
          })(seriesIndex, categoryIndex, x + barWidth / 2));
          handle.group.addEventListener('pointerenter', function () {
            showTip(seriesIndex, categoryIndex, x + barWidth / 2, y(series.values[categoryIndex]));
          });
          handle.group.addEventListener('pointerleave', function () { common.hideTip(lab.plot); });
          handles.push({ handle: handle, seriesIndex: seriesIndex, categoryIndex: categoryIndex });
        });
      }

      if (layout === 'stacked') {
        labels.push({
          node: common.placeValueLabel(root, center, y(groupTotals[categoryIndex]) - 10, NC.fmt.number(groupTotals[categoryIndex], 0), {
            top: plot.top + 12
          })
        });
      } else {
        dataset.series.forEach(function (series, seriesIndex) {
          if (compact && seriesIndex !== 0) return;
          var start = center - groupWidth / 2;
          var x = start + seriesIndex * (barWidth + barGap);
          labels.push({
            node: common.placeValueLabel(root, x + barWidth / 2, y(series.values[categoryIndex]) - 8, NC.fmt.number(series.values[categoryIndex], 0), {
              top: plot.top + 12,

            categoryIndex: categoryIndex
          });

    });

    legend(lab, dataset);
    state.bars = bars;
    state.handles = handles;
    state.segments = segments;
    state.labels = labels;
    state.barWidth = barWidth;
    state.barGap = barGap;

    state.groupTotals = groupTotals;
    state.root = root;
