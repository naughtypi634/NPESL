<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>短语搭配 Collocations</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --rule:#e5e5ea;
    --surface:#f5f5f7;
    --accent:var(--blue, #0071e3); --tint:var(--blue-tint, #e8f2ff);
    --on-accent:var(--on-blue, #ffffff);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable",
      "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f7; --muted:#98989d; --rule:#2c2c2e;
      --surface:#1c1c1e;
      --accent:var(--blue, #0a84ff); --tint:var(--blue-tint, #0d2a45);
      color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
    -webkit-font-smoothing:antialiased; }
  .page { max-width:760px; margin:0 auto;
    padding:clamp(40px,7vh,72px) 24px 96px; }
  h1 { margin:0; font-size:clamp(2rem,6vw,2.8rem); font-weight:700;
    letter-spacing:-0.03em; line-height:1.08; }
  .sub { margin:10px 0 0; color:var(--muted); font-size:16px; }
  .sub a { color:var(--accent); text-decoration:none; }
  .crumbs { margin:0 0 10px; color:var(--muted); font-size:13px; }
  .crumbs a { color:var(--muted); text-decoration:none; }
  .crumbs a:hover { color:var(--accent); }
  .level1 { display:flex; gap:8px; margin:18px 0 10px; }
  .level1 button { appearance:none; display:inline-flex; align-items:center; gap:5px;
    font:inherit; font-size:14px; padding:8px 16px;
    border:1px solid var(--rule); border-radius:var(--radius-pill, 999px); background:transparent;
    color:var(--fg); cursor:pointer; }
  .level1 button:hover { background:var(--surface); }
  .level1 button[aria-pressed="true"] { background:var(--accent);
    border-color:var(--accent); color:var(--on-accent); }
  /* 箭头提示这一栏可以展开/收起：收起指向右，展开转向下 */
  .level1 .mode-arw { display:inline-block; font-size:1.1em; line-height:1;
    opacity:.72; transition:transform .18s ease; }
  .level1 button[aria-expanded="true"] .mode-arw { transform:rotate(90deg); }
  @media (prefers-reduced-motion: reduce) {
    .level1 .mode-arw { transition:none; }
  }
  .hint { margin:14px 0 0; color:var(--muted); font-size:14px; }
  .group .theme { margin:24px 0 6px; font-size:16px; font-weight:600; }
  .group .theme a { color:var(--fg); text-decoration:none; }
  .group .theme a:hover { color:var(--accent); }
  .theme-go { float:right; font-size:12px; font-weight:400; color:var(--accent); }
  /* [hidden] 会被 .chips{display:flex} 覆盖，必须显式压回去 */
  [hidden] { display:none !important; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .chips button, .chips a { appearance:none; display:inline-block;
    font:inherit; font-size:14px; padding:7px 14px; line-height:1.2;
    border:1px solid var(--rule); border-radius:var(--radius-pill, 999px); background:transparent;
    color:var(--fg); text-decoration:none; cursor:pointer; }
  .chips button:hover, .chips a:hover { background:var(--surface); }
  .chips button[aria-pressed="true"] { background:var(--accent);
    border-color:var(--accent); color:var(--on-accent); }
  .topbar { display:flex; flex-wrap:wrap; align-items:center;
    justify-content:space-between; gap:10px; margin:18px 0 10px; }
  .level1 { margin:0; }
  .voice-seg { display:inline-flex; align-items:center; border:1px solid var(--rule);
    border-radius:var(--radius-pill, 999px); overflow:hidden; }
  .voice-ico { display:inline-flex; align-items:center; padding-left:12px;
    color:var(--muted); }
  .voice-ico svg { width:15px; height:15px; }
  .voice-seg button { appearance:none; border:0; background:transparent;
    color:var(--fg); font:inherit; font-size:14px; padding:6px 14px; cursor:pointer; }
  .voice-seg button + button { border-left:1px solid var(--rule); }
  .voice-seg button[aria-pressed="true"] { background:var(--accent);
    color:var(--on-accent); }
  .prow { display:flex; align-items:baseline; gap:12px; width:100%;
    text-align:left; font:inherit; color:inherit; background:var(--bg);
    border:1px solid var(--rule); border-radius:var(--radius-control, 14px); padding:12px 14px;
    cursor:pointer; }
  .prow:hover { background:var(--surface); }
  .prow .en { font-size:17px; font-weight:600; min-width:0; }
  .prow .zh { margin-left:auto; max-width:48%; text-align:right; color:var(--muted);
    font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prow .arw { color:var(--muted); transition:transform .15s ease; }
  .prow[aria-expanded="true"] .arw { transform:rotate(90deg); }
  .card { margin:8px 0 16px; padding:16px; border:1px solid var(--rule);
    border-radius:var(--radius-card, 16px); background:var(--bg); }
  .card-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
  .card .w { display:inline-block; padding:7px 14px; font-size:14px; font-weight:600;
    border:1px solid var(--rule); border-radius:var(--radius-pill, 999px);
    background:transparent; color:var(--fg);
    transition:background-color .18s ease, color .18s ease, border-color .18s ease; }
  .card .ipa { color:var(--muted); font-size:13px; }
  .card .playbtn { appearance:none; border:0; background:transparent; padding:0;
    display:inline-flex; align-items:center; cursor:pointer; color:inherit; }
  /* 可播放提示：小圆播放件；播放时一圈向外扩散的渐变脉冲 */
  .card .playbtn .play { position:relative; display:inline-flex; align-items:center;
    justify-content:center; width:18px; height:18px; flex:none;
    border:1px solid var(--rule); border-radius:50%; background:var(--bg);
    color:var(--muted);
    transition:background-color .12s ease, color .12s ease,
      border-color .12s ease, transform .12s ease; }
  .card .playbtn .play svg { display:block; width:8px; height:8px; margin-left:1px; }
  .card .playbtn:hover .play, .card .playbtn.on .play {
    background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .card .playbtn:active .play { transform:scale(.9); }
  .card .playbtn .bars { display:none; align-items:flex-end; gap:2px; height:9px; }
  .card .playbtn .bars i { display:block; width:2px; height:4px; border-radius:1px;
    background:currentColor; }
  .card .playbtn .bars i:nth-child(2) { height:7px; }
  .card .playbtn .bars i:nth-child(3) { height:5px; }
  .card .playbtn.on .play svg { display:none; }
  .card .playbtn.on .play .bars { display:inline-flex; }
  .card .say-unit:has(.playbtn.on) .w {
    background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .card .say-unit:has(.playbtn.on) .txt { color:var(--accent); }
  .card .playbtn:focus { outline:none; }
  .card .playbtn:focus-visible { outline:2px solid var(--accent);
    outline-offset:3px; border-radius:50%; }
  @media (prefers-reduced-motion: reduce) {
    .card .playbtn .play { transition:none; }
    .card .w, .card .txt { transition:none; }
  }
  .card .ex-unit { display:flex; align-items:flex-start; gap:10px; }
  .card .ex-unit .playbtn { margin-top:3px; }
  .card .ex-text { flex:1; min-width:0; }
  .card .ex-text .txt { display:block; font-size:16px; line-height:1.5; }
  .card .ex-text .zh { display:block; margin-top:3px; color:var(--muted); font-size:13px; }
  .card .badges { display:inline-flex; gap:6px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:var(--radius-pill, 999px);
    border:1px solid var(--rule); color:var(--muted); }
  .badge.reg { color:var(--accent); border-color:var(--accent); }
  .badge.kind { font-weight:600; }
  .badge.kind-phrasal { color:var(--accent); border-color:var(--accent); }
  .badge.kind-prep { color:#a78bfa; border-color:#a78bfa; }
  .badge.kind-idiom { color:#f0a984; border-color:#f0a984; }
  .card .zh-line { margin:8px 0 0; color:var(--muted); font-size:14px; }
  .card .sense { margin-top:10px; }
  .card .sense-zh { margin:0 0 4px; font-size:13px; color:var(--muted); }
  .card .variants { margin-top:14px; padding-top:12px; border-top:1px dashed var(--rule); }
  .card .variants-title { margin:0 0 8px; font-size:12px; color:var(--accent);
    font-weight:600; letter-spacing:0.02em; }
  .card .variant { margin-top:12px; }
  .card .variant:first-of-type { margin-top:0; }
  .card .variant-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
  .card .variant-head .w { font-weight:600; }
  .card .variant-zh { margin:3px 0 0; font-size:13px; color:var(--muted); }
  .card .variant-note { margin:3px 0 0; font-size:12px; line-height:1.55;
    color:var(--muted); }
  .card .variant .ex-unit { margin-top:5px; }
  .card .note-card { margin-top:12px; padding:12px 14px;
    border-radius:var(--radius-control, 12px);
    background:var(--surface-strong, var(--surface)); border:1px solid var(--rule);
    border-left:3px solid var(--accent); }
  .card .note-card p { margin:6px 0 0; font-size:13px; line-height:1.6; }
  .card .note-card p b { display:inline-block; margin-right:6px; font-size:12px;
    color:var(--accent); font-weight:600; }
  .card .opp { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .card .opp-btn { display:inline-flex; align-items:baseline; gap:5px;
    padding:2px 10px; border:1px solid var(--accent);
    border-radius:var(--radius-pill, 999px); background:transparent; color:var(--accent);
    font:inherit; font-size:13px; line-height:1.5; cursor:pointer; }
  .card .opp-btn:hover { background:var(--tint); }
  .card .opp-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card .opp-btn .zh, .card .opp-word .zh { color:var(--muted); font-size:12px; }
  .card .opp-sep { color:var(--muted); }
  .card .opp-word { margin:6px 0 0; font-size:13px; color:var(--muted); }
  .card .opp-word b { display:inline-block; margin-right:6px; font-size:12px;
    color:var(--accent); font-weight:600; }
  .card.opp-focus { box-shadow:0 0 0 3px var(--accent); }
  .card .opp-return-inline { display:inline-flex; align-items:center; gap:6px;
    margin-top:14px; padding:9px 16px;
    border:1px solid var(--rule); border-radius:var(--radius-pill, 999px);
    background:var(--surface-strong, var(--surface)); color:var(--fg);
    font:inherit; font-size:14px; cursor:pointer; }
  .card .opp-return-inline:hover { border-color:var(--accent); color:var(--accent); }
  .card .opp-return-inline:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .back { display:inline-block; margin-bottom:14px; color:var(--muted);
    text-decoration:none; font-size:14px; }
  .back:hover { color:var(--accent); }
  .stage { margin:34px 0 4px; font-size:15px; font-weight:600;
    color:var(--fg); letter-spacing:0.02em; }
  .stage-en { font-weight:400; color:var(--muted); font-size:13px;
    letter-spacing:0.04em; }
  .list { display:flex; flex-direction:column; gap:14px; margin-top:12px; }
  .row { display:flex; align-items:baseline; gap:16px; padding:16px 18px;
    border:1px solid var(--rule); border-radius:var(--radius-card, 24px);
    background:var(--bg); text-decoration:none; color:inherit;
    transition:background-color .15s ease, box-shadow .15s ease,
      transform .15s ease; }
  .row:hover { background:var(--surface); transform:translateY(-1px);
    box-shadow:var(--shadow-card, 0 1px 2px rgba(0, 0, 0, 0.05),
      0 8px 24px rgba(0, 0, 0, 0.06)); }
  .row:active { transform:scale(0.995); }
  .num { width:26px; flex:none; color:var(--muted); font-size:13px;
    font-variant-numeric:tabular-nums; }
  .title { flex:1; min-width:0; }
  .en { display:block; font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  .zh { display:block; margin-top:2px; font-size:15px; color:var(--muted); }
  .tag { flex:none; font-size:14px; color:var(--accent); font-weight:600;
    font-variant-numeric:tabular-nums; }
  @media (max-width:560px) { .tag { display:none; } .row { gap:12px; padding:16px 14px; } }
</style>
</head>
<body>
<div class="page">
<h1>短语搭配</h1>
<div class="topbar"><div class="level1" role="group" aria-label="浏览方式"><button type="button" data-mode="scene" aria-pressed="true">场景话题<span class="mode-arw" aria-hidden="true">›</span></button><button type="button" data-mode="particle" aria-pressed="false">介词<span class="mode-arw" aria-hidden="true">›</span></button></div><div class="voice-seg" role="group" aria-label="音色"><span class="voice-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg></span><button type="button" data-voice="f" aria-pressed="true">女</button><button type="button" data-voice="m" aria-pressed="false">男</button></div></div>
<div class="chips" data-chips="scene"></div>
<div class="chips" data-chips="particle" hidden></div>
<div class="chips" data-chips="theme" hidden></div>
<div id="view"></div>
</div>
<script src="data.fee21427f0.js"></script>
<script>
(function(){
var D=window.COLLOCATION_INDEX;
var view=document.getElementById('view');
var rowScene=document.querySelector('[data-chips="scene"]');
var rowPart=document.querySelector('[data-chips="particle"]');
var rowTheme=document.querySelector('[data-chips="theme"]');
var modeBtns=document.querySelectorAll('[data-mode]');
var STATE_KEY='pv-index-state-v1';var state={scene:'all',particle:'all'},mode='scene',open=null;
var positions={scene:0,particle:0},chipsExpanded=true,atCategories=false;
try{
  var saved=JSON.parse(sessionStorage.getItem(STATE_KEY)||'null');
  if(saved&&saved.state&&saved.positions){
    if(saved.mode==='scene'||saved.mode==='particle')mode=saved.mode;
    if(saved.state.scene==='all'||D.scene.some(function(g){return g.id===saved.state.scene;}))state.scene=saved.state.scene;
    if(saved.state.particle==='all'||D.particle.some(function(g){return g.p===saved.state.particle;}))state.particle=saved.state.particle;
    if(Number.isFinite(saved.positions.scene)&&saved.positions.scene>=0)positions.scene=saved.positions.scene;
    if(Number.isFinite(saved.positions.particle)&&saved.positions.particle>=0)positions.particle=saved.positions.particle;
  }
}catch(e){}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function chip(attr,val,label){return '<button type="button" data-'+attr+'="'+val+'">'+esc(label)+'</button>';}
function rowButton(i){
  var e=D.entries[i];
  return '<button class="prow" type="button" data-i="'+i+'" aria-expanded="false"><span class="en">'+esc(e.h)+'</span><span class="zh">'+esc(e.zh)+'</span><span class="arw">›</span></button>';
}
function fmt(v){return (v==null?'':v.toFixed(3));}
function card(i){
  var e=D.entries[i];var out='<div class="card" data-card="'+i+'">';
  out+='<div class="card-head say-unit" data-unit="'+i+'-0"><span class="w">'+esc(e.h)+'</span>'+(e.ipa?'<span class="ipa">/'+esc(e.ipa)+'/</span>':'')+'<button class="say playbtn" type="button" data-i="'+i+'" data-k="0" aria-label="播放"><span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" width="8" height="8" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="bars"><i></i><i></i><i></i></span></span></button><span class="badges">'+(e.kind==='chunk'?'':'<span class="badge kind kind-'+e.kind+'">'+(e.kind==='prep'?'介词搭配':e.kind==='idiom'?'习语':'短语动词')+'</span>')+(e.reg?'<span class="badge reg">'+(e.reg==='spoken'?'口语':e.reg==='written'?'书面':'中性')+'</span>':'')+(e.kind==='phrasal'?'<span class="badge split">'+(e.sep?'可分':'不可分')+'</span>':'')+'</span></div>';
  out+='<p class="zh-line">'+esc(e.zh)+'</p>';
  for(var s=0;s<e.sen.length;s++){
    var it=e.sen[s];
    var wo='';
    if(e.wo&&e.wo.length){var wl=e.wo.filter(function(w){return w[0]===s+1;});if(wl.length)wo='<p class=\"opp-word\"><b>反义</b>'+wl.map(function(w){return esc(w[1])+'<span class=\"zh\">'+esc(w[2])+'</span>';}).join(' · ')+'</p>';}
    out+='<div class="sense"><p class="sense-zh">'+esc(it[0])+'</p><div class="say-unit ex-unit" data-unit="'+i+'-'+(s+1)+'"><button class="say playbtn" type="button" data-i="'+i+'" data-k="'+(s+1)+'" aria-label="播放"><span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" width="8" height="8" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="bars"><i></i><i></i><i></i></span></span></button><div class="ex-text"><span class="txt">'+esc(it[1])+'</span><span class="zh">'+esc(it[2])+'</span></div></div>'+wo+'</div>';
  }
  if(e.var&&e.var.length){
    out+='<div class="variants"><p class="variants-title">近义</p>';
    for(var v=0;v<e.var.length;v++){
      var vv=e.var[v];
      out+='<div class="variant"><div class="variant-head"><span class="w">'+esc(vv[0])+'</span>'+(vv[1]?'<span class="ipa">/'+esc(vv[1])+'/</span>':'')+(vv[3]?'<span class="badge reg">'+(vv[3]==='spoken'?'口语':vv[3]==='written'?'书面':'中性')+'</span>':'')+'<button class="say playbtn" type="button" data-i="'+i+'" data-k="'+vv[7]+'" aria-label="播放"><span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" width="8" height="8" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="bars"><i></i><i></i><i></i></span></span></button></div><p class="variant-zh">'+esc(vv[2])+'</p><p class="variant-note">'+esc(vv[6])+'</p><div class="say-unit ex-unit" data-unit="'+i+'-v'+v+'"><button class="say playbtn" type="button" data-i="'+i+'" data-k="'+vv[8]+'" aria-label="播放"><span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" width="8" height="8" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="bars"><i></i><i></i><i></i></span></span></button><div class="ex-text"><span class="txt">'+esc(vv[4])+'</span><span class="zh">'+esc(vv[5])+'</span></div></div></div>';
    }
    out+='</div>';
  }
  var notes='';
  if(e.l1)notes+='<p class="l1"><b>易错</b>'+esc(e.l1)+'</p>';
  if(e.coll&&e.coll.length)notes+='<p class="colloc"><b>搭配</b>'+e.coll.map(function(c){return esc(c[0])+(c[1]?'：'+esc(c[1]):'');}).join(' · ')+'</p>';
  if(e.conf&&e.conf.length)notes+='<p class="confuse"><b>易混</b>'+e.conf.map(function(c){return esc(c[0])+(c[1]?'：'+esc(c[1]):'');}).join(' · ')+'</p>';
  if(e.opp&&e.opp.length)notes+='<p class="opp"><b>反义</b>'+e.opp.map(function(o){return '<button type="button" class="opp-btn" data-opp-i="'+o.i+'">'+esc(o.h)+'<span class="zh">'+esc(o.zh)+'</span></button>';}).join('<span class="opp-sep">·</span>')+'</p>';
  if(notes)out+='<div class="note-card">'+notes+'</div>';
  if(oppOrigin&&oppOrigin.target===i){var oh=D.entries[oppOrigin.open];out+='<button class="opp-return-inline" type="button" data-opp-return-inline>‹ 返回 '+esc(oh?oh.h:'')+'</button>';}
  return out+'</div>';
}
function sceneHtml(){
  var out='';
  D.scene.forEach(function(g){
    out+='<section class="group" data-cat="'+g.id+'">';
    g.themes.forEach(function(t){
      out+='<h3 class="theme" data-theme="'+t.id+'">'+esc(t.zh)+' <span class="stage-en">'+esc(t.en)+'</span></h3>';
      out+='<div class="list">'+t.rows.map(rowButton).join('')+'</div>';
    });
    out+='</section>';
  });
  return out;
}
function partHtml(){
  var out='';
  D.particle.forEach(function(g){
    out+='<section class="group" data-particle="'+g.p+'"><h3 class="theme">'+esc(g.label||g.p)+'</h3><div class="list">'+g.rows.map(rowButton).join('')+'</div></section>';
  });
  return out;
}
var html={scene:sceneHtml(),particle:partHtml()};
function themeGroup(cat){
  for(var i=0;i<D.scene.length;i++)if(D.scene[i].id===cat)return D.scene[i];
  return null;
}
function showThemeLevel(){return mode==='scene'&&state.scene!=='all'&&!atCategories;}
function renderThemeRow(){
  var g=themeGroup(state.scene);
  var out='<button type="button" class="sp-chip-back" data-theme-back="1">‹ 全部分类</button>';
  if(g)out+=g.themes.map(function(t){return '<button type="button" data-theme="'+t.id+'">'+esc(t.zh)+'</button>';}).join('');
  rowTheme.innerHTML=out;
}
function setChips(m){
  var l3=showThemeLevel();
  rowScene.hidden=(m!=='scene')||l3;
  rowPart.hidden=(m!=='particle');
  rowTheme.hidden=!l3;
  if(l3)renderThemeRow();
  for(var i=0;i<modeBtns.length;i++){
    var active=modeBtns[i].getAttribute('data-mode')===m;
    modeBtns[i].setAttribute('aria-pressed',active?'true':'false');
    modeBtns[i].setAttribute('aria-expanded',active&&chipsExpanded?'true':'false');
  }
  var chips=(m==='scene'?rowScene:rowPart).querySelectorAll('button');
  for(var c=0;c<chips.length;c++)chips[c].setAttribute('aria-pressed',chips[c].getAttribute('data-'+m)==='all'&&state[m]==='all'?'true':(chips[c].getAttribute('data-'+m)===state[m]?'true':'false'));
}
function setChipsExpanded(expanded){
  chipsExpanded=!!expanded;
  document.documentElement.classList.toggle('sp-chips-open',chipsExpanded);
  for(var i=0;i<modeBtns.length;i++)modeBtns[i].setAttribute('aria-expanded',modeBtns[i].getAttribute('data-mode')===mode&&chipsExpanded?'true':'false');
}
function persistState(){try{sessionStorage.setItem(STATE_KEY,JSON.stringify({mode:mode,state:state,positions:positions}));}catch(e){}}
function scrollToEl(target){
  var banner=document.querySelector('.sp-context');
  var offset=banner?banner.getBoundingClientRect().height+(parseFloat(getComputedStyle(banner).top)||0)+12:0;
  var y=window.scrollY+target.getBoundingClientRect().top-offset;
  window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
}
function scrollToFirstTheme(){
  var groups=view.querySelectorAll('.group'),target=null;
  for(var i=0;i<groups.length;i++)if(groups[i].style.display!=='none'){target=groups[i].querySelector('.theme')||groups[i].querySelector('.prow');if(target)break;}
  if(!target){view.scrollIntoView({block:'start',behavior:'smooth'});return;}
  scrollToEl(target);
}
var restoringPosition=false;
var oppOrigin=null;
function clearOppFocus(){var el=view.querySelector('.card.opp-focus');if(el)el.classList.remove('opp-focus');}
function exitOpp(){if(oppOrigin){oppOrigin=null;clearOppFocus();}}
function paint(m,value,scroll,restore,keepScroll,keepOpp){
  if(!keepOpp)exitOpp();
  var changed=mode!==m;var shouldRestore=(changed||restore)&&!keepScroll;
  if(changed)positions[mode]=window.scrollY;
  if(shouldRestore)restoringPosition=true;
  mode=m;if(value!==undefined)state[m]=value;
  view.innerHTML=html[m];open=null;
  var attr=(m==='scene'?'cat':'particle');
  var groups=view.querySelectorAll('.group');
  for(var g=0;g<groups.length;g++)groups[g].style.display=(state[m]==='all'||groups[g].getAttribute('data-'+attr)===state[m])?'':'none';
  setChips(m);
  if(scroll){setChipsExpanded(showThemeLevel());scrollToFirstTheme();}
  else if(shouldRestore)requestAnimationFrame(function(){var y=Math.min(positions[m],Math.max(0,document.documentElement.scrollHeight-window.innerHeight));window.scrollTo(0,y);positions[m]=y;restoringPosition=false;persistState();});
  persistState();
}
var stateTimer=0;
window.addEventListener('scroll',function(){
  if(restoringPosition)return;
  positions[mode]=window.scrollY;
  if(stateTimer)clearTimeout(stateTimer);
  stateTimer=setTimeout(persistState,120);
},{passive:true});
window.addEventListener('pagehide',function(){positions[mode]=window.scrollY;persistState();});
function toggleCard(btn){
  exitOpp();
  var i=+btn.getAttribute('data-i');
  var existing=view.querySelector('.card');
  var prev=view.querySelector('.prow[aria-expanded="true"]');
  if(open===i){if(existing)existing.remove();btn.setAttribute('aria-expanded','false');open=null;return;}
  if(existing)existing.remove();
  if(prev)prev.setAttribute('aria-expanded','false');
  open=i;btn.setAttribute('aria-expanded','true');btn.insertAdjacentHTML('afterend',card(i));
}
function openOppTarget(i){
  var e=D.entries[i];if(!e)return false;
  if(mode!=='scene'||state.scene!==e.c)paint('scene',e.c,false,false,true,true);
  var row=view.querySelector('.prow[data-i="'+i+'"]');if(!row)return false;
  if(open!==i){
    var ex=view.querySelector('.card');if(ex)ex.remove();
    var prev=view.querySelector('.prow[aria-expanded="true"]');if(prev)prev.setAttribute('aria-expanded','false');
    open=i;row.setAttribute('aria-expanded','true');row.insertAdjacentHTML('afterend',card(i));
  }
  var c=view.querySelector('.card[data-card="'+i+'"]');
  if(c){c.classList.add('opp-focus');scrollToEl(c);}
  return true;
}
function jumpToOpp(i){
  if(oppOrigin&&oppOrigin.target===i){returnToOppOrigin();return;}
  if(!oppOrigin)oppOrigin={mode:mode,scene:state.scene,particle:state.particle,atCategories:atCategories,chipsExpanded:chipsExpanded,open:open,y:window.scrollY};
  oppOrigin.target=i;
  if(!openOppTarget(i))oppOrigin.target=null;
}
function returnToOppOrigin(){
  var o=oppOrigin;if(!o)return;
  oppOrigin=null;clearOppFocus();
  atCategories=o.atCategories;
  if(mode!==o.mode||state.scene!==o.scene||state.particle!==o.particle)paint(o.mode,o.mode==='scene'?o.scene:o.particle,false,false,true,true);
  chipsExpanded=o.chipsExpanded;setChipsExpanded(chipsExpanded);
  var row=view.querySelector('.prow[data-i="'+o.open+'"]');
  if(row){
    var ex=view.querySelector('.card');if(ex)ex.remove();
    var prev=view.querySelector('.prow[aria-expanded="true"]');if(prev)prev.setAttribute('aria-expanded','false');
    open=o.open;row.setAttribute('aria-expanded','true');row.insertAdjacentHTML('afterend',card(o.open));
    var c=view.querySelector('.card[data-card="'+o.open+'"]');
    if(c){c.classList.add('opp-focus');scrollToEl(c);}
  }
  persistState();
}
var KEY_VOICE='pv-voice';var voice='f';
try{var sv=localStorage.getItem(KEY_VOICE);if(sv==='f'||sv==='m')voice=sv;}catch(e){}
var audio=new Audio();audio.preload='auto';var srcCache={};var stopAt=0,onEl=null;window.__phAudio=audio;
function srcFor(url){
  if(srcCache[url])return srcCache[url];
  var can=location.protocol!=='file:'&&window.fetch&&window.URL&&URL.createObjectURL;
  if(!can){srcCache[url]=Promise.resolve(url);return srcCache[url];}
  srcCache[url]=fetch(url).then(function(r){if(!r.ok)throw 0;return r.blob();})
    .then(function(b){return URL.createObjectURL(b);}).catch(function(){return url;});
  return srcCache[url];
}
var ctx=null;
try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ctx=null;}
var bufCache={},curSrc=null,raf=0,stopTimer=0;
function finishStop(){
  try{audio.pause();}catch(e){}
  if(stopAt)window.__phLast={mode:'ha',end:stopAt,t:audio.currentTime};
  stopAt=0;if(onEl){onEl.classList.remove('on');onEl=null;}
}
function stopSrc(){
  if(curSrc){try{curSrc.onended=null;curSrc.stop();}catch(e){}curSrc=null;}
  if(onEl){onEl.classList.remove('on');onEl=null;}
}
function tick(){
  if(!stopAt)return;
  if(audio.currentTime>=stopAt-0.008){finishStop();return;}
  raf=requestAnimationFrame(tick);
}
function armStop(from,to){
  if(stopTimer)clearTimeout(stopTimer);
  var ms=Math.max(0,(to-Math.max(from,audio.currentTime))*1000)-20;
  stopTimer=setTimeout(function(){
    if(!stopAt)return;
    if(audio.currentTime>=stopAt-0.05){finishStop();}
    else{armStop(audio.currentTime,stopAt);}
  },Math.max(0,ms));
}
function playFallback(el,s,en){
  if(raf)cancelAnimationFrame(raf);
  srcFor('audio/'+D.entries[+el.getAttribute('data-i')].sp[voice]).then(function(src){
    if(audio.src!==src)audio.src=src;
    stopAt=en;window.__phEnd=en;if(onEl)onEl.classList.remove('on');onEl=el;el.classList.add('on');
    var go=function(){try{audio.currentTime=s;}catch(err){}audio.play().catch(function(){});
      if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);armStop(s,en);};
    if(audio.readyState>0)go();else audio.addEventListener('loadedmetadata',go,{once:true});
  });
}
function playSay(el){
  var i=+el.getAttribute('data-i'),k=+el.getAttribute('data-k');
  var e=D.entries[i];var span=e.au[k];
  if(!span||!e.sp||!e.sp[voice])return;
  var s=voice==='f'?span[0]:span[2],en=voice==='f'?span[1]:span[3];
  if(s==null||en==null)return;
  window.__phEnd=en;
  var url='audio/'+e.sp[voice];
  if(ctx&&window.fetch&&location.protocol!=='file:'){
    stopSrc();
    var fire=function(buf){
      if(ctx.state==='suspended')ctx.resume().catch(function(){});
      var src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
      curSrc=src;onEl=el;el.classList.add('on');
      var t0=ctx.currentTime;window.__phLast={mode:'wa',s:s,en:en,t0:t0,t1:null};
      src.onended=function(){
        window.__phLast.t1=ctx.currentTime;
        if(curSrc===src)curSrc=null;
        if(onEl===el){el.classList.remove('on');onEl=null;}
      };
      try{src.start(0,Math.max(0,s),Math.max(0.04,en-s));}
      catch(err){playFallback(el,s,en);}
    };
    if(bufCache[url])fire(bufCache[url]);
    else fetch(url).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();})
      .then(function(ab){return ctx.decodeAudioData(ab);})
      .then(function(b){bufCache[url]=b;fire(b);})
      .catch(function(){playFallback(el,s,en);});
    return;
  }
  playFallback(el,s,en);
}
var voiceBtns=document.querySelectorAll('[data-voice]');
function paintVoice(){
  for(var v=0;v<voiceBtns.length;v++)voiceBtns[v].setAttribute('aria-pressed',voiceBtns[v].getAttribute('data-voice')===voice?'true':'false');
}
for(var vv=0;vv<voiceBtns.length;vv++)voiceBtns[vv].addEventListener('click',function(e){voice=e.currentTarget.getAttribute('data-voice');try{localStorage.setItem(KEY_VOICE,voice);}catch(err){}paintVoice();});
paintVoice();
rowScene.innerHTML=chip('scene','all','全部')+D.scene.map(function(g){return chip('scene',g.id,g.zh);}).join('');
rowPart.innerHTML=chip('particle','all','全部')+D.particle.map(function(g){return chip('particle',g.p,g.label||g.p);}).join('');
rowScene.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;atCategories=false;paint('scene',b.getAttribute('data-scene'),true);});
rowPart.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;paint('particle',b.getAttribute('data-particle'),true);});
rowTheme.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-theme-back')){atCategories=true;setChips(mode);return;}
  var id=b.getAttribute('data-theme');
  var target=view.querySelector('.theme[data-theme="'+id+'"]');
  if(target)scrollToEl(target);
});
for(var m=0;m<modeBtns.length;m++)modeBtns[m].addEventListener('click',function(e){var next=e.currentTarget.getAttribute('data-mode');if(next===mode){setChipsExpanded(!chipsExpanded);return;}atCategories=false;setChipsExpanded(true);paint(next,state[next],false);});
view.addEventListener('click',function(e){
  var ret=e.target.closest('[data-opp-return-inline]');
  if(ret){returnToOppOrigin();return;}
  var ob=e.target.closest('.opp-btn');
  if(ob){jumpToOpp(+ob.getAttribute('data-opp-i'));return;}
  var say=e.target.closest('.say');
  if(say){playSay(say);return;}
  var b=e.target.closest('.prow');
  if(b)toggleCard(b);
});
function scrollToGroup(g){
  if(!g)return;
  var head=g.querySelector('.theme')||g.querySelector('.prow')||g;
  scrollToEl(head);
}
// 顶部面包屑（分类 / 主题）由 scroll-progress.js 渲染成按钮，点这里回跳
document.addEventListener('npesl:context',function(e){
  var d=(e&&e.detail)||{};
  if(d.particle){
    if(d.kind==='root'){paint('particle','all',true);return;}
    scrollToGroup(view.querySelector('.group[data-particle="'+d.group+'"]'));
    return;
  }
  if(d.kind==='root'){
    atCategories=true;setChips(mode);
    scrollToGroup(view.querySelector('.group[data-cat="'+d.cat+'"]'));
    return;
  }
  var t=d.theme?view.querySelector('.theme[data-theme="'+d.theme+'"]'):null;
  if(t)scrollToEl(t);
});
try{if('scrollRestoration'in history)history.scrollRestoration='manual';}catch(e){}
paint(mode,state[mode],false,true);
setChipsExpanded(chipsExpanded);
})();
</script>
<script src="scroll-progress.js" defer></script>
</body>
