<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPESL · 成人英语练习</title>
<link rel="icon" type="image/png" sizes="512x512" href="npesl-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:site_name" content="NPESL">
<meta property="og:title" content="NPESL · 成人英语练习">
<meta property="og:image" content="https://npesl.pages.dev/npesl-icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://npesl.pages.dev/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('npesl-theme');if(t==='glass')t='dark';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(40px, 8vh, 72px) max(20px, env(safe-area-inset-left, 0px)) 96px;
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    width: 52px;
    height: 52px;
    border-radius: 13px;
    flex: none;
    color: var(--primary);
  }

  /* 方片跟着主题走：浅色近黑、深色近白；字反过来用底色。 */
  .logo-text {
    fill: var(--background);
    font-family: var(--font);
    font-size: 117px;
    font-weight: 700;
    letter-spacing: 0;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 34px);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: clamp(32px, 6vh, 48px);
  }
  .card {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 15px 11px 11px;
    border-radius: var(--radius-card);
    color: inherit;
    text-decoration: none;
    transition: background-color 0.12s ease;
  }
  .glyph {
    display: grid;
    place-items: center;
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: var(--radius-control);
    background-color: var(--muted-surface);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .glyph[data-tone="ipa"] { font-size: 19px; font-weight: 500; }
  .title {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .chev {
    flex: none;
    display: block;
    width: 16px;
    height: 16px;
    color: var(--muted);
    opacity: 0.75;
  }
  @media (max-width: 420px) {
    .logo { width: 46px; height: 46px; border-radius: 12px; }
    .card { gap: 12px; padding: 10px 14px 10px 10px; }
    .title { font-size: 15px; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="brand">
    <svg class="logo" viewBox="0 0 512 512" width="52" height="52" aria-hidden="true" focusable="false">
      <rect width="512" height="512" rx="128" fill="currentColor"/>
      <text class="logo-text" x="256" y="256" text-anchor="middle" dominant-baseline="central">NPESL</text>
    </svg>
    <h1>NPESL</h1>
  </header>

  <nav class="cards">
    <a class="card" href="ipa/">
      <span class="glyph" data-tone="ipa" aria-hidden="true">ə</span>
      <span class="title">美式英语音标表</span>
      <svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="card" href="phenomena/">
      <span class="glyph" aria-hidden="true">P</span>
      <span class="title">常见发音现象(AmE)</span>
      <svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="card" href="phonics/">
      <span class="glyph" aria-hidden="true">Aa</span>
      <span class="title">自然拼读阅读训练</span>
      <svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="card" href="collocation/">
      <span class="glyph" aria-hidden="true">on</span>
      <span class="title">短语搭配</span>
      <svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="card" href="drill/">
      <span class="glyph" aria-hidden="true">Q</span>
      <span class="title">Question Drill</span>
      <svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="card" href="conversation/">
      <span class="glyph" aria-hidden="true">C</span>
      <span class="title">Conversation Starters</span>
      <svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="card" href="visual-vocabulary/">
      <span class="glyph" aria-hidden="true">VV</span>
      <span class="title">Visual Vocabulary 图解词汇</span>
      <svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>
</main>
<script src="theme.js" defer></script>
</body>
</html>
