<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPESL · 成人英语练习</title>
<link rel="icon" type="image/png" sizes="512x512" href="npesl-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:site_name" content="NPESL">
<meta property="og:title" content="NPESL · 成人英语练习">
<meta property="og:image" content="https://npesl.pages.dev/npesl-icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://npesl.pages.dev/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('npesl-theme');document.documentElement.setAttribute('data-theme',t&&['auto','editorial','brutal','glass','mono','bright','sepia','dark'].indexOf(t)>-1?t:'auto');}catch(e){document.documentElement.setAttribute('data-theme','auto');}</script>
<link rel="stylesheet" href="theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Serif+SC:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;800&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --rule: #e5e5ea;
    --surface: #f5f5f7;
    --blue: #0071e3;
    --blue-tint: #e8f2ff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Segoe UI Variable", "Segoe UI", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #f5f5f7;
      --muted: #98989d;
      --rule: #38383a;
      --surface: #1c1c1e;
      --blue: #2997ff;
      --blue-tint: #102a43;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(48px, 9vh, 96px) max(20px, env(safe-area-inset-left, 0px)) 96px;
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    flex: none;
  }
  h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 40px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .sub {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: clamp(44px, 8vh, 72px);
  }
  .card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px;
    border: 1px solid var(--rule);
    border-radius: 24px;
    background: var(--bg);
    color: inherit;
    text-decoration: none;
    transition: background-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover {
    background: var(--surface);
    transform: translateY(-1px);
  }
  .card:active { transform: scale(0.995); }
  .glyph {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--blue-tint);
    color: var(--blue);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .glyph-alt {
    background: var(--surface);
    color: var(--fg);
  }
  .body { flex: 1; min-width: 0; }
  .title {
    display: block;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .desc {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 14px;
  }
  .arrow {
    flex: none;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
  }
  @media (max-width: 420px) {
    .card { gap: 14px; padding: 18px; }
    .glyph { width: 50px; height: 50px; font-size: 20px; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="brand">
    <img class="logo" src="npesl-icon.png" alt="NPESL" width="64" height="64">
    <h1>NPESL</h1>
  </header>

  <nav class="cards">
    <a class="card" href="ipa/">
      <span class="glyph glyph-alt">ə</span>
      <span class="body">
        <span class="title">美式英语音标表</span>
      </span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="phenomena/">
      <span class="glyph">P</span>
      <span class="body">
        <span class="title">常见发音现象(AmE)</span>
      </span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="phonics/">
      <span class="glyph">Aa</span>
      <span class="body">
        <span class="title">自然拼读阅读训练</span>
      </span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="phrasal/">
      <span class="glyph glyph-alt">on</span>
      <span class="body">
        <span class="title">短语动词</span>
      </span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="drill/">
      <span class="glyph glyph-alt">Q</span>
      <span class="body">
        <span class="title">Question Drill</span>
      </span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="conversation/">
      <span class="glyph">C</span>
      <span class="body">
        <span class="title">Conversation Starters</span>
      </span>
      <span class="arrow">›</span>
    </a>
  </nav>
</main>
<script src="theme.js" defer></script>
</body>
</html>
