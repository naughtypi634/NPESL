  .seg { display:flex; border:1px solid var(--rule); border-radius:999px;
    overflow:hidden; min-width:0; }
  .seg button, .pill { appearance:none; border:0; background:transparent;
    color:var(--fg); font:inherit; font-size:14px; padding:7px 13px;
    cursor:pointer; white-space:nowrap; }
  .pill { border:1px solid var(--rule); border-radius:999px; }
  .seg button[aria-pressed="true"], .pill[aria-pressed="true"] {
    background:var(--accent); color:var(--on-accent); }
  .seg button + button { border-left:1px solid var(--rule); }
  .speed { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .speed input { width:128px; accent-color:var(--accent); }
  .speed span { min-width:38px; color:var(--muted); font-size:13px;

  .dialogue { margin-top:8px; }
  .line { display:block; width:100%; text-align:left; font:inherit;

  .line:hover { background:var(--surface); }

  .line .txt { display:block; font-size:19px; line-height:1.6; }
  .line .zh { display:block; margin-top:5px; color:var(--muted); font-size:14px;
    line-height:1.4; }
  ruby { ruby-position:under; -webkit-ruby-position:after; }
  rt { font-size:1em; font-weight:700; color:var(--mark); }


  .footer { margin-top:34px; }
  body.zh-off .zh { display:none; }

  .status { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    margin:0; max-width:calc(100vw - 40px); padding:9px 16px; border-radius:999px;
    background:rgba(0,0,0,.82); color:#fff; font-size:14px; opacity:0;
    pointer-events:none; transition:opacity .2s ease; }
  .status.show { opacity:1; }

  @media (max-width:560px) {
    .toolbar { gap:8px; }
    .seg button, .pill { padding:6px 10px; font-size:13px; }
    .target { gap:10px 18px; }
  }

<script>
(function () {
  var KEY_VOICE = 'rs-voice';
  var KEY_SPEED = 'rs-speed', KEY_ZH = 'rs-zh', KEY_DONE = 'rs-done';
  var LESSON = parseInt(document.querySelector('.num').textContent, 10);
  var DEFAULT_SPEED = 0.9;
  var voice = 'f', speed = DEFAULT_SPEED;

  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  try {
    if (load(KEY_VOICE) === 'f' || load(KEY_VOICE) === 'm') voice = load(KEY_VOICE);
    var savedSpeed = parseFloat(load(KEY_SPEED));
    if (savedSpeed >= 0.6 && savedSpeed <= 1.5) speed = savedSpeed;
  } catch (e) {}

  var player = new Audio();
  player.preload = 'auto';
  player.preservesPitch = true;
  player.webkitPreservesPitch = true;

  var allRows = Array.prototype.slice.call(document.querySelectorAll('.line'));
  var current = null, playlist = null, statusTimer = null;
  var stickyStatus = false;
  var raf = 0, loadedSrc = null;
  var SOURCES = {}, READY = {};
  var SPRITES = {};
  try { SPRITES = JSON.parse(document.getElementById('spriteMap').textContent); }
  catch (e) { SPRITES = {}; }

  function spanFor(el) {
    var start = el.getAttribute('data-start-' + voice);
    var end = el.getAttribute('data-end-' + voice);
    if (start === null || end === null) return null;
    var s = parseFloat(start), e = parseFloat(end);
    return (isFinite(s) && isFinite(e)) ? [s, e] : null;
  }

  function spriteUrlFor(v) {
    var rel = SPRITES[v];
    return rel ? 'audio/' + rel : null;
  }

  function stopTick() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  // 只有落进 seekable 的位置才跳得动；站点不支持 Range 时它长期只有 [0,0]。
  function seekableEnd() {
    var ranges = player.seekable, end = 0;
    for (var i = 0; i < ranges.length; i++) {
      if (ranges.end(i) > end) end = ranges.end(i);
    }
    return end;
  }

  // 拿不到整包时（本地文件、跨域不让 fetch）只有媒体元素可用：等目标位置变
  // 成可跳的再试，别把用户丢在错误的位置上。
  function waitForData(el, seek, from, attempt) {
    if (current !== el) return;
    if (seekableEnd() >= from - 0.01) { seek(); return; }
    if (attempt > 40) { audioFailed(el); return; }
    showStatus('语音加载中…', true);
    setTimeout(function () { waitForData(el, seek, from, attempt + 1); }, 250);
  }

  // 每章一条音频：跳到片段起点，等 seek 落地再播，播到终点就停。
  function startSpan(el, span, onEnd) {
    var from = span[0], stopAt = span[1];
    var retries = 0;
    try { player.pause(); } catch (e) {}
    stopTick();
    var playSpan = function () {
      if (current !== el) return;
      if (player.currentTime < from - 0.15) {
        // seek 没落地：宁可等数据，也不要从整条音频的开头播起。
        if (++retries > 3) { audioFailed(el); return; }
        waitForData(el, seek, from, 0);
        return;
      }
      hideStatus();
      player.playbackRate = speed;
      var started = player.play();
      var tick = function () {
        if (current !== el) return;
        if (player.currentTime >= stopAt - 0.008) {
          try { player.pause(); } catch (e) {}
          stopTick();
          unmark();
          if (onEnd) onEnd();
          return;
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      if (started && started.catch) {
        started.catch(function (err) {
          if (err && err.name === 'AbortError') return;
          if (current === el) audioFailed(el);
        });
      }
    };
    var seek = function () {
      if (current !== el) return;
      if (Math.abs(player.currentTime - from) < 0.02) { playSpan(); return; }
      var done = false;
      var onSeeked = function () {
        if (done) return;
        done = true;
        player.removeEventListener('seeked', onSeeked);
        if (current === el) playSpan();
      };
      player.addEventListener('seeked', onSeeked);
      try {
        player.currentTime = from;
      } catch (e) {
        player.removeEventListener('seeked', onSeeked);
        done = true;
        waitForData(el, seek, from, 0);
        return;
      }
      // 个别浏览器 seek 后不派发 seeked，别把用户卡在原地。
      setTimeout(function () {
        if (done) return;
        done = true;
        player.removeEventListener('seeked', onSeeked);
        if (current === el) playSpan();
      }, 1500);
    };
    if (player.readyState < 1) {
      var onLoaded = function () {
        player.removeEventListener('loadedmetadata', onLoaded);
        seek();
      };
      player.addEventListener('loadedmetadata', onLoaded);
      try { player.load(); } catch (e) {}
    } else {
      seek();
    }
  }

  // Cloudflare Pages 的静态资源不支持 Range 请求（Range 被忽略，永远 200 整包），
  // 媒体元素在没有 Range 时连 seekable 都只有 [0,0]，点后面的句子会被夹回开头播。
  // 所以先把整条 sprite 取进内存换成 blob 地址：seek 永远精确；离线包用
  // file:// 时 fetch 不可用，退回直接给媒体元素。
  function sourceFor(v) {
    if (SOURCES[v]) return SOURCES[v];
    var url = spriteUrlFor(v);
    if (!url) { SOURCES[v] = Promise.resolve(null); return SOURCES[v]; }
    var canFetch = location.protocol !== 'file:' && window.fetch
      && window.Promise && window.URL && URL.createObjectURL;
    if (!canFetch) {
      READY[v] = true;
      SOURCES[v] = Promise.resolve(url);
      return SOURCES[v];
    }
    SOURCES[v] = fetch(url).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.blob();
    }).then(function (blob) {
      return URL.createObjectURL(blob);
    }).catch(function () {
      return url;
    }).then(function (src) {
      READY[v] = true;
      return src;
    });
    return SOURCES[v];
  }

  function begin(el, onEnd) {
    var span = spanFor(el);
    if (!span || !spriteUrlFor(voice)) {
      if (current === el) unmark();
      showStatus('这一句暂无语音');
      return;
    }
    var loading = null;
    if (!READY[voice]) {
      loading = setTimeout(function () { showStatus('语音加载中…', true); }, 300);
    }
    sourceFor(voice).then(function (src) {
      if (loading) clearTimeout(loading);
      if (current !== el) return;
      if (!src) { audioFailed(el); return; }
      if (loadedSrc !== src) {
        player.src = src;
        loadedSrc = src;
      }
      startSpan(el, span, onEnd);
    });
  }

  function unmark() {
    if (current) current.classList.remove('playing');
    current = null;
  }

  function stopAudio() {
    try { player.pause(); } catch (e) {}
    stopTick();
    hideStatus();
    unmark();
  }

  function showStatus(text, sticky) {
    var el = document.querySelector('[data-audio-status]');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    stickyStatus = !!sticky;
    if (statusTimer) clearTimeout(statusTimer);
    if (stickyStatus) { statusTimer = null; return; }
    statusTimer = setTimeout(function () {
      if (stickyStatus) return;
      el.textContent = '';
      el.classList.remove('show');
    }, 4000);
  }

  function hideStatus() {
    var el = document.querySelector('[data-audio-status]');
    stickyStatus = false;
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    if (!el) return;
    el.textContent = '';
    el.classList.remove('show');
  }

  function setSpeed(value, save) {
    var n = Number(value);
    if (!isFinite(n)) n = DEFAULT_SPEED;
    n = Math.max(0.6, Math.min(1.5, Math.round(n * 100) / 100));
    speed = n;
    player.playbackRate = n;
    var label = document.querySelector('[data-speed-label]');
    if (label) label.textContent = String(n).replace(/0$/, '') + '×';
    var input = document.querySelector('[data-speed]');
    if (input && Math.abs(parseFloat(input.value) - n) > 0.001) input.value = n;
    if (save) store(KEY_SPEED, String(n));
  }

  function setPlayAll(on) {
    var btn = document.querySelector('[data-play-all]');
    var label = document.querySelector('[data-play-label]');
    if (!btn) return;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (label) label.textContent = on ? '停止' : '连播';
  }

  function stopPlaylist() {
    playlist = null;
    setPlayAll(false);
    stopAudio();
  }

  function audioFailed(el) {
    if (!current && !playlist) return;
    if (el && current && current !== el) return;
    stopPlaylist();
    showStatus('语音加载失败，请重试');
  }

  function playItem(index) {
    if (!playlist) return;
    if (index >= playlist.items.length) { stopPlaylist(); return; }
    playlist.at = index;
    var el = playlist.items[index];
    try { player.pause(); } catch (e) {}
    unmark();
    if (!spanFor(el)) { audioFailed(el); return; }
    current = el;
    el.classList.add('playing');
    if (index > 0) {
      var rect = el.getBoundingClientRect();
      if (rect.top < 70 || rect.bottom > window.innerHeight - 24) {
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        catch (e) { el.scrollIntoView(); }
      }
    }
    var list = playlist;
    begin(el, function () {
      if (playlist !== list) return;
      playItem(list.at + 1);
    });
  }

  function play(el) {
    if (playlist) stopPlaylist();
    if (current === el && !player.paused) { stopAudio(); return; }
    stopAudio();
    current = el;
    el.classList.add('playing');
    begin(el, null);
  }

  function replayCurrent() {
    var el = current;
    if (!el) return;
    var wasPlaying = !player.paused;
    stopAudio();
    if (wasPlaying) play(el);
  }

  player.addEventListener('loadedmetadata', function () {
    try { player.playbackRate = speed; } catch (e) {}
  });
  player.addEventListener('error', function () {
    if (current) audioFailed(current);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    if (playlist) stopPlaylist(); else stopAudio();
  });

  function setVoice(next) {
    voice = next === 'm' ? 'm' : 'f';
    store(KEY_VOICE, voice);
    var buttons = document.querySelectorAll('[data-voice]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed',
        buttons[i].getAttribute('data-voice') === voice ? 'true' : 'false');
    }
    replayCurrent();
    if (document.readyState === 'complete') prefetch();
  }

  // 点读是这一页的主动作：页面空闲时先把当前音色的 sprite 取进内存，
  // 点下去就能出声（只在联网时预取；离线包走 file://，媒体元素直接读本地文件）。
  function prefetch() {
    if (navigator.connection && navigator.connection.saveData) return;
    sourceFor(voice);
  }

  function setZh(on) {
    document.body.classList.toggle('zh-off', !on);
    store(KEY_ZH, on ? 'on' : 'off');
    var btn = document.querySelector('[data-zh-toggle]');
    if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function isDone() {
    try {
      var list = JSON.parse(load(KEY_DONE) || '[]');
      return list.indexOf(LESSON) >= 0;
    } catch (e) { return false; }
  }

  function setDone(on) {
    var list = [];
    try { list = JSON.parse(load(KEY_DONE) || '[]'); } catch (e) {}
    if (!Array.isArray(list)) list = [];
    var has = list.indexOf(LESSON) >= 0;
    if (on && !has) list.push(LESSON);
    if (!on && has) list.splice(list.indexOf(LESSON), 1);
    store(KEY_DONE, JSON.stringify(list));
    var btn = document.querySelector('[data-done]');
    if (btn) {
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.textContent = on ? '已学' : '标记已学';
    }
  }

  var voiceButtons = document.querySelectorAll('[data-voice]');
  for (var j = 0; j < voiceButtons.length; j++) {
    voiceButtons[j].addEventListener('click', function (event) {
      setVoice(event.currentTarget.getAttribute('data-voice'));
    });
  }
  var zhButton = document.querySelector('[data-zh-toggle]');
  if (zhButton) zhButton.addEventListener('click', function () {
    setZh(document.body.classList.contains('zh-off'));
  });
  var speedInput = document.querySelector('[data-speed]');
  if (speedInput) speedInput.addEventListener('input', function () {
    setSpeed(parseFloat(speedInput.value), true);
  });
  var speedReset = document.querySelector('[data-speed-reset]');
  if (speedReset) speedReset.addEventListener('click', function () {
    setSpeed(DEFAULT_SPEED, true);
  });
  var playAllBtn = document.querySelector('[data-play-all]');
  if (playAllBtn) playAllBtn.addEventListener('click', function () {
    if (playlist) { stopPlaylist(); return; }
    if (!allRows.length) return;
    stopAudio();
    playlist = { items: allRows, at: -1 };
    setPlayAll(true);
    playItem(0);
  });
  var doneBtn = document.querySelector('[data-done]');
  if (doneBtn) doneBtn.addEventListener('click', function () { setDone(!isDone()); });

  document.addEventListener('click', function (event) {
    if (!event.target.closest) return;
    var el = event.target.closest('.line, .target .pill');
    if (el) play(el);
  });

  setVoice(voice);
  setZh(load(KEY_ZH) !== 'off');
  setSpeed(speed, false);
  setDone(isDone());

  if (window.requestIdleCallback) {
    requestIdleCallback(prefetch, { timeout: 2500 });
  } else {
    setTimeout(prefetch, 1500);
  }
})();
</script>
</body>
</html>
