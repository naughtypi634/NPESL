<script>
(function () {
  /* 页面的隐式状态都收进转移表：只允许表里列出的转移，非法事件返回

  function createMachine(name, initial, table) {
    var state = initial;
    var listeners = [];
    return {
      name: name,
      get state() { return state; },
      can: function (event) {
        return !!(table[state] && table[state][event]);

      send: function (event, payload) {

        state = target;
        for (var i = 0; i < listeners.length; i++) {
          listeners[i](state, event, payload);
        }
        return true;
      },
      on: function (fn) { listeners.push(fn); }
    };
  }

  var KEY_SPEED = 'rs-speed', KEY_ZH = 'rs-zh';
  var DEFAULT_SPEED = 0.9;

  var voice = (savedVoice === 'f' || savedVoice === 'm') ? savedVoice : 'f';

  var savedSpeed = parseFloat(load(KEY_SPEED));
  if (savedSpeed >= 0.6 && savedSpeed <= 1.5) speed = savedSpeed;

  var player = new Audio();
  player.preload = 'auto';
  player.preservesPitch = true;
  player.webkitPreservesPitch = true;

  var allRows = Array.prototype.slice.call(document.querySelectorAll('.line'));
  var voiceButtons = Array.prototype.slice.call(document.querySelectorAll('[data-voice]'));
  var zhButton = document.querySelector('[data-zh-toggle]');
  var speedInput = document.querySelector('[data-speed]');
  var speedLabel = document.querySelector('[data-speed-label]');
  var playAllBtn = document.querySelector('[data-play-all]');
  var playAllLabel = document.querySelector('[data-play-label]');
  var statusEl = document.querySelector('[data-audio-status]');

  // 给连播顺序和无头代理一个稳定的句子坐标。
  allRows.forEach(function (el, index) {
    el.setAttribute('data-kind', 'line');
    el.setAttribute('data-index', String(index));
  });
  Array.prototype.forEach.call(document.querySelectorAll('.target .pill'), function (el) {
    el.setAttribute('data-kind', 'demo');
  });

  var SPRITES = {};
  try { SPRITES = JSON.parse(document.getElementById('spriteMap').textContent); }
  catch (e) { SPRITES = {}; }

  function spriteUrlFor(v) {
    var rel = SPRITES[v];
    return rel ? 'audio/' + rel : null;
  }

  function spanFor(el, v) {
    var start = el.getAttribute('data-start-' + v);
    var end = el.getAttribute('data-end-' + v);
    if (start === null || end === null) return null;
    var s = parseFloat(start), e = parseFloat(end);
    return (isFinite(s) && isFinite(e)) ? [s, e] : null;
  }

  /* 每条 sprite 的取包过程：idle → fetching → ready（blob，或退回直连）
     或 missing（没有这个音色）。取过一次就复用同一个 Promise。 */
  function createSource(v) {
    return createMachine('source:' + v, 'idle', {
      idle:     { fetch: 'fetching', missing: 'missing' },
      fetching: { resolve: 'ready', fallback: 'ready', missing: 'missing' },
      ready:    {},
      missing:  {}
    });
  }

  var sources = { f: createSource('f'), m: createSource('m') };
  var SOURCES = {};

  // Cloudflare Pages 的静态资源不支持 Range 请求（Range 被忽略，永远 200 整包），
  // 媒体元素在没有 Range 时连 seekable 都只有 [0,0]，点后面的句子会被夹回开头播。
  // 所以先把整条 sprite 取进内存换成 blob 地址：seek 永远精确；离线包用
  // file:// 时 fetch 不可用，退回直接给媒体元素。
  function sourceFor(v) {
    if (SOURCES[v]) return SOURCES[v];
    var machine = sources[v];
    var url = spriteUrlFor(v);
    if (!url) {
      machine.send('missing');
      SOURCES[v] = Promise.resolve(null);
      return SOURCES[v];
    }
    var canFetch = location.protocol !== 'file:' && window.fetch
      && window.Promise && window.URL && URL.createObjectURL;

      machine.send('fetch');
      machine.send('resolve');
      SOURCES[v] = Promise.resolve(url);
      return SOURCES[v];

      return URL.createObjectURL(blob);

      machine.send('fallback');
      return url;
    });

    idle:    { load: 'loading' },
    loading: { load: 'loading', seek: 'seeking', stop: 'idle', fail: 'idle', missing: 'idle' },
    seeking: { load: 'loading', play: 'playing', stop: 'idle', fail: 'idle', missing: 'idle' },
    playing: { load: 'loading', finish: 'idle', stop: 'idle', fail: 'idle' }
  });

  var active = null, audioToken = 0, audioRaf = 0, audioStopAt = 0;
  var loadTimer = 0, loadedSrc = null;

  /* 连播：off → playing；每句自然结束走 advance，停 / 失败回 off。 */

    off:     { start: 'playing' },
    playing: { advance: 'playing', stop: 'off' }

    hidden:    { show: 'transient', hold: 'sticky' },
    transient: { show: 'transient', hold: 'sticky', hide: 'hidden' },
    sticky:    { show: 'transient', hold: 'sticky', hide: 'hidden' }
  });
  var statusText = '', statusTimer = 0;

  /* 音色：f ⇄ m。按钮 aria-pressed、body 的 data-voice-state 和
     localStorage 都从同一份状态渲染；切换时正在播的句子用新音色重放。 */
  var voiceMachine = createMachine('voice', voice, {
    f: { select: function (next) { return next === 'm' ? 'm' : null; } },
    m: { select: function (next) { return next === 'f' ? 'f' : null; } }

    off: { toggle: 'on' }

  function audioAlive(token) {
    return token === audioToken && audio.state !== 'idle';
  }

  function audioClear() {
    if (audioRaf) { cancelAnimationFrame(audioRaf); audioRaf = 0; }
    if (loadTimer) { clearTimeout(loadTimer); loadTimer = 0; }

  function seekableEnd() {
    var ranges = player.seekable, end = 0;
    for (var i = 0; i < ranges.length; i++) {
      if (ranges.end(i) > end) end = ranges.end(i);

  function startCueWatch(token, stopAt) {

      if (!audioAlive(token) || audio.state !== 'playing') { audioRaf = 0; return; }
      if (player.currentTime >= stopAt - 0.008) { audio.send('finish'); return; }
      audioRaf = requestAnimationFrame(tick);
    };

    var fail = function () { if (audioAlive(token)) audio.send('fail'); };

    // 成可跳的再试，别把用户丢在错误的位置上。
    var waitForData = function (attempt) {

        return;

      audio.send('play', { stopAt: stopAt });

        started.catch(function (err) {
          if (err && err.name === 'AbortError') return;
          fail();

      if (!audioAlive(token)) return;

        player.currentTime = startAt;
      } catch (e) {
        player.removeEventListener('seeked', onSeeked);

        waitForData(0);
        return;

        done = true;

      audio.send('seek');
      seek();

      return;
    }

    /* stop / fail / finish / missing：停声、清高亮、作废所有在途回调。 */
    audioToken += 1;
    audioClear();
    try { player.pause(); } catch (e) {}

    if (event === 'finish') {
      if (queue.state === 'playing') queue.send('advance');
      return;
    }
    if (event === 'missing') {
      if (queue.state === 'playing') queue.send('stop');
      showStatus('这一句暂无语音');
      return;
    }
    if (event === 'fail') {
      if (queue.state === 'playing') queue.send('stop');
      showStatus('语音加载失败，请重试');
      return;
    }
    hideStatus();
  });

  queue.on(function (state, event, payload) {
    document.body.setAttribute('data-queue', state);
    if (playAllBtn) {
      playAllBtn.setAttribute('aria-pressed', state === 'playing' ? 'true' : 'false');
    }
    if (playAllLabel) playAllLabel.textContent = state === 'playing' ? '停止' : '连播';

    if (event === 'start') {
      queueData = { items: payload.items, at: 0 };
      playItem(0);
      return;
    }
    if (event === 'advance') {
      if (!queueData) return;
      queueData.at += 1;
      playItem(queueData.at);
      return;
    }
    // stop：清队列，并停掉正在播的这一句。
    queueData = null;
    audio.send('stop');
  });

  function playItem(index) {
    if (!queueData) return;
    if (index >= queueData.items.length) { queue.send('stop'); return; }
    queueData.at = index;
    var el = queueData.items[index];
    if (index > 0) {
      var rect = el.getBoundingClientRect();
      if (rect.top < 70 || rect.bottom > window.innerHeight - 24) {
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        catch (e) { el.scrollIntoView(); }
      }
    }
    audio.send('load', { el: el, voice: voice });
  }

  function play(el) {
    // 同一个句子：播放或加载中再点一次 = 停，而不是从头重播。
    var same = active === el && audio.state !== 'idle';
    if (queue.state === 'playing') queue.send('stop');
    if (same) { audio.send('stop'); return; }
    audio.send('load', { el: el, voice: voice });
  }

  function renderVoice(state) {
    document.body.setAttribute('data-voice-state', state);
    for (var i = 0; i < voiceButtons.length; i++) {
      voiceButtons[i].setAttribute('aria-pressed',
        voiceButtons[i].getAttribute('data-voice') === state ? 'true' : 'false');
    }
  }

  voiceMachine.on(function (state) {
    voice = state;
    store(KEY_VOICE, state);
    renderVoice(state);
    // 正在播放或正在加载的句子，换音色后用新音色重放；连播继续。
    if (audio.state !== 'idle' && active) {
      audio.send('load', { el: active, voice: state });
    }
    if (document.readyState === 'complete') prefetch();
  });

  function renderLang(state) {
    document.body.classList.toggle('zh-off', state === 'off');
    document.body.setAttribute('data-zh', state);
    if (zhButton) zhButton.setAttribute('aria-pressed', state === 'on' ? 'true' : 'false');
  }

  lang.on(function (state) {
    renderLang(state);
    store(KEY_ZH, state);
  });

  function renderStatus(state) {
    document.body.setAttribute('data-status', state);
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = 0; }
    if (!statusEl) return;
    if (state === 'hidden') {
      statusEl.textContent = '';
      statusEl.classList.remove('show');
      return;
    }
    statusEl.textContent = statusText;
    statusEl.classList.add('show');
    if (state === 'transient') {
      statusTimer = setTimeout(function () {
        statusTimer = 0;
        status.send('hide');
      }, 4000);
    }
  }

  status.on(function (state, event, payload) {
    if (payload && typeof payload.text === 'string') statusText = payload.text;
    renderStatus(state);
  });

  function showStatus(text, sticky) {
    status.send(sticky ? 'hold' : 'show', { text: text });
  }

  function hideStatus() {
    status.send('hide');
  }

  function setSpeed(value, save) {
    var n = Number(value);
    if (!isFinite(n)) n = DEFAULT_SPEED;
    n = Math.max(0.6, Math.min(1.5, Math.round(n * 100) / 100));
    speed = n;
    player.playbackRate = n;
    if (speedLabel) speedLabel.textContent = String(n).replace(/0$/, '') + '×';
    if (speedInput && Math.abs(parseFloat(speedInput.value) - n) > 0.001) speedInput.value = n;
    if (save) store(KEY_SPEED, String(n));
  }

  // 点读是这一页的主动作：页面空闲时先把当前音色的 sprite 取进内存，
  // 点下去就能出声（只在联网时预取；离线包走 file://，媒体元素直接读本地文件）。
  function prefetch() {
    if (navigator.connection && navigator.connection.saveData) return;
    sourceFor(voice);
  }

  player.addEventListener('loadedmetadata', function () {
    try { player.playbackRate = speed; } catch (e) {}
  });
  player.addEventListener('timeupdate', function () {
    if (audio.state === 'playing' && player.currentTime >= audioStopAt - 0.008) {
      audio.send('finish');
    }
  });
  player.addEventListener('ended', function () {
    if (audio.state === 'playing') audio.send('finish');
  });
  player.addEventListener('error', function () {
    if (audio.state !== 'idle') audio.send('fail');
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    if (queue.state === 'playing') queue.send('stop');
    else audio.send('stop');
  });

  voiceButtons.forEach(function (button) {
    button.addEventListener('click', function () {
      voiceMachine.send('select', button.getAttribute('data-voice'));
    });
  });
  if (zhButton) zhButton.addEventListener('click', function () {
    lang.send('toggle');
  });
  if (speedInput) speedInput.addEventListener('input', function () {
    setSpeed(parseFloat(speedInput.value), true);
  });
  var speedReset = document.querySelector('[data-speed-reset]');
  if (speedReset) speedReset.addEventListener('click', function () {
    setSpeed(DEFAULT_SPEED, true);
  });
  if (playAllBtn) playAllBtn.addEventListener('click', function () {
    if (queue.state === 'playing') { queue.send('stop'); return; }
    if (!allRows.length) return;
    queue.send('start', { items: allRows });
  });
  document.addEventListener('click', function (event) {
    if (!event.target.closest) return;
    var el = event.target.closest('.line, .target .pill');
    if (el) play(el);
  });

  renderVoice(voiceMachine.state);
  renderLang(lang.state);
  renderStatus(status.state);
  document.body.setAttribute('data-audio', audio.state);
  document.body.setAttribute('data-queue', queue.state);
  setSpeed(speed, false);

  /* 给测试和无头代理一个稳定读口：不用从 DOM 倒推当前状态。 */
  window.__phenomena = Object.freeze({
    snapshot: function () {
      return {
        page: 'lesson',
        audio: {
          state: audio.state,
          element: active ? {
            kind: active.getAttribute('data-kind') || 'line',
            index: active.getAttribute('data-index')
          } : null,
          stopAt: audioStopAt,
          time: player.currentTime
        },
        queue: {
          state: queue.state,
          at: queueData ? queueData.at : -1,
          length: queueData ? queueData.items.length : 0
        },
        voice: voiceMachine.state,
        lang: lang.state,
        status: status.state,
        speed: speed,
        sources: { f: sources.f.state, m: sources.m.state }
      };
    }
  });

  if (window.requestIdleCallback) {
    requestIdleCallback(prefetch, { timeout: 2500 });
  } else {
    setTimeout(prefetch, 1500);
  }
})();
</script>
</body>
</html>
