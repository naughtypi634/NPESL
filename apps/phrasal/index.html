<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>短语动词 Phrasal Verbs</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --rule:#e5e5ea;
    --surface:#f5f5f7;
    --accent:var(--blue, #0071e3); --tint:var(--blue-tint, #e8f2ff);
    --on-accent:var(--on-blue, #ffffff);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable",
      "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f7; --muted:#98989d; --rule:#2c2c2e;
      --surface:#1c1c1e;
      --accent:var(--blue, #0a84ff); --tint:var(--blue-tint, #0d2a45);
      color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
    -webkit-font-smoothing:antialiased; }
  .page { max-width:760px; margin:0 auto;
    padding:clamp(40px,7vh,72px) 24px 96px; }
  h1 { margin:0; font-size:clamp(2rem,6vw,2.8rem); font-weight:700;
    letter-spacing:-0.03em; line-height:1.08; }
  .sub { margin:10px 0 0; color:var(--muted); font-size:16px; }
  .sub a { color:var(--accent); text-decoration:none; }
  .crumbs { margin:0 0 10px; color:var(--muted); font-size:13px; }
  .crumbs a { color:var(--muted); text-decoration:none; }
  .crumbs a:hover { color:var(--accent); }
  .level1 { display:flex; gap:8px; margin:18px 0 10px; }
  .level1 button { appearance:none; font:inherit; font-size:14px; padding:8px 16px;
    border:1px solid var(--rule); border-radius:999px; background:transparent;
    color:var(--fg); cursor:pointer; }
  .level1 button:hover { background:var(--surface); }
  .level1 button[aria-pressed="true"] { background:var(--accent);
    border-color:var(--accent); color:var(--on-accent); }
  .hint { margin:14px 0 0; color:var(--muted); font-size:14px; }
  .group .theme { margin:24px 0 6px; font-size:16px; font-weight:600; }
  .group .theme a { color:var(--fg); text-decoration:none; }
  .group .theme a:hover { color:var(--accent); }
  .theme-go { float:right; font-size:12px; font-weight:400; color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .chips button, .chips a { appearance:none; display:inline-block;
    font:inherit; font-size:14px; padding:7px 14px; line-height:1.2;
    border:1px solid var(--rule); border-radius:999px; background:transparent;
    color:var(--fg); text-decoration:none; cursor:pointer; }
  .chips button:hover, .chips a:hover { background:var(--surface); }
  .chips button[aria-pressed="true"] { background:var(--accent);
    border-color:var(--accent); color:var(--on-accent); }
  .back { display:inline-block; margin-bottom:14px; color:var(--muted);
    text-decoration:none; font-size:14px; }
  .back:hover { color:var(--accent); }
  .stage { margin:34px 0 4px; font-size:15px; font-weight:600;
    color:var(--fg); letter-spacing:0.02em; }
  .stage-en { font-weight:400; color:var(--muted); font-size:13px;
    letter-spacing:0.04em; }
  .list { display:flex; flex-direction:column; gap:14px; margin-top:12px; }
  .row { display:flex; align-items:baseline; gap:16px; padding:16px 18px;
    border:1px solid var(--rule); border-radius:var(--radius-card, 24px);
    background:var(--bg); text-decoration:none; color:inherit;
    transition:background-color .15s ease, box-shadow .15s ease,
      transform .15s ease; }
  .row:hover { background:var(--surface); transform:translateY(-1px);
    box-shadow:var(--shadow-card, 0 1px 2px rgba(0, 0, 0, 0.05),
      0 8px 24px rgba(0, 0, 0, 0.06)); }
  .row:active { transform:scale(0.995); }
  .num { width:26px; flex:none; color:var(--muted); font-size:13px;
    font-variant-numeric:tabular-nums; }
  .title { flex:1; min-width:0; }
  .en { display:block; font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  .zh { display:block; margin-top:2px; font-size:15px; color:var(--muted); }
  .tag { flex:none; font-size:14px; color:var(--accent); font-weight:600;
    font-variant-numeric:tabular-nums; }
  @media (max-width:560px) { .tag { display:none; } .row { gap:12px; padding:16px 14px; } }
</style>
</head>
<body>
<div class="page">
<h1>短语动词</h1>
<div class="level1" role="group" aria-label="浏览方式"><button type="button" data-mode="scene" aria-pressed="true">场景话题</button><button type="button" data-mode="particle" aria-pressed="false">介词</button></div>
<div class="chips" data-chips="scene"></div>
<div class="chips" data-chips="particle" hidden></div>
<div id="view"></div>
</div>
<script src="data.451b503620.js"></script>
<script>
(function(){
var D=window.PHRASAL_INDEX;
var view=document.getElementById('view');
var rowScene=document.querySelector('[data-chips="scene"]');
var rowPart=document.querySelector('[data-chips="particle"]');
var modeBtns=document.querySelectorAll('[data-mode]');
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function chip(attr,val,label){return '<button type="button" data-'+attr+'="'+val+'">'+esc(label)+'</button>';}
function rowsHtml(rows,page,withPage){
  var out='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i];var p=withPage?r[2]:page;var id=withPage?r[3]:r[2];
    out+='<a class="row" href="'+p+'#'+id+'"><span class="title"><span class="en">'+esc(r[0])+'</span><span class="zh">'+esc(r[1])+'</span></span></a>';
  }
  return out;
}
function renderScene(){
  var html='';
  D.scene.forEach(function(g){
    html+='<section class="group" data-cat="'+g.id+'"><p class="stage">'+esc(g.zh)+' <span class="stage-en">'+esc(g.en)+' · '+g.count+' 条</span></p>';
    g.themes.forEach(function(t){
      html+='<h3 class="theme"><a href="'+t.page+'">'+esc(t.zh)+' <span class="stage-en">'+esc(t.en)+'</span><span class="theme-go">进入主题 ›</span></a></h3>';
      html+='<div class="list">'+rowsHtml(t.rows,t.page,false)+'</div>';
    });
    html+='</section>';
  });
  return html;
}
function renderParticle(){
  var html='';
  D.particle.forEach(function(g){
    var label=g.label||g.p;
    html+='<section class="group" data-particle="'+g.p+'"><p class="stage">'+esc(label)+' <span class="stage-en">'+g.rows.length+' 条</span></p>';
    html+='<div class="list">'+rowsHtml(g.rows,'',true)+'</div></section>';
  });
  return html;
}
var sceneHtml=renderScene(),partHtml=renderParticle();
rowScene.innerHTML=chip('cat','all','全部')+D.scene.map(function(g){return chip('cat',g.id,g.zh);}).join('');
rowPart.innerHTML=chip('part','all','全部')+D.particle.map(function(g){return chip('part',g.p,g.label||g.p);}).join('');
function paint(mode,key,value){
  view.innerHTML=(mode==='scene'?sceneHtml:partHtml);
  view.setAttribute('data-view',mode);
  rowScene.hidden=(mode!=='scene');rowPart.hidden=(mode==='scene');
  for(var i=0;i<modeBtns.length;i++)modeBtns[i].setAttribute('aria-pressed',modeBtns[i].getAttribute('data-mode')===mode?'true':'false');
  var sec=(mode==='scene'?'cat':'particle'),chipAttr=(mode==='scene'?'cat':'part');
  var groups=view.querySelectorAll('.group');
  for(var g=0;g<groups.length;g++)groups[g].style.display=(value==='all'||groups[g].getAttribute('data-'+sec)===value)?'':'none';
  var chips=(mode==='scene'?rowScene:rowPart).querySelectorAll('button');
  for(var c=0;c<chips.length;c++)chips[c].setAttribute('aria-pressed',chips[c].getAttribute('data-'+chipAttr)===value?'true':'false');
}
function onClick(container,attr,key){container.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;paint(key,attr,b.getAttribute('data-'+attr));});}
for(var m=0;m<modeBtns.length;m++)modeBtns[m].addEventListener('click',function(e){var mode=e.currentTarget.getAttribute('data-mode');paint(mode,mode==='scene'?'cat':'part','all');});
onClick(rowScene,'cat','scene');onClick(rowPart,'part','particle');
paint('scene','cat','all');
})();
</script>
</body>
</html>
