<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE_EN__ · 短语动词</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --rule:#e5e5ea;
    --surface:#f5f5f7;
    --accent:var(--blue, #0071e3); --tint:var(--blue-tint, #e8f2ff);
    --on-accent:var(--on-blue, #ffffff);
    --mark:var(--blue, #0071e3);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable",
      "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color-scheme:light;
  }
  /* 只有站点主题脚本没跑起来（没有 data-theme）时才按系统深色兜底。
     一旦 data-theme 存在，配色全部交给站点主题样式表 —— 否则用户选了亮色主题，
     这里的深色变量仍会生效，出现黑字压黑底。
     注意：本文件不能出现站点主题文件的文件名，构建脚本靠这个字符串判断
     “页面已经自带主题”，误判会整页跳过主题注入（切换按钮也会消失）。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { --bg:#000000; --fg:#f5f5f7; --muted:#98989d;
      --rule:#2c2c2e; --surface:#1c1c1e;
      --accent:var(--blue, #0a84ff); --tint:var(--blue-tint, #0d2a45);
      --mark:var(--blue, #4da3ff);
      color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
    -webkit-font-smoothing:antialiased; }
  .page { max-width:720px; margin:0 auto;
    padding:clamp(28px,5vh,48px) 20px 96px; }

  .back { display:inline-block; margin-bottom:22px; color:var(--muted);
    text-decoration:none; font-size:14px; }
  .back:hover { color:var(--accent); }
  .crumbs { margin:0 0 8px; color:var(--muted); font-size:13px; }
  .crumbs a { color:var(--muted); text-decoration:none; }
  .crumbs a:hover { color:var(--accent); }
  .num { margin:0 0 6px; color:var(--muted); font-size:13px;
    font-variant-numeric:tabular-nums; letter-spacing:0.08em; }
  h1 { margin:0; font-size:clamp(1.8rem,5.4vw,2.5rem); font-weight:700;
    letter-spacing:-0.03em; line-height:1.1; }
  .title-zh { margin:8px 0 0; color:var(--muted); font-size:17px; }
  .intro { margin:14px 0 0; color:var(--muted); font-size:15px; line-height:1.6; }
  .legend { margin:14px 0 0; padding:12px 14px; border-radius:14px;
    background:var(--surface); color:var(--muted); font-size:14px; line-height:1.7; }
  .legend b { color:var(--fg); font-weight:600; }
  .legend code { color:var(--accent); font-family:inherit; font-size:15px; }

  .toolbar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap;
    align-items:center; gap:8px 10px; margin-top:22px; padding:12px 0;
    background:var(--bg); border-bottom:1px solid var(--rule); }
  .seg { display:flex; border:1px solid var(--rule); border-radius:999px;
    overflow:hidden; }
  .seg button, .pill { appearance:none; border:0; background:transparent;
    color:var(--fg); font:inherit; font-size:14px; padding:7px 13px;
    cursor:pointer; white-space:nowrap; }
  .pill { border:1px solid var(--rule); border-radius:999px; }
  .seg button[aria-pressed="true"], .pill[aria-pressed="true"] {
    background:var(--accent); color:var(--on-accent); }
  .seg button + button { border-left:1px solid var(--rule); }
  .speed { display:flex; align-items:center; gap:8px; }
  .speed input { width:118px; accent-color:var(--accent); }
  .speed span { min-width:38px; color:var(--muted); font-size:13px;
    font-variant-numeric:tabular-nums; }

  .entries { margin-top:6px; }
  .entry, .senses, .sense { min-width:0; }
  .entry { padding:26px 0 22px; border-bottom:1px solid var(--rule); }
  .entry-head { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
  .head { display:inline-flex; align-items:baseline; gap:10px; appearance:none;
    border:0; background:transparent; color:inherit; font:inherit; padding:2px 4px;
    border-radius:10px; cursor:pointer; text-align:left; }
  .head:hover { background:var(--surface); }
  .head .w { font-size:24px; font-weight:700; letter-spacing:-0.02em; }
  .head .ipa { color:var(--muted); font-size:14px; }
  .head .play, .ex .play { font-size:0.62em; color:var(--muted); }
  .head.playing { background:var(--tint); }
  .badges { display:inline-flex; gap:6px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px;
    border:1px solid var(--rule); color:var(--muted); }
  .badge.reg { color:var(--accent); border-color:var(--accent); }
  .zh-line { margin:10px 0 0; font-size:15px; color:var(--muted); }

  .senses { margin-top:12px; display:grid; gap:10px; }
  .sense-zh { margin:0 0 4px; font-size:13px; color:var(--muted);
    letter-spacing:0.02em; }
  /* button 的 UA 样式不换行，一句长例句会把整页撑宽 */
  .head, .ex { white-space:normal; overflow-wrap:anywhere; }
  .ex { display:block; width:100%; text-align:left; font:inherit; color:inherit;
    background:var(--surface); border:0; border-radius:16px; padding:12px 14px;
    cursor:pointer; transition:background-color .12s ease; }
  .ex:hover { background:var(--tint); }
  .ex.playing { background:var(--tint); }
  .ex .txt { display:block; font-size:17px; line-height:1.55; }
  .ex .zh { display:block; margin-top:4px; color:var(--muted); font-size:13px;
    line-height:1.45; }

  /* 背景只用主题自己的 surface 变量，文字用 --fg，任何主题都保证对比度 */
  .note-card { margin-top:14px; padding:14px 16px; border-radius:16px;
    background:var(--surface-strong, var(--surface)); color:var(--fg);
    border:1px solid var(--rule); border-left:3px solid var(--accent);
    display:grid; gap:10px; }
  .note-card p { margin:0; font-size:14px; line-height:1.65; color:var(--fg); }
  .note-card p b { display:inline-block; margin-right:8px; font-size:12px;
    color:var(--accent); font-weight:600; }

  body.zh-off .zh, body.zh-off .zh-line, body.zh-off .sense-zh { display:none; }

  .status { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    margin:0; max-width:calc(100vw - 40px); padding:9px 16px; border-radius:999px;
    background:rgba(0,0,0,.82); color:#fff; font-size:14px; opacity:0;
    pointer-events:none; transition:opacity .2s ease; }
  .status.show { opacity:1; }

  @media (max-width:560px) {
    .head .w { font-size:21px; }
    .ex .txt { font-size:16px; }
  }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="index.html">短语动词</a>
  <header>
    <p class="crumbs"><a href="index.html">短语动词</a> › __CATEGORY_ZH__ › __TITLE_ZH__</p>
    <h1>__TITLE_EN__</h1>
    <p class="title-zh">__TITLE_ZH__</p>
    <p class="intro">__INTRO__</p>
    <p class="legend"><b>可分</b> = 代词必须放中间：<code>pick me up</code><br>名词放中间或后面都行：<code>pick up my friend</code> / <code>pick my friend up</code></p>
  </header>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="小品词">
      <button type="button" data-particle="all" aria-pressed="true">全部</button>
      <button type="button" data-particle="up" aria-pressed="false">up</button>
      <button type="button" data-particle="down" aria-pressed="false">down</button>
      <button type="button" data-particle="out" aria-pressed="false">out</button>
      <button type="button" data-particle="off" aria-pressed="false">off</button>
      <button type="button" data-particle="on" aria-pressed="false">on</button>
      <button type="button" data-particle="in" aria-pressed="false">in</button>
    </div>
    <div class="seg" role="group" aria-label="音色">
      <button type="button" data-voice="f" aria-pressed="true">女</button>
      <button type="button" data-voice="m" aria-pressed="false">男</button>
    </div>
    <div class="speed">
      <input type="range" data-speed min="0.6" max="1.5" step="0.05" value="0.9" aria-label="语速">
      <span data-speed-label>0.9×</span>
      <button class="pill" type="button" data-speed-reset>默认</button>
    </div>
    <button class="pill" type="button" data-zh-toggle aria-pressed="true">中文</button>
    <button class="pill" type="button" data-play-all aria-pressed="false"><span data-play-label>连播</span></button>
  </div>

  <section class="entries">
      <!--ENTRIES-->
  </section>
  <p class="status" data-audio-status></p>
</main>
<!--SPRITES-->
<script>
(function () {
  var KEY_VOICE = 'pv-voice';
  var KEY_SPEED = 'pv-speed', KEY_ZH = 'pv-zh';
  var DEFAULT_SPEED = 0.9;
  var voice = 'f', speed = DEFAULT_SPEED;

  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  try {
    if (load(KEY_VOICE) === 'f' || load(KEY_VOICE) === 'm') voice = load(KEY_VOICE);
    var savedSpeed = parseFloat(load(KEY_SPEED));
    if (savedSpeed >= 0.6 && savedSpeed <= 1.5) speed = savedSpeed;
  } catch (e) {}

  var player = new Audio();
  player.preload = 'auto';
  player.preservesPitch = true;
  player.webkitPreservesPitch = true;

  var allRows = Array.prototype.slice.call(document.querySelectorAll('.say'));
  var current = null, playlist = null, statusTimer = null;
  var stickyStatus = false;
  var raf = 0, loadedSrc = null;
  var SOURCES = {}, READY = {};
  var SPRITES = {};
  try { SPRITES = JSON.parse(document.getElementById('spriteMap').textContent); }
  catch (e) { SPRITES = {}; }

  function spanFor(el) {
    var start = el.getAttribute('data-start-' + voice);
    var end = el.getAttribute('data-end-' + voice);
    if (start === null || end === null) return null;
    var s = parseFloat(start), e = parseFloat(end);
    return (isFinite(s) && isFinite(e)) ? [s, e] : null;
  }

  function spriteUrlFor(v) {
    var rel = SPRITES[v];
    return rel ? 'audio/' + rel : null;
  }

  function stopTick() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  // 只有落进 seekable 的位置才跳得动；站点不支持 Range 时它长期只有 [0,0]。
  function seekableEnd() {
    var ranges = player.seekable, end = 0;
    for (var i = 0; i < ranges.length; i++) {
      if (ranges.end(i) > end) end = ranges.end(i);
    }
    return end;
  }

  function waitForData(el, seek, from, attempt) {
    if (current !== el) return;
    if (seekableEnd() >= from - 0.01) { seek(); return; }
    if (attempt > 40) { audioFailed(el); return; }
    showStatus('语音加载中…', true);
    setTimeout(function () { waitForData(el, seek, from, attempt + 1); }, 250);
  }

  function startSpan(el, span, onEnd) {
    var from = span[0], stopAt = span[1];
    var retries = 0;
    try { player.pause(); } catch (e) {}
    stopTick();
    var playSpan = function () {
      if (current !== el) return;
      if (player.currentTime < from - 0.15) {
        if (++retries > 3) { audioFailed(el); return; }
        waitForData(el, seek, from, 0);
        return;
      }
      hideStatus();
      player.playbackRate = speed;
      var started = player.play();
      var tick = function () {
        if (current !== el) return;
        if (player.currentTime >= stopAt - 0.008) {
          try { player.pause(); } catch (e) {}
          stopTick();
          unmark();
          if (onEnd) onEnd();
          return;
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      if (started && started.catch) {
        started.catch(function (err) {
          if (err && err.name === 'AbortError') return;
          if (current === el) audioFailed(el);
        });
      }
    };
    var seek = function () {
      if (current !== el) return;
      if (Math.abs(player.currentTime - from) < 0.02) { playSpan(); return; }
      var done = false;
      var onSeeked = function () {
        if (done) return;
        done = true;
        player.removeEventListener('seeked', onSeeked);
        if (current === el) playSpan();
      };
      player.addEventListener('seeked', onSeeked);
      try {
        player.currentTime = from;
      } catch (e) {
        player.removeEventListener('seeked', onSeeked);
        done = true;
        waitForData(el, seek, from, 0);
        return;
      }
      setTimeout(function () {
        if (done) return;
        done = true;
        player.removeEventListener('seeked', onSeeked);
        if (current === el) playSpan();
      }, 1500);
    };
    if (player.readyState < 1) {
      var onLoaded = function () {
        player.removeEventListener('loadedmetadata', onLoaded);
        seek();
      };
      player.addEventListener('loadedmetadata', onLoaded);
      try { player.load(); } catch (e) {}
    } else {
      seek();
    }
  }

  // Cloudflare Pages 的静态资源不支持 Range，媒体元素 seekable 只有 [0,0]，
  // 点后面的句子会被夹回开头。先把整条 sprite 取进内存换成 blob 地址。
  function sourceFor(v) {
    if (SOURCES[v]) return SOURCES[v];
    var url = spriteUrlFor(v);
    if (!url) { SOURCES[v] = Promise.resolve(null); return SOURCES[v]; }
    var canFetch = location.protocol !== 'file:' && window.fetch
      && window.Promise && window.URL && URL.createObjectURL;
    if (!canFetch) {
      READY[v] = true;
      SOURCES[v] = Promise.resolve(url);
      return SOURCES[v];
    }
    SOURCES[v] = fetch(url).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.blob();
    }).then(function (blob) {
      return URL.createObjectURL(blob);
    }).catch(function () {
      return url;
    }).then(function (src) {
      READY[v] = true;
      return src;
    });
    return SOURCES[v];
  }

  function begin(el, onEnd) {
    var span = spanFor(el);
    if (!span || !spriteUrlFor(voice)) {
      if (current === el) unmark();
      showStatus('这一条暂无语音');
      return;
    }
    var loading = null;
    if (!READY[voice]) {
      loading = setTimeout(function () { showStatus('语音加载中…', true); }, 300);
    }
    sourceFor(voice).then(function (src) {
      if (loading) clearTimeout(loading);
      if (current !== el) return;
      if (!src) { audioFailed(el); return; }
      if (loadedSrc !== src) {
        player.src = src;
        loadedSrc = src;
      }
      startSpan(el, span, onEnd);
    });
  }

  function unmark() {
    if (current) current.classList.remove('playing');
    current = null;
  }

  function stopAudio() {
    try { player.pause(); } catch (e) {}
    stopTick();
    hideStatus();
    unmark();
  }

  function showStatus(text, sticky) {
    var el = document.querySelector('[data-audio-status]');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    stickyStatus = !!sticky;
    if (statusTimer) clearTimeout(statusTimer);
    if (stickyStatus) { statusTimer = null; return; }
    statusTimer = setTimeout(function () {
      if (stickyStatus) return;
      el.textContent = '';
      el.classList.remove('show');
    }, 4000);
  }

  function hideStatus() {
    var el = document.querySelector('[data-audio-status]');
    stickyStatus = false;
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    if (!el) return;
    el.textContent = '';
    el.classList.remove('show');
  }

  function setSpeed(value, save) {
    var n = Number(value);
    if (!isFinite(n)) n = DEFAULT_SPEED;
    n = Math.max(0.6, Math.min(1.5, Math.round(n * 100) / 100));
    speed = n;
    player.playbackRate = n;
    var label = document.querySelector('[data-speed-label]');
    if (label) label.textContent = String(n).replace(/0$/, '') + '×';
    var input = document.querySelector('[data-speed]');
    if (input && Math.abs(parseFloat(input.value) - n) > 0.001) input.value = n;
    if (save) store(KEY_SPEED, String(n));
  }

  function setPlayAll(on) {
    var btn = document.querySelector('[data-play-all]');
    var label = document.querySelector('[data-play-label]');
    if (!btn) return;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (label) label.textContent = on ? '停止' : '连播';
  }

  function stopPlaylist() {
    playlist = null;
    setPlayAll(false);
    stopAudio();
  }

  function audioFailed(el) {
    if (!current && !playlist) return;
    if (el && current && current !== el) return;
    stopPlaylist();
    showStatus('语音加载失败，请重试');
  }

  function playItem(index) {
    if (!playlist) return;
    if (index >= playlist.items.length) { stopPlaylist(); return; }
    playlist.at = index;
    var el = playlist.items[index];
    try { player.pause(); } catch (e) {}
    unmark();
    if (!spanFor(el)) { audioFailed(el); return; }
    current = el;
    el.classList.add('playing');
    if (index > 0) {
      var rect = el.getBoundingClientRect();
      if (rect.top < 70 || rect.bottom > window.innerHeight - 24) {
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        catch (e) { el.scrollIntoView(); }
      }
    }
    var list = playlist;
    begin(el, function () {
      if (playlist !== list) return;
      playItem(list.at + 1);
    });
  }

  function play(el) {
    if (playlist) stopPlaylist();
    if (current === el && !player.paused) { stopAudio(); return; }
    stopAudio();
    current = el;
    el.classList.add('playing');
    begin(el, null);
  }

  function replayCurrent() {
    var el = current;
    if (!el) return;
    var wasPlaying = !player.paused;
    stopAudio();
    if (wasPlaying) play(el);
  }

  player.addEventListener('loadedmetadata', function () {
    try { player.playbackRate = speed; } catch (e) {}
  });
  player.addEventListener('error', function () {
    if (current) audioFailed(current);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    if (playlist) stopPlaylist(); else stopAudio();
  });

  function setVoice(next) {
    voice = next === 'm' ? 'm' : 'f';
    store(KEY_VOICE, voice);
    var buttons = document.querySelectorAll('[data-voice]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed',
        buttons[i].getAttribute('data-voice') === voice ? 'true' : 'false');
    }
    replayCurrent();
    if (document.readyState === 'complete') prefetch();
  }

  function prefetch() {
    if (navigator.connection && navigator.connection.saveData) return;
    sourceFor(voice);
  }

  function setZh(on) {
    document.body.classList.toggle('zh-off', !on);
    store(KEY_ZH, on ? 'on' : 'off');
    var btn = document.querySelector('[data-zh-toggle]');
    if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  var voiceButtons = document.querySelectorAll('[data-voice]');
  for (var j = 0; j < voiceButtons.length; j++) {
    voiceButtons[j].addEventListener('click', function (event) {
      setVoice(event.currentTarget.getAttribute('data-voice'));
    });
  }
  var zhButton = document.querySelector('[data-zh-toggle]');
  if (zhButton) zhButton.addEventListener('click', function () {
    setZh(document.body.classList.contains('zh-off'));
  });
  var speedInput = document.querySelector('[data-speed]');
  if (speedInput) speedInput.addEventListener('input', function () {
    setSpeed(parseFloat(speedInput.value), true);
  });
  var speedReset = document.querySelector('[data-speed-reset]');
  if (speedReset) speedReset.addEventListener('click', function () {
    setSpeed(DEFAULT_SPEED, true);
  });
  var playAllBtn = document.querySelector('[data-play-all]');
  if (playAllBtn) playAllBtn.addEventListener('click', function () {
    if (playlist) { stopPlaylist(); return; }
    var rows = allRows.filter(function (el) {
      var card = el.closest('.entry');
      return !card || card.style.display !== 'none';
    });
    if (!rows.length) return;
    stopAudio();
    playlist = { items: rows, at: -1 };
    setPlayAll(true);
    playItem(0);
  });

  // 小品词筛选：只看 up / down / out 这类词条
  var PARTICLE_KEY = 'pv-particle';
  var particle = 'all';
  var particleButtons = document.querySelectorAll('[data-particle]');
  function applyParticle(next, save) {
    particle = next;
    var cards = document.querySelectorAll('.entry');
    for (var i = 0; i < cards.length; i++) {
      cards[i].style.display =
        (next === 'all' || cards[i].getAttribute('data-particle') === next) ? '' : 'none';
    }
    for (var j = 0; j < particleButtons.length; j++) {
      particleButtons[j].setAttribute('aria-pressed',
        particleButtons[j].getAttribute('data-particle') === next ? 'true' : 'false');
    }
    if (save) store(PARTICLE_KEY, next);
  }
  for (var q = 0; q < particleButtons.length; q++) {
    particleButtons[q].addEventListener('click', function (event) {
      applyParticle(event.currentTarget.getAttribute('data-particle'), true);
    });
  }
  applyParticle(load(PARTICLE_KEY) || 'all', false);

  document.addEventListener('click', function (event) {
    if (!event.target.closest) return;
    var el = event.target.closest('.say');
    if (el) play(el);
  });

  setVoice(voice);
  setZh(load(KEY_ZH) !== 'off');
  setSpeed(speed, false);

  if (window.requestIdleCallback) {
    requestIdleCallback(prefetch, { timeout: 2500 });
  } else {
    setTimeout(prefetch, 1500);
  }
})();
</script>
</body>
</html>
