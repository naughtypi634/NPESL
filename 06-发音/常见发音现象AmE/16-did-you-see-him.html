<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Did You See Him? · 常见发音现象(AmE)</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --rule:#e5e5ea;
    --surface:#f5f5f7;
    --accent:var(--blue, #0071e3); --tint:var(--blue-tint, #e8f2ff);
    --mark:var(--blue, #0071e3);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable",
      "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f7; --muted:#98989d; --rule:#2c2c2e;
      --surface:#1c1c1e;
      --accent:var(--blue, #0a84ff); --tint:var(--blue-tint, #0d2a45);
      --mark:var(--blue, #4da3ff);
      color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
    -webkit-font-smoothing:antialiased; }
  .page { max-width:720px; margin:0 auto;
    padding:clamp(28px,5vh,48px) 20px 96px; }

  .back { display:inline-block; margin-bottom:22px; color:var(--muted);
    text-decoration:none; font-size:14px; }
  .back:hover { color:var(--accent); }
  .num { margin:0 0 6px; color:var(--muted); font-size:13px;
    font-variant-numeric:tabular-nums; letter-spacing:0.08em; }
  h1 { margin:0; font-size:clamp(1.8rem,5.4vw,2.5rem); font-weight:700;
    letter-spacing:-0.03em; line-height:1.1; }
  .title-zh { margin:8px 0 0; color:var(--muted); font-size:17px; }

  .targets { margin-top:30px; display:grid; gap:12px; }
  .target { display:flex; flex-wrap:wrap; align-items:center; gap:12px 26px;
    padding:16px 18px; background:var(--surface); border-radius:24px; }
  .pair { display:inline-flex; align-items:baseline; gap:10px; font-size:17px; }
  .pair .w { color:var(--muted); }
  .pair .s { color:var(--mark); font-weight:700; font-size:19px; }
  .pair .arrow { color:var(--muted); }
  .target .pill { white-space:normal; text-align:left; max-width:100%; }
  .target .pill .play { font-size:0.7em; color:var(--muted); margin-right:6px; }

  .toolbar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap;
    align-items:center; gap:8px 10px; margin-top:22px; padding:12px 0;
    background:var(--bg); border-bottom:1px solid var(--rule); }
  .seg { display:flex; border:1px solid var(--rule); border-radius:999px;
    overflow:hidden; min-width:0; }
  .seg button, .pill { appearance:none; border:0; background:transparent;
    color:var(--fg); font:inherit; font-size:14px; padding:7px 13px;
    cursor:pointer; white-space:nowrap; }
  .pill { border:1px solid var(--rule); border-radius:999px; }
  .seg button[aria-pressed="true"], .pill[aria-pressed="true"] {
    background:var(--accent); color:#fff; }
  .seg button + button { border-left:1px solid var(--rule); }
  .speed { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .speed input { width:128px; accent-color:var(--accent); }
  .speed span { min-width:38px; color:var(--muted); font-size:13px;
    font-variant-numeric:tabular-nums; }

  .dialogue { margin-top:8px; }
  .line { display:block; width:100%; text-align:left; font:inherit;
    color:inherit; background:transparent; border:0; border-bottom:1px solid var(--rule);
    padding:15px 12px; cursor:pointer; border-radius:12px;
    transition:background-color .12s ease; }
  .line:hover { background:var(--surface); }
  .line.playing { background:var(--tint); }
  .line .txt { display:block; font-size:19px; line-height:1.6; }
  .line .zh { display:block; margin-top:5px; color:var(--muted); font-size:14px;
    line-height:1.4; }
  ruby { ruby-position:under; -webkit-ruby-position:after; }
  rt { font-size:1em; font-weight:700; color:var(--mark); }


  .footer { margin-top:34px; }
  body.zh-off .zh { display:none; }

  .status { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    margin:0; max-width:calc(100vw - 40px); padding:9px 16px; border-radius:999px;
    background:rgba(0,0,0,.82); color:#fff; font-size:14px; opacity:0;
    pointer-events:none; transition:opacity .2s ease; }
  .status.show { opacity:1; }

  @media (max-width:560px) {
    .toolbar { gap:8px; }
    .seg button, .pill { padding:6px 10px; font-size:13px; }
    .target { gap:10px 18px; }
  }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="index.html">常见发音现象(AmE)</a>
  <header>
    <p class="num">16 · 吞音</p>
    <h1>Did You See Him?</h1>
    <p class="title-zh">你看见他了吗</p>
  </header>

  <section class="targets">
      <div class="target"><span class="pair"><span class="w">he / his / him / her / them</span><span class="arrow">→</span><span class="s">&#x27;e / &#x27;is / &#x27;im / &#x27;er / &#x27;em</span></span><button class="pill" type="button" data-clip-f="f/f5/f5fadc5738a83a4b.mp3" data-clip-m="m/bc/bc38c4b3c778a15d.mp3"><span class="play">▶</span>Did you see <ruby>him<rt>&#x27;im</rt></ruby> this morning?</button></div>
  </section>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="音色">
      <button type="button" data-voice="f" aria-pressed="true">女</button>
      <button type="button" data-voice="m" aria-pressed="false">男</button>
    </div>
    <div class="speed">
      <input type="range" data-speed min="0.6" max="1.5" step="0.05" value="0.9" aria-label="语速">
      <span data-speed-label>0.9×</span>
      <button class="pill" type="button" data-speed-reset>默认</button>
    </div>
    <button class="pill" type="button" data-zh-toggle aria-pressed="true">中文</button>
    <button class="pill" type="button" data-play-all aria-pressed="false"><span data-play-label>连播</span></button>
  </div>

  <section class="dialogue">
      <button class="line" type="button" data-clip-f="f/f5/f5fadc5738a83a4b.mp3" data-clip-m="m/bc/bc38c4b3c778a15d.mp3"><span class="txt">Did you see <ruby>him<rt>&#x27;im</rt></ruby> this morning?</span><span class="zh">你早上看见他了吗？</span></button>
      <button class="line" type="button" data-clip-f="f/d7/d72f71c289bd3628.mp3" data-clip-m="m/c9/c939415e7cbe1df5.mp3"><span class="txt">No, but I saw <ruby>his<rt>&#x27;is</rt></ruby> car outside.</span><span class="zh">没，但看见他车在外面。</span></button>
      <button class="line" type="button" data-clip-f="f/68/689b9353b6efcf6e.mp3" data-clip-m="m/a8/a88b638bb2e2465f.mp3"><span class="txt">Ask <ruby>him<rt>&#x27;im</rt></ruby> about the meeting.</span><span class="zh">问问他开会的事。</span></button>
      <button class="line" type="button" data-clip-f="f/b6/b6c5a4befda777d4.mp3" data-clip-m="m/08/08a3fb9d884fdf25.mp3"><span class="txt">I&#x27;ll text <ruby>him<rt>&#x27;im</rt></ruby> after lunch.</span><span class="zh">我午饭后给他发消息。</span></button>
      <button class="line" type="button" data-clip-f="f/cc/cca87085cebce2ce.mp3" data-clip-m="m/d0/d0609cdc83681b33.mp3"><span class="txt">Where&#x27;s <ruby>her<rt>&#x27;er</rt></ruby> office now?</span><span class="zh">她现在办公室在哪？</span></button>
      <button class="line" type="button" data-clip-f="f/08/086102a0cf3c60fa.mp3" data-clip-m="m/64/6456d0259aa3d8b4.mp3"><span class="txt">Third floor. I gave <ruby>her<rt>&#x27;er</rt></ruby> the files yesterday.</span><span class="zh">三楼。我昨天把文件给她了。</span></button>
      <button class="line" type="button" data-clip-f="f/50/50e0358fb742e92e.mp3" data-clip-m="m/74/74b3a71e328ddafd.mp3"><span class="txt">Good. Did <ruby>he<rt>&#x27;e</rt></ruby> sign <ruby>them<rt>&#x27;em</rt></ruby>?</span><span class="zh">好。他签了吗？</span></button>
      <button class="line" type="button" data-clip-f="f/43/43b537b0e6ebdd2d.mp3" data-clip-m="m/23/234221723fb60bb3.mp3"><span class="txt">Not yet. <ruby>He<rt>&#x27;e</rt></ruby> said <ruby>he<rt>&#x27;e</rt></ruby> needs a day.</span><span class="zh">还没。他说要一天。</span></button>
      <button class="line" type="button" data-clip-f="f/34/341d7de3a22d7b4a.mp3" data-clip-m="m/a3/a3a85c6bf9531ee3.mp3"><span class="txt">Tell <ruby>him<rt>&#x27;im</rt></ruby> we need <ruby>them<rt>&#x27;em</rt></ruby> by Friday.</span><span class="zh">跟他说我们周五前要。</span></button>
      <button class="line" type="button" data-clip-f="f/d1/d11401296820a9d1.mp3" data-clip-m="m/84/8419a7a309c435f6.mp3"><span class="txt">I&#x27;ll call <ruby>him<rt>&#x27;im</rt></ruby> now.</span><span class="zh">我现在给他打电话。</span></button>
      <button class="line" type="button" data-clip-f="f/de/de19e82dd743e259.mp3" data-clip-m="m/b8/b84f0d5e3ff08ed6.mp3"><span class="txt">And send <ruby>her<rt>&#x27;er</rt></ruby> a copy too.</span><span class="zh">也给她发一份。</span></button>
      <button class="line" type="button" data-clip-f="f/68/68de14a868dd05c5.mp3" data-clip-m="m/09/09486530193dcbdf.mp3"><span class="txt">Already did. She has <ruby>them<rt>&#x27;em</rt></ruby> on <ruby>her<rt>&#x27;er</rt></ruby> desk.</span><span class="zh">已经发了。文件在她桌上。</span></button>
  </section>

  <div class="footer">
    <button class="pill" type="button" data-done aria-pressed="false">标记已学</button>
  </div>
  <p class="status" data-audio-status></p>
</main>
<script>
(function () {
  var KEY_VOICE = 'rs-voice';
  var KEY_SPEED = 'rs-speed', KEY_ZH = 'rs-zh', KEY_DONE = 'rs-done';
  var LESSON = parseInt(document.querySelector('.num').textContent, 10);
  var DEFAULT_SPEED = 0.9;
  var voice = 'f', speed = DEFAULT_SPEED;

  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  try {
    if (load(KEY_VOICE) === 'f' || load(KEY_VOICE) === 'm') voice = load(KEY_VOICE);
    var savedSpeed = parseFloat(load(KEY_SPEED));
    if (savedSpeed >= 0.6 && savedSpeed <= 1.5) speed = savedSpeed;
  } catch (e) {}

  var player = new Audio();
  player.preload = 'auto';
  player.preservesPitch = true;
  player.webkitPreservesPitch = true;

  var allRows = Array.prototype.slice.call(document.querySelectorAll('.line'));
  var current = null, playlist = null, statusTimer = null;

  function clipFor(el) {
    return el.getAttribute('data-clip-' + voice);
  }

  function loadClip(clip) {
    player.src = 'audio/' + clip;
    // Browsers reset playbackRate when src changes; apply it again.
    player.playbackRate = speed;
    player.preservesPitch = true;
    player.webkitPreservesPitch = true;
  }

  function unmark() {
    if (current) current.classList.remove('playing');
    current = null;
  }

  function stopAudio() {
    try { player.pause(); } catch (e) {}
    unmark();
  }

  function showStatus(text) {
    var el = document.querySelector('[data-audio-status]');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
      el.textContent = '';
      el.classList.remove('show');
    }, 4000);
  }

  function setSpeed(value, save) {
    var n = Number(value);
    if (!isFinite(n)) n = DEFAULT_SPEED;
    n = Math.max(0.6, Math.min(1.5, Math.round(n * 100) / 100));
    speed = n;
    player.playbackRate = n;
    var label = document.querySelector('[data-speed-label]');
    if (label) label.textContent = String(n).replace(/0$/, '') + '×';
    var input = document.querySelector('[data-speed]');
    if (input && Math.abs(parseFloat(input.value) - n) > 0.001) input.value = n;
    if (save) store(KEY_SPEED, String(n));
  }

  function setPlayAll(on) {
    var btn = document.querySelector('[data-play-all]');
    var label = document.querySelector('[data-play-label]');
    if (!btn) return;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (label) label.textContent = on ? '停止' : '连播';
  }

  function stopPlaylist() {
    playlist = null;
    setPlayAll(false);
    stopAudio();
  }

  function audioFailed(el) {
    if (!current && !playlist) return;
    if (el && current && current !== el) return;
    stopPlaylist();
    showStatus('语音加载失败，请重试');
  }

  function playItem(index) {
    if (!playlist) return;
    if (index >= playlist.items.length) { stopPlaylist(); return; }
    playlist.at = index;
    var el = playlist.items[index];
    try { player.pause(); } catch (e) {}
    unmark();
    current = el;
    el.classList.add('playing');
    if (index > 0) {
      var rect = el.getBoundingClientRect();
      if (rect.top < 70 || rect.bottom > window.innerHeight - 24) {
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        catch (e) { el.scrollIntoView(); }
      }
    }
    var clip = clipFor(el);
    if (!clip) { audioFailed(el); return; }
    loadClip(clip);
    var playing = player.play();
    if (playing && playing.catch) {
      playing.catch(function () { if (current === el) audioFailed(el); });
    }
  }

  function play(el) {
    if (playlist) stopPlaylist();
    if (current === el && !player.paused) { stopAudio(); return; }
    stopAudio();
    var clip = clipFor(el);
    if (!clip) { showStatus('这一句暂无语音'); return; }
    current = el;
    el.classList.add('playing');
    loadClip(clip);
    var playing = player.play();
    if (playing && playing.catch) {
      playing.catch(function () { if (current === el) audioFailed(el); });
    }
  }

  function replayCurrent() {
    var el = current;
    if (!el) return;
    var wasPlaying = !player.paused;
    stopAudio();
    if (wasPlaying) play(el);
  }

  player.addEventListener('ended', function () {
    if (playlist) playItem(playlist.at + 1);
    else unmark();
  });
  player.addEventListener('loadedmetadata', function () {
    try { player.playbackRate = speed; } catch (e) {}
  });
  player.addEventListener('error', function () {
    if (current) audioFailed(current);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopPlaylist();
  });

  function setVoice(next) {
    voice = next === 'm' ? 'm' : 'f';
    store(KEY_VOICE, voice);
    var buttons = document.querySelectorAll('[data-voice]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed',
        buttons[i].getAttribute('data-voice') === voice ? 'true' : 'false');
    }
    replayCurrent();
  }

  function setZh(on) {
    document.body.classList.toggle('zh-off', !on);
    store(KEY_ZH, on ? 'on' : 'off');
    var btn = document.querySelector('[data-zh-toggle]');
    if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function isDone() {
    try {
      var list = JSON.parse(load(KEY_DONE) || '[]');
      return list.indexOf(LESSON) >= 0;
    } catch (e) { return false; }
  }

  function setDone(on) {
    var list = [];
    try { list = JSON.parse(load(KEY_DONE) || '[]'); } catch (e) {}
    if (!Array.isArray(list)) list = [];
    var has = list.indexOf(LESSON) >= 0;
    if (on && !has) list.push(LESSON);
    if (!on && has) list.splice(list.indexOf(LESSON), 1);
    store(KEY_DONE, JSON.stringify(list));
    var btn = document.querySelector('[data-done]');
    if (btn) {
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.textContent = on ? '已学' : '标记已学';
    }
  }

  var voiceButtons = document.querySelectorAll('[data-voice]');
  for (var j = 0; j < voiceButtons.length; j++) {
    voiceButtons[j].addEventListener('click', function (event) {
      setVoice(event.currentTarget.getAttribute('data-voice'));
    });
  }
  var zhButton = document.querySelector('[data-zh-toggle]');
  if (zhButton) zhButton.addEventListener('click', function () {
    setZh(document.body.classList.contains('zh-off'));
  });
  var speedInput = document.querySelector('[data-speed]');
  if (speedInput) speedInput.addEventListener('input', function () {
    setSpeed(parseFloat(speedInput.value), true);
  });
  var speedReset = document.querySelector('[data-speed-reset]');
  if (speedReset) speedReset.addEventListener('click', function () {
    setSpeed(DEFAULT_SPEED, true);
  });
  var playAllBtn = document.querySelector('[data-play-all]');
  if (playAllBtn) playAllBtn.addEventListener('click', function () {
    if (playlist) { stopPlaylist(); return; }
    if (!allRows.length) return;
    stopAudio();
    playlist = { items: allRows, at: -1 };
    setPlayAll(true);
    playItem(0);
  });
  var doneBtn = document.querySelector('[data-done]');
  if (doneBtn) doneBtn.addEventListener('click', function () { setDone(!isDone()); });

  document.addEventListener('click', function (event) {
    if (!event.target.closest) return;
    var el = event.target.closest('.line, .target .pill');
    if (el) play(el);
  });

  setVoice(voice);
  setZh(load(KEY_ZH) !== 'off');
  setSpeed(speed, false);
  setDone(isDone());
})();
</script>
</body>
</html>
